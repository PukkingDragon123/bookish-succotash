// ==========================================================================
// src/art/critters.js
// ==========================================================================
// One parameterised quadruped/biped rig draws every living thing in the game:
// the player ferret, ten NPCs, the wildlife, and the poachers. Species are
// config objects; animation comes from analytic pose curves with deliberate
// lag between body, head and tail so movement reads as fluid rather than
// mechanical. Frames are baked once into canvases and cached.

// bundled: import { surface, ell, ellShaded, circ, rect, px, line, caps
// bundled: import { P } from './palette.js';
// bundled: import { TAU, clamp } from '../engine/math.js';
// bundled: import { hash2 } from '../engine/rng.js';

// --- pose curves -----------------------------------------------------------
// Each animation is a pure function of phase -> a small bag of numbers. Adding
// phase offsets between parts is what gives the rig its follow-through.
function poseFor(anim, t) {
  const a = t * TAU;
  const p = {
    bob: 0, lean: 0, legA: 0, legB: 0, tail: 0, tailLift: 0, head: 0, headTilt: 0,
    sqx: 1, sqy: 1, ear: 0, blink: 0, lunge: 0, arm: 0, wing: 0, crouch: 0,
  };
  switch (anim) {
    case 'idle':
      p.bob = Math.sin(a) * 0.6;
      p.sqy = 1 + Math.sin(a) * 0.035;
      p.sqx = 1 - Math.sin(a) * 0.025;
      p.tail = Math.sin(a * 0.75 - 0.7) * 0.5;
      p.tailLift = Math.sin(a * 0.75) * 1.2;
      p.head = Math.sin(a - 0.9) * 0.5;
      p.headTilt = Math.sin(a * 0.5) * 0.09;
      p.ear = t > 0.72 && t < 0.82 ? 1 : 0;
      p.blink = t > 0.88 ? 1 : 0;
      break;
    // Hammering, sawing, hauling a beam into place. Used whenever someone is
    // building the camp for you, which in the opening hour is most of the time.
    case 'work': {
      const swing = Math.sin(a * 2);
      p.arm = 3.4 + swing * 4.6;
      p.lean = 1.2 + Math.max(0, swing) * 0.9;
      p.bob = Math.abs(swing) * -0.8;
      p.head = 0.9 + swing * 0.5;
      p.headTilt = 0.24;
      p.sqy = 1 - Math.max(0, swing) * 0.06;
      p.tail = Math.sin(a) * 0.9;
      p.crouch = 1.2;
      break;
    }

    // Gesturing while they speak. Small, but a static NPC talking at you reads
    // as a vending machine and one that moves reads as a person.
    case 'talk':
      p.bob = Math.sin(a * 2) * 0.5;
      p.arm = Math.sin(a * 3) * 2.6 + 1.4;
      p.head = Math.sin(a * 2.4) * 0.7;
      p.headTilt = Math.sin(a * 1.6) * 0.14;
      p.tail = Math.sin(a * 1.2) * 1.1;
      p.tailLift = 0.8;
      p.ear = t > 0.5 && t < 0.62 ? 1 : 0;
      break;

    case 'wave':
      p.arm = 5 + Math.sin(a * 4) * 3.4;
      p.lean = -0.6;
      p.bob = Math.sin(a * 2) * 0.6;
      p.head = -0.6;
      p.ear = 1;
      break;

    // Hauling: leaning into the weight, short choppy steps.
    case 'carry':
      p.legA = Math.sin(a) * 0.7;
      p.legB = Math.sin(a + Math.PI) * 0.7;
      p.bob = Math.abs(Math.sin(a)) * -0.7;
      p.lean = 1.8;
      p.crouch = 1.6;
      p.arm = 4.2;
      p.head = 1.2;
      p.headTilt = 0.16;
      break;

    case 'cheer':
      p.arm = 6.4 + Math.sin(a * 5) * 2;
      p.bob = -Math.abs(Math.sin(a * 3)) * 2.6;
      p.head = -1.4;
      p.tail = Math.sin(a * 6) * 2.4;
      p.tailLift = 2.4;
      p.ear = 1;
      break;

    // Down on one knee behind cover, gun up. What a recruit does in a wave.
    case 'aim':
      p.crouch = 3.4;
      p.lean = 1.4;
      p.arm = 5.6;
      p.head = 0.4;
      p.bob = Math.sin(a * 2) * 0.25;
      p.sqy = 0.94;
      break;

    case 'sleep':
      p.crouch = 5;
      p.sqy = 0.6;
      p.sqx = 1.24;
      p.head = 3.4;
      p.headTilt = 0.5;
      p.blink = 1;
      p.bob = Math.sin(a * 0.6) * 0.5;
      p.tail = 1.6;
      break;

    // A sharp recoil away from whatever just hit you.
    case 'flinch': {
      const q = Math.sin(Math.min(1, t * 2.2) * Math.PI);
      p.lean = -q * 3.2;
      p.head = q * 2;
      p.crouch = q * 2.4;
      p.blink = q > 0.4 ? 1 : 0;
      p.arm = -q * 2;
      break;
    }

    case 'walk':
      p.legA = Math.sin(a);
      p.legB = Math.sin(a + Math.PI);
      p.bob = Math.abs(Math.sin(a)) * -1.1;
      p.sqy = 1 + Math.abs(Math.sin(a)) * 0.05;
      p.tail = Math.sin(a * 0.5 - 1.1) * 1.1;
      p.tailLift = Math.sin(a - 0.8) * 1.1;
      p.head = Math.sin(a - 0.6) * 0.8;
      p.lean = 0.4;
      p.arm = Math.sin(a) * 2.2;
      break;
    case 'run':
      p.legA = Math.sin(a) * 1.5;
      p.legB = Math.sin(a + Math.PI) * 1.5;
      p.bob = -1.6 - Math.sin(a * 2) * 1.5;
      p.sqy = 1 + Math.sin(a * 2) * 0.09;
      p.sqx = 1 - Math.sin(a * 2) * 0.06;
      p.tail = Math.sin(a * 0.5 - 1.2) * 1.6 + 1.2;
      p.tailLift = 2.4 + Math.sin(a - 0.7) * 1.4;
      p.head = Math.sin(a - 0.5) * 1.2;
      p.lean = 1.6;
      p.arm = Math.sin(a) * 3.4;
      break;
    case 'attack': {
      // wind up over the first 40%, snap forward, settle
      const w = t < 0.4 ? -t / 0.4 : (t < 0.6 ? (t - 0.4) / 0.2 * 2.4 - 1 : 1.4 - (t - 0.6) / 0.4 * 1.4);
      p.lunge = w * 3.2;
      p.lean = w * 2.2;
      p.sqx = 1 + Math.max(0, w) * 0.09;
      p.sqy = 1 - Math.max(0, w) * 0.07;
      p.arm = w * 5;
      p.tail = -w * 1.6;
      p.head = w * 1.2;
      break;
    }
    case 'hurt':
      p.lean = -2.2;
      p.bob = 1;
      p.sqx = 1.14; p.sqy = 0.88;
      p.ear = 1;
      p.blink = 1;
      p.tail = -2;
      break;
    case 'sit':
      p.crouch = 3;
      p.bob = Math.sin(a) * 0.4;
      p.tail = Math.sin(a * 0.6) * 1.4;
      p.head = Math.sin(a * 0.8) * 0.4;
      break;
    case 'fly':
      p.wing = Math.sin(a * 2);
      p.bob = Math.sin(a * 2) * 1.8;
      p.tail = Math.sin(a) * 0.8;
      break;
    case 'swim':
      p.bob = Math.sin(a) * 0.8;
      p.tail = Math.sin(a * 2) * 2.4;
      break;
    case 'dead':
      p.crouch = 6; p.sqx = 1.3; p.sqy = 0.5; p.blink = 1; p.ear = 1;
      break;
    default:
      break;
  }
  return p;
}

// Default species config; every field can be overridden per creature.
const BASE = {
  bodyW: 7, bodyH: 4.4, headR: 4, neck: 3.4, snout: 2.2, snoutDrop: 1,
  ears: 'round', earSize: 2, earSpread: 2.4,
  tail: 'thin', tailLen: 8, tailR: 1.6,
  legs: 4, legLen: 4, legR: 1.4, legSpread: 3.6,
  hump: 0, antlers: 'none', quills: false, wings: false, beak: false,
  mask: false, cyberEye: false, stitches: null, spots: 0, stripes: 0,
  eyeR: 1, biped: false, chunky: 0,
  colors: {
    body: P.furTan, light: null, dark: null, belly: P.furBelly,
    ear: P.nose, eye: '#171310', nose: P.nose, foot: null, accent: null,
  },
  gear: null,
  scale: 1,
};

// How a face is set. Rides on top of whatever the body is doing, so a ferret
// can be sprinting and furious, or standing still and pleased with itself.
const FACE = {
  calm:    { lid: 0.15, brow: 0, mouth: 'closed', ear: 0, squint: 0 },
  alert:   { lid: 0,    brow: 0.5, mouth: 'closed', ear: 1, squint: 0 },
  curious: { lid: 0,    brow: 0.3, mouth: 'ajar', ear: 1, squint: 0 },
  happy:   { lid: 0.45, brow: 0.1, mouth: 'smile', ear: 1, squint: 0.5 },
  angry:   { lid: 0.4,  brow: -1, mouth: 'snarl', ear: -1, squint: 0.4 },
  afraid:  { lid: -0.1, brow: 0.9, mouth: 'ajar', ear: -1, squint: 0 },
  hurt:    { lid: 0.6,  brow: 0.6, mouth: 'open', ear: -1, squint: 0.35 },
  focused: { lid: 0.35, brow: -0.5, mouth: 'closed', ear: 0, squint: 0.2 },
  sad:     { lid: 0.5,  brow: 0.7, mouth: 'frown', ear: -1, squint: 0.1 },
  talk:    { lid: 0.1,  brow: 0.2, mouth: 'talk', ear: 0, squint: 0 },
  dead:    { lid: 0.9,  brow: 0, mouth: 'ajar', ear: -1, squint: 0 },
};
const FACE_KEYS = Object.keys(FACE);

// Everything this rig draws is scaled up by this much. The camera pulled back
// when the wildlife got its detail pass, and the player and the NPCs have to
// come with it or the ferret ends up a thumbnail in its own game.
const CRITTER_DETAIL = 1.5;

// Geometry fields, as opposed to flags and colours. Only these get scaled.
const DIMS = [
  'bodyW', 'bodyH', 'headR', 'neck', 'snout', 'snoutDrop',
  'earSize', 'earSpread', 'tailLen', 'tailR',
  'legLen', 'legR', 'legSpread', 'hump',
];

function resolve(cfg) {
  const c = Object.assign({}, BASE, cfg);
  const k = CRITTER_DETAIL * (cfg.scale || 1);
  for (const d of DIMS) c[d] = (c[d] || 0) * k;
  // Eyes grow more slowly than the skull, or every face turns into a doll's.
  c.eyeR = (c.eyeR || 1) * (1 + (k - 1) * 0.5);
  if (c.stitches) c.stitches = c.stitches.map(([a, b]) => [a * k, b * k]);
  c._k = k;
  c.colors = Object.assign({}, BASE.colors, cfg.colors || {});
  const col = c.colors;
  if (!col.light) col.light = shade(col.body, 0.16);
  if (!col.dark) col.dark = shade(col.body, -0.3);
  if (!col.foot) col.foot = shade(col.body, -0.42);
  if (!col.accent) col.accent = col.dark;
  return c;
}

/** Canvas size that comfortably fits this species in every pose. */
function critterSize(cfg) {
  const c = resolve(cfg);
  const w = Math.ceil((Math.max(c.bodyW * 2 + c.tailLen * 0.9, c.headR * 2 + c.snout * 2, c.legSpread * 2 + 4)) + 10);
  const h = Math.ceil(c.legLen + c.bodyH * 2 + c.neck + c.headR * 2 + c.earSize * 2 + (c.antlers !== 'none' ? 9 : 0) + 8);
  return { w: Math.max(12, w), h: Math.max(14, h) };
}

/**
 * Draw one creature frame into ctx. Origin is bottom-centre of the canvas
 * (the feet), so world drawing can just anchor by ground position.
 */
function drawCritter(ctx, cfgRaw, anim, t, view = 'front', exprName = 'calm') {
  const face = FACE[exprName] || FACE.calm;
  const c = resolve(cfgRaw);
  const col = c.colors;
  const p = poseFor(anim, t);
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2;
  const groundY = H - 1;
  const back = view === 'back';

  const legLen = c.legLen;
  const bodyCy = groundY - legLen - c.bodyH + p.bob - p.crouch;
  const bodyW = c.bodyW * p.sqx;
  const bodyH = c.bodyH * p.sqy;
  const dir = back ? -1 : 1;

  // ---------------------------------------------------------------- tail
  if (c.tail !== 'none') {
    const tx = cx - (c.bodyW * 0.75) * dir;
    const ty = bodyCy + 0.5;
    const swing = p.tail;
    const lift = p.tailLift;
    const segs = Math.max(3, Math.round(c.tailLen / 2.2));
    let px0 = tx, py0 = ty;
    for (let i = 1; i <= segs; i++) {
      const f = i / segs;
      // Each segment lags a little further behind: classic follow-through.
      const bend = swing * f * 1.5;
      const nx = tx - dir * (c.tailLen * f) + bend * 1.6;
      const ny = ty - lift * f - (c.tail === 'fan' ? f * 2 : 0) + Math.sin(f * 2.2 + swing) * 0.6;
      const r = c.tail === 'bushy' ? c.tailR * (1 + f * 0.7)
        : c.tail === 'stub' ? c.tailR * (1 - f * 0.5)
          : c.tailR * (1 - f * 0.35);
      const tipTail = col.tailTip && f > 0.62;
      capsule(ctx, px0, py0, nx, ny, Math.max(0.6, r), tipTail ? col.tailTip : (f > 0.5 ? col.dark : col.body));
      px0 = nx; py0 = ny;
    }
    if (c.tail === 'fan') {
      for (let k = -2; k <= 2; k++) {
        line(ctx, px0, py0, px0 - dir * 3 + k * 1.2, py0 - 3 + Math.abs(k) * 0.6, col.dark);
      }
    }
  }

  // ------------------------------------------------------------ back legs
  const drawLeg = (ox, phase, front) => {
    const hipX = cx + ox;
    const hipY = bodyCy + bodyH * 0.55;
    const swing = phase * 2.2;
    const footX = hipX + swing + p.lean * 0.4;
    const footY = groundY - Math.max(0, phase) * 1.6 - p.crouch * 0.4;
    const kneeX = (hipX + footX) / 2 + (front ? 0.6 : -0.6);
    const kneeY = (hipY + footY) / 2 + 0.6;
    const lc = front ? col.body : col.dark;
    taper(ctx, hipX, hipY, kneeX, kneeY, c.legR, c.legR * 0.85, lc);
    taper(ctx, kneeX, kneeY, footX, footY, c.legR * 0.85, c.legR * 0.7, lc);
    circ(ctx, footX, footY - 0.4, Math.max(1, c.legR * 0.9), col.foot);
  };

  if (c.legs >= 4) {
    drawLeg(-c.legSpread * dir, p.legB, false);
    drawLeg(c.legSpread * 0.55 * dir, p.legA, false);
  } else if (!c.biped) {
    drawLeg(-c.legSpread * 0.5, p.legB, false);
  }

  // ---------------------------------------------------------------- body
  // Two overlapping masses (haunch + chest) read as a real quadruped from 3/4.
  const haunchX = cx - c.bodyW * 0.42 * dir;
  const chestX = cx + c.bodyW * 0.38 * dir;
  if (c.hump) {
    ellShaded(ctx, haunchX, bodyCy - c.hump * 0.5, bodyW * 0.72, bodyH * (1 + c.hump * 0.16), col.body, col.light, col.dark);
  } else {
    ellShaded(ctx, haunchX, bodyCy + 0.4, bodyW * 0.66, bodyH * 0.95, col.body, col.light, col.dark);
  }
  ellShaded(ctx, chestX, bodyCy + p.lean * 0.2, bodyW * 0.7, bodyH, col.body, col.light, col.dark);

  if (!back) {
    ell(ctx, chestX, bodyCy + bodyH * 0.42, bodyW * 0.44, bodyH * 0.42, col.belly);
  } else {
    // A dorsal stripe of shadow gives the back view some form.
    ell(ctx, cx, bodyCy - bodyH * 0.3, bodyW * 0.5, bodyH * 0.4, col.light);
  }

  if (c.spots) {
    for (let i = 0; i < c.spots; i++) {
      const hx = hash2(i, 7, 3) * 2 - 1, hy = hash2(i, 11, 5) * 2 - 1;
      circ(ctx, cx + hx * bodyW * 0.6, bodyCy + hy * bodyH * 0.55, 1, col.accent);
    }
  }
  if (c.stripes) {
    for (let i = 0; i < c.stripes; i++) {
      const fx = cx - bodyW * 0.7 + (i + 0.5) * (bodyW * 1.4 / c.stripes);
      rect(ctx, fx, bodyCy - bodyH * 0.7, 1, bodyH * 1.2, col.accent);
    }
  }
  if (c.quills) {
    for (let i = -4; i <= 4; i++) {
      const qx = cx + i * 1.3;
      const qy = bodyCy - bodyH * 0.85 - Math.cos(i * 0.4) * 1.2;
      line(ctx, qx, qy, qx + i * 0.5 - dir * 1.5, qy - 3.4, col.accent);
    }
  }

  // ----------------------------------------------------------- front legs
  if (c.legs >= 4) {
    drawLeg(-c.legSpread * 0.2 * dir, p.legA, true);
    drawLeg(c.legSpread * 0.95 * dir, p.legB, true);
  } else if (c.biped) {
    drawLeg(-2.2, p.legA, true);
    drawLeg(2.2, p.legB, true);
    // arms swing opposite the legs
    const shY = bodyCy - bodyH * 0.3;
    taper(ctx, cx - bodyW * 0.7, shY, cx - bodyW * 0.9 - p.arm * 0.5, shY + 4 + Math.abs(p.arm) * 0.2, c.legR, c.legR * 0.8, col.dark);
    taper(ctx, cx + bodyW * 0.7, shY, cx + bodyW * 0.9 + p.arm * 0.5, shY + 4 + Math.abs(p.arm) * 0.2, c.legR, c.legR * 0.8, col.body);
  } else {
    drawLeg(c.legSpread * 0.5, p.legA, true);
  }

  // ---------------------------------------------------------------- head
  const headX = cx + (c.bodyW * 0.55 + p.lunge) * dir + p.head * 0.5;
  const headY = bodyCy - bodyH - c.neck + p.head * 0.5 - p.lean * 0.2;

  // neck
  taper(ctx, chestX, bodyCy - bodyH * 0.4, headX, headY + c.headR * 0.6, c.headR * 0.62, c.headR * 0.7, col.body);

  // ears behind the skull
  const earOut = p.ear ? 1.5 : 0;
  const drawEar = (side) => {
    const ex = headX + side * c.earSpread;
    const ey = headY - c.headR * 0.72 - c.earSize * 0.3;
    switch (c.ears) {
      case 'round':
        circ(ctx, ex, ey - earOut * 0.5, c.earSize, col.body);
        circ(ctx, ex, ey + 0.2 - earOut * 0.5, c.earSize * 0.5, col.ear);
        break;
      case 'pointy':
        tri(ctx, ex - c.earSize, ey + c.earSize, ex + c.earSize, ey + c.earSize, ex + side * (0.6 + earOut), ey - c.earSize * 1.7, col.body);
        tri(ctx, ex - c.earSize * 0.5, ey + c.earSize * 0.6, ex + c.earSize * 0.5, ey + c.earSize * 0.6, ex + side * 0.4, ey - c.earSize * 0.9, col.ear);
        break;
      case 'long':
        capsule(ctx, ex, ey + c.earSize, ex + side * (1 + earOut), ey - c.earSize * 2.4, c.earSize * 0.62, col.body);
        capsule(ctx, ex, ey + c.earSize * 0.5, ex + side * (0.7 + earOut), ey - c.earSize * 1.7, c.earSize * 0.3, col.ear);
        break;
      case 'tuft':
        line(ctx, ex, ey, ex + side * 2, ey - c.earSize * 2, col.dark);
        circ(ctx, ex, ey, c.earSize * 0.8, col.body);
        break;
      case 'horn':
        taper(ctx, ex, ey, ex + side * 2.6, ey - c.earSize * 1.6, c.earSize * 0.7, 0.6, col.accent);
        break;
      case 'none':
      default: break;
    }
  };
  drawEar(-1); drawEar(1);

  if (c.antlers !== 'none') {
    const beamLen = c.antlers === 'elk' ? 10 : 6;
    for (const side of [-1, 1]) {
      const bx = headX + side * c.headR * 0.55, by = headY - c.headR * 0.8;
      line(ctx, bx, by, bx + side * 3, by - beamLen, P.barkDead);
      line(ctx, bx + side * 1, by - beamLen * 0.4, bx + side * 4.5, by - beamLen * 0.55, P.barkDead);
      line(ctx, bx + side * 2, by - beamLen * 0.7, bx + side * 5, by - beamLen * 0.95, P.barkDead);
      if (c.antlers === 'elk') line(ctx, bx + side * 3, by - beamLen, bx + side * 5.5, by - beamLen - 2.5, P.barkDead);
    }
  }

  // skull
  ellShaded(ctx, headX, headY, c.headR, c.headR * 0.92, col.body, col.light, col.dark);

  if (!back) {
    // muzzle / beak
    if (c.beak) {
      tri(ctx, headX + dir * c.headR * 0.3, headY - 0.6, headX + dir * c.headR * 0.3, headY + 1.6,
        headX + dir * (c.headR + c.snout), headY + 0.4, col.nose);
    } else if (c.snout > 0) {
      ellShaded(ctx, headX + dir * (c.headR * 0.55), headY + c.snoutDrop, c.snout, c.snout * 0.72,
        col.muzzle || col.belly, null, shade(col.muzzle || col.belly, -0.14));
      circ(ctx, headX + dir * (c.headR * 0.5 + c.snout * 0.75), headY + c.snoutDrop - 0.2, 0.9, col.nose);
    }

    // bandit mask (black-footed ferret, raccoon-likes)
    if (c.mask) {
      rect(ctx, headX - c.headR * 0.95, headY - c.headR * 0.28, c.headR * 1.9, c.headR * 0.62, col.maskColor || P.furMask);
    }

    // eyes
    const eyeY = headY - c.headR * 0.05 - face.squint * 0.4;
    const eyeDX = c.headR * 0.5;
    const lid = clamp(face.lid + (p.blink ? 1 : 0), 0, 1);
    const shut = lid > 0.88;

    // the organic eye
    if (shut) {
      // a closed lid is a curve, not a flat bar: it is the difference between
      // asleep and switched off
      line(ctx, headX - eyeDX - c.eyeR, eyeY, headX - eyeDX, eyeY + 0.8, col.dark);
      line(ctx, headX - eyeDX, eyeY + 0.8, headX - eyeDX + c.eyeR, eyeY, col.dark);
    } else {
      const openH = Math.max(0.8, c.eyeR * (1 - lid * 0.72));
      ell(ctx, headX - eyeDX, eyeY, c.eyeR, openH, col.eye);
      if (c.eyeR > 1 && openH > 1) px(ctx, Math.round(headX - eyeDX - 0.4), Math.round(eyeY - openH * 0.4), P.white);
      if (lid > 0.12) rect(ctx, headX - eyeDX - c.eyeR, eyeY - c.eyeR, c.eyeR * 2 + 1, Math.max(1, c.eyeR * lid), col.body);
    }

    // the other one
    if (c.cyberEye) {
      // The lab's parting gift. It has no eyelid, so it stares straight
      // through a blink and through every expression on the face.
      rect(ctx, headX + eyeDX - c.eyeR - 1, eyeY - c.eyeR - 1, c.eyeR * 2 + 3, c.eyeR * 2 + 3, P.nestSteelDk);
      rect(ctx, headX + eyeDX - c.eyeR, eyeY - c.eyeR, c.eyeR * 2 + 1, c.eyeR * 2 + 1, P.cyberDim);
      circ(ctx, headX + eyeDX, eyeY, Math.max(0.9, c.eyeR * 0.8), P.cyber);
      px(ctx, Math.round(headX + eyeDX), Math.round(eyeY), P.cyberHot);
      px(ctx, Math.round(headX + eyeDX + c.eyeR + 1), Math.round(eyeY - c.eyeR - 1), P.cyberHot);
    } else if (shut) {
      line(ctx, headX + eyeDX - c.eyeR, eyeY, headX + eyeDX, eyeY + 0.8, col.dark);
      line(ctx, headX + eyeDX, eyeY + 0.8, headX + eyeDX + c.eyeR, eyeY, col.dark);
    } else {
      const openH = Math.max(0.8, c.eyeR * (1 - lid * 0.72));
      ell(ctx, headX + eyeDX, eyeY, c.eyeR, openH, col.eye);
      if (c.eyeR > 1 && openH > 1) px(ctx, Math.round(headX + eyeDX - 0.4), Math.round(eyeY - openH * 0.4), P.white);
      if (lid > 0.12) rect(ctx, headX + eyeDX - c.eyeR, eyeY - c.eyeR, c.eyeR * 2 + 1, Math.max(1, c.eyeR * lid), col.body);
    }

    // Brows. Angled in toward the nose is anger, up and out is fear, and that
    // one pair of pixels does most of the emotional work on a face this size.
    const browAmt = face.brow || (c.brow ? 0.2 : 0);
    if (Math.abs(browAmt) > 0.05 || c.brow) {
      const base = eyeY - c.eyeR - 1 + (c.brow || 0);
      for (const side of [-1, 1]) {
        const ex = headX + side * eyeDX;
        const inner = base - browAmt;
        const outer = base + browAmt;
        line(ctx, ex - 1.5, side > 0 ? inner : outer, ex + 1.5, side > 0 ? outer : inner, col.dark);
      }
    }

    // Mouth, on the snout.
    const mx = headX + dir * (c.headR * 0.42 + c.snout * 0.5);
    const my = headY + c.snoutDrop + c.headR * 0.34;
    if (face.mouth === 'snarl') {
      line(ctx, mx - dir * 2.4, my, mx + dir * 0.6, my + 0.8, col.dark);
      px(ctx, Math.round(mx - dir * 1.6), Math.round(my - 0.6), P.white);
      px(ctx, Math.round(mx - dir * 0.4), Math.round(my - 0.6), P.white);
    } else if (face.mouth === 'open') {
      ell(ctx, mx - dir * 0.8, my + 0.4, 1.5, 1.2, '#3a1a1a');
    } else if (face.mouth === 'talk') {
      const o = 0.6 + Math.abs(Math.sin(t * TAU * 3)) * 1.1;
      ell(ctx, mx - dir * 0.8, my + 0.3, 1.3, o, '#3a1a1a');
    } else if (face.mouth === 'smile') {
      line(ctx, mx - dir * 2.2, my - 0.4, mx - dir * 0.8, my + 0.6, col.dark);
      line(ctx, mx - dir * 0.8, my + 0.6, mx + dir * 0.6, my - 0.2, col.dark);
    } else if (face.mouth === 'frown') {
      line(ctx, mx - dir * 2.2, my + 0.6, mx - dir * 0.8, my - 0.3, col.dark);
      line(ctx, mx - dir * 0.8, my - 0.3, mx + dir * 0.6, my + 0.5, col.dark);
    } else if (face.mouth === 'ajar') {
      line(ctx, mx - dir * 1.8, my, mx + dir * 0.4, my + 0.4, col.dark);
    } else {
      line(ctx, mx - dir * 1.6, my, mx + dir * 0.2, my + 0.2, col.dark);
    }
  } else {
    // back of the head: just the skull shading plus ear backs
    ell(ctx, headX, headY - c.headR * 0.2, c.headR * 0.6, c.headR * 0.42, col.light);
  }

  // stitches — the lab left its seams behind
  if (c.stitches) {
    for (const s of c.stitches) {
      const sx = headX + s[0] * dir, sy = headY + s[1];
      line(ctx, sx - 2, sy, sx + 2, sy, P.stitch);
      for (let i = -2; i <= 2; i += 2) line(ctx, sx + i, sy - 1.2, sx + i, sy + 1.2, P.stitch);
    }
  }
  if (c.bodyStitch) {
    const sx = cx - c.bodyW * 0.2 * dir, sy = bodyCy - 0.5;
    line(ctx, sx, sy - 3, sx, sy + 3, P.stitch);
    for (let i = -3; i <= 3; i += 2) line(ctx, sx - 1.4, sy + i, sx + 1.4, sy + i, P.stitch);
  }

  // wings (birds) — drawn last so they overlap the body
  if (c.wings) {
    const wy = bodyCy - bodyH * 0.2;
    const flap = p.wing;
    for (const side of [-1, 1]) {
      const tipX = cx + side * (bodyW + 5 + Math.abs(flap) * 1.5);
      const tipY = wy - flap * 5;
      taper(ctx, cx + side * bodyW * 0.5, wy, tipX, tipY, c.bodyH * 0.7, 1, col.dark);
      line(ctx, tipX, tipY, tipX - side * 2, tipY + 3, col.body);
    }
  }

  // gear (hats, vests, goggles, packs) — NPC personality lives here
  if (c.gear) drawGear(ctx, c, p, { cx, bodyCy, bodyW, bodyH, headX, headY, dir, back, groundY });

  return ctx;
}

function drawGear(ctx, c, p, m) {
  const g = c.gear;
  const { headX, headY, cx, bodyCy, bodyW, bodyH, dir, back } = m;
  const r = c.headR;
  if (g.scarf) {
    rect(ctx, headX - r * 0.9, headY + r * 0.75, r * 1.8, 2, g.scarf);
    rect(ctx, headX - r * 0.9 - dir * 2, headY + r * 0.75 + 1, 2, 4 + p.arm * 0.3, g.scarf);
  }
  if (g.vest) {
    ell(ctx, cx + c.bodyW * 0.3 * dir, bodyCy + 0.4, bodyW * 0.62, bodyH * 0.8, g.vest);
    if (g.vestTrim) rect(ctx, cx + c.bodyW * 0.3 * dir - bodyW * 0.62, bodyCy + bodyH * 0.4, bodyW * 1.24, 1, g.vestTrim);
  }
  if (g.apron) {
    rect(ctx, cx - bodyW * 0.5, bodyCy - bodyH * 0.2, bodyW, bodyH * 1.3, g.apron);
    speckle(ctx, Math.round(cx - bodyW * 0.5), Math.round(bodyCy), Math.round(bodyW), Math.round(bodyH), shade(g.apron, -0.25), 0.16, 4);
  }
  if (g.pack) {
    ell(ctx, cx - c.bodyW * 0.8 * dir, bodyCy - bodyH * 0.3, bodyW * 0.42, bodyH * 0.8, g.pack);
    rect(ctx, cx - c.bodyW * 0.8 * dir - 1, bodyCy - bodyH * 0.3, 3, 1, shade(g.pack, -0.3));
  }
  // A working belt, and something hanging off it. Small, but it is the
  // difference between an animal and somebody with a job.
  if (g.belt) {
    rect(ctx, cx - bodyW * 0.56, bodyCy + bodyH * 0.34, bodyW * 1.12, 1.6, g.belt);
    rect(ctx, cx - 1, bodyCy + bodyH * 0.3, 2.4, 2.6, shade(g.belt, 0.28));
  }
  if (g.pouch) {
    ell(ctx, cx - c.bodyW * 0.55 * dir, bodyCy + bodyH * 0.42, bodyW * 0.24, bodyH * 0.34, g.pouch);
    rect(ctx, cx - c.bodyW * 0.55 * dir - bodyW * 0.24, bodyCy + bodyH * 0.28, bodyW * 0.48, 1, shade(g.pouch, -0.3));
  }
  if (g.hat === 'ranger') {
    rect(ctx, headX - r * 1.5, headY - r * 0.75, r * 3, 1.4, g.hatColor || P.poachCoat);
    tri(ctx, headX - r * 0.9, headY - r * 0.7, headX + r * 0.9, headY - r * 0.7, headX, headY - r * 2.2, g.hatColor || P.poachCoat);
  } else if (g.hat === 'cap') {
    ell(ctx, headX, headY - r * 0.85, r * 0.95, r * 0.55, g.hatColor || P.nestTeal);
    rect(ctx, headX + dir * r * 0.5, headY - r * 0.75, r * 1.1, 1, shade(g.hatColor || P.nestTeal, -0.2));
  } else if (g.hat === 'helmet') {
    ell(ctx, headX, headY - r * 0.5, r * 1.12, r * 0.9, g.hatColor || P.nestSteel);
    rect(ctx, headX - r * 1.1, headY - r * 0.2, r * 2.2, 1, shade(g.hatColor || P.nestSteel, -0.3));
  } else if (g.hat === 'bandana') {
    rect(ctx, headX - r, headY - r * 0.85, r * 2, 2, g.hatColor || P.nestRed);
    line(ctx, headX - r, headY - r * 0.5, headX - r - 3, headY + 1 + p.arm * 0.3, g.hatColor || P.nestRed);
  } else if (g.hat === 'flower') {
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      px(ctx, Math.round(headX + Math.cos(a) * 1.6 - r * 0.6), Math.round(headY - r * 0.9 + Math.sin(a) * 1.6), g.hatColor || P.paintbrush);
    }
    px(ctx, Math.round(headX - r * 0.6), Math.round(headY - r * 0.9), P.balsamroot);
  } else if (g.hat === 'visor') {
    rect(ctx, headX - r, headY - r * 0.4, r * 2, 2, g.hatColor || P.cyberDim);
    rect(ctx, headX - r * 0.7, headY - r * 0.4 + 0.4, r * 1.4, 1, P.cyber);
  }
  if (g.goggles && !back) {
    rect(ctx, headX - r * 1.05, headY - r * 0.35, r * 2.1, 2.2, P.nestSteelDk);
    circ(ctx, headX - r * 0.5, headY + r * 0.05 - 0.3, 1.2, g.gogglesColor || P.springHot);
    circ(ctx, headX + r * 0.5, headY + r * 0.05 - 0.3, 1.2, g.gogglesColor || P.springHot);
  }
  if (g.antenna) {
    line(ctx, headX, headY - r, headX + dir * 1.5, headY - r - 5, P.nestSteel);
    circ(ctx, headX + dir * 1.5, headY - r - 5, 1, P.nestRed);
  }
}

/** Bake an animation for one species/view. */
function critterFrames(key, cfg, anim, view = 'front', frameCount = 8, expr = 'calm') {
  return getSheet(`critter:${key}:${anim}:${view}:${frameCount}:${expr}`, () => {
    const { w, h } = critterSize(cfg);
    const frames = [];
    for (let i = 0; i < frameCount; i++) {
      const ctx = surface(w, h);
      drawCritter(ctx, cfg, anim, i / frameCount, view, expr);
      outline(ctx, cfg.outlineColor || P.black);
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

/** A single still frame, e.g. for portraits and UI. */
function critterStill(key, cfg, anim = 'idle', view = 'front', t = 0) {
  return critterFrames(key, cfg, anim, view, 1)[0];
}


// ==========================================================================
// src/art/ferret.js
// ==========================================================================
// The ferret, drawn live.
//
// Every other animal in the game is baked: eight frames per animation, painted
// once into canvases and blitted. That is right for a bison, which is a barrel
// on four posts and moves like one. It is wrong for a mustelid.
//
// A black-footed ferret is forty centimetres of spine with very short legs
// bolted underneath. It does not walk, it flows: the body is a wave, the back
// arches on every bound, and when it turns, the front end goes first and the
// rest of it follows a beat later. None of that survives being cut into eight
// keyframes.
//
// So this one is a rig, not a sprite sheet. A chain of spine nodes trails the
// head with real follow-the-leader constraints, a travel-driven phase runs a
// bound wave down it, and the feet are placed by inverse kinematics: a paw
// plants, the body moves over it, and it swings forward only when it has been
// left too far behind. The animation is a side effect of the movement rather
// than a loop playing next to it.

// bundled: import { P } from './palette.js';
// bundled: import { TAU, clamp, lerp } from '../engine/math.js';

/** Cheap scatter for blink timing. Does not need to be good. */
/** Lighten a hex by a fraction. */
function shadeHex(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) + (255 - ((n >> 16) & 255)) * amt));
  const g = Math.min(255, Math.round(((n >> 8) & 255) + (255 - ((n >> 8) & 255)) * amt));
  const b = Math.min(255, Math.round((n & 255) + (255 - (n & 255)) * amt));
  return `rgb(${r},${g},${b})`;
}

function rndish(v) { const x = Math.sin(v * 12.9898) * 43758.5453; return x - Math.floor(x); }

// ---------------------------------------------------------------------------
//  shape
// ---------------------------------------------------------------------------

const SEGS = 15;            // spine nodes, nose to tail tip
const LINK = 1.15;          // world units between nodes: short, so it curves smoothly
const MAX_BEND = 0.42;      // radians of bend allowed at each joint

// Body radius along the spine, nose (0) to tail tip (1). A black-footed ferret
// is a tube: barely thicker at the shoulder than at the hip, and never as tall
// as it is long. Small numbers here are the whole point.
const PROFILE = [
  1.5, 1.8, 1.9, 2.0, 2.0,  // neck and shoulder
  2.0, 1.9, 1.9, 1.9, 1.9,  // the long middle
  1.7, 1.3, 1.0, 0.8, 0.5,  // hip into tail
];
const SHOULDER = 4;         // spine index the front legs hang off
const HIP = 9;              // ...and the back legs
const TAIL_FROM = 11;       // where the tail starts, for colouring

const COL = {
  base: '#c9b083',
  light: '#e2cca0',
  belly: '#f2e6c8',
  dark: '#a8926a',
  guard: '#8a7452',
  mask: '#3a3026',
  earInner: '#b98d84',
  face: '#f0e4cc',
  foot: '#2a241c',
  tailTip: '#2a241c',
  nose: '#1a1410',
  eye: '#171310',
  outline: '#171a16',
};

// ---------------------------------------------------------------------------
//  the rig
// ---------------------------------------------------------------------------

class FerretRig {
  constructor() {
    this.spine = [];
    for (let i = 0; i < SEGS; i++) this.spine.push({ x: 0, y: 0 });
    this.ready = false;
    this.phase = 0;          // gait phase, advanced by distance travelled
    this.bound = 0;          // 0..1 how much of a bound is in the gait
    this.headBob = 0;
    this.lift = 0;           // whole-body lift, for a dash
    this.crouch = 0;
    this.feet = [];
    for (let i = 0; i < 4; i++) this.feet.push({ x: 0, y: 0, px: 0, py: 0, swing: 0, planted: true });
    this.travel = 0;
    this.facing = 1;
    this.lastX = 0; this.lastY = 0;
    // the bite: a lunge and a snap, driven from the same place as everything
    // else so the body comes with the head instead of the head sliding off it
    this.biteT = 0;
    this.biteDur = 0.26;
    this.biteAng = 0;
    this.blinkT = 0;
    this.earFlick = 0;
  }

  /**
   * Dash in and bite. The head goes first and hard, the jaw opens on the way
   * in and closes at full extension, and the body follows because it has no
   * choice — which is the whole reason the rig exists.
   */
  bite(ang) {
    this.biteT = this.biteDur;
    this.biteAng = ang;
  }

  /** 0 while idle, 0..1 through the lunge, for anything that wants to react. */
  get biteProgress() {
    return this.biteT > 0 ? 1 - this.biteT / this.biteDur : 0;
  }

  /** Snap the whole body to a point. Used on spawn and after a teleport. */
  reset(x, y) {
    for (let i = 0; i < SEGS; i++) { this.spine[i].x = x - i * LINK; this.spine[i].y = y; }
    for (const f of this.feet) { f.x = x; f.y = y; f.px = x; f.py = y; f.swing = 0; }
    this.lastX = x; this.lastY = y;
    this.ready = true;
  }

  /**
   * Advance the body. `head` is where the nose wants to be; everything else
   * is derived from how far it actually moved.
   */
  update(dt, o) {
    const { x, y, vx, vy, facing, anim, dashing, aim } = o;
    if (!this.ready) this.reset(x, y);

    const speed = Math.hypot(vx, vy);
    const moved = Math.hypot(x - this.lastX, y - this.lastY);
    this.lastX = x; this.lastY = y;
    this.travel += moved;

    // The gait phase runs off distance, not time, so the feet never skate and
    // the body never keeps bounding while you stand still.
    const strideLen = speed > 150 ? 16 : 11;
    this.phase = (this.travel / strideLen) % 1;

    // How much of a bound is in it. A ferret trots at low speed and bounds
    // flat out, and the arch in the back is the difference.
    const wantBound = clamp((speed - 45) / 130, 0, 1);
    this.bound += (wantBound - this.bound) * Math.min(1, dt * 7);
    this.lift += ((dashing ? 2.2 : 0) - this.lift) * Math.min(1, dt * 12);
    const wantCrouch = anim === 'sit' || anim === 'dead' ? 2.4 : anim === 'hurt' ? 1.2 : 0;
    this.crouch += (wantCrouch - this.crouch) * Math.min(1, dt * 8);
    if (facing) this.facing = facing;

    // --- the spine ---------------------------------------------------------
    // The nose leads. Every other node is pulled to a fixed distance behind
    // the one in front of it, which is the entire secret: turn and the body
    // sweeps round behind you on its own, with no animation authored for it.
    const head = this.spine[0];
    // The nose leads toward whatever has her attention: where she is going if
    // she is moving, where she is looking if she is not.
    let lookAng = this.lookAng == null ? 0 : this.lookAng;
    const want = speed > 12 ? Math.atan2(vy, vx) : (aim != null ? aim : lookAng);
    let d2 = want - lookAng;
    while (d2 > Math.PI) d2 -= TAU;
    while (d2 < -Math.PI) d2 += TAU;
    lookAng += d2 * Math.min(1, dt * 13);
    this.lookAng = lookAng;
    // A bite throws the nose a long way forward for a fifth of a second, and
    // points it at what she is biting rather than where she is walking.
    this.biteT = Math.max(0, this.biteT - dt);
    let lead = 2.2, headAng = lookAng;
    if (this.biteT > 0) {
      const f = this.biteProgress;
      // out fast, back slow: the snap is on the way in
      const reach = f < 0.45 ? f / 0.45 : 1 - (f - 0.45) / 0.55 * 0.75;
      lead = 2.2 + reach * 7.5;
      headAng = this.biteAng;
      this.lookAng = this.biteAng;
    }
    head.x = x + Math.cos(headAng) * lead;
    head.y = y - 2.6 + Math.sin(headAng) * lead * 0.55;

    // blinks and ear flicks, so a standing ferret is never completely still
    this.blinkT -= dt;
    if (this.blinkT < -0.1) this.blinkT = rndish(this.travel + x) * 3 + 2.2;
    this.earFlick = Math.max(0, this.earFlick - dt);
    if (this.earFlick <= 0 && speed < 20 && Math.random() < dt * 0.4) this.earFlick = 0.3;

    for (let i = 1; i < SEGS; i++) {
      const a = this.spine[i - 1], b = this.spine[i];
      let dx = b.x - a.x, dy = b.y - a.y;
      let ang = (dx || dy) ? Math.atan2(dy, dx) : Math.PI;

      // Limit how far each joint can bend away from the one in front of it.
      // This is what turns a loose chain into a spine: the head goes first,
      // and the turn travels down the body a joint at a time, which is the
      // whip you see when a real mustelid corners.
      if (i >= 2) {
        const prev = this.spine[i - 2];
        const pang = Math.atan2(a.y - prev.y, a.x - prev.x);
        let da = ang - pang;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        da = clamp(da, -MAX_BEND, MAX_BEND);
        // Uncoil when she is not going anywhere. Without this the chain keeps
        // whatever curl it was left in and a standing ferret is a croissant.
        const straighten = Math.min(0.9, dt * (speed < 24 ? 4.2 : 1.1));
        ang = pang + da * (1 - straighten);
      }

      // Placed exactly, never sprung. A soft constraint stretches at speed and
      // the ferret comes out as a smear; a hard one cannot.
      const link = LINK * (i > TAIL_FROM ? 1.2 : 1);
      b.x = a.x + Math.cos(ang) * link;
      b.y = a.y + Math.sin(ang) * link;
    }

    // --- feet ---------------------------------------------------------------
    // Each foot has a target under its shoulder or hip. It stays planted until
    // the target has walked too far away, then swings to meet it. That is what
    // stops the legs from skating and it costs almost nothing.
    const stepDist = 3.6 + speed * 0.022;
    for (let i = 0; i < 4; i++) {
      const f = this.feet[i];
      const front = i < 2;
      const node = this.spine[front ? SHOULDER : HIP];
      const side = i % 2 === 0 ? 1 : -1;
      // perpendicular to the local spine direction, so feet sit either side
      const ahead = this.spine[front ? SHOULDER - 1 : HIP - 1];
      const ang = Math.atan2(node.y - ahead.y, node.x - ahead.x);
      const nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
      const tgtX = node.x + nx * side * 1.3 - Math.cos(ang) * 0.8;
      const tgtY = node.y + ny * side * 0.6 + 3.4;

      if (f.swing > 0) {
        f.swing = Math.max(0, f.swing - dt * (7 + speed * 0.05));
        const t = 1 - f.swing;
        f.x = lerp(f.px, tgtX + Math.cos(ang) * stepDist * 0.5, t);
        f.y = lerp(f.py, tgtY, t);
      } else {
        const gap = Math.hypot(f.x - tgtX, f.y - tgtY);
        // A foot that has somehow been left a long way behind — a teleport, a
        // respawn, a dash through a wall — just catches up rather than
        // stringing the leg out across the screen.
        if (gap > stepDist * 3.5) { f.x = tgtX; f.y = tgtY; f.swing = 0; }
        else if (gap > stepDist) {
          // diagonal pairs on a trot, front-and-back pairs on a bound
          const partner = this.feet[i ^ (this.bound > 0.5 ? 1 : 3)];
          if (!partner || partner.swing <= 0.35) {
            f.px = f.x; f.py = f.y; f.swing = 1;
          }
        }
      }
    }

    this.headBob = Math.sin(this.phase * TAU) * (0.5 + this.bound * 1.2);
  }

  /** Height of the arch at a point along the body, 0 (nose) to 1 (tail). */
  _arch(f) {
    // One hump that travels down the spine as the gait cycles: the back rises
    // as the hind feet come under, which is the shape of a mustelid bound.
    const wave = Math.sin((f - this.phase) * TAU) * Math.sin(f * Math.PI);
    return wave * (0.8 + this.bound * 4.2);
  }

  // -------------------------------------------------------------------------
  //  drawing
  // -------------------------------------------------------------------------

  /**
   * Draw straight into the world buffer. No baked frames, no cache: the pose
   * only exists this frame.
   */
  draw(r, opts = {}) {
    const ctx = r.ctx;
    const cam = r.camera;
    const alpha = opts.alpha == null ? 1 : opts.alpha;
    const tint = opts.tint || null;
    const S = opts.scale == null ? 1 : opts.scale;
    if (alpha <= 0) return;

    const ox = cam.ox, oy = cam.oy;

    // per-node screen positions, with the gait arch folded in
    const pts = [];
    for (let i = 0; i < SEGS; i++) {
      const f = i / (SEGS - 1);
      const n = this.spine[i];
      pts.push({
        x: n.x - ox,
        y: n.y - oy - this._arch(f) - this.lift + this.crouch * (0.5 + f * 0.5),
        r: PROFILE[i] * S,
        f,
      });
    }

    ctx.globalAlpha = alpha;

    // --- legs, behind the body ---------------------------------------------
    for (let i = 0; i < 4; i++) {
      const f = this.feet[i];
      const front = i < 2;
      const node = pts[front ? SHOULDER : HIP];
      const far = i % 2 === 1;
      const hipX = node.x + (front ? 0.5 : -0.5) * this.facing;
      const hipY = node.y + node.r * 0.4;
      const lifted = f.swing > 0 ? Math.sin((1 - f.swing) * Math.PI) * 2 : 0;
      const fx = f.x - ox, fy = f.y - oy - lifted;
      // short, thick, bent: a ferret's leg is barely longer than its foot
      const kneeX = (hipX + fx) / 2 + (front ? 0.7 : -0.7) * this.facing;
      const kneeY = (hipY + fy) / 2 - 0.4;
      ctx.fillStyle = tint || (far ? COL.guard : COL.dark);
      this._seg(ctx, hipX, hipY, kneeX, kneeY, 1);
      this._seg(ctx, kneeX, kneeY, fx, fy, 0.8);

      // Black feet: the thing the species is actually named after. A paw pad
      // with toes on it, and a lighter top edge when the foot is off the
      // ground, so a step reads as a step and not a shadow twitching.
      const px3 = Math.round(fx), py3 = Math.round(fy);
      ctx.fillStyle = tint || COL.foot;
      ctx.fillRect(px3 - 1, py3 - 1, 3, 2);
      if (!tint) {
        // two toes on the leading edge, and a lit top when the foot is up
        const tang = Math.atan2(fy - kneeY, fx - kneeX);
        const tnx = -Math.sin(tang), tny = Math.cos(tang);
        ctx.fillStyle = shadeHex(COL.foot, 0.3);
        for (const k of [-0.7, 0.7]) {
          ctx.fillRect(Math.round(fx + Math.cos(tang) * 1.2 + tnx * k), Math.round(fy + Math.sin(tang) * 1.2 + tny * k), 1, 1);
        }
        if (lifted > 0.5) { ctx.fillStyle = COL.dark; ctx.fillRect(px3 - 1, py3 - 2, 2, 1); }
      }
    }

    // --- body ---------------------------------------------------------------
    // A tube, painted as perpendicular spans along the spine, so the silhouette
    // stays clean whichever way the body is pointing. Outline first, at one
    // pixel wider, which is a free black keyline without a getImageData pass.
    this._tube(ctx, pts, tint || COL.outline, 1, null);
    this._tube(ctx, pts, tint || COL.base, 0, tint ? null : (f, up) => {
      // shading picked per span: dark along the ridge, pale under the belly
      if (f > 0.82) return COL.tailTip;
      if (up < -0.62) return COL.guard;      // the dark ridge along the spine
      if (up < -0.2) return COL.light;
      if (up > 0.7) return COL.belly;
      return null;
    });

    if (!tint) {
      // guard hairs along the spine, sparse, following the ridge
      ctx.fillStyle = COL.guard;
      for (let i = 2; i < TAIL_FROM; i += 3) {
        const p2 = pts[i];
        ctx.fillRect(Math.round(p2.x), Math.round(p2.y - p2.r), 1, 1);
      }
    }

    // --- head ---------------------------------------------------------------
    const h = pts[0], n1 = pts[1];
    const ang = Math.atan2(h.y - n1.y, h.x - n1.x);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const px2 = -sa, py2 = ca;                 // unit normal
    const bite = this.biteProgress;
    // the jaw is wide open on the way in and shut at full extension
    const jaw = this.biteT > 0 ? (bite < 0.5 ? bite / 0.5 : Math.max(0, 1 - (bite - 0.5) / 0.22)) : 0;
    const hx = h.x + ca * 0.6, hy = h.y + sa * 0.6 + this.headBob * 0.2;
    const hr = 2.7 * S;

    // --- ears, behind the skull so it overlaps their bases ------------------
    // Small, round, set wide and low on the back of the head. They flick, they
    // pin back when she is running flat out, and they are half of why a face
    // this size reads as a face at all.
    if (!tint) {
      const pin = clamp(this.bound * 0.9 + (this.biteT > 0 ? 1 : 0), 0, 1);
      const flick = this.earFlick > 0 ? Math.sin(this.earFlick * 40) * 0.5 : 0;
      for (const side of [-1, 1]) {
        // pinned ears slide back along the skull instead of standing up
        const back = 0.35 + pin * 0.55;
        const out = (0.95 - pin * 0.3) * (1 + (side > 0 ? flick : -flick) * 0.2);
        const ex = hx - ca * hr * back + px2 * side * hr * out;
        const ey = hy - sa * hr * back + py2 * side * hr * out - hr * (0.34 - pin * 0.24);
        ctx.fillStyle = COL.outline;
        this._blob(ctx, ex, ey, 1.8 * S);
        ctx.fillStyle = COL.face;
        this._blob(ctx, ex, ey, 1.2 * S);
        ctx.fillStyle = COL.base;
        this._blob(ctx, ex - ca * 0.4, ey - sa * 0.4, 0.7 * S);
        // the pink inside, one pixel, only when the ear is up
        if (pin < 0.5) {
          ctx.fillStyle = COL.earInner;
          ctx.fillRect(Math.round(ex + ca * 0.6), Math.round(ey + sa * 0.6), 1, 1);
        }
      }
    }

    // --- skull ---------------------------------------------------------------
    // The head is the pale part. A black-footed ferret's face is cream from
    // the crown to the chin with one dark band across the eyes, and painting
    // the skull in body colour throws that away and leaves a brown lump.
    ctx.fillStyle = tint || COL.outline;
    this._blob(ctx, hx, hy, hr + 1);
    ctx.fillStyle = tint || COL.face;
    this._blob(ctx, hx, hy, hr);

    if (!tint) {
      // the crown is a shade darker, so the skull still has a top and a side
      ctx.fillStyle = COL.base;
      this._blob(ctx, hx - ca * hr * 0.62, hy - sa * hr * 0.62, hr * 0.42);

      // --- muzzle -----------------------------------------------------------
      // A ferret's face is mostly nose: a pale wedge running forward off the
      // skull, a dark button on the end of it, and a mouth line underneath.
      const mL = hr * 0.88;
      const mx = hx + ca * mL, my = hy + sa * mL;
      // No keyline on the muzzle: it sits inside the skull silhouette, and an
      // outline there just draws a dark ring across the middle of the face.
      ctx.fillStyle = COL.face;
      this._blob(ctx, mx, my, hr * 0.5);
      ctx.fillStyle = shadeHex(COL.face, 0.35);
      this._blob(ctx, mx - ca * 0.4, my - sa * 0.4 - 0.5, hr * 0.28);

      const nx2 = mx + ca * hr * 0.52, ny2 = my + sa * hr * 0.52;
      ctx.fillStyle = COL.nose;
      ctx.fillRect(Math.round(nx2), Math.round(ny2), 2, 1);
      ctx.fillStyle = shadeHex(COL.nose, 0.35);
      ctx.fillRect(Math.round(nx2), Math.round(ny2), 1, 1);

      // --- jaw --------------------------------------------------------------
      if (jaw > 0.05) {
        // open mouth: a dark wedge under the nose with two teeth in it
        const gape = jaw * hr * 1.15;
        const jx = mx - ca * hr * 0.15, jy = my - sa * hr * 0.15;
        ctx.fillStyle = '#3a1414';
        for (let d = 0; d <= gape; d += 0.6) {
          const wdt = Math.max(1, Math.round((1 - d / (gape + 0.6)) * hr * 0.9));
          for (let k = -wdt; k <= wdt; k++) {
            ctx.fillRect(Math.round(jx + ca * d + px2 * k * 0.7), Math.round(jy + sa * d + py2 * k * 0.7), 1, 1);
          }
        }
        ctx.fillStyle = '#f4efe2';
        for (const side of [-1, 1]) {
          ctx.fillRect(Math.round(jx + ca * 0.6 + px2 * side * hr * 0.5), Math.round(jy + sa * 0.6 + py2 * side * hr * 0.5), 1, 1);
          ctx.fillRect(Math.round(jx + ca * gape * 0.7 + px2 * side * hr * 0.3), Math.round(jy + sa * gape * 0.7 + py2 * side * hr * 0.3), 1, 1);
        }
      } else {
        // closed: one short line, which is all a mouth needs at this size
        ctx.fillStyle = shadeHex(COL.nose, 0.18);
        ctx.fillRect(Math.round(mx + px2 * 0.5), Math.round(my + py2 * 0.5 + 1), 1, 1);
        ctx.fillRect(Math.round(mx - px2 * 0.5), Math.round(my - py2 * 0.5 + 1), 1, 1);
      }

      // --- the mask ----------------------------------------------------------
      // The band across the eyes is the single most recognisable thing about a
      // black-footed ferret, so it is drawn as a band and not a smudge.
      ctx.fillStyle = COL.mask;
      for (let t = -1.3; t <= 1.3; t += 0.22) {
        const bx2 = hx + px2 * t * hr * 0.9 + ca * hr * 0.12;
        const by2 = hy + py2 * t * hr * 0.9 + sa * hr * 0.12;
        // two pixels deep, following the face's own axis
        ctx.fillRect(Math.round(bx2), Math.round(by2), 1, 1);
        ctx.fillRect(Math.round(bx2 + ca * 0.9), Math.round(by2 + sa * 0.9), 1, 1);
      }

      // --- eyes ---------------------------------------------------------------
      const blinking = this.blinkT > 0 && this.blinkT < 0.09;
      const eF = hr * 0.22, eS = hr * 0.66;
      const e1x = hx + ca * eF + px2 * eS, e1y = hy + sa * eF + py2 * eS;
      const e2x = hx + ca * eF - px2 * eS, e2y = hy + sa * eF - py2 * eS;

      // hers: a dark bead with a catchlight, and it blinks
      if (blinking) {
        ctx.fillStyle = COL.mask;
        ctx.fillRect(Math.round(e1x) - 1, Math.round(e1y), 2, 1);
      } else {
        // Flat black, no catchlight. A pale highlight here reads as a second
        // glowing optic, and the whole point is that she only has one.
        ctx.fillStyle = COL.eye;
        ctx.fillRect(Math.round(e1x) - 1, Math.round(e1y) - 1, 2, 2);
      }

      // theirs: a hard little optic with a housing. It has no lid, so it does
      // not blink with the other one, and that is the point of it.
      ctx.fillStyle = P.nestSteelDk;
      ctx.fillRect(Math.round(e2x) - 1, Math.round(e2y) - 1, 3, 2);
      ctx.fillStyle = P.cyberHot;
      ctx.fillRect(Math.round(e2x), Math.round(e2y) - 1, 1, 1);

      // stitches over the shoulder, where they opened her up
      const st = pts[SHOULDER + 1];
      ctx.fillStyle = P.stitch;
      const sang = Math.atan2(pts[SHOULDER].y - pts[SHOULDER + 2].y, pts[SHOULDER].x - pts[SHOULDER + 2].x);
      const snx = -Math.sin(sang), sny = Math.cos(sang);
      for (let t = -1; t <= 1; t++) {
        ctx.fillRect(Math.round(st.x + snx * t * st.r * 0.7), Math.round(st.y + sny * t * st.r * 0.7), 1, 1);
      }
    }

    ctx.globalAlpha = 1;
  }

  /** The glow of the optic, for the light pass. */
  eyePos() {
    const h = this.spine[0], n1 = this.spine[1];
    const ang = Math.atan2(h.y - n1.y, h.x - n1.x);
    return { x: h.x + Math.cos(ang) * 1.4, y: h.y + Math.sin(ang) * 1.4 - 0.5 };
  }

  /** Body radius at a spine index, for anything that wants to mirror the shape. */
  radiusAt(i) { return PROFILE[clamp(i, 0, SEGS - 1)]; }

  /** A recorded pose, drawn flat. Used for the dash trail. */
  drawGhost(r, spine, alpha, color) {
    if (alpha <= 0) return;
    const ctx = r.ctx, cam = r.camera;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    for (let i = 0; i < spine.length - 1; i++) {
      const a = spine[i], b = spine[i + 1];
      const steps = Math.max(1, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y)));
      for (let s2 = 0; s2 <= steps; s2++) {
        const t = s2 / steps;
        const x = Math.round(a.x + (b.x - a.x) * t - cam.ox);
        const y = Math.round(a.y + (b.y - a.y) * t - cam.oy);
        const d = Math.max(1, Math.round((a.r + (b.r - a.r) * t)));
        ctx.fillRect(x - (d >> 1), y - (d >> 1), d, d);
      }
    }
    ctx.globalAlpha = 1;
  }

  /** Where the gun sits, and where the wood rides. */
  shoulder() { return this.spine[SHOULDER]; }
  hipNode() { return this.spine[HIP]; }
  nose() { return this.spine[0]; }

  // -- primitives ------------------------------------------------------------

  /**
   * A filled disc, centred, rasterised row by row.
   *
   * The obvious thing here is a square, and a square is what a head made of
   * stacked squares looks like: a brick. Scanning rows costs a handful of
   * fillRects and gives an actual round skull at five pixels across, which is
   * the difference between a face and a smudge.
   */
  _blob(ctx, x, y, r) {
    const cx = Math.round(x), cy = Math.round(y);
    if (r <= 0.7) { ctx.fillRect(cx, cy, 1, 1); return; }
    if (r <= 1.2) { ctx.fillRect(cx - 1, cy - 1, 2, 2); return; }
    const R = r;
    const top = Math.round(-R), bot = Math.round(R);
    for (let j = top; j <= bot; j++) {
      const dy = (Math.abs(j) + 0.5) - 0.5;
      const half = Math.sqrt(Math.max(0, R * R - dy * dy));
      const w = Math.max(1, Math.round(half * 2));
      ctx.fillRect(cx - (w >> 1), cy + j, w, 1);
    }
  }

  /** A tapering limb segment. */
  _seg(ctx, x0, y0, x1, y1, w) {
    const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
    const d = Math.max(1, Math.round(w * 2));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      ctx.fillRect(Math.round(x0 + (x1 - x0) * t) - (d >> 1), Math.round(y0 + (y1 - y0) * t) - (d >> 1), d, d);
    }
  }

  /**
   * Paint the body as a run of spans perpendicular to the spine.
   *
   * Stamping squares along a centre line gives a lumpy sausage that changes
   * width as the body rotates. Walking the spine and filling across its normal
   * gives a clean tube at any angle, and hands each pixel its position across
   * the body so the shader callback can put the dark on top and the pale
   * underneath.
   */
  _tube(ctx, pts, color, grow, shade) {
    ctx.fillStyle = color;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.ceil(len * 1.6));
      const nx = len > 0.001 ? -dy / len : 0;
      const ny = len > 0.001 ? dx / len : 1;
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const cx = a.x + dx * t, cy = a.y + dy * t;
        const rr = (a.r + (b.r - a.r) * t) + grow;
        if (rr <= 0.2) continue;
        const f = a.f + (b.f - a.f) * t;
        const half = Math.max(1, Math.round(rr));
        for (let k = -half; k <= half; k++) {
          const u = k / half;                    // -1 top, +1 bottom of the body
          if (shade) {
            const c = shade(f, u);
            ctx.fillStyle = c || color;
          }
          ctx.fillRect(Math.round(cx + nx * k), Math.round(cy + ny * k), 1, 1);
        }
        if (shade) ctx.fillStyle = color;
      }
    }
  }
}

// src/systems/inventory.js
// ==========================================================================
// Resource bag. Wood is special: it is physically carried on the ferret's back
// with a hard cap of 10 pieces, so `add('wood', n)` can partially fail and the
// caller has to deal with the overflow.

// bundled: import { RESOURCES } from './defs.js';

class Inventory {
  constructor() {
    this.items = Object.create(null);
    this.caps = Object.create(null);
    for (const k of Object.keys(RESOURCES)) {
      this.items[k] = 0;
      if (RESOURCES[k].carry) this.caps[k] = RESOURCES[k].carry;
    }
    this.onChange = null;
  }

  get(k) { return this.items[k] || 0; }
  cap(k) { return this.caps[k] == null ? Infinity : this.caps[k]; }
  isFull(k) { return this.get(k) >= this.cap(k); }
  setCap(k, v) { this.caps[k] = v; }

  /** Returns how many were actually accepted. */
  add(k, n = 1) {
    if (!(k in this.items)) this.items[k] = 0;
    const cap = this.cap(k);
    const before = this.items[k];
    const after = Math.min(cap, before + n);
    this.items[k] = after;
    if (after !== before && this.onChange) this.onChange(k, after - before);
    return after - before;
  }

  has(k, n = 1) { return this.get(k) >= n; }

  hasAll(costObj) {
    for (const k in costObj) if (this.get(k) < costObj[k]) return false;
    return true;
  }

  /** Returns true if the whole amount was removed. */
  take(k, n = 1) {
    if (this.get(k) < n) return false;
    this.items[k] -= n;
    if (this.onChange) this.onChange(k, -n);
    return true;
  }

  takeAll(costObj) {
    if (!this.hasAll(costObj)) return false;
    for (const k in costObj) this.take(k, costObj[k]);
    return true;
  }

  /** Everything the player is holding, as [key, count] pairs, non-zero only. */
  entries() {
    const out = [];
    for (const k in this.items) if (this.items[k] > 0) out.push([k, this.items[k]]);
    return out;
  }

  total() {
    let n = 0;
    for (const k in this.items) n += this.items[k];
    return n;
  }
}
