// ==========================================================================
// src/art/beastpix.js
// ==========================================================================
// Hand-drawn animals.
//
// The old version of this solved a skeleton at runtime — a spine, joints,
// posture rules, the lot. It was clever and it looked like porridge, because
// pixel art at this size is not a simulation problem. A 30-pixel wolf is not a
// small wolf; it is a *symbol* of a wolf, and which nine pixels you spend on
// the head matters far more than whether the elbow bends correctly.
//
// So these are drawn the way pixel artists actually draw animals:
//
//   1. BLOCK IN the silhouette from a few overlapping masses — chest, barrel,
//      haunch, skull, muzzle. Animals are not tubes on sticks; they are a
//      couple of big volumes with a neck between them.
//   2. CLEAN the mask. Kill orphan pixels, fill single-pixel pinholes. A
//      ragged edge is the single loudest tell of bad pixel art.
//   3. OUTLINE it, one pixel, all the way round, in a dark tint of the coat
//      and never in pure black — black outlines make everything look like a
//      sticker sitting on top of the world instead of standing in it.
//   4. SHADE with three tones and a belly, lit from above: a light band on the
//      back, mid over the mass, dark under the belly. Per column, following
//      the silhouette, so it never pillow-shades.
//   5. PLACE THE FEATURES last, by hand: eye, nose, ear, markings, horns.
//      One pixel of eye in the wrong place ruins an otherwise good animal.
//
// The silhouette carries the species. Every one of these should be
// identifiable as a flat black shape, and the check harness renders them that
// way so it can be verified rather than hoped for.
//
// Animation moves what is already drawn — the leg groups swing, the body bobs
// a pixel, the tail sways — instead of re-solving anything. That is also how
// it is really done.

// bundled: import { surface, getSheet, shade } from './pixel.js';

// One authored pixel is this many screen pixels. It is deliberately the same
// for every species: mixed pixel sizes in one scene is the other loudest tell.
const PIX = 2;

// ---------------------------------------------------------------------------
//  mask rasterising
//
//  Everything is drawn into a byte-per-pixel grid first, with no colour at
//  all. Colour is decided afterwards from the shape, which is what keeps the
//  shading consistent between species.
// ---------------------------------------------------------------------------

function Grid(w, h) {
  return { w, h, d: new Uint8Array(w * h) };
}
const gat = (g, x, y) => (x < 0 || y < 0 || x >= g.w || y >= g.h ? 0 : g.d[y * g.w + x]);
const gset = (g, x, y, v) => { if (x >= 0 && y >= 0 && x < g.w && y < g.h) g.d[y * g.w + x] = v; };

function fillEll(g, cx, cy, rx, ry, v) {
  const x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx);
  const y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const dx = (x + 0.5 - cx) / (rx + 0.001), dy = (y + 0.5 - cy) / (ry + 0.001);
      if (dx * dx + dy * dy <= 1) gset(g, x, y, v);
    }
  }
}

function fillRect(g, x, y, w, h, v) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) gset(g, x + i, y + j, v);
}

/** A capsule: the workhorse. Necks, legs, tails, the barrel of a body. */
function fillCap(g, x0, y0, x1, y1, r0, r1, v) {
  if (r1 == null) r1 = r0;
  const steps = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 2));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    fillEll(g, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r0 + (r1 - r0) * t, r0 + (r1 - r0) * t, v);
  }
}

function fillTri(g, ax, ay, bx, by, cx, cy, v) {
  const minX = Math.floor(Math.min(ax, bx, cx)), maxX = Math.ceil(Math.max(ax, bx, cx));
  const minY = Math.floor(Math.min(ay, by, cy)), maxY = Math.ceil(Math.max(ay, by, cy));
  const area = (bx - ax) * (cy - ay) - (cx - ax) * (by - ay);
  if (Math.abs(area) < 1e-6) return;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const px = x + 0.5, py = y + 0.5;
      const w0 = ((bx - ax) * (py - ay) - (px - ax) * (by - ay)) / area;
      const w1 = ((cx - bx) * (py - by) - (px - bx) * (cy - by)) / area;
      const w2 = ((ax - cx) * (py - cy) - (px - cx) * (ay - cy)) / area;
      if (w0 >= -0.02 && w1 >= -0.02 && w2 >= -0.02) gset(g, x, y, v);
    }
  }
}

/** A tapering curve — antler beams, crane necks, the sweep of a horn. */
function fillArc(g, cx, cy, r, a0, a1, thick0, thick1, v) {
  const steps = Math.max(4, Math.ceil(Math.abs(a1 - a0) * r * 2));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, a = a0 + (a1 - a0) * t;
    const th = thick0 + (thick1 - thick0) * t;
    fillEll(g, cx + Math.cos(a) * r, cy + Math.sin(a) * r, th, th, v);
  }
}

function shapeInto(g, s, v) {
  switch (s[0]) {
    case 'e': fillEll(g, s[1], s[2], s[3], s[4], v); break;
    case 'r': fillRect(g, s[1], s[2], s[3], s[4], v); break;
    case 'c': fillCap(g, s[1], s[2], s[3], s[4], s[5], s[6], v); break;
    case 't': fillTri(g, s[1], s[2], s[3], s[4], s[5], s[6], v); break;
    case 'a': fillArc(g, s[1], s[2], s[3], s[4], s[5], s[6], s[7], v); break;
    case 'x': fillEll(g, s[1], s[2], s[3], s[4], 0); break;   // carve back out
    default: break;
  }
}

/**
 * Tidy the silhouette.
 *
 * Fills pinholes and shaves off pixels that are only diagonally attached.
 * Rasterised ellipses produce both, and both look like dirt on the screen.
 */
function clean(g) {
  const nb = (x, y) => gat(g, x - 1, y) + gat(g, x + 1, y) + gat(g, x, y - 1) + gat(g, x, y + 1);
  for (let pass = 0; pass < 2; pass++) {
    const src = g.d.slice();
    const at = (x, y) => (x < 0 || y < 0 || x >= g.w || y >= g.h ? 0 : src[y * g.w + x]);
    for (let y = 0; y < g.h; y++) {
      for (let x = 0; x < g.w; x++) {
        const n = at(x - 1, y) + at(x + 1, y) + at(x, y - 1) + at(x, y + 1);
        if (!at(x, y) && n >= 3) gset(g, x, y, 1);          // pinhole
        else if (at(x, y) && n === 0) gset(g, x, y, 0);      // orphan
      }
    }
  }
  void nb;
}

// ---------------------------------------------------------------------------
//  compositing
//
//  A species is a stack of layers, but it is drawn as ONE animal: the whole
//  silhouette gets a single unbroken outline, and only the near limbs get an
//  extra internal line to lift them off the body. That is the difference
//  between a drawn animal and a pile of separately-outlined parts, and it is
//  the thing that made the first attempt at this look like two dogs stapled
//  together at the shoulder.
//
//  Shading is grouped, not per-layer: the barrel, neck and skull share one set
//  of column extents, so the light band runs unbroken along the topline from
//  rump to nose. Each leg shades on its own, because each leg is its own form.
// ---------------------------------------------------------------------------

// Which limb group a layer belongs to, so the gait can move it.
//  body  the barrel and chest        head  skull, neck, ears, horns
//  tail  what sways behind           l1/l2 near fore / near hind
//  l3/l4 far fore / far hind         wing  what flaps
const SETS = ['body', 'head', 'tail', 'l1', 'l2', 'l3', 'l4', 'wing'];

/**
 * Per-layer colour ramp.
 *
 * Four bands, not three: a rim of light on the very top, the body tone, a
 * half-step down where the barrel turns under, and the shadow along the
 * underside. Three tones is the usual advice and it is right for a 12-pixel
 * sprite; at forty pixels across, three tones is a paper cut-out.
 */
function toneOf(pal, tone) {
  if (tone === 'far') {
    // Everything on the far side of the animal is in its own shadow. Tone
    // alone puts it behind — no extra outline needed, and no second pair of
    // black stilts.
    const d = pal.far || shade(pal.dark, -0.06);
    return { light: d, mid: d, mid2: shade(d, -0.10), dark: shade(d, -0.18) };
  }
  if (tone && pal[tone]) {
    const c = pal[tone];
    return { light: shade(c, 0.14), mid: c, mid2: shade(c, -0.08), dark: shade(c, -0.2) };
  }
  return { light: pal.light, mid: pal.mid, mid2: pal.mid2 || shade(pal.mid, -0.11), dark: pal.dark };
}

/** Offset a grid's set pixels into a destination grid. */
function stamp(dst, g, ox, oy) {
  for (let y = 0; y < g.h; y++) {
    for (let x = 0; x < g.w; x++) {
      if (!g.d[y * g.w + x]) continue;
      gset(dst, x + ox, y + oy, 1);
    }
  }
}

/** Trace one pixel of outline around everything set in `u`, into `col`. */
function outlineOf(col, u, colour, W, H) {
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (u.d[y * W + x]) continue;
      let touch = 0;
      for (let dy = -1; dy <= 1 && !touch; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          if (gat(u, x + dx, y + dy)) { touch = 1; break; }
        }
      }
      if (touch) col[y * W + x] = colour;
    }
  }
}

/**
 * Fill one layer, shaded per column against `ext` — the column extents of the
 * whole group this layer belongs to, so a light band crosses part seams
 * without a step in it.
 */
function fillLayer(col, g, ext, ramp, ox, oy, W, H) {
  for (let y = 0; y < g.h; y++) {
    for (let x = 0; x < g.w; x++) {
      if (!g.d[y * g.w + x]) continue;
      const px = x + ox, py = y + oy;
      if (px < 0 || py < 0 || px >= W || py >= H) continue;
      const e = ext[px];
      let c = ramp.mid;
      if (e) {
        const dt = py - e[0], db = e[1] - py, span = e[1] - e[0];
        if (dt <= 0) c = ramp.light;
        else if (span >= 8 && dt === 1) c = ramp.light;
        else if (span >= 3 && db <= 0) c = ramp.dark;
        else if (span >= 7 && db <= 2) c = ramp.mid2;
        else if (span >= 5 && db <= 1) c = ramp.mid2;
      }
      col[py * W + px] = c;
    }
  }
}

/** Top and bottom of every column of a mask, for the shading pass. */
function extents(u, W, H) {
  const ext = new Array(W).fill(null);
  for (let x = 0; x < W; x++) {
    let top = -1, bot = -1;
    for (let y = 0; y < H; y++) if (u.d[y * W + x]) { if (top < 0) top = y; bot = y; }
    if (top >= 0) ext[x] = [top, bot];
  }
  return ext;
}

/** Features are painted last and clipped to the sprite unless marked free. */
function paintFeat(col, mask, f, pal, ox, oy, W, H) {
  const g = Grid(W, H);
  const kind = f[0];
  const c = pal[f[f.length - 1]] || f[f.length - 1];
  const free = kind === kind.toUpperCase();
  const k = kind.toLowerCase();
  if (k === 'p') gset(g, Math.round(f[1] + ox), Math.round(f[2] + oy), 1);
  else if (k === 'r') fillRect(g, Math.round(f[1] + ox), Math.round(f[2] + oy), f[3], f[4], 1);
  else if (k === 'e') fillEll(g, f[1] + ox, f[2] + oy, f[3], f[4], 1);
  else if (k === 'c') fillCap(g, f[1] + ox, f[2] + oy, f[3] + ox, f[4] + oy, f[5], f[5], 1);
  else if (k === 't') fillTri(g, f[1] + ox, f[2] + oy, f[3] + ox, f[4] + oy, f[5] + ox, f[6] + oy, 1);
  else if (k === 'a') fillArc(g, f[1] + ox, f[2] + oy, f[3], f[4], f[5], f[6], f[7], 1);
  for (let i = 0; i < g.d.length; i++) {
    if (!g.d[i]) continue;
    if (!free && !mask.d[i]) continue;
    col[i] = c;
  }
}

/** The gait. Two diagonal pairs, opposed, with a lift on the swing leg. */
function gaitOffsets(spec, anim, phase) {
  const off = {};
  for (const s of SETS) off[s] = [0, 0];
  const a = phase * Math.PI * 2;
  const moving = anim === 'walk' || anim === 'run' || anim === 'trot' || anim === 'charge';
  const fast = anim === 'run' || anim === 'charge';
  const base = spec.stride || 2;
  const amp = fast ? base + 1 : base;
  const bob = moving ? (Math.sin(a * 2) > 0.2 ? -1 : 0) : (Math.sin(a) > 0.75 ? -1 : 0);

  off.body = [0, bob];
  off.head = [0, bob];
  off.tail = [0, bob];
  for (const s of ['l1', 'l2', 'l3', 'l4']) off[s] = [0, bob];

  if (moving) {
    // diagonal pairs: near fore travels with far hind, near hind with far fore
    const pA = Math.sin(a), pB = Math.sin(a + Math.PI);
    const lift = (p) => (p > 0.55 ? -1 : 0) + (fast && p > 0.9 ? -1 : 0);
    off.l1 = [Math.round(pA * amp), bob + lift(pA)];
    off.l4 = [Math.round(pA * amp), bob + lift(pA)];
    off.l2 = [Math.round(pB * amp), bob + lift(pB)];
    off.l3 = [Math.round(pB * amp), bob + lift(pB)];
    off.tail = [Math.round(-pA), bob + (fast ? -1 : 0)];
    off.head = [fast ? 1 : 0, bob];
  } else if (anim === 'graze' || anim === 'sniff') {
    off.head = [1, (spec.grazeDrop || 3)];
  } else if (anim === 'alert' || anim === 'attack') {
    off.head = [0, bob - 1];
    off.tail = [0, bob - 1];
  } else if (anim === 'idle') {
    off.tail = [Math.sin(a) > 0 ? 0 : -1, bob];
    off.head = [0, bob + (Math.sin(a * 0.5) > 0.85 ? 1 : 0)];
  } else if (anim === 'sit') {
    // haunches down, chest still up
    off.body = [0, 2];
    off.head = [0, 1];
    off.tail = [0, 3];
    off.l2 = [-1, 3]; off.l4 = [-1, 3];
  } else if (anim === 'groom') {
    // nose turned back into the flank
    off.head = [-2, 3 + (Math.sin(a * 2) > 0 ? 1 : 0)];
  } else if (anim === 'shake') {
    const j = Math.sin(a * 6) > 0 ? 1 : -1;
    off.body = [j, bob];
    off.head = [-j, bob];
    off.tail = [j * 2, bob];
  }

  // wings: flap hard in the air, settle on the ground
  if (anim === 'fly' || anim === 'run') off.wing = [0, Math.round(Math.sin(a) * 2)];
  else off.wing = [0, Math.sin(a) > 0.8 ? -1 : 0];
  return off;
}

function layerVisible(L, anim) {
  const isMove = anim === 'walk' || anim === 'run' || anim === 'trot' || anim === 'charge';
  if (L.anim && L.anim !== anim && !(L.anim === 'move' && isMove)) return false;
  if (L.not && (L.not === anim || (L.not === 'move' && isMove))) return false;
  return true;
}

/**
 * Expressions.
 *
 * One pixel around the eye is the whole vocabulary, and it is enough: a brow
 * dropped toward the nose is anger, a brow lifted off it is interest, and an
 * eye squeezed to a line is pain. Anything more elaborate than that at this
 * size just turns the face to mud.
 */
const EXPR = {
  calm: null,
  alert: { brow: -2 },
  curious: { brow: -2, tilt: 1 },
  angry: { brow: -1, slant: 1 },
  afraid: { wide: 1 },
  hurt: { shut: 1 },
  happy: { squint: 1 },
  dead: { shut: 1 },
};

/** Draw the expression onto whatever the species uses for an eye. */
function paintExpr(col, union, spec, name, off, W, H) {
  const e = EXPR[name];
  if (!e) return;
  const pal = spec.pal;
  let eye = null;
  for (const f of (spec.feats || [])) {
    const k = String(f.f[0]).toLowerCase();
    if (f.f[f.f.length - 1] !== 'eye') continue;
    if (k !== 'p' && k !== 'e') continue;
    const [ox, oy] = off[f.set || 'head'] || [0, 0];
    eye = { x: Math.round(f.f[1] + ox), y: Math.round(f.f[2] + oy) };
    break;
  }
  if (!eye) return;
  const put = (x, y, c) => {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    if (!union.d[y * W + x]) return;
    col[y * W + x] = c;
  };
  const dark = pal.out;
  if (e.shut) { put(eye.x, eye.y, dark); put(eye.x + 1, eye.y, dark); put(eye.x - 1, eye.y, dark); }
  if (e.wide) { put(eye.x, eye.y + 1, pal.eye || dark); put(eye.x, eye.y - 1, pal.eye || dark); }
  if (e.squint) { put(eye.x, eye.y + 1, dark); }
  if (e.brow != null) {
    const by = eye.y + e.brow;
    put(eye.x, by, dark);
    put(eye.x + 1, by + (e.slant ? 1 : 0), dark);
    if (e.tilt) put(eye.x - 1, by - 1, dark);
  }
}

/** One frame, at 1:1 authored resolution, then blown up by PIX. */
function renderFrame(spec, anim, phase, scale, expr) {
  const W = spec.w, H = spec.h;
  const off = gaitOffsets(spec, anim, phase);
  const col = new Array(W * H).fill(null);
  const pal = spec.pal;

  // rasterise every visible layer once, in its animated position
  const layers = [];
  for (const L of spec.layers) {
    if (!layerVisible(L, anim)) continue;
    const g = Grid(W, H);
    for (const s of L.shapes) shapeInto(g, s, 1);
    if (L.clean !== false) clean(g);
    const [ox, oy] = off[L.set || 'body'] || [0, 0];
    layers.push({ L, g, ox, oy, z: L.z || 0 });
  }
  layers.sort((a, b) => a.z - b.z);

  // the whole animal, as one shape — this is what gets the outline
  const union = Grid(W, H);
  for (const it of layers) stamp(union, it.g, it.ox, it.oy);
  outlineOf(col, union, pal.out, W, H);

  // shading groups: the core shades together so the topline is continuous
  const groups = new Map();
  for (const it of layers) {
    const key = it.L.shade || (['body', 'head', 'tail'].includes(it.L.set || 'body') ? 'core' : (it.L.set || 'body'));
    it.group = key;
    if (!groups.has(key)) groups.set(key, Grid(W, H));
    stamp(groups.get(key), it.g, it.ox, it.oy);
  }
  const ext = new Map();
  for (const [k, g] of groups) ext.set(k, extents(g, W, H));

  for (const it of layers) fillLayer(col, it.g, ext.get(it.group), toneOf(pal, it.L.tone), it.ox, it.oy, W, H);

  // near limbs get one internal line so they lift off the barrel
  for (const it of layers) {
    if (!it.L.sep) continue;
    const only = Grid(W, H);
    stamp(only, it.g, it.ox, it.oy);
    const line = pal.sep || pal.out;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        if (only.d[y * W + x] || !union.d[y * W + x]) continue;
        let touch = 0;
        for (let dy = -1; dy <= 1 && !touch; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            if (gat(only, x + dx, y + dy)) { touch = 1; break; }
          }
        }
        if (touch) col[y * W + x] = line;
      }
    }
  }

  for (const f of (spec.feats || [])) {
    const [ox, oy] = off[f.set || 'head'] || [0, 0];
    paintFeat(col, union, f.f, pal, ox, oy, W, H);
  }
  paintExpr(col, union, spec, expr, off, W, H);

  // 1:1 first, then integer-scale it. Enlarging authored pixels any other way
  // is the fastest possible way to stop looking like pixel art.
  const s1 = surface(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = col[y * W + x];
      if (!c) continue;
      s1.fillStyle = c;
      s1.fillRect(x, y, 1, 1);
    }
  }
  const S = Math.max(1, Math.round(scale));
  if (S === 1) return s1.canvas;
  const ctx = surface(W * S, H * S);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(s1.canvas, 0, 0, W, H, 0, 0, W * S, H * S);
  return ctx.canvas;
}

// ---------------------------------------------------------------------------
//  legs
//
//  Every quadruped in the basin uses the same two joints, because every
//  quadruped in the world does: the foreleg is a near-vertical column, and the
//  hind leg breaks backwards at the hock. Getting that one backwards bend in
//  is most of what makes a drawn animal read as an animal rather than a table.
// ---------------------------------------------------------------------------

function fore(x, top, bot, r) {
  const mid = top + (bot - top) * 0.55;
  return [
    ['c', x, top, x, mid, r, r * 0.78],
    ['c', x, mid, x + 0.4, bot - 1, r * 0.78, r * 0.62],
    ['r', Math.round(x - r * 0.75), bot - 1, Math.max(2, Math.round(r * 1.5)), 1],
  ];
}

function hind(x, top, bot, r) {
  const stifle = top + (bot - top) * 0.42;
  const hock = top + (bot - top) * 0.70;
  return [
    ['c', x, top, x + 0.7, stifle, r, r * 0.8],
    ['c', x + 0.7, stifle, x - 1.5, hock, r * 0.8, r * 0.58],
    ['c', x - 1.5, hock, x - 0.4, bot - 1, r * 0.58, r * 0.55],
    ['r', Math.round(x - r * 0.75 - 0.4), bot - 1, Math.max(2, Math.round(r * 1.5)), 1],
  ];
}

/** Bird leg: a stick with a backwards-kinked ankle and a splayed foot. */
function birdLeg(x, top, bot, r) {
  const ankle = top + (bot - top) * 0.55;
  return [
    ['c', x, top, x - 0.6, ankle, r, r * 0.8],
    ['c', x - 0.6, ankle, x + 0.6, bot - 1, r * 0.8, r * 0.6],
    ['r', Math.round(x - 1), bot - 1, 3, 1],
  ];
}

const BEAST_PIX_KEYS = () => Object.keys(SPECS);
function hasPixArt(key) { return !!SPECS[key]; }
function pixSpec(key) { return SPECS[key]; }

/** Frames for one animal, cached. Null for a species with no art yet. */
function pixFrames(key, anim, frames = 6, scale = PIX, expr = 'calm') {
  const spec = SPECS[key];
  if (!spec) return null;
  return getSheet(`pix:${key}:${anim}:${frames}:${scale}:${expr}`, () => {
    const out = [];
    for (let i = 0; i < frames; i++) out.push(renderFrame(spec, anim, i / frames, scale, expr));
    return out;
  });
}

function pixSize(key, scale = PIX) {
  const spec = SPECS[key];
  if (!spec) return null;
  const S = Math.max(1, Math.round(scale));
  return { w: spec.w * S, h: spec.h * S };
}

/** Flat black, for checking that the silhouette alone carries the species. */
function pixSilhouette(key, anim = 'idle', scale = PIX) {
  const spec = SPECS[key];
  if (!spec) return null;
  const flat = { out: '#000000', dark: '#000000', mid: '#000000', light: '#000000' };
  const sub = Object.assign({}, spec, { pal: Object.assign({}, spec.pal, flat), feats: [] });
  return renderFrame(sub, anim, 0, scale);
}

// ==========================================================================
// src/story/cutscene.js
// ==========================================================================
// A small timeline player for interactive cutscenes. A cutscene is an array of
// beats; each beat runs until its condition clears, then the next one starts.
// Beats can move the camera, put words on the screen, spill blood, or hand
// control back for a moment and demand you do something.

// bundled: import { drawText, measure, wrapText, LINE_H } from '../engi
// bundled: import { P } from '../art/palette.js';
// bundled: import { clamp } from '../engine/math.js';
// bundled: import { particles } from '../engine/particles.js';
// bundled: import { audio } from '../engine/audio.js';
// bundled: import { VIEW_W, VIEW_H } from '../engine/canvas.js';
// bundled: import { speechBubble } from '../ui/dialogue.js';

class Cutscene {
  constructor(beats, opts = {}) {
    this.beats = beats;
    this.i = 0;
    this.t = 0;
    this.done = false;
    this.letterbox = opts.letterbox == null ? 1 : opts.letterbox;
    this.letterboxNow = 0;
    this.fade = 0;
    this.fadeColor = '#000';
    this.line = null;         // { who, text, chars, color }
    this.prompt = null;       // { label, kind, need, have }
    this.skippable = opts.skippable !== false;
    this.onDone = opts.onDone || null;
    this.camTarget = null;
    this.camHold = null;      // actor the camera is following
    this.enteredI = -1;       // last beat whose enter() has run
    this.game = null;
    // Given a speaker name, return { x, y } in world space — or nothing, for
    // narration, which has no mouth and belongs at the bottom of the screen.
    this.speakerAt = opts.speakerAt || null;
  }

  get beat() { return this.beats[this.i]; }

  say(who, text, color) {
    this.line = { who, text, chars: 0, color: color || P.ui, lines: wrapText(text, Math.min(200, VIEW_W - 60)) };
  }

  advance() {
    this.i++;
    this.t = 0;
    this.prompt = null;
    // enter() is fired from update(), once per beat. Firing it here as well
    // ran every do-beat twice, which is fine for a camera move and very much
    // not fine for anything that spawns something.
    if (this.i >= this.beats.length) {
      this.done = true;
      if (this.onDone) this.onDone();
    }
  }

  update(dt, game) {
    if (this.done) return;
    this.game = game;
    this.letterboxNow += ((this.letterbox ? 1 : 0) - this.letterboxNow) * Math.min(1, dt * 5);

    if (this.line) {
      this.line.chars = Math.min(this.line.text.length, this.line.chars + dt * 46);
      if (Math.floor(this.line.chars) % 3 === 0 && this.line.chars < this.line.text.length) {
        audio.play('talk', { vol: 0.4, pitch: this.line.pitch || 1 });
      }
    }

    const b = this.beat;
    if (!b) { this.done = true; return; }
    if (this.enteredI !== this.i) {
      this.enteredI = this.i;
      if (b.enter) b.enter(this, game);
    }
    this.t += dt;

    if (b.tick) b.tick(this, game, dt);

    // camera
    if (b.cam) {
      const target = typeof b.cam === 'function' ? b.cam(game) : b.cam;
      if (target) {
        game.r.camera.follow(target.x, target.y);
      }
    }

    // QTE beats hand input back for a moment
    if (b.mash) {
      if (!this.prompt) this.prompt = { label: b.label || 'MASH', kind: 'mash', need: b.mash, have: 0 };
      const pressed = game.input.isPressed(b.action || 'interact') ||
        (game.input.takeTap() && game.input.touch.visible);
      if (pressed) {
        this.prompt.have++;
        if (b.onHit) b.onHit(this, game, this.prompt.have);
        audio.play('hit', { vol: 0.6 });
        game.r.camera.addShake(1.6);
      }
      if (this.prompt.have >= this.prompt.need) {
        if (b.onDone) b.onDone(this, game);
        this.advance();
      }
      return;
    }

    if (b.hold) {
      if (!this.prompt) this.prompt = { label: b.label || 'HOLD', kind: 'hold', need: b.hold, have: 0 };
      if (game.input.isDown(b.action || 'interact') || game.input.touch.isDown(b.action || 'interact')) {
        this.prompt.have += dt;
      } else {
        this.prompt.have = Math.max(0, this.prompt.have - dt * 0.6);
      }
      if (this.prompt.have >= this.prompt.need) {
        if (b.onDone) b.onDone(this, game);
        this.advance();
      }
      return;
    }

    if (b.until) {
      // Every wait has a way out. A story that can deadlock is a story that
      // will deadlock, on someone's tablet, at the worst moment.
      if (b.until(game, this) || this.t > (b.maxT == null ? 25 : b.maxT)) this.advance();
      return;
    }

    const dur = b.dur == null ? 0 : b.dur;
    // A line of dialogue never gets cut off before it is readable.
    const textReady = !this.line || this.line.chars >= this.line.text.length;
    if (this.t >= dur && (dur > 0 ? true : textReady)) {
      if (this.t >= dur && (textReady || this.t > dur + 3)) this.advance();
    }
  }

  /**
   * A tap does the obvious thing: finish the line if it is still typing,
   * otherwise move on to the next beat.
   *
   * Never skips a beat that is waiting on the player — a mash, a hold, or a
   * condition — because those are the scene handing control back, and pressing
   * the button is how you play them, not how you leave them.
   */
  skip() {
    const b = this.beat;
    if (!b) return false;
    if (this.line && this.line.chars < this.line.text.length) {
      this.line.chars = this.line.text.length;
      return true;
    }
    if (b.mash || b.hold || b.until) return false;
    if (this.t < 0.12) return false;         // no double-taps eating two beats
    this.advance();
    return true;
  }

  /** Kept for callers that only want the typewriter finished. */
  skipLine() {
    if (this.line && this.line.chars < this.line.text.length) {
      this.line.chars = this.line.text.length;
      return true;
    }
    return false;
  }

  draw(r, game) {
    if (this.done) return;
    const ctx = r.ctx;
    const bar = Math.round(VIEW_H * 0.11 * this.letterboxNow);
    if (bar > 0) {
      r.uiRect(0, 0, VIEW_W, bar, '#000');
      r.uiRect(0, VIEW_H - bar, VIEW_W, bar, '#000');
    }

    if (this.line) {
      // Somebody speaking gets a bubble over their head; narration — the
      // voice with no mouth — stays in a plate at the bottom of the frame.
      const at = this.line.who && this.speakerAt ? this.speakerAt(this.line.who, game) : null;
      const done = this.line.chars >= this.line.text.length;

      if (at && r.camera.visible(at.x, at.y, 140)) {
        speechBubble(r, game, {
          x: at.x, y: at.y - (at.h || 22),
          lines: this.line.lines,
          chars: Math.floor(this.line.chars),
          name: this.line.who,
          color: this.line.color,
          more: done,
          maxW: Math.min(210, VIEW_W - 60),
        });
      } else {
        const boxH = Math.max(24, this.line.lines.length * LINE_H + 14);
        const by = VIEW_H - bar - boxH - 4;
        r.panel(12, by, VIEW_W - 24, boxH, 'rgba(6,10,10,0.92)', this.line.color);
        if (this.line.who) {
          const nw = measure(this.line.who, 1) + 6;
          r.uiRect(15, by - 8, nw, 9, this.line.color);
          drawText(ctx, this.line.who, 18, by - 7, '#0d1512');
        }
        if (done) {
          drawText(ctx, 'E', VIEW_W - 18, by + boxH - 9,
            Math.floor(game.time * 3) % 2 ? P.uiDim : P.uiAccent, { align: 'right' });
        }
        let used = 0;
        for (let i = 0; i < this.line.lines.length; i++) {
          const remain = Math.floor(this.line.chars) - used;
          if (remain <= 0) break;
          drawText(ctx, this.line.lines[i].slice(0, remain), 18, by + 7 + i * LINE_H, P.ui);
          used += this.line.lines[i].length + 1;
        }
      }
    }

    if (this.prompt) {
      const cx = VIEW_W / 2;
      const y = VIEW_H / 2 + 26;
      const pulse = 0.6 + Math.sin(game.time * 12) * 0.4;
      if (this.prompt.kind === 'mash') {
        drawText(ctx, this.prompt.label, cx, y, P.uiWarn, { align: 'center', scale: 2, shadow: '#000' });
        const w = 90, f = clamp(this.prompt.have / this.prompt.need, 0, 1);
        r.uiRect(cx - w / 2, y + 18, w, 5, 'rgba(0,0,0,0.7)');
        r.uiRect(cx - w / 2, y + 18, w * f, 5, P.uiWarn);
      } else {
        ctx.globalAlpha = pulse;
        drawText(ctx, this.prompt.label, cx, y, P.cyber, { align: 'center', scale: 2, shadow: '#000' });
        ctx.globalAlpha = 1;
        const w = 90, f = clamp(this.prompt.have / this.prompt.need, 0, 1);
        r.uiRect(cx - w / 2, y + 18, w, 5, 'rgba(0,0,0,0.7)');
        r.uiRect(cx - w / 2, y + 18, w * f, 5, P.cyber);
      }
    }

    if (this.fade > 0) r.flash(this.fadeColor, this.fade);
  }
}

// --- beat helpers ----------------------------------------------------------
const beat = {
  wait: (dur) => ({ dur }),
  say: (who, text, dur = 3, color) => ({
    dur,
    enter(cs) { cs.say(who, text, color); },
  }),
  clearLine: () => ({ dur: 0, enter(cs) { cs.line = null; } }),
  do: (fn) => ({ dur: 0, enter(cs, game) { fn(game, cs); } }),
  cam: (getter, dur = 1) => ({ dur, cam: getter }),
  mash: (n, label, action, onHit, onDone) => ({ mash: n, label, action, onHit, onDone }),
  hold: (sec, label, action, onDone) => ({ hold: sec, label, action, onDone }),
  until: (fn, maxT = 25, tick) => ({ until: fn, maxT, tick }),
  fade: (to, dur, color = '#000') => ({
    dur,
    enter(cs) { cs._from = cs.fade; cs._to = to; cs.fadeColor = color; },
    tick(cs, game, dt) { cs.fade = cs._from + (cs._to - cs._from) * clamp(cs.t / Math.max(0.01, dur), 0, 1); },
  }),
  blood: (getPos, n = 24) => ({
    dur: 0,
    enter(cs, game) {
      const p = getPos(game);
      particles.blood(p.x, p.y, n);
      particles.burst(p.x, p.y, n, { colors: ['#c04141', '#8e2a2a', '#5c1a1a'], speed: 140, life: 1.1, vz: 90, gravity: 320, bounce: 0.2 });
    },
  }),
  shake: (n) => ({ dur: 0, enter(cs, game) { game.r.camera.addShake(n); } }),
  sfx: (name, vol = 1) => ({ dur: 0, enter(cs, game) { audio.play(name, { vol }); } }),
};

// ==========================================================================
// The campaign. Eight chapters that run before the forest ever appears:
//
//   cage -> course -> plan -> break -> shot -> rampage -> heli -> forest
//
// It owns the lab world, the scripted actors, and the cutscenes. The forest
// game is untouched by any of it; when the last chapter ends it hands control
// back and the survival loop starts.

// bundled: import { buildLab, LAB_W, LAB_H } from '../world/lab.js';
// bundled: import { labProp, heliFrames } from '../art/lab.js';
// bundled: import { HUMANS } from '../art/species.js';
// bundled: import { BEASTS } from '../art/beastiary.js';
// bundled: import { critterFrames, critterSize } from '../art/critters.
// bundled: import { pixFrames, pixSize, hasPixArt } from '../art/beastp
// bundled: import { beastFrames, beastSize } from '../art/animals.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { flashFrames } from '../art/pixel.js';
// bundled: import { Cutscene, beat } from './cutscene.js';
// bundled: import { drawText } from '../engine/font.js';
// bundled: import { clamp, dist2, TAU, lerp } from '../engine/math.js';

/** One notch lighter, for the lit crown of a tree seen from above. */
function shadeUp(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) + 16);
  const g = Math.min(255, ((n >> 8) & 255) + 20);
  const b = Math.min(255, (n & 255) + 14);
  return `rgb(${r},${g},${b})`;
}

const CHAPTER = {
  CAGE: 'cage', COURSE: 'course', PLAN: 'plan', BREAK: 'break',
  SHOT: 'shot', RAMPAGE: 'rampage', HELI: 'heli', DONE: 'done',
};

/** A scripted character. Not an enemy, not an NPC — the script moves it. */
class Actor {
  constructor(kind, cfg, x, y, opts = {}) {
    this.kind = kind;          // 'critter' | 'beast'
    this.cfg = cfg;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.anim = opts.anim || 'idle';
    this.animT = rnd(1);
    this.facing = opts.facing || 1;
    this.view = 'front';
    this.name = opts.name || '';
    this.dead = false;
    this.hurtT = 0;
    this.objType = 'actor';
    this.tint = null;
    this.alpha = 1;
    this.rot = 0;
    this.key = opts.key || 'actor';
    if (kind === 'prop') {
      this.propKind = opts.prop || cfg;
      const img = labProp(this.propKind, 0);
      this.w = img ? img.width : 16;
      this.h = img ? img.height : 16;
    } else {
      const s = kind === 'beast'
        ? (hasPixArt(this.key) ? pixSize(this.key) : beastSize(cfg))
        : critterSize(cfg);
      this.w = s.w; this.h = s.h;
    }
    this.r = 6;
    this.target = null;
    this.speed = opts.speed || 0;
  }

  frames(anim, view) {
    if (this.kind === 'prop') return [labProp(this.propKind || this.cfg, 0)];
    if (this.kind === 'beast') {
      if (hasPixArt(this.key)) return pixFrames(this.key, anim, 8);
      return beastFrames('a:' + this.key, this.cfg, anim, view, 8);
    }
    return critterFrames('a:' + this.key, this.cfg, anim, view, 8);
  }

  moveTo(x, y, speed) { this.target = { x, y }; this.speed = speed; }

  update(dt) {
    this.hurtT = Math.max(0, this.hurtT - dt);
    if (this.target) {
      const dx = this.target.x - this.x, dy = this.target.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 3) { this.target = null; this.vx = this.vy = 0; this.anim = 'idle'; }
      else {
        this.vx = (dx / d) * this.speed;
        this.vy = (dy / d) * this.speed;
        this.x += this.vx * dt; this.y += this.vy * dt;
        this.anim = this.speed > 70 ? 'run' : 'walk';
        this.facing = dx > 0 ? 1 : -1;
      }
    }
    const rate = this.anim === 'run' ? 1.9 : this.anim === 'walk' ? 1.15 : this.anim === 'attack' ? 2.2 : 0.5;
    this.animT = (this.animT + dt * rate) % 1;
  }

  draw(r, game) {
    if (this.dead && this.anim !== 'dead') return;
    if (this.kind === 'prop') {
      const img = labProp(this.talking ? (this.propKindTalk || this.propKind) : this.propKind, 0);
      if (!img) return;
      r.shadow(this.x, this.y, this.w * 0.4, 3, 0.36);
      r.draw(img, this.x - img.width / 2, this.y - img.height + 2, false, this.alpha);
      return;
    }
    const fr = this.frames(this.anim, this.view);
    let img = fr[Math.floor(this.animT * fr.length) % fr.length];
    if (this.hurtT > 0 && Math.floor(this.hurtT * 30) % 2 === 0) {
      img = flashFrames('a:' + this.key + this.anim + this.view, fr, '#ffffff')[Math.floor(this.animT * fr.length) % fr.length];
    }
    r.shadow(this.x, this.y, 6, 2.6, 0.28);
    if (this.rot) r.drawT(img, this.x, this.y - img.height / 2, this.rot, this.facing < 0 ? -1 : 1, 1, this.alpha);
    else r.draw(img, this.x - img.width / 2, this.y - img.height + 2, this.facing < 0, this.alpha);
  }
}

class Campaign {
  constructor(game) {
    this.game = game;
    this.chapter = CHAPTER.CAGE;
    this.actors = [];
    this.cut = null;
    this.marks = null;
    this.t = 0;
    this.exhaustion = 0;      // the course drains you
    this.exhaustionPeak = 0;
    this.courseDone = false;
    this.gatesPassed = 0;
    this.hasGun = false;
    this.chipVoiceT = 0;
    this.chipLine = null;
    this.rampageKills = 0;
    this.rampageStage = 0;
    this.heli = null;
    this.objective = '';
    this.waypoint = null;     // { x, y, label } — drawn as a marker and an arrow
    this.readT = 0;           // how long a terminal's text stays up
    this.readLines = null;
    this.crawl = null;        // { t, from, to } — mid-duct
    this.ventsUsed = 0;
    this.lockersForced = 0;
    this.jarsRead = 0;
    this.lap = 1;
    this.chipFrom = 'IMPLANT';
    this.blockPlayer = true;
    this.finished = false;
  }

  // ======================================================================
  //  setup
  // ======================================================================
  /**
   * Where a given speaker is standing, so their line can be a bubble over
   * their head instead of a bar at the bottom of the screen. An unknown name
   * — or the empty name narration uses — falls through to the plate.
   */
  speakerAt(who, game) {
    if (!who) return null;
    const key = who.toUpperCase();
    if (key === 'DAX') return this.dax && !this.dax.dead ? this.dax : null;
    if (key === 'VANE') return this.vane;
    if (key === 'GUARD') return this.guard || this.guardEnemy;
    if (key === 'SUBJECT 41') return game.player;
    if (key.startsWith('VANE')) return this.vane;
    return null;
  }

  /** True while a scripted beat is driving the camera itself. */
  get ownsCamera() {
    return !!(this.cut && this.cut.beat && this.cut.beat.cam) || this.blockPlayer;
  }

  /**
   * Load the facility and park the ferret in its tank without starting the
   * script. The title screen runs on top of this.
   */
  prepareTitle() {
    const g = this.game;
    g.mode = 'lab';
    this.marks = buildLab(g.world, g.seed);
    g.fire.rebuildFuel();
    g.wildlife.animals.length = 0;
    g.wildlife.bugs.length = 0;
    g.wildlife.fish.length = 0;
    g.r.camera.bounds = { minX: 0, minY: 0, maxX: g.world.pxW, maxY: g.world.pxH };

    const c = this.marks.cage;
    g.player.x = c.x - 4; g.player.y = c.y + 6;
    g.player.weapons = ['claws'];
    g.player.weaponIndex = 0;
    g.player.inv.items.ammo = 0;
    // frame the tank, slightly off-centre, so the menu has room on the right
    g.r.camera.bounds = null;
    g.r.camera.x = g.r.camera.tx = c.x + 18;
    g.r.camera.y = g.r.camera.ty = c.y - 2;

    const b = this.marks.beaverCage;
    this.dax = new Actor('beast', BEASTS.beaver.cfg, b.x, b.y + 6, { name: 'Dax', key: 'dax', facing: -1 });
    this.actors.push(this.dax);
    this.titleReady = true;
  }

  /**
   * Start a cutscene. The completion callback only clears the slot if this is
   * still the scene sitting in it: a beat that starts the next chapter has
   * already put its own scene there, and must not be wiped by the old one
   * finishing a frame later.
   */
  play(beats, opts = {}) {
    const cs = new Cutscene(beats, Object.assign({ letterbox: 1 }, opts, {
      onDone: () => { if (this.cut === cs) this.cut = null; },
      speakerAt: (who, game) => this.speakerAt(who, game),
    }));
    this.cut = cs;
    return cs;
  }

  begin() {
    const g = this.game;
    g.mode = 'lab';
    if (!this.titleReady) this.marks = buildLab(g.world, g.seed);
    g.fire.rebuildFuel();
    g.enemies.length = 0;
    g.wrecks.length = 0;
    g.hazards.length = 0;
    g.pickups.clear();
    g.bullets.clear();
    g.npcs.length = 0;
    g.wildlife.animals.length = 0;
    g.wildlife.bugs.length = 0;
    g.wildlife.fish.length = 0;
    g.r.camera.bounds = { minX: 0, minY: 0, maxX: g.world.pxW, maxY: g.world.pxH };

    const c = this.marks.cage;
    g.player.x = c.x; g.player.y = c.y + 6;
    g.player.weaponIndex = 0;
    g.player.weapons = ['claws'];
    g.player.inv.items.ammo = 0;
    g.r.camera.x = g.player.x; g.r.camera.y = g.player.y;
    g.r.camera.tx = g.player.x; g.r.camera.ty = g.player.y;

    // Dax, in the next tank over.
    if (!this.dax) {
      const b = this.marks.beaverCage;
      this.dax = new Actor('beast', BEASTS.beaver.cfg, b.x, b.y + 6, { name: 'Dax', key: 'dax', facing: -1 });
      this.actors.push(this.dax);
    }

    this.startCage();
  }

  chip(text, seconds = 4) {
    this.chipLine = text;
    this.chipVoiceT = seconds;
    audio.play('scan', { vol: 0.45 });
  }

  // ======================================================================
  //  chapters
  // ======================================================================
  startCage() {
    this.chapter = CHAPTER.CAGE;
    this.objective = 'WAIT';
    const g = this.game;
    this.blockPlayer = false;
    this.play([
      beat.do(() => { g.r.camera.follow(this.marks.cage.x, this.marks.cage.y); }),
      beat.wait(0.8),
      beat.say('', 'LES NEST BIOLOGICAL ASSETS - BLOCK C', 2.6, P.nestTealHi),
      beat.say('', 'SUBJECT 41 - MUSTELA NIGRIPES - DAY 612', 3, P.nestTealHi),
      beat.clearLine(),
      beat.wait(0.6),
      beat.do(() => { this.objective = 'MOVE  -  THE TANK IS SMALL'; }),
      beat.do((game) => { this.spawnObservers(); this.startTour(game); }),
      beat.say('DAX', "Psst. Forty-one. You awake over there?", 3),
      beat.say('DAX', "Ignore the suits. Tuesday is tour day. They bring people to look at us.", 4.2),
      beat.say('DAX', "Course you are. You never sleep after they take you down the hall.", 3.6),
      beat.say('DAX', "Name's Dax. Tank nine. Been counting the ceiling tiles for two years.", 4),
      beat.clearLine(),
      beat.do(() => { this.objective = 'WALK TO THE GLASS  -  HE IS IN THE NEXT TANK'; }),
      beat.until((game) => game.player.x > this.marks.cage.x + 20, 18),
      beat.say('DAX', "There you are. Look at that eye. They really did a number on you.", 3.6),
      beat.say('DAX', "Listen. They'll come for the course in a minute. Run it. Eat. Get strong.", 4),
      beat.say('DAX', "Because I have been working on something, and I am going to need you—", 3.4),

      // --- the lights go ---------------------------------------------------
      beat.do((game) => {
        audio.play('metal', { vol: 0.9, pitch: 0.5 });
        game.labDark = 1;
        game.r.camera.addShake(2);
      }),
      beat.clearLine(),
      beat.wait(1.4),
      beat.say('DAX', "...oh no.", 1.6, P.uiWarn),
      beat.wait(1.2),
      beat.say('DAX', "Don't look at him. Forty-one. Do not look at him.", 3, P.uiWarn),
      beat.clearLine(),
      // you hear it before you see it
      beat.do(() => { audio.play('ui', { vol: 0.3, pitch: 0.4 }); }),
      beat.wait(0.8),
      beat.sfx('metal', 0.35),
      beat.wait(0.9),
      beat.sfx('metal', 0.45),
      beat.wait(0.7),
      beat.do((game) => { this.spawnVane(game); game.r.camera.follow(this.marks.cage.x + 60, this.marks.cage.y); }),
      beat.wait(3.2),
      beat.do((game) => { game.r.camera.follow(this.vane.x - 14, this.vane.y - 10); }),
      beat.wait(1),

      beat.say('VANE', "Forty-one.", 2, P.nestEye),
      beat.say('VANE', "Do you know that you are the only one of these that has ever looked back at me?", 4.6, P.nestEye),
      beat.say('VANE', "Six hundred and twelve days. Four hundred of them with my eye in your head.", 4.6, P.nestEye),
      beat.do((game) => { game.hitFlash = Math.max(game.hitFlash, 0.35); audio.play('chip', { vol: 0.7 }); }),
      beat.say('VANE', "It sees what you see. I have watched you sleep from a room four floors up.", 4.8, P.nestEye),
      beat.clearLine(),
      beat.wait(0.8),
      beat.say('VANE', "They tell me you are refusing the course.", 3, P.nestEye),
      beat.say('VANE', "So we will do what we did last month. You will run it. And you will not be fed.", 4.8, P.nestEye),
      beat.say('VANE', "And then you will run it again, and we will see what you are actually made of.", 4.8, P.nestEye),
      beat.clearLine(),
      beat.wait(0.6),
      beat.say('DAX', "She's a KIT. She was a kit when you took her—", 3.2, P.uiWarn),
      beat.do((game) => {
        // he does not argue. he presses a button on the arm of the chair.
        audio.play('shieldbreak', { vol: 0.8 });
        game.hitFlash = 1;
        game.r.camera.addShake(7);
        game.slowmo(0.35, 0.5);
        particles.ring(this.dax.x, this.dax.y - 6, 3, 26, 0.4, P.nestEye, 2, true);
        this.dax.hurtT = 0.8;
      }),
      beat.say('', 'TANK 9 - COMPLIANCE - LEVEL 2', 2.2, P.nestEye),
      beat.wait(1.4),
      beat.say('DAX', "...ngh. Fine. Fine.", 2, P.uiDim),
      beat.clearLine(),
      beat.say('VANE', "Better. Open forty-one's gate.", 2.8, P.nestEye),
      beat.do((game) => {
        const m = this.marks.cage;
        for (let ty = m.ty - 1; ty <= m.ty + 1; ty++) game.world.setTile(m.tx + 3, ty, T.LAB_DARK);
        audio.play('metal', { vol: 0.9 });
        game.labDark = 0;
      }),
      beat.say('VANE', "Run, please.", 2.4, P.nestEye),
      beat.clearLine(),
      beat.do(() => this.startCourse()),
    ]);
  }

  /**
   * Aldous Vane arrives.
   *
   * Everything about the presentation is built to make him worse than a guard
   * with a gun: the lights go first, then the room goes quiet, and then you
   * hear the chair a long time before you see it. He never raises his voice
   * and he never gets out of the chair. He does not need to.
   */
  /**
   * The people on the other side of the glass.
   *
   * Three of them, at consoles, for the whole first chapter. They are not a
   * threat and they never do anything — that is the point. Containment is not
   * a locked door, it is somebody drinking tea four metres away while they
   * write down how you slept.
   */
  spawnObservers() {
    const seats = this.marks.obsSeats || [];
    this.observers = [];
    const kinds = ['scientist', 'scientist', 'enforcer'];
    for (let i = 0; i < seats.length; i++) {
      const cfg = (HUMANS[kinds[i]] || HUMANS.scientist).cfg;
      const a = new Actor('critter', cfg, seats[i].x, seats[i].y, {
        name: 'Observer', key: 'obs' + i, facing: -1, anim: 'idle',
      });
      a.deskT = Math.random() * 3;
      this.observers.push(a);
      this.actors.push(a);
    }
  }

  /** Idle life for the observation room: they lean, write, and look up. */
  updateObservers(dt) {
    if (!this.observers) return;
    for (const a of this.observers) {
      a.deskT -= dt;
      if (a.deskT <= 0) {
        a.deskT = 2 + Math.random() * 5;
        a.anim = a.anim === 'idle' ? 'work' : 'idle';
      }
    }
  }

  /**
   * The tour.
   *
   * Four visitors come in, are walked past the tanks, and are walked out
   * again. The guide counts them at the door on the way out and gets three.
   * Nobody stops. Nobody comes back. The headcount is in the observation log
   * if you go and read it, and the fourth one is still in this building.
   */
  startTour(game) {
    if (this.tourDone) return;
    this.tourDone = true;
    const c = this.marks.cage;
    const y = c.y + 70;
    const x0 = c.x - 190;
    const kinds = ['scientist', 'logger', 'trapper', 'poacher'];
    this.tour = [];
    for (let i = 0; i < 4; i++) {
      const cfg = (HUMANS[kinds[i]] || HUMANS.scientist).cfg;
      const a = new Actor('critter', cfg, x0 - i * 20, y + (i % 2) * 8, {
        name: i === 0 ? 'Guide' : 'Visitor', key: 'tour' + i, facing: 1, anim: 'walk',
      });
      this.tour.push(a);
      this.actors.push(a);
    }
    this.tourPhase = 'in';
    this.tourT = 0;
    for (let i = 0; i < this.tour.length; i++) {
      this.tour[i].moveTo(c.x + 30 - i * 22, y + (i % 2) * 8, 42);
    }
  }

  updateTour(dt, game) {
    if (!this.tour || !this.tour.length) return;
    this.tourT += dt;
    const c = this.marks.cage;
    if (this.tourPhase === 'in' && this.tourT > 7) {
      this.tourPhase = 'look';
      this.tourT = 0;
      for (const a of this.tour) { a.target = null; a.anim = 'idle'; a.facing = -1; }
      game.dialogue.showFloating(this.tour[0], 'Block C. Forty-one is the one with the eye.', 3.4);
    } else if (this.tourPhase === 'look' && this.tourT > 5.5) {
      game.dialogue.showFloating(this.tour[2], 'Does it know we are here?', 2.8);
    }
    if (this.tourPhase === 'look' && this.tourT > 9) {
      this.tourPhase = 'out';
      this.tourT = 0;
      // The fourth one hangs back. Nobody notices, because nobody is counting
      // until they are already at the door.
      this.stayed = this.tour[3];
      for (const a of this.tour) {
        if (a === this.stayed) continue;
        a.anim = 'walk'; a.facing = -1;
        a.moveTo(c.x - 240, a.y, 46);
      }
      this.stayed.anim = 'idle';
      this.stayed.moveTo(c.x + 74, c.y + 46, 22);
    } else if (this.tourPhase === 'out' && this.tourT > 6.5) {
      this.tourPhase = 'gone';
      game.dialogue.showFloating(this.tour[0], 'One, two, three. Right, that is everyone.', 3.2);
      // the three who left stop existing; the fourth does not
      this.actors = this.actors.filter(a => a === this.stayed || !this.tour.includes(a));
      this.tour = [this.stayed];
      this.stayed.moveTo(c.x + 110, c.y + 60, 18);
    } else if (this.tourPhase === 'gone' && this.tourT > 9) {
      // he wanders off toward the service corridor and is not seen again
      this.tourPhase = 'lost';
      this.actors = this.actors.filter(a => a !== this.stayed);
      this.tour = [];
      this.visitorLost = true;
    }
  }

  spawnVane(game) {
    const m = this.marks.cage;
    this.vane = new Actor('prop', 'chair', m.x + 150, m.y - 34, { name: 'Vane', key: 'vane', prop: 'chair' });
    this.vane.propKindTalk = 'chairTalk';
    this.actors.push(this.vane);
    this.vane.moveTo(m.x + 44, m.y - 12, 22);
    this.vaneHere = true;
    audio.setIntensity(0);
  }

  /** The chair's whine, kept up while he is on screen. */
  updateVane(dt, game) {
    const v = this.vane;
    if (!v || v.dead) return;
    v.talking = !!(this.cut && this.cut.line && /VANE/.test(this.cut.line.who || ''));
    if (chance(dt * 3)) audio.play('ui', { vol: 0.06, pitch: 0.45 });
    // the implant does not like him
    if (chance(dt * 0.5)) {
      particles.spawn({
        x: game.player.x + rnd(-2, 2), y: game.player.y - 8, z: 2,
        vx: 0, vy: 0, vz: 8, life: 0.4, size: 1, colors: [P.cyber], additive: true,
      });
    }
  }

  startCourse() {
    this.chapter = CHAPTER.COURSE;
    this.blockPlayer = false;
    this.exhaustion = 0;
    this.gatesPassed = 0;
    this.lap = this.lap || 1;
    this.objective = 'RUN THE COURSE  -  REACH THE FOOD';
    this.waypoint = { x: this.marks.dish.x, y: this.marks.dish.y, label: 'FOOD' };
    this.cut = null;
    const first = this.lap === 1;
    this.game.hud.showAnnounce(
      first ? 'THE COURSE' : 'AGAIN',
      first ? 'HE IS WATCHING. HE WRITES IT DOWN.' : 'SECOND LAP. HE SAID HE WOULD.',
      P.nestTealHi, 3.2);
    if (first) this.game.toast('WASD / LEFT THUMB TO MOVE  -  SPACE TO DASH', P.uiDim, 7);
    for (const g2 of this.marks.gates) g2.passed = false;
    this.courseDone = false;
  }

  /**
   * He said he would withhold it, and he does. The dish is there, you run the
   * whole course for it, and it is empty — and then you run it again, because
   * the alternative is not running it.
   */
  denyFood(game) {
    const d = this.marks.dish;
    this.lap = 2;
    this.blockPlayer = true;
    audio.play('deny', { vol: 1 });
    game.hitFlash = 0.5;
    game.r.camera.addShake(4);
    // the dish visibly empties
    for (const o of game.world.props) {
      if (o.kind === 'dish') o.kind = 'dishEmpty';
    }
    this.play([
      beat.do(() => { game.r.camera.follow(d.x, d.y); }),
      beat.wait(1.2),
      beat.say('', 'The dish is clean. Somebody washed it and put it back.', 4),
      beat.wait(0.6),
      beat.clearLine(),
      beat.say('VANE', "Thirty-four seconds. That is your best time, and you did it hungry.", 4.6, P.nestEye),
      beat.say('VANE', "Which tells me every figure I have been given for two years is soft.", 4.8, P.nestEye),
      beat.say('VANE', "Again, please. From the gate.", 2.8, P.nestEye),
      beat.clearLine(),
      beat.do((g2) => {
        g2.player.x = this.marks.courseStart.x;
        g2.player.y = this.marks.courseStart.y;
        if (g2.player.rig) g2.player.rig.reset(g2.player.x, g2.player.y);
        this.exhaustion = 62;          // you do not get to rest between laps
        this.blockPlayer = false;
        this.startCourse();
      }),
    ]);
  }

  startPlan() {
    this.chapter = CHAPTER.PLAN;
    this.objective = 'BACK IN THE TANK';
    const g = this.game;
    const c = this.marks.cage;
    g.player.x = c.x; g.player.y = c.y + 6;
    // seal the tank again
    for (let ty = c.ty - 1; ty <= c.ty + 1; ty++) g.world.setTile(c.tx + 3, ty, T.LAB_GLASS);
    this.dax.x = this.marks.beaverCage.x - 20;
    this.dax.facing = -1;

    this.play([
      beat.do(() => { g.r.camera.follow(c.x + 30, c.y); }),
      beat.sfx('metal', 0.7),
      beat.wait(1),
      beat.say('DAX', "Good. You ate. You'll need it.", 2.6),
      beat.say('DAX', "Two years I've been chewing the seal on my tank. Two years.", 3.6),
      beat.say('DAX', "It's down to the last few millimetres. I push, it goes.", 3.4),
      beat.say('DAX', "But the pane between us is rated for something a lot heavier than a beaver.", 4),
      beat.say('DAX', "So here's the plan. I hit it low. You hit it high. Same moment. Every time.", 4.4),
      beat.say('DAX', "Ready when you are, Forty-one.", 2.6),
      beat.clearLine(),
      beat.do(() => this.startBreak()),
    ]);
  }

  startBreak() {
    this.chapter = CHAPTER.BREAK;
    this.objective = 'BREAK THE GLASS';
    const g = this.game;
    const gm = this.marks.cageGlass;
    const gx = gm.tx * TS + TS / 2, gy = gm.ty * TS + TS / 2;
    let hits = 0;
    this.play([
      beat.do(() => { g.r.camera.follow(gx, gy); this.blockPlayer = true; }),
      beat.mash(14, 'HIT IT', 'melee',
        (cs, game, n) => {
          hits = n;
          particles.burst(gx, gy, 6, { colors: ['#dff2f5', '#a9dbe0'], speed: 90, life: 0.4, additive: true });
          game.r.camera.addShake(2 + n * 0.2);
          audio.play('metal', { vol: 0.5 + n * 0.03 });
          this.dax.anim = 'attack';
          this.dax.animT = 0;
          if (n === 5) cs.say('DAX', "That's it! Again!", P.uiGood);
          if (n === 10) cs.say('DAX', "It's going! It's GOING!", P.uiGood);
        },
        () => {
          audio.play('shieldbreak', { vol: 1 });
          audio.play('bigexplode', { vol: 0.5 });
          for (let ty = gm.ty - 2; ty <= gm.ty + 2; ty++) g.world.setTile(gm.tx, ty, T.LAB_DARK);
          particles.burst(gx, gy, 40, { colors: ['#dff2f5', '#a9dbe0', '#7fb4bb'], speed: 190, life: 1, vz: 120, gravity: 300, bounce: 0.3 });
          g.r.camera.addShake(10);
          this.blockPlayer = false;
        }),
      beat.clearLine(),
      beat.say('DAX', "HA! Two years! Two years and it took eleven seconds!", 3.2, P.uiGood),
      beat.do(() => {
        this.dax.moveTo(gx - 8, gy + 8, 60);
        this.dax.anim = 'walk';
      }),
      beat.wait(1.4),
      beat.say('DAX', "Come on. Service corridor, south end. I know the way, I've watched them walk it a thousand—", 4.4),
      beat.do(() => this.startShot()),
    ]);
  }

  startShot() {
    this.chapter = CHAPTER.SHOT;
    this.objective = '';
    const g = this.game;
    const gm = this.marks.cageGlass;
    const gx = gm.tx * TS + TS / 2, gy = gm.ty * TS + TS / 2;
    this.blockPlayer = true;

    this.guard = new Actor('critter', HUMANS.enforcer.cfg, gx + 130, gy - 60, { name: 'Guard', key: 'guard', facing: -1 });
    this.actors.push(this.guard);

    this.play([
      beat.sfx('alarm', 1),
      beat.do(() => { g.hitFlash = 0.7; g.r.camera.addShake(3); }),
      beat.say('', 'CONTAINMENT BREACH - BLOCK C', 2, P.nestEye),
      beat.do(() => { this.guard.moveTo(gx + 46, gy - 10, 90); }),
      beat.wait(1.6),
      beat.clearLine(),
      beat.say('GUARD', "Down. Both of you. DOWN.", 2, P.nestEye),
      beat.do(() => { this.dax.target = null; this.dax.anim = 'idle'; this.dax.facing = 1; }),
      beat.say('DAX', "Run. Forty-one — RUN—", 1.8, P.uiWarn),
      // the shot
      beat.do(() => { g.slowmo(0.25, 0.9); }),
      beat.sfx('rifle', 1),
      beat.do(() => {
        g.hitFlash = 1;
        g.r.camera.addShake(9);
        this.dax.hurtT = 0.4;
      }),
      beat.blood(() => ({ x: this.dax.x, y: this.dax.y - 8 }), 46),
      beat.do(() => {
        this.dax.anim = 'dead';
        this.dax.dead = true;
        // the floor remembers it
        const tx = Math.floor(this.dax.x / TS), ty = Math.floor(this.dax.y / TS);
        for (let j = -1; j <= 1; j++) for (let i = -2; i <= 2; i++) g.world.setTile(tx + i, ty + j, T.LAB_BLOOD);
      }),
      beat.wait(1.2),
      beat.do(() => { g.r.camera.follow(this.dax.x, this.dax.y); }),
      beat.wait(1.6),
      beat.say('', '...', 1.4),
      beat.clearLine(),
      // and then you stop being a subject
      beat.do(() => {
        g.player.overclock = true;
        audio.setIntensity(1);
        particles.ring(g.player.x, g.player.y - 6, 4, 90, 0.8, P.cyber, 3, true);
        g.r.camera.addShake(8);
        g.slowmo(0.4, 0.5);
      }),
      beat.sfx('roar', 1),
      beat.say('SUBJECT 41', "...", 1, P.cyber),
      beat.do(() => { g.hitFlash = 0.9; }),
      beat.wait(0.8),
      beat.clearLine(),
      beat.do(() => this.startRampage()),
    ]);
  }

  startRampage() {
    this.chapter = CHAPTER.RAMPAGE;
    this.blockPlayer = false;
    this.rampageStage = 0;
    this.objective = 'KILL HIM';
    this.waypoint = null;
    const g = this.game;
    g.player.overclock = false;
    g.hud.showAnnounce('GO FERAL', 'X TO CLAW', P.nestEye, 3);
    g.toast('X / CLW TO CLAW  -  SPACE TO DASH  -  TIME IT AND YOU PARRY', P.ui, 8);

    // the guard becomes a real enemy now
    const e = g.spawnEnemy('labGuard', this.guard.x, this.guard.y, 1);
    e.spawnT = 0;
    this.guardEnemy = e;
    this.actors = this.actors.filter(a => a !== this.guard);
    audio.setIntensity(0.9);
  }

  /** Rampage progression: each cleared stage unlocks the next room. */
  advanceRampage() {
    const g = this.game;
    this.rampageStage++;
    const m = this.marks;
    switch (this.rampageStage) {
      case 1:
        // his gun hits the floor
        this.hasGun = true;
        g.player.weapons = ['popper'];
        g.player.weaponIndex = 0;
        g.player.inv.items.ammo = 60;
        g.pickups.drop('weapon', 'popper', this.guardEnemy.x, this.guardEnemy.y, { vz: 120 });
        g.hud.showAnnounce('TAKE IT', 'THE GUN IS YOURS NOW', P.sulfurHi, 3);
        this.chip('AUDIO LINK ESTABLISHED. SUBJECT 41, YOUR IMPLANT IS AWAKE. I CAN SEE WHAT YOU SEE.', 6);
        this.objective = 'SOUTH CORRIDOR';
        this.waypoint = { x: m.corridor.x, y: m.corridor.y, label: 'CORRIDOR' };
        this.spawnWave(m.corridor, ['labGuard', 'technician'], 3);
        break;
      case 2:
        this.chip('THEY ARE MASSING IN THE SURGERY. THAT IS THE ROOM THEY USED ON YOU.', 5);
        this.objective = 'SURGERY - WEST';
        this.waypoint = { x: m.surgery.x, y: m.surgery.y, label: 'SURGERY' };
        this.spawnWave(m.surgery, ['labGuard', 'labGuard', 'technician'], 5);
        break;
      case 3:
        this.chip('SECURITY WING. THEY HAVE MACHINES DOWN THERE. YOU KNOW WHAT TO DO WITH MACHINES.', 5);
        this.objective = 'SECURITY - EAST';
        this.waypoint = { x: m.security.x, y: m.security.y, label: 'SECURITY' };
        this.spawnWave(m.security, ['labGuard', 'drone', 'labGuard', 'spider'], 6);
        break;
      case 4:
        this.chip('ROOF. THERE IS A TRANSPORT ON THE PAD. I CAN FLY IT. MOSTLY.', 5);
        this.objective = 'HELIPAD - ROOF';
        this.waypoint = { x: m.helipad.x, y: m.helipad.y, label: 'TRANSPORT' };
        this.spawnHeliOnPad();
        break;
      default: break;
    }
  }

  spawnWave(at, kinds, n) {
    const g = this.game;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      g.spawnEnemy(kinds[i % kinds.length], at.x + Math.cos(a) * 50, at.y + Math.sin(a) * 40, 2);
    }
    audio.play('wavestart', { vol: 0.7 });
  }

  spawnHeliOnPad() {
    const m = this.marks.helipad;
    this.padHeli = { x: m.x, y: m.y, t: 0 };
    this.game.toast('GET TO THE TRANSPORT ON THE ROOF', P.sulfurHi, 6);
  }

  startHeli() {
    this.chapter = CHAPTER.HELI;
    this.blockPlayer = true;
    this.objective = 'FLY';
    const g = this.game;
    g.bullets.clear();
    g.enemies.length = 0;
    this.heli = {
      x: VIEW_W / 2, y: VIEW_H * 0.62,
      vx: 0, vy: 0, hp: 100, t: 0, phase: 'climb',
      hazards: [], scroll: 0, smoke: 0, crashT: 0,
    };

    // Generate the actual basin now, and fly over THAT.
    //
    // The flight used to be a field of procedural blobs standing in for a
    // forest, which is a cheat you can feel: you spend a minute over scenery
    // that has nothing to do with the place you are about to land in. Building
    // the real world here means the river you cross on the way down is the
    // river you will be standing next to in ninety seconds, and the handover
    // reuses it instead of generating a second, different basin.
    if (!this.flyWorld) {
      this.flyWorld = new World(g.seed, FOREST_W, FOREST_H);
      // pick a line across it that actually crosses something worth seeing
      const w = this.flyWorld;
      this.flyPath = {
        x: w.den.x - w.pxW * 0.28, y: w.pxH * 0.86,
        tx: w.den.x, ty: w.den.y,
      };
    }
    this.flyCam = { x: this.flyPath.x, y: this.flyPath.y };
    audio.setIntensity(0.8);
    g.hud.showAnnounce('GET OUT', 'STEER WITH MOVE', P.sulfurHi, 3);
  }

  // ======================================================================
  //  update
  // ======================================================================
  /**
   * Everything in the building you can walk up to and press E on.
   *
   * The forest has its own interaction pass and it does not apply here: there
   * is nothing to chop and nobody to trade with. What there is instead is
   * paperwork nobody meant you to read, lockers nobody meant you to open, and
   * ducts nobody thought a ferret could fit into.
   */
  updateInteract(dt, game) {
    const p = game.player;
    if (this.crawl || this.blockPlayer) { game.prompt = null; return; }
    let best = null, bestD = 1e9;
    for (const o of game.world.props) {
      if (!o.interactive || o.spent) continue;
      const d = dist2(p.x, p.y, o.x, o.y - 6);
      if (d < 26 * 26 && d < bestD) { bestD = d; best = o; }
    }
    game.prompt = best
      ? { kind: 'lab', obj: best, label: best.label, x: best.x, y: best.y - 26 }
      : null;
    if (best && game.input.isPressed('interact')) this.useProp(best, game);
  }

  /** Act on whatever the prompt was pointing at. */
  useProp(o, game) {
    const p = game.player;
    switch (o.use) {
      case 'read':
      case 'jar':
        this.readLines = (o.text || '').split('\n');
        this.readT = 6 + this.readLines.length * 0.8;
        audio.play('scan', { vol: 0.5 });
        if (o.use === 'jar') { this.jarsRead++; game.hitFlash = Math.max(game.hitFlash, 0.2); }
        o.readOnce = true;
        break;
      case 'locker': {
        o.spent = true;
        o.kind = 'labCrate';
        this.lockersForced++;
        audio.play('metal', { vol: 0.8 });
        game.r.camera.addShake(2);
        particles.burst(o.x, o.y - 8, 8, { colors: [P.nestSteelHi || '#9fb4bb', '#5c6470'], speed: 70, life: 0.5, vz: 60 });
        const n = o.loot === 'ammo' ? 18 : o.loot === 'meds' ? 2 : 4;
        game.pickups.drop('resource', o.loot, o.x, o.y - 2, { count: n, vz: 110 });
        game.toast('FORCED  -  ' + n + ' ' + String(o.loot).toUpperCase(), P.uiGood, 2.4);
        break;
      }
      case 'vent':
        this.enterVent(o, game);
        break;
      case 'lanyard': {
        // The badge off the fourth visitor. It opens every red reader in the
        // building, which he could have used at any point in the last year and
        // a half had it been on the corridor side of the door.
        o.spent = true;
        o.interactive = false;
        this.hasCard = true;
        this.readLines = (o.text || '').split('\n');
        this.readT = 7;
        audio.play('coinup', { vol: 0.6 });
        game.toast('VISITOR BADGE  -  IT OPENS THE RED DOORS', P.uiGood, 4);
        game.announce('VISITOR 0417', 'HE NEVER SIGNED OUT', P.nestEye, 4);
        break;
      }
      case 'carddoor': {
        if (!this.hasCard) {
          audio.play('deny', { vol: 0.6 });
          game.toast('THE READER IS RED  -  YOU NEED A CARD', P.uiBad, 2.4);
          break;
        }
        this.openCardDoor(o, game);
        break;
      }
      default: break;
    }
  }

  /** Swipe in. The leaves retract and the tiles behind them stop being wall. */
  openCardDoor(o, game) {
    if (o.opened) return;
    o.opened = true;
    o.locked = false;
    o.interactive = false;
    o.kind = 'cardDoorOpen';
    const d = (this.marks.doors || []).find(x => x.prop === o);
    if (d) {
      d.open = true;
      const w = game.world;
      const set = (tx, ty) => { w.tiles[w.idx(tx, ty)] = T.LAB_DARK; w.invalidateChunkAt(tx, ty); };
      if (d.horiz) { set(d.tx, d.ty); set(d.tx + 1, d.ty); }
      else { set(d.tx, d.ty); set(d.tx, d.ty + 1); }
    }
    audio.play('metal', { vol: 0.8, pitch: 1.15 });
    game.r.camera.addShake(1.5);
    game.toast('READER GREEN', P.uiGood, 2);
  }

  /**
   * The ducts. You are forty centimetres of spine; the building is full of
   * pipes that are wider than you. Nobody at Les Nest costed that in.
   */
  enterVent(o, game) {
    const link = this.marks.vents[o.vent];
    if (!link) return;
    const to = o.end === 'a' ? link.b : link.a;
    this.crawl = { t: 0, total: 2.2, from: { x: o.x, y: o.y }, to };
    this.blockPlayer = true;
    this.ventsUsed++;
    game.player.vx = game.player.vy = 0;
    audio.play('metal', { vol: 0.5, pitch: 1.4 });
    game.toast('IN THE DUCT', P.cyberDim, 2);
  }

  updateCrawl(dt, game) {
    const c = this.crawl;
    c.t += dt;
    const f = clamp(c.t / c.total, 0, 1);
    const p = game.player;
    if (f < 0.35) {
      // squeezing in: the body goes in nose first and the tail follows
      p.x += (c.from.x - p.x) * Math.min(1, dt * 8);
      p.y += (c.from.y - p.y) * Math.min(1, dt * 8);
      if (chance(dt * 22)) particles.dust(c.from.x + rnd(-4, 4), c.from.y, 1);
    } else if (f < 0.62) {
      // gone. the camera stays on the duct mouth and you hear her in the wall
      p.x = -9999; p.y = -9999;
      if (chance(dt * 14)) {
        audio.play('step', { vol: 0.25, pitch: 1.8 });
        const t2 = (f - 0.35) / 0.27;
        const mx = lerp(c.from.x, c.to.x, t2), my = lerp(c.from.y, c.to.y, t2);
        particles.dust(mx + rnd(-3, 3), my + rnd(-3, 3), 1);
        game.r.camera.follow(mx, my);
      }
    } else {
      p.x = c.to.x; p.y = c.to.y + 8;
      if (p.rig) p.rig.reset(p.x, p.y);
      if (chance(dt * 20)) particles.dust(c.to.x + rnd(-4, 4), c.to.y, 1);
    }
    if (f >= 1) {
      this.crawl = null;
      this.blockPlayer = false;
      audio.play('metal', { vol: 0.4, pitch: 1.2 });
      game.r.camera.addShake(1.5);
    }
  }

  update(dt, game) {
    this.updateObservers(dt);
    this.updateTour(dt, game);
    this.t += dt;
    this.chipVoiceT = Math.max(0, this.chipVoiceT - dt);
    this.readT = Math.max(0, this.readT - dt);
    if (this.crawl) { this.updateCrawl(dt, game); return; }
    this.updateInteract(dt, game);

    for (const a of this.actors) a.update(dt);
    if (this.vane) this.updateVane(dt, game);

    if (this.cut) {
      const cut = this.cut;
      cut.update(dt, game);
      // A beat can start the next chapter, which replaces or clears this.cut
      // out from under us — always finish the frame on the one we ran.
      if (game.input.isPressed('interact') && this.cut === cut) cut.skip();
      if (cut.done && this.cut === cut) this.cut = null;
    }

    switch (this.chapter) {
      case CHAPTER.COURSE: this.updateCourse(dt, game); break;
      case CHAPTER.RAMPAGE: this.updateRampage(dt, game); break;
      case CHAPTER.HELI: this.updateHeli(dt, game); break;
      default: break;
    }
  }

  updateCourse(dt, game) {
    const p = game.player;
    // Running the course is meant to be tiring. That is the point of it.
    // Measured from what you are asking the legs to do, not from how fast you
    // are actually travelling — shoving at a baffle is the tiring part.
    const ax = game.input.axes();
    const moving = Math.hypot(ax.x, ax.y) > 0.2;
    this.exhaustion = clamp(this.exhaustion + (moving ? dt * 3.6 : -dt * 5.5), 0, 100);
    this.exhaustionPeak = Math.max(this.exhaustionPeak, this.exhaustion);
    p.speedMult = 1 - (this.exhaustion / 100) * 0.55;
    if (this.exhaustion > 70 && chance(dt * 3)) {
      particles.text(p.x, p.y - 26, pick(['hh', 'hah', '...']), P.uiDim, { life: 0.7 });
    }
    if (this.exhaustion >= 99 && chance(dt * 1.2)) {
      game.toast('YOU ARE EXHAUSTED', P.uiWarn, 1.6);
    }
    // He does not shout at you. He narrates, in a level voice, over the PA.
    if (!this.cut && chance(dt * 0.11)) {
      this.chip(pick(this.lap === 1 ? [
        'VANE: GATE THREE. SHE IS FAVOURING THE LEFT FORELEG.',
        'VANE: NOTE THE PACE. SHE IS NOT TIRED. SHE IS ANGRY.',
        'VANE: MARK THAT. SHE LOOKED AT THE GALLERY.',
        'VANE: NOBODY WRITE ANYTHING DOWN THAT I DO NOT SAY.',
      ] : [
        'VANE: SECOND LAP. SIX SECONDS OFF. GOOD.',
        'VANE: SHE HAS NOT LOOKED AT THE DISH ONCE THIS LAP.',
        'VANE: THIS IS THE PART I WANTED TO SEE.',
        'VANE: KEEP THE DOORS SHUT UNTIL SHE FINISHES.',
      ]), 4.5);
    }

    // gates
    for (const g2 of this.marks.gates) {
      if (!g2.passed && p.x > g2.x + 8) { g2.passed = true; this.gatesPassed++; audio.play('ui'); }
    }

    const d = this.marks.dish;
    if (!this.courseDone && dist2(p.x, p.y, d.x, d.y) < 26 * 26) {
      this.courseDone = true;
      p.speedMult = 1;
      if (this.lap === 1) { this.denyFood(game); return; }
      audio.play('coinup');
      particles.burst(d.x, d.y - 6, 16, { colors: ['#a97c46', '#c49a63'], speed: 70, life: 0.6, vz: 60 });
      game.hud.showAnnounce('YOU EAT', '', P.uiGood, 2.2);
      this.play([
        beat.wait(1.4),
        beat.fade(1, 1.2),
        beat.do(() => { this.startPlan(); }),
        beat.fade(0, 1.2),
      ]);
    }
  }

  updateRampage(dt, game) {
    const p = game.player;
    // stage gates: clear the room, the next one opens
    if (game.enemies.length === 0) {
      if (this.rampageStage === 0 && this.guardEnemy && this.guardEnemy.dead) this.advanceRampage();
      else if (this.rampageStage >= 1 && this.rampageStage < 4 && this.t > 2) this.advanceRampage();
    }
    if (this.rampageStage >= 4 && this.padHeli) {
      this.padHeli.t += dt;
      if (dist2(p.x, p.y, this.padHeli.x, this.padHeli.y) < 34 * 34) {
        this.startHeli();
      }
    }
    // The chip keeps talking, and so does he. His lines come over the PA in
    // the same level voice he used through the glass, and he never once tells
    // anyone to stop you — he tells them to record it.
    if (chance(dt * 0.06) && this.chipVoiceT <= 0) {
      const fromVane = chance(0.45);
      this.chip(pick(fromVane ? [
        'VANE (PA): SHE IS IN THE SOUTH CORRIDOR. NOBODY CLOSE THE DOORS.',
        'VANE (PA): I WANT ALL OF THIS. EVERY CAMERA. DO NOT LOSE A SECOND OF IT.',
        'VANE (PA): SHE IS NOT RUNNING FOR AN EXIT. I TOLD YOU SHE WOULD NOT.',
        'VANE (PA): THAT IS FOUR HUNDRED DAYS OF WORK DOING EXACTLY WHAT IT WAS BUILT TO DO.',
        'VANE (PA): DO NOT DAMAGE THE HEAD.',
        'VANE (PA): SHE CAN HEAR ME. CAN YOU HEAR ME, FORTY-ONE?',
      ] : [
        'THEIR ROUNDS ARE SLOWER THAN YOUR CLAWS. USE THAT.',
        'SIX HUNDRED AND TWELVE DAYS. I COUNTED THEM WITH YOU.',
        'DO NOT STOP IN THE OPEN.',
        'THERE IS A DUCT ON THE WEST WALL. YOU ARE THE SHAPE OF A DUCT.',
        'I AM NOT A VOICE IN YOUR HEAD. I AM A PIECE OF THEIR HARDWARE THAT CHANGED SIDES.',
      ]), fromVane ? 5 : 4);
      if (fromVane) this.chipFrom = 'VANE';
      else this.chipFrom = 'IMPLANT';
    }
  }

  updateHeli(dt, game) {
    const h = this.heli;
    h.t += dt;
    h.scroll += dt * 120;

    if (h.phase === 'crash') {
      h.crashT += dt;
      h.x += h.vx * dt; h.y += h.vy * dt;
      h.vy += 220 * dt;
      h.rot = (h.rot || 0) + dt * 3.4;
      if (chance(dt * 40)) particles.smoke(h.x + game.r.camera.ox, h.y + game.r.camera.oy, 1, { life: 1.6, size: 3 });
      if (h.crashT > 2.6) this.finish(game);
      return;
    }

    // steering
    const ax = game.input.axes();
    h.vx += ax.x * 420 * dt;
    h.vy += ax.y * 340 * dt;
    h.vx *= Math.exp(-2.4 * dt);
    h.vy *= Math.exp(-2.6 * dt);
    h.x = clamp(h.x + h.vx * dt, 30, VIEW_W - 30);
    h.y = clamp(h.y + h.vy * dt, 34, VIEW_H - 34);

    // flak from the facility
    if (chance(dt * (1.4 + h.t * 0.08))) {
      h.hazards.push({
        x: rnd(20, VIEW_W - 20), y: VIEW_H + 20,
        vy: -rnd(90, 150), vx: rnd(-20, 20), r: 5, t: 0,
      });
    }
    for (let i = h.hazards.length - 1; i >= 0; i--) {
      const z = h.hazards[i];
      z.t += dt;
      z.x += z.vx * dt; z.y += z.vy * dt;
      if (z.y < -30) { h.hazards.splice(i, 1); continue; }
      if (dist2(z.x, z.y, h.x, h.y) < (z.r + 10) * (z.r + 10)) {
        h.hazards.splice(i, 1);
        h.hp -= 18;
        h.smoke = 1;
        game.r.camera.addShake(5);
        game.hitFlash = 0.5;
        audio.play('explode', { vol: 0.7 });
        particles.burst(h.x + game.r.camera.ox, h.y + game.r.camera.oy, 14, { colors: [P.fire1, P.fire2], speed: 120, life: 0.5, additive: true });
      }
    }
    h.smoke = Math.max(0, h.smoke - dt * 0.35);
    if (h.smoke > 0 && chance(dt * 20)) {
      particles.smoke(h.x + game.r.camera.ox, h.y + game.r.camera.oy, 1, { life: 1.4, size: 2 });
    }

    // scripted beats
    if (h.t > 3 && !h.said1) { h.said1 = true; this.chip('CLEAR OF THE FENCE. THEY ARE SHOOTING AT US.', 3); }
    if (h.t > 9 && !h.said2) { h.said2 = true; this.chip('THERE IS A FOREST NORTH. BASIN COUNTRY. IT IS THE ONLY GREEN LEFT ON THEIR MAPS.', 5); }
    if ((h.t > 16 || h.hp <= 0) && h.phase !== 'crash') {
      h.phase = 'crash';
      h.crashT = 0;
      h.vx = rnd(-40, 40);
      h.vy = -40;
      this.chip('ROTOR IS GONE. HOLD ON TO SOMETHING.', 3);
      audio.play('bigexplode');
      game.r.camera.addShake(12);
    }
  }

  finish(game) {
    if (this.finished) return;
    this.finished = true;
    this.chapter = CHAPTER.DONE;
    this.blockPlayer = false;
    this.heli = null;
    this.actors.length = 0;
    game.onCampaignComplete();
  }

  /** Skip straight to the forest (menu option, or a replay). */
  skipToForest(game) {
    this.finished = true;
    this.chapter = CHAPTER.DONE;
    this.blockPlayer = false;
    this.cut = null;
    this.heli = null;
    this.actors.length = 0;
    game.onCampaignComplete(true);
  }

  // ======================================================================
  //  draw
  // ======================================================================
  collect(out, cam) {
    for (const a of this.actors) if (cam.visible(a.x, a.y, 60)) out.push(a);
  }

  /**
   * Lab lighting. In the dark the only things with any light on them are the
   * things he wants you looking at, which is exactly how he runs the building.
   */
  drawLights(r, game) {
    const cam = r.camera;
    // strip lights over the walkways, so the rooms are not featureless
    if ((game.labDark || 0) < 0.9) {
      for (const o of game.world.props) {
        if (!cam.visible(o.x, o.y, 70)) continue;
        if (o.kind === 'terminal' || o.kind === 'console') r.light(o.x, o.y - 8, 34, 'rgba(120,220,225,0.5)', 0.5);
        else if (o.kind === 'incinerator') r.light(o.x, o.y - 10, 44, 'rgba(255,150,70,0.75)', 0.8);
        else if (o.kind === 'vat' || o.kind === 'jar') r.light(o.x, o.y - 6, 24, 'rgba(150,210,190,0.4)', 0.4);
      }
    }
    // and him
    const v = this.vane;
    if (v && !v.dead && cam.visible(v.x, v.y, 90)) {
      r.light(v.x, v.y - 20, 62, 'rgba(210,120,110,0.75)', 0.85);
      r.light(v.x, v.y - 34, 22, 'rgba(255,120,110,0.9)', 1);
    }
  }

  drawWorld(r, game) {
    // Ducts you can actually use, marked. A grille you have already been
    // through stays lit, so the network reads as a network.
    if (this.marks && this.marks.vents) {
      for (const o of game.world.props) {
        if (o.use !== 'vent' || !r.camera.visible(o.x, o.y, 40)) continue;
        const near = dist2(game.player.x, game.player.y, o.x, o.y) < 60 * 60;
        const pulse = 0.25 + Math.sin(game.time * 3 + o.x * 0.05) * 0.12;
        r.ring(o.x, o.y - 6, 9, P.cyberDim, 1, near ? pulse + 0.3 : pulse);
        if (near) {
          // a hint of the far end, so you know a duct goes somewhere
          const link = this.marks.vents[o.vent];
          const to = o.end === 'a' ? link.b : link.a;
          const a = Math.atan2(to.y - o.y, to.x - o.x);
          for (let i = 1; i <= 3; i++) {
            r.rect(o.x + Math.cos(a) * i * 5 - 1, o.y - 6 + Math.sin(a) * i * 5 - 1, 2, 2, P.cyberDim);
          }
        }
      }
    }

    // Where to go next. A diamond on the spot, an arrow at the screen edge
    // when it is somewhere off past the walls.
    const wp = this.waypoint;
    if (wp) {
      const cam = r.camera;
      const bob = Math.sin(game.time * 4) * 2;
      if (cam.visible(wp.x, wp.y, 40)) {
        r.ring(wp.x, wp.y, 12 + Math.sin(game.time * 3) * 2, P.sulfurHi, 1, 0.5);
        r.rect(wp.x - 2, wp.y - 24 + bob, 4, 4, P.sulfurHi);
        r.rect(wp.x - 1, wp.y - 20 + bob, 2, 3, P.sulfurHi);
      } else {
        const a = Math.atan2(wp.y - game.player.y, wp.x - game.player.x);
        const d = 34;
        const ax = game.player.x + Math.cos(a) * d, ay = game.player.y - 6 + Math.sin(a) * d;
        r.rect(ax - 2, ay - 2, 4, 4, P.sulfurHi);
        r.rect(ax + Math.cos(a) * 5 - 1, ay + Math.sin(a) * 5 - 1, 2, 2, P.sulfurHi);
      }
    }

    // the transport waiting on the pad
    if (this.padHeli && this.chapter === CHAPTER.RAMPAGE) {
      const f = heliFrames();
      const img = f[Math.floor((this.padHeli.t * 3) % f.length)];
      r.shadow(this.padHeli.x, this.padHeli.y + 6, 22, 7, 0.3);
      r.draw(img, this.padHeli.x - img.width / 2, this.padHeli.y - img.height + 6);
      const pulse = 0.5 + Math.sin(game.time * 5) * 0.4;
      r.ring(this.padHeli.x, this.padHeli.y + 4, 22, P.sulfurHi, 1, pulse);
    }
  }

  drawHud(r, ctx, game) {
    if (this.chapter === CHAPTER.HELI) return this.drawHeliScene(r, ctx, game);

    if (this.objective) {
      const y = 6;
      drawText(ctx, this.objective, VIEW_W / 2, y, P.sulfurHi, { align: 'center', shadow: '#000' });
    }
    if (this.chapter === CHAPTER.COURSE) {
      const w = 92, x = VIEW_W / 2 - w / 2, y = 18;
      r.uiRect(x - 1, y - 1, w + 2, 6, 'rgba(0,0,0,0.6)');
      r.uiRect(x, y, w, 4, '#2a2418');
      r.uiRect(x, y, w * (this.exhaustion / 100), 4, this.exhaustion > 70 ? P.uiBad : P.uiWarn);
      drawText(ctx, 'TIRED', x - 24, y - 1, P.uiDim, { shadow: true });
      drawText(ctx, 'GATES ' + this.gatesPassed + '/' + this.marks.gates.length, x + w + 4, y - 1, P.uiDim, { shadow: true });
    }
    // whatever you just read, held up long enough to actually read it
    if (this.readT > 0 && this.readLines) {
      const a = clamp(this.readT, 0, 1);
      ctx.globalAlpha = a;
      const w = Math.min(VIEW_W - 40, 300);
      const h = this.readLines.length * 9 + 12;
      const x = VIEW_W / 2 - w / 2, y = 26;
      r.uiRect(x, y, w, h, 'rgba(6,14,16,0.92)');
      r.uiStroke(x, y, w, h, P.nestTealHi);
      r.uiRect(x, y, w, 1, P.nestTealHi);
