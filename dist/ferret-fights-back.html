  spark: (c) => { circ(c, 3, 3, 2.2, P.cyber); circ(c, 3, 3, 1, P.cyberHot); },
  nail: (c) => { rect(c, 0, 2, 6, 2, P.nestSteelHi); px(c, 6, 2, '#ffffff'); px(c, 6, 3, '#ffffff'); },
  grenade: (c) => { circ(c, 4, 4, 3.2, '#3a3226'); circ(c, 3, 3, 1.4, P.sulfur); px(c, 5, 1, P.fire1); },
  steam: (c) => { circ(c, 4, 4, 3.4, P.springHot); circ(c, 4, 4, 2, '#ffffff'); },
  quill: (c) => { taper(c, 0, 3, 8, 3, 0.6, 1.6, '#d8cbaa'); px(c, 0, 3, '#3a2a20'); },
  // enemy
  redOrb: (c) => { circ(c, 4, 4, 3.2, P.nestRed); circ(c, 4, 4, 1.8, '#ff9a8a'); px(c, 4, 4, '#ffffff'); },
  tealOrb: (c) => { circ(c, 4, 4, 3.2, P.nestTeal); circ(c, 4, 4, 1.8, P.nestTealHi); px(c, 4, 4, '#ffffff'); },
  laserBolt: (c) => { rect(c, 0, 2, 10, 3, P.nestEye); rect(c, 1, 3, 8, 1, '#ffd0c8'); },
  shell: (c) => { ell(c, 4, 4, 2.6, 3.4, P.nestSteelDk); ell(c, 4, 3, 1.6, 2, P.nestSteel); px(c, 4, 6, P.fire2); },
  saw: (c) => {
    circ(c, 6, 6, 4.4, P.nestSteelHi);
    circ(c, 6, 6, 2, P.nestSteelDk);
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      px(c, Math.round(6 + Math.cos(a) * 5.4), Math.round(6 + Math.sin(a) * 5.4), P.nestSteelHi);
    }
  },
  ember: (c) => { circ(c, 4, 4, 3, P.fire3); circ(c, 4, 4, 1.8, P.fire2); px(c, 4, 4, P.fire1); },
  net: (c) => {
    frameRect(c, 0, 0, 10, 10, '#8a7a5a');
    line(c, 0, 5, 10, 5, '#8a7a5a'); line(c, 5, 0, 5, 10, '#8a7a5a');
  },
  dart: (c) => { taper(c, 0, 3, 9, 3, 0.8, 2, P.nestTealHi); px(c, 9, 3, '#ffffff'); },
};
const BULLET_ART_NAMES = Object.keys(BULLETS);

function bulletSprite(kind) {
  return getSheet(`bullet:${kind}`, () => {
    const sizes = { nail: [8, 6], laserBolt: [12, 7], quill: [10, 7], saw: [14, 14], net: [12, 12], slug: [10, 7], dart: [11, 7] };
    const [w, h] = sizes[kind] || [9, 9];
    const ctx = surface(w, h);
    const fn = BULLETS[kind] || BULLETS.pellet;
    fn(ctx);
    outline(ctx, 'rgba(13,18,15,0.85)');
    return [ctx.canvas];
  })[0];
}

// --- world pickups ---------------------------------------------------------
function pickupSprite(item) {
  return getSheet(`pickup:${item}`, () => {
    const frames = [];
    for (let i = 0; i < 4; i++) {
      const ctx = surface(14, 14);
      const bob = Math.sin((i / 4) * TAU) * 1;
      // soft glow disc so loot is visible in tall grass
      ell(ctx, 7, 11, 4, 1.6, 'rgba(0,0,0,0.28)');
      const icon = itemIcon(item);
      ctx.drawImage(icon, 2, 1 + bob);
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

/** The stolen upgrade chip, spinning in the air. */
function chipPickupFrames() {
  return getSheet('pickup:chipSpin', () => {
    const frames = [];
    for (let i = 0; i < 8; i++) {
      const ctx = surface(16, 16);
      const t = i / 8;
      const w = Math.abs(Math.cos(t * TAU)) * 5 + 1.2;
      const bob = Math.sin(t * TAU) * 1.4;
      const cy = 8 + bob;
      rect(ctx, 8 - w, cy - 4, w * 2, 8, P.cyberDim);
      rect(ctx, 8 - w * 0.6, cy - 2.6, w * 1.2, 5.2, '#0d2a33');
      circ(ctx, 8, cy, Math.min(2, w), P.cyber);
      if (w > 2) {
        for (let k = 0; k < 3; k++) {
          rect(ctx, 8 - w - 1, cy - 3 + k * 2.4, 1, 1, P.nestSteelHi);
          rect(ctx, 8 + w, cy - 3 + k * 2.4, 1, 1, P.nestSteelHi);
        }
      }
      outline(ctx, P.black);
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

/** Marker showing where a wave will break through. */
function warnMarkerFrames() {
  return getSheet('fx:warnMarker', () => {
    const frames = [];
    for (let i = 0; i < 6; i++) {
      const ctx = surface(16, 16);
      const t = i / 6;
      const a = 0.4 + Math.abs(Math.sin(t * TAU)) * 0.6;
      ctx.globalAlpha = a;
      tri(ctx, 3, 3, 13, 3, 8, 13, P.nestRed);
      tri(ctx, 5, 4.4, 11, 4.4, 8, 10.4, '#ffd0c8');
      rect(ctx, 7, 5, 2, 3, P.nestRed);
      px(ctx, 8, 9, P.nestRed);
      ctx.globalAlpha = 1;
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

/** Muzzle flash, drawn additively at the barrel tip. */
function muzzleFlash(size = 1) {
  return getSheet(`fx:muzzle:${size}`, () => {
    const frames = [];
    for (let i = 0; i < 3; i++) {
      const ctx = surface(16, 12);
      const s = (1 - i / 3) * size;
      ell(ctx, 4, 6, 5 * s, 3.4 * s, P.fire2);
      ell(ctx, 3, 6, 3.4 * s, 2.2 * s, P.fire1);
      for (let k = 0; k < 4; k++) {
        const a = (k / 4) * TAU + 0.4;
        line(ctx, 4, 6, 4 + Math.cos(a) * 7 * s, 6 + Math.sin(a) * 5 * s, P.fire2);
      }
      frames.push(ctx.canvas);
    }
    return frames;
  });
}


// ==========================================================================
// src/world/noise.js
// ==========================================================================
// Value noise with fractal octaves and domain warping. Fast enough to generate
// a 240x200 tile basin in a few frames, and smooth enough that the terrain has
// real landforms rather than TV static.

// bundled: import { hash2 } from '../engine/rng.js';

const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);

function valueNoise(x, y, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = fade(xf), v = fade(yf);
  const a = hash2(xi, yi, seed);
  const b = hash2(xi + 1, yi, seed);
  const c = hash2(xi, yi + 1, seed);
  const d = hash2(xi + 1, yi + 1, seed);
  const top = a + (b - a) * u;
  const bot = c + (d - c) * u;
  return top + (bot - top) * v;
}

function fbm(x, y, seed = 0, octaves = 4, lacunarity = 2, gain = 0.5) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise(x * freq, y * freq, seed + i * 1013) * amp;
    norm += amp;
    amp *= gain;
    freq *= lacunarity;
  }
  return sum / norm;
}

/** Ridged noise — sharp crests, good for mountain spines and thermal fissures. */
function ridged(x, y, seed = 0, octaves = 4) {
  let amp = 1, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < octaves; i++) {
    const n = 1 - Math.abs(valueNoise(x * freq, y * freq, seed + i * 7919) * 2 - 1);
    sum += n * n * amp;
    norm += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return sum / norm;
}

/** Push the sample point around with more noise: turns blobs into coastlines. */
function warpedFbm(x, y, seed = 0, strength = 1.6, octaves = 4) {
  const wx = fbm(x + 5.2, y + 1.3, seed + 31, 3) - 0.5;
  const wy = fbm(x + 9.7, y + 4.6, seed + 57, 3) - 0.5;
  return fbm(x + wx * strength, y + wy * strength, seed, octaves);
}

/** Distance-to-nearest-feature-point, cell noise. Used for spring pools. */
function cellular(x, y, seed = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  let best = 10, bestId = 0;
  for (let j = -1; j <= 1; j++) {
    for (let i = -1; i <= 1; i++) {
      const cx = xi + i, cy = yi + j;
      const px = cx + hash2(cx, cy, seed);
      const py = cy + hash2(cx, cy, seed + 991);
      const d = Math.hypot(px - x, py - y);
      if (d < best) { best = d; bestId = (cx * 73856093) ^ (cy * 19349663); }
    }
  }
  return { d: best, id: bestId >>> 0 };
}


// ==========================================================================
// src/art/flora.js
// ==========================================================================
// Trees, plants, rocks, ore and thermal props. Everything is drawn from a seed
// so each individual lodgepole is a slightly different lodgepole, and canopies
// sway on a baked loop with the trunk held still.

// bundled: import { surface, ell, ellShaded, circ, rect, px, line, tape
// bundled: import { P } from './palette.js';
// bundled: import { hash2, makeRng } from '../engine/rng.js';
// bundled: import { TAU } from '../engine/math.js';

// Bend frames, not loop frames. Frame 0 is fully bent upwind, the last is
// fully bent downwind, and the world picks between them from the wind field —
// so a whole hillside leans together instead of every plant twitching alone.
const SWAY_FRAMES = 9;
const BEND_FRAMES = 9;
const PLANT_BEND_FRAMES = BEND_FRAMES;
const TREE_BEND_FRAMES = SWAY_FRAMES;

// --- trees -----------------------------------------------------------------

/**
 * Every conifer gets its own greens.
 *
 * A hillside of the same four sprites reads as wallpaper, however good the
 * sprite is. Shifting each tree a little warmer or cooler and a little lighter
 * or darker off its seed costs nothing — the frames are baked per variant
 * anyway — and turns a repeating pattern back into a forest.
 */
function conifer(rng) {
  const warm = (rng() - 0.5) * 0.14;      // toward olive / toward blue-green
  const val = (rng() - 0.5) * 0.20;       // sunlit crown / shaded hollow
  const tint = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    r = Math.max(0, Math.min(255, Math.round(r * (1 + val + warm * 1.4))));
    g = Math.max(0, Math.min(255, Math.round(g * (1 + val + warm * 0.3))));
    b = Math.max(0, Math.min(255, Math.round(b * (1 + val - warm * 1.2))));
    return `rgb(${r},${g},${b})`;
  };
  return {
    pine: tint(P.pine), pineLight: tint(P.pineLight),
    pineDark: tint(P.pineDark), spruce: tint(P.spruce),
  };
}

function drawLodgepole(ctx, rng, sway, opts = {}) {
  const C = conifer(rng);
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const trunkH = opts.trunkH || Math.round(H * 0.34);
  const trunkW = opts.trunkW || 3;
  const burnt = opts.burnt;
  const trunkCol = burnt ? P.charred : P.bark;

  // trunk
  rect(ctx, cx - trunkW / 2, base - trunkH, trunkW, trunkH, trunkCol);
  rect(ctx, cx - trunkW / 2, base - trunkH, 1, trunkH, shade(trunkCol, -0.25));
  rect(ctx, cx + trunkW / 2 - 1, base - trunkH, 1, trunkH, shade(trunkCol, 0.14));
  speckle(ctx, Math.round(cx - trunkW / 2), Math.round(base - trunkH), trunkW, trunkH, shade(trunkCol, -0.3), 0.22, 11);
  // root flare
  ell(ctx, cx, base - 1, trunkW * 1.5, 2, shade(trunkCol, -0.15));

  if (burnt) {
    for (let i = 0; i < 5; i++) {
      const y = base - trunkH - i * 3;
      const s = rng() < 0.5 ? -1 : 1;
      line(ctx, cx, y, cx + s * rng() * 7, y - 2 - rng() * 3, P.charred);
    }
    return;
  }

  // canopy: stacked needle tiers, widest at the bottom
  const tiers = opts.tiers || 5;
  const topY = 3;
  const canopyH = base - trunkH + 4 - topY;
  const maxW = opts.maxW || W * 0.45;
  for (let i = tiers - 1; i >= 0; i--) {
    const f = i / (tiers - 1);           // 0 = top, 1 = bottom
    const y = topY + canopyH * f;
    const w = maxW * (0.22 + f * 0.78);
    const off = sway * (1 - f) * 1.6;
    const dark = i % 2 === 0 ? C.pineDark : C.pine;
    const lit = i % 2 === 0 ? C.pine : C.pineLight;
    // ragged tier edge: a run of small blobs rather than one clean triangle
    const blobs = Math.max(3, Math.round(w / 2.4));
    for (let b = 0; b < blobs; b++) {
      const bt = b / (blobs - 1);
      const bx = cx + off + (bt - 0.5) * 2 * w;
      const by = y + Math.abs(bt - 0.5) * 3.4 + (hash2(b, i, 3) - 0.5) * 1.6;
      const br = 2.2 + (1 - Math.abs(bt - 0.5) * 2) * 2 + hash2(b, i, 9) * 1.2;
      ell(ctx, bx, by, br, br * 0.82, dark);
    }
    for (let b = 0; b < blobs; b++) {
      const bt = b / (blobs - 1);
      const bx = cx + off + (bt - 0.5) * 2 * w * 0.8;
      const by = y - 1 + Math.abs(bt - 0.5) * 3;
      if (hash2(b, i, 21) < 0.55) ell(ctx, bx, by, 1.8, 1.4, lit);
    }
  }
  // crown spike
  taper(ctx, cx + sway * 1.8, topY - 2, cx + sway * 1.2, topY + 5, 0.6, 2.4, C.pineDark);
  if (opts.snow) {
    for (let i = 0; i < 8; i++) {
      const a = rng() * TAU;
      circ(ctx, cx + Math.cos(a) * maxW * 0.5 + sway, topY + 4 + rng() * canopyH * 0.7, 1.4, P.snow);
    }
  }
}

function drawSpruce(ctx, rng, sway) {
  const C = conifer(rng);
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const trunkH = 8;
  rect(ctx, cx - 1.5, base - trunkH, 3, trunkH, P.bark);
  const tiers = 7;
  for (let i = tiers - 1; i >= 0; i--) {
    const f = i / (tiers - 1);
    const y = 3 + (base - trunkH + 3) * f;
    const w = W * 0.44 * (0.14 + f * 0.86);
    const off = sway * (1 - f) * 1.8;
    tri(ctx, cx + off - w, y + 4, cx + off + w, y + 4, cx + off * 1.3, y - 3, i % 2 ? C.spruce : C.pineDark);
    tri(ctx, cx + off - w * 0.6, y + 2.6, cx + off + w * 0.6, y + 2.6, cx + off * 1.3, y - 1.4, i % 2 ? C.pine : C.spruce);
  }
}

function drawAspen(ctx, rng, sway) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const trunkH = Math.round(H * 0.46);
  const lean = (rng() - 0.5) * 3;
  taper(ctx, cx, base, cx + lean + sway * 0.5, base - trunkH, 2.4, 1.5, P.aspenBark);
  rect(ctx, cx - 2, base - trunkH + 2, 1, trunkH - 3, shade(P.aspenBark, -0.18));
  // the black "eyes" on aspen bark
  for (let i = 0; i < 5; i++) {
    const y = base - 4 - rng() * (trunkH - 6);
    const x = cx + lean * ((base - y) / trunkH) + (rng() < 0.5 ? -2 : 1);
    rect(ctx, x, y, 2, 1, P.aspenMark);
    px(ctx, x - 1, y, P.aspenMark);
  }
  // The crown. Aspen leaves are small and round and they hang in a loose,
  // ragged cloud — the old version drew one big filled disc with a highlight
  // on it, which is why a hillside of them looked like a row of lollipops.
  const topX = cx + lean + sway * 2.2;
  const topY = base - trunkH - 1;
  const leaves = 54;
  for (let i = 0; i < leaves; i++) {
    const a = rng() * TAU;
    const rr = Math.sqrt(rng()) * 11.5;
    const bx = topX + Math.cos(a) * rr + sway * (0.4 + rr * 0.09);
    const by = topY + Math.sin(a) * rr * 0.72 - 5;
    // lit on top, shadowed underneath, and a few dead leaves gone to rust
    const up = (by - topY) < -5;
    const col = rng() < 0.10 ? P.aspenRust
      : up ? P.aspenLeafHi
      : (by - topY) > 0 ? shade(P.aspenLeaf, -0.24) : P.aspenLeaf;
    ell(ctx, bx, by, 2.1 + rng() * 0.9, 1.7 + rng() * 0.7, col);
  }
  // a couple of gaps punched back through, so the crown has sky in it
  for (let i = 0; i < 3; i++) {
    const a = rng() * TAU, rr = 3 + rng() * 6;
    ctx.clearRect(Math.round(topX + Math.cos(a) * rr), Math.round(topY + Math.sin(a) * rr * 0.7), 2, 1);
  }
}

function drawSnag(ctx, rng, sway) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const trunkH = Math.round(H * 0.78);
  taper(ctx, cx, base, cx + sway * 0.4, base - trunkH, 2.6, 1.2, P.snagWood);
  rect(ctx, cx - 2, base - trunkH, 1, trunkH, shade(P.snagWood, -0.3));
  for (let i = 0; i < 4; i++) {
    const y = base - 6 - rng() * (trunkH - 8);
    const s = rng() < 0.5 ? -1 : 1;
    const len = 4 + rng() * 6;
    taper(ctx, cx, y, cx + s * len, y - 3 - rng() * 3 + sway * 0.4, 1.2, 0.6, P.barkDead);
  }
  speckle(ctx, Math.round(cx - 3), Math.round(base - trunkH), 6, trunkH, shade(P.snagWood, -0.28), 0.2, 5);
}

function drawStump(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 2, 5, 2.6, P.bark);
  rect(ctx, cx - 5, base - 4, 10, 3, P.bark);
  ell(ctx, cx, base - 4, 5, 2.4, '#a97c46');
  ell(ctx, cx, base - 4, 3.2, 1.5, '#8a6234');
  ell(ctx, cx, base - 4, 1.4, 0.7, '#6b4a2a');
}

// --- shrubs, flowers, ground cover ----------------------------------------

function drawSage(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  for (let i = 0; i < 12; i++) {
    const a = -Math.PI / 2 + (rng() - 0.5) * 2.2;
    const len = 4 + rng() * 6;
    const ex = cx + Math.cos(a) * len, ey = base + Math.sin(a) * len;
    line(ctx, cx + (rng() - 0.5) * 3, base, ex, ey, P.sageDark);
    circ(ctx, ex, ey, 1.6, i % 2 ? P.sage : shade(P.sage, 0.12));
  }
  ell(ctx, cx, base - 1, 5, 2, P.sageDark);
}

function drawBerryBush(ctx, rng, kind = 'huckleberry') {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const leaf = kind === 'huckleberry' ? '#3d6630' : '#4b7a3a';
  for (let i = 0; i < 10; i++) {
    const a = rng() * TAU;
    const rr = rng() * 5;
    ell(ctx, cx + Math.cos(a) * rr, base - 4 + Math.sin(a) * rr * 0.7, 3.4, 2.8, i % 3 ? leaf : shade(leaf, 0.14));
  }
  const berryCol = kind === 'huckleberry' ? P.berry : '#8a2f3a';
  const berryHi = kind === 'huckleberry' ? P.berryHi : '#c04a52';
  for (let i = 0; i < 7; i++) {
    const a = rng() * TAU, rr = 1.5 + rng() * 4.5;
    const bx = cx + Math.cos(a) * rr, by = base - 4 + Math.sin(a) * rr * 0.8;
    circ(ctx, bx, by, 1.3, berryCol);
    px(ctx, Math.round(bx - 0.5), Math.round(by - 0.6), berryHi);
  }
}

function drawFlower(ctx, rng, kind) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const stemTop = base - (H - 4);
  switch (kind) {
    case 'lupine':
      line(ctx, cx, base, cx, stemTop, '#3d6630');
      for (let i = 0; i < 7; i++) {
        const y = stemTop + i * 1.6;
        const w = 1.2 + (i / 7) * 1.6;
        ell(ctx, cx - w * 0.6, y, w, 1, P.lupine);
        ell(ctx, cx + w * 0.6, y + 0.8, w, 1, shade(P.lupine, 0.16));
      }
      break;
    case 'paintbrush':
      line(ctx, cx, base, cx, stemTop + 1, '#3d6630');
      for (let i = 0; i < 5; i++) {
        const y = stemTop + i * 1.4;
        ell(ctx, cx + (i % 2 ? 1 : -1), y, 1.8, 1.2, i % 2 ? P.paintbrush : shade(P.paintbrush, 0.18));
      }
      break;
    case 'balsamroot':
      line(ctx, cx, base, cx, stemTop + 2, '#4b7a3a');
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TAU;
        ell(ctx, cx + Math.cos(a) * 2.6, stemTop + 2 + Math.sin(a) * 2, 1.5, 1.1, P.balsamroot);
      }
      circ(ctx, cx, stemTop + 2, 1.4, '#8a6a1c');
      break;
    case 'fireweed':
      line(ctx, cx, base, cx, stemTop, '#4b7a3a');
      for (let i = 0; i < 6; i++) {
        const y = stemTop + i * 1.8;
        const s = i % 2 ? 1 : -1;
        circ(ctx, cx + s * 1.6, y, 1.4, P.fireweed);
      }
      break;
    case 'beargrass':
      for (let i = -3; i <= 3; i++) {
        line(ctx, cx, base, cx + i * 2.2, base - 6 - Math.abs(i), '#6b7a4a');
      }
      line(ctx, cx, base, cx, stemTop + 4, '#6b7a4a');
      ell(ctx, cx, stemTop + 3, 1.9, 2.6, shade(P.bearGrass, -0.14));
      ell(ctx, cx - 0.5, stemTop + 2.4, 1.2, 1.6, P.bearGrass);
      break;
    case 'mushroom': {
      const n = 2 + Math.floor(rng() * 2);
      for (let i = 0; i < n; i++) {
        const mx = cx + (i - (n - 1) / 2) * 4;
        rect(ctx, mx - 0.5, base - 3, 2, 3, P.mushroomPale);
        ell(ctx, mx, base - 3.5, 2.8, 1.8, P.mushroom);
        px(ctx, Math.round(mx - 1), Math.round(base - 4), P.mushroomPale);
      }
      break;
    }
    case 'fern':
      for (let i = -2; i <= 2; i++) {
        const a = -Math.PI / 2 + i * 0.42;
        const ex = cx + Math.cos(a) * 7, ey = base + Math.sin(a) * 8;
        line(ctx, cx, base, ex, ey, '#2f4a2c');
        for (let j = 1; j <= 3; j++) {
          const t = j / 4;
          const bx = cx + (ex - cx) * t, by = base + (ey - base) * t;
          line(ctx, bx, by, bx - 2, by - 1, '#3d6236');
          line(ctx, bx, by, bx + 2, by - 1, '#3d6236');
        }
      }
      break;
    case 'grass':
    default: {
      // A tuft is a fan of blades from one root — thick at the base, one
      // pixel at the tip, curving over as it goes. Five random scratches is
      // what the old one was, and it read as television static.
      const n = 5 + Math.floor(rng() * 3);
      for (let i = 0; i < n; i++) {
        const t = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
        const gx = cx + t * 3.0 + (rng() - 0.5);
        const len = (H - 2) - Math.abs(t) * (H * 0.34) - rng() * 1.6;
        const lean = t * 3.2 + (rng() - 0.5) * 1.2;
        const col = Math.abs(t) < 0.45 ? P.grassLight : P.grass;
        for (let sp = 0; sp <= len; sp++) {
          const u = sp / Math.max(1, len);
          const bx = Math.round(gx + lean * u * u);
          px(ctx, bx, Math.round(base - sp), col);
          // the root end is two pixels wide, which is what stops a blade
          // looking like a stray line of noise
          if (u < 0.3) px(ctx, bx + (t < 0 ? -1 : 1), Math.round(base - sp), shade(col, -0.22));
        }
      }
      break;
    }
  }
}

/**
 * A reed bed. Tall, straight, and it goes over further than anything else on
 * the map when a gust comes through, which is most of why it is worth drawing.
 */
function drawReeds(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  for (let i = 0; i < 11; i++) {
    const t = (i / 10) * 2 - 1;
    const x = cx + t * 7 + (rng() - 0.5) * 1.5;
    const hgt = H - 3 - Math.abs(t) * 5 - rng() * 3;
    const col = i % 3 === 0 ? '#a8b46a' : i % 3 === 1 ? '#8a9a52' : '#6b7a42';
    line(ctx, x, base, x + t * 1.6, base - hgt, col);
    // the seed head — a dark thumb at the top of every third stem
    if (i % 3 === 0) ell(ctx, x + t * 1.6, base - hgt + 1.5, 0.9, 2.0, '#6b5a2e');
  }
  for (let i = 0; i < 3; i++) {
    line(ctx, cx - 5 + i * 5, base, cx - 8 + i * 6, base - 3, '#4d5a34');
  }
}

/** Resin bleeding down a scarred trunk. Amber, and it catches the light. */
function drawResinSeep(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  taper(ctx, cx, base, cx, base - (H - 3), 3.2, 2.6, P.bark);
  rect(ctx, cx - 3, base - H + 4, 2, H - 5, shade(P.bark, -0.28));
  // the wound, and the run of amber below it
  ell(ctx, cx + 0.5, base - H * 0.6, 2.2, 3.4, '#8a6238');
  for (let i = 0; i < 4; i++) {
    const y = base - H * 0.6 + i * 3;
    ell(ctx, cx + 0.5 + (rng() - 0.5), y, 1.6 - i * 0.2, 2.2, i < 2 ? '#e8b455' : '#c88a2a');
  }
  ell(ctx, cx + 0.8, base - 4, 3.0, 1.6, '#c88a2a');
  px(ctx, Math.round(cx), Math.round(base - H * 0.62), '#f4d68a');
}

/** What the birds leave under a roost. */
function drawFeatherFall(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const base = H - 1;
  for (let i = 0; i < 5; i++) {
    const x = 3 + rng() * (W - 6), y = base - rng() * 5;
    const a = rng() * Math.PI;
    const ex = x + Math.cos(a) * 5, ey = y - Math.abs(Math.sin(a)) * 4;
    line(ctx, x, y, ex, ey, '#5a5448');
    for (let j = 1; j <= 3; j++) {
      const t = j / 4;
      line(ctx, x + (ex - x) * t, y + (ey - y) * t,
           x + (ex - x) * t + 1.6, y + (ey - y) * t - 0.8, j % 2 ? '#8a94a0' : '#6b7480');
    }
  }
  speckle(ctx, 2, base - 2, W - 4, 3, '#9aa2ac', 0.18, 5);
}

/** A cut bank of wet clay. */
function drawClayBank(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ellShaded(ctx, cx, base - 4, 10, 5.5, '#8a5a42', '#a87458', '#5c3a2a');
  ellShaded(ctx, cx - 6, base - 2, 5, 3, '#7a4e38', '#9c6a50', '#523226');
  // the horizontal bedding lines that say "bank" and not "boulder"
  for (let i = 0; i < 3; i++) {
    line(ctx, cx - 8 + rng() * 2, base - 3 - i * 2.4, cx + 8 - rng() * 2, base - 3.6 - i * 2.4, '#6b4432');
  }
  speckle(ctx, cx - 8, base - 7, 16, 6, '#b98a6a', 0.14, 9);
}

/** Winterkill, stacked where the drifts left it. */
function drawBonePile(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 1, 11, 3, '#4d4436');
  for (let i = 0; i < 7; i++) {
    const x = cx - 8 + rng() * 16, y = base - 2 - rng() * 6;
    const a = (rng() - 0.5) * 1.6;
    const ex = x + Math.cos(a) * 5, ey = y + Math.sin(a) * 2;
    line(ctx, x, y, ex, ey, i % 2 ? '#d8d0b8' : '#b2a98e');
    circ(ctx, x, y, 1.2, '#e6e0c8');
    circ(ctx, ex, ey, 1.1, '#e6e0c8');
  }
  // a skull, because a bone pile without one is a pile of sticks
  ell(ctx, cx + 4, base - 4, 3.2, 2.6, '#e0d8c0');
  taper(ctx, cx + 6, base - 4, cx + 10, base - 3, 2.0, 1.2, '#d2c9ae');
  px(ctx, Math.round(cx + 3.4), Math.round(base - 4.6), '#3a352c');
  px(ctx, Math.round(cx + 5.2), Math.round(base - 4.4), '#3a352c');
}

// --- rocks, ore, minerals --------------------------------------------------

function drawRock(ctx, rng, kind, size = 1) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  let base1 = P.stone, lightC = P.stoneLight, darkC = P.stoneDark;
  if (kind === 'obsidian') { base1 = P.obsidian; lightC = P.obsidianHi; darkC = '#0d0d14'; }
  if (kind === 'sulfur') { base1 = '#8a7a3a'; lightC = P.sulfur; darkC = '#5a4f22'; }
  if (kind === 'coal') { base1 = P.coal; lightC = '#4a4a4c'; darkC = '#161618'; }

  const r = 5 * size;
  // A rock is 3 overlapping lumps so the silhouette never looks like a circle.
  const lumps = [[0, 0, r], [-r * 0.7, r * 0.25, r * 0.72], [r * 0.65, r * 0.3, r * 0.66]];
  for (const [lx, ly, lr] of lumps) ellShaded(ctx, cx + lx, base - r * 0.7 + ly, lr, lr * 0.82, base1, lightC, darkC);
  // facet highlights
  for (let i = 0; i < 4; i++) {
    const a = rng() * TAU, rr = rng() * r * 0.7;
    line(ctx, cx + Math.cos(a) * rr, base - r * 0.7 + Math.sin(a) * rr * 0.7,
      cx + Math.cos(a) * rr + 2, base - r * 0.7 + Math.sin(a) * rr * 0.7 - 1, darkC);
  }
  if (kind === 'iron' || kind === 'copper' || kind === 'sulfurVein' || kind === 'saltpeter') {
    const veinCol = kind === 'iron' ? P.iron : kind === 'copper' ? P.copper : kind === 'saltpeter' ? P.saltpeter : P.sulfur;
    const veinHi = kind === 'iron' ? P.ironHi : kind === 'copper' ? P.copperHi : kind === 'saltpeter' ? '#ffffff' : P.sulfurHi;
    for (let i = 0; i < 6; i++) {
      const a = rng() * TAU, rr = rng() * r * 0.75;
      const vx = cx + Math.cos(a) * rr, vy = base - r * 0.7 + Math.sin(a) * rr * 0.7;
      circ(ctx, vx, vy, 1.4, veinCol);
      px(ctx, Math.round(vx - 0.4), Math.round(vy - 0.5), veinHi);
    }
  }
  if (kind === 'obsidian') {
    for (let i = 0; i < 3; i++) {
      const a = rng() * TAU;
      line(ctx, cx, base - r * 0.8, cx + Math.cos(a) * r * 0.8, base - r * 0.8 + Math.sin(a) * r * 0.6, P.obsidianHi);
    }
  }
}

function drawSulfurMound(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 2, 8, 4, '#8a7a3a');
  ell(ctx, cx, base - 3.5, 6.6, 3.2, P.sulfur);
  ell(ctx, cx - 1, base - 4.4, 4, 2, P.sulfurHi);
  for (let i = 0; i < 10; i++) {
    const a = rng() * TAU, rr = rng() * 6;
    px(ctx, Math.round(cx + Math.cos(a) * rr), Math.round(base - 3 + Math.sin(a) * rr * 0.5), rng() < 0.5 ? P.sulfurHi : '#c9b22a');
  }
  // vent hole
  ell(ctx, cx + 2, base - 4, 1.6, 0.9, '#5a4f22');
}

function drawSaltpeterCrust(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 1.5, 9, 3.4, P.sinter);
  ell(ctx, cx, base - 2.4, 7, 2.6, P.saltpeter);
  dither(ctx, Math.round(cx - 6), Math.round(base - 4), 12, 4, '#ffffff', 0);
  for (let i = 0; i < 6; i++) {
    const a = rng() * TAU, rr = rng() * 7;
    px(ctx, Math.round(cx + Math.cos(a) * rr), Math.round(base - 2 + Math.sin(a) * rr * 0.4), '#c9cdcd');
  }
}

// --- thermal features & props ---------------------------------------------

function drawGeyserCone(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 2, 11, 5, P.sinter);
  ell(ctx, cx, base - 5, 8, 4, shade(P.sinter, 0.1));
  ell(ctx, cx, base - 7.5, 5.4, 3, shade(P.sinter, 0.16));
  ell(ctx, cx, base - 8.5, 3, 1.6, '#3a3a38');
  for (let i = 0; i < 16; i++) {
    const a = rng() * TAU, rr = 3 + rng() * 7;
    px(ctx, Math.round(cx + Math.cos(a) * rr), Math.round(base - 4 + Math.sin(a) * rr * 0.45), rng() < 0.4 ? P.springRim1 : shade(P.sinter, -0.14));
  }
}

function drawFumarole(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 1.5, 7, 3.4, P.mudpot);
  ell(ctx, cx, base - 3, 4.4, 2.2, '#4a3b2a');
  ell(ctx, cx, base - 3.6, 2.2, 1.1, '#241f1c');
  for (let i = 0; i < 8; i++) {
    const a = rng() * TAU, rr = rng() * 5;
    px(ctx, Math.round(cx + Math.cos(a) * rr), Math.round(base - 2 + Math.sin(a) * rr * 0.5), P.sulfur);
  }
}

function drawBones(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 2, 4, 2.6, '#d8d2bb');
  circ(ctx, cx - 3.5, base - 3, 1.4, '#d8d2bb');
  ell(ctx, cx + 3, base - 1, 1.2, 0.8, '#c4bda6');
  for (let i = 0; i < 3; i++) line(ctx, cx - 2 + i * 2, base - 3.4, cx - 3 + i * 2, base - 0.6, '#c4bda6');
  circ(ctx, cx - 3.6, base - 3.4, 0.7, '#5a5348');
}

function drawLogPile(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  for (let i = 0; i < 3; i++) {
    const y = base - 2 - i * 3;
    const off = (i % 2) * 2 - 1;
    rect(ctx, cx - 7 + off, y - 2, 14, 3, P.bark);
    rect(ctx, cx - 7 + off, y - 2, 14, 1, P.barkLight);
    ell(ctx, cx - 7 + off, y - 0.5, 1.4, 1.5, '#a97c46');
    ell(ctx, cx + 7 + off, y - 0.5, 1.4, 1.5, '#8a6234');
  }
}

function drawDen(ctx, rng) {
  // The ferret den: the place you are defending.
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 3, 15, 8, P.dirt);
  ell(ctx, cx, base - 5, 13, 7, P.dirtLight);
  ell(ctx, cx, base - 2, 6, 4.4, '#1a1410');
  ell(ctx, cx, base - 2.6, 5, 3.6, '#0d0a08');
  // grass fringe and a few scattered pebbles
  for (let i = 0; i < 16; i++) {
    const a = rng() * TAU, rr = 9 + rng() * 6;
    const gx = cx + Math.cos(a) * rr, gy = base - 4 + Math.sin(a) * rr * 0.45;
    line(ctx, gx, gy, gx + (rng() - 0.5) * 2, gy - 2 - rng() * 2, rng() < 0.5 ? P.grass : P.grassLight);
  }
  for (let i = 0; i < 6; i++) {
    const a = rng() * TAU, rr = 6 + rng() * 7;
    circ(ctx, cx + Math.cos(a) * rr, base - 3 + Math.sin(a) * rr * 0.4, 1.2, P.gravel);
  }
  // little bedding of dry grass at the mouth
  for (let i = 0; i < 8; i++) line(ctx, cx - 4 + i, base - 1, cx - 5 + i + (rng() - 0.5) * 2, base - 2.5, P.meadowDry);
}

function drawWorkbench(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  rect(ctx, cx - 10, base - 8, 20, 5, P.bark);
  rect(ctx, cx - 10, base - 8, 20, 1, P.barkLight);
  rect(ctx, cx - 9, base - 3, 2, 3, P.bark);
  rect(ctx, cx + 7, base - 3, 2, 3, P.bark);
  // vise, hammer, a scatter of parts
  rect(ctx, cx + 3, base - 11, 4, 3, P.stone);
  rect(ctx, cx - 7, base - 10, 5, 2, P.nestSteel);
  line(ctx, cx - 5, base - 10, cx - 5, base - 13, P.barkLight);
  circ(ctx, cx - 1, base - 9, 1.4, P.iron);
  circ(ctx, cx + 1, base - 9.5, 1, P.copper);
}

function drawForge(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  rect(ctx, cx - 9, base - 10, 18, 10, P.stoneDark);
  rect(ctx, cx - 9, base - 10, 18, 2, P.stone);
  speckle(ctx, cx - 9, base - 10, 18, 10, P.stoneLight, 0.12, 3);
  rect(ctx, cx - 5, base - 7, 10, 6, '#160f0c');
  ell(ctx, cx, base - 3, 4.4, 2.4, P.fire3);
  ell(ctx, cx, base - 3, 3, 1.6, P.fire2);
  ell(ctx, cx, base - 3, 1.6, 0.9, P.fire1);
  rect(ctx, cx - 3, base - 14, 2, 4, P.stoneDark);
  rect(ctx, cx + 2, base - 13, 2, 3, P.stoneDark);
}

function drawCrate(ctx, rng, corp = false) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const body = corp ? P.nestDark : P.bark;
  const trim = corp ? P.nestTeal : P.barkLight;
  rect(ctx, cx - 7, base - 12, 14, 12, body);
  rect(ctx, cx - 7, base - 12, 14, 1, trim);
  rect(ctx, cx - 7, base - 7, 14, 1, trim);
  rect(ctx, cx - 7, base - 12, 1, 12, shade(body, -0.25));
  rect(ctx, cx + 6, base - 12, 1, 12, shade(body, 0.15));
  if (corp) {
    // stencilled nest mark
    ell(ctx, cx, base - 5, 4, 2.4, P.nestTealHi);
    ell(ctx, cx, base - 5.4, 2.4, 1.4, P.nestDark);
    px(ctx, cx, base - 5.4, P.eggShell);
  } else {
    line(ctx, cx - 6, base - 11, cx + 5, base - 1, shade(body, -0.2));
  }
}

const TREE_KINDS = {
  pine: { w: 34, h: 52, fn: drawLodgepole, shadow: 7 },
  pineSmall: { w: 26, h: 38, fn: (c, r, s) => drawLodgepole(c, r, s, { tiers: 4, maxW: 11, trunkH: 10 }), shadow: 5 },
  pineTall: { w: 38, h: 66, fn: (c, r, s) => drawLodgepole(c, r, s, { tiers: 6, maxW: 16, trunkH: 22 }), shadow: 8 },
  spruce: { w: 30, h: 54, fn: drawSpruce, shadow: 6 },
  aspen: { w: 34, h: 50, fn: drawAspen, shadow: 6 },
  snag: { w: 22, h: 46, fn: drawSnag, shadow: 4 },
  burnt: { w: 26, h: 40, fn: (c, r, s) => drawLodgepole(c, r, s, { burnt: true, trunkH: 30 }), shadow: 4 },
  stump: { w: 16, h: 12, fn: (c, r) => drawStump(c, r), shadow: 5, static: true },
};

function treeFrames(kind, variant = 0) {
  const spec = TREE_KINDS[kind] || TREE_KINDS.pine;
  return getSheet(`tree:${kind}:${variant}`, () => {
    const frames = [];
    const n = spec.static ? 1 : SWAY_FRAMES;
    for (let i = 0; i < n; i++) {
      const rng = makeRng(variant * 7919 + 13);
      const ctx = surface(spec.w, spec.h);
      // A tree is heavy. It leans a long way at the crown and barely at all
      // at the butt, and it never leans as far as grass does.
      const bend = n === 1 ? 0 : (i / (n - 1)) * 2 - 1;
      spec.fn(ctx, rng, bend * 2.2);
      outline(ctx, P.black);
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

function treeShadowRadius(kind) { return (TREE_KINDS[kind] || TREE_KINDS.pine).shadow; }
const TREE_KIND_NAMES = Object.keys(TREE_KINDS);

const PLANT_KINDS = {
  sage: { bend: 1.3, w: 18, h: 14, fn: (c, r) => drawSage(c, r) },
  huckleberry: { bend: 1.2, w: 20, h: 16, fn: (c, r) => drawBerryBush(c, r, 'huckleberry') },
  serviceberry: { bend: 1.2, w: 20, h: 16, fn: (c, r) => drawBerryBush(c, r, 'serviceberry') },
  lupine: { bend: 3.4, w: 12, h: 16, fn: (c, r) => drawFlower(c, r, 'lupine') },
  paintbrush: { bend: 3.0, w: 12, h: 14, fn: (c, r) => drawFlower(c, r, 'paintbrush') },
  balsamroot: { bend: 2.4, w: 14, h: 14, fn: (c, r) => drawFlower(c, r, 'balsamroot') },
  fireweed: { bend: 3.8, w: 12, h: 18, fn: (c, r) => drawFlower(c, r, 'fireweed') },
  beargrass: { bend: 3.6, w: 16, h: 18, fn: (c, r) => drawFlower(c, r, 'beargrass') },
  mushroom: { bend: 0, w: 14, h: 10, fn: (c, r) => drawFlower(c, r, 'mushroom') },
  fern: { bend: 2.2, w: 18, h: 14, fn: (c, r) => drawFlower(c, r, 'fern') },
  grass: { bend: 4.2, w: 12, h: 10, fn: (c, r) => drawFlower(c, r, 'grass') },
  reeds: { bend: 3.4, w: 20, h: 22, fn: (c, r) => drawReeds(c, r) },
  resin: { bend: 0.4, w: 16, h: 20, fn: (c, r) => drawResinSeep(c, r) },
  feathers: { bend: 1.2, w: 18, h: 12, fn: (c, r) => drawFeatherFall(c, r) },
};
const PLANT_KIND_NAMES = Object.keys(PLANT_KINDS);

function plantFrames(kind, variant = 0) {
  const spec = PLANT_KINDS[kind] || PLANT_KINDS.grass;
  return getSheet(`plant:${kind}:${variant}`, () => {
    const frames = [];
    const pad = 5;
    for (let i = 0; i < BEND_FRAMES; i++) {
      const rng = makeRng(variant * 104729 + 17);
      const ctx = surface(spec.w + pad * 2, spec.h);
      const bend = (i / (BEND_FRAMES - 1)) * 2 - 1;
      // Shear, not shift. Grass is rooted: the base stays exactly where it is
      // and the tips travel. Sliding the whole sprite sideways is what made
      // the old meadow look like it was shivering rather than blowing.
      const k = bend * (spec.bend == null ? 3.0 : spec.bend) / Math.max(1, spec.h);
      ctx.save();
      ctx.setTransform(1, 0, -k, 1, pad + k * spec.h, 0);
      spec.fn(ctx, rng);
      ctx.restore();
      outline(ctx, P.black);
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

  saltpeter: { w: 24, h: 12, fn: (c, r) => drawSaltpeterCrust(c, r) },
  sulfur: { w: 22, h: 14, fn: (c, r) => drawSulfurMound(c, r) },
  clay: { w: 24, h: 16, fn: (c, r) => drawClayBank(c, r) },
  bones: { w: 26, h: 16, fn: (c, r) => drawBonePile(c, r) },
};
const ROCK_KIND_NAMES = Object.keys(ROCK_KINDS);

function rockSprite(kind, variant = 0) {
  const spec = ROCK_KINDS[kind] || ROCK_KINDS.stone;
  return getSheet(`rock:${kind}:${variant}`, () => {
    const rng = makeRng(variant * 31337 + 7);
    const ctx = surface(spec.w, spec.h);
    spec.fn(ctx, rng);
    outline(ctx, P.black);
    return [ctx.canvas];
  })[0];
}

const PROPS = {
  geyserCone: { w: 28, h: 16, fn: drawGeyserCone },
  fumarole: { w: 20, h: 10, fn: drawFumarole },
  bones: { w: 16, h: 10, fn: drawBones },
  logPile: { w: 20, h: 14, fn: drawLogPile },
  den: { w: 40, h: 24, fn: drawDen },
  workbench: { w: 26, h: 18, fn: drawWorkbench },
  forge: { w: 22, h: 18, fn: drawForge },
  crate: { w: 18, h: 16, fn: (c, r) => drawCrate(c, r, false) },
  nestCrate: { w: 18, h: 16, fn: (c, r) => drawCrate(c, r, true) },
};
const PROP_NAMES = Object.keys(PROPS);

function propSprite(kind, variant = 0) {
  const spec = PROPS[kind];
  if (!spec) return null;
  return getSheet(`prop:${kind}:${variant}`, () => {
    const rng = makeRng(variant * 65537 + 3);
    const ctx = surface(spec.w, spec.h);
    spec.fn(ctx, rng);
    outline(ctx, P.black);
    return [ctx.canvas];
  })[0];
}


// ==========================================================================
// src/art/lab.js
// ==========================================================================
// Les Nest interior props. Everything in here is clean, rectangular and
// well-lit, which is exactly what makes it feel wrong after twenty minutes in
// a forest — and what makes the blood show up so well.

// bundled: import { surface, ell, ellShaded, circ, rect, px, line, caps
// bundled: import { P } from './palette.js';
// bundled: import { drawNestLogo } from './machines.js';
// bundled: import { TAU } from '../engine/math.js';
// bundled: import { makeRng } from '../engine/rng.js';

function panelPlate(ctx, x, y, w, h, base = P.nestSteel) {
  rect(ctx, x, y, w, h, base);
  rect(ctx, x, y, w, 1, shade(base, 0.24));
  rect(ctx, x, y + h - 1, w, 1, shade(base, -0.32));
  rect(ctx, x, y, 1, h, shade(base, 0.1));
  rect(ctx, x + w - 1, y, 1, h, shade(base, -0.24));
}

// --- props -----------------------------------------------------------------

/** The tank you live in. Drawn open or closed, whole or shattered. */
function drawCage(ctx, rng, state) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  // steel frame
  panelPlate(ctx, cx - 16, base - 6, 32, 6, P.nestSteelDk);
  panelPlate(ctx, cx - 16, base - 34, 32, 4, P.nestSteelDk);
  rect(ctx, cx - 16, base - 32, 2, 26, P.nestSteel);
  rect(ctx, cx + 14, base - 32, 2, 26, P.nestSteel);
  // glass
  if (state !== 'broken') {
    ctx.globalAlpha = 0.55;
    rect(ctx, cx - 14, base - 31, 28, 25, '#5f8f96');
    ctx.globalAlpha = 1;
    rect(ctx, cx - 11, base - 30, 1, 23, '#a9dbe0');
    rect(ctx, cx - 10, base - 30, 1, 7, '#a9dbe0');
    rect(ctx, cx + 6, base - 24, 1, 17, '#a9dbe0');
    if (state === 'cracked') {
      const cxx = cx + 2, cyy = base - 20;
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * TAU + 0.3;
        line(ctx, cxx, cyy, cxx + Math.cos(a) * (5 + i), cyy + Math.sin(a) * (5 + i), '#dff2f5');
      }
      circ(ctx, cxx, cyy, 2, '#eef8fa');
    }
  } else {
    // jagged remnants along the frame
    for (let i = 0; i < 10; i++) {
      const x = cx - 13 + i * 3;
      tri(ctx, x, base - 31, x + 3, base - 31, x + 1.5, base - 31 + 3 + rng() * 5, '#7fb4bb');
    }
    for (let i = 0; i < 8; i++) {
      const x = cx - 13 + i * 3.6;
      tri(ctx, x, base - 6, x + 3, base - 6, x + 1.5, base - 6 - 3 - rng() * 5, '#7fb4bb');
    }
  }
  // label plate
  panelPlate(ctx, cx - 9, base - 5, 18, 4, P.nestDark);
  rect(ctx, cx - 7, base - 4, 2, 2, P.nestTealHi);
  rect(ctx, cx - 3, base - 4, 8, 1, P.nestSteelHi);
  // status light
  circ(ctx, cx + 12, base - 33, 1.4, state === 'broken' ? P.nestEye : P.nestTealHi);
}

function drawConsole(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  panelPlate(ctx, cx - 11, base - 12, 22, 12, P.nestSteelDk);
  panelPlate(ctx, cx - 9, base - 20, 18, 9, P.nestDark);
  rect(ctx, cx - 7, base - 18, 14, 5, '#0d2a2a');
  for (let i = 0; i < 4; i++) {
    rect(ctx, cx - 6, base - 17 + i, 2 + rng() * 9, 1, i % 2 ? P.nestTealHi : P.springHot);
  }
  for (let i = 0; i < 5; i++) circ(ctx, cx - 8 + i * 4, base - 8, 1, i === 2 ? P.nestEye : P.nestSteelHi);
}

function drawVat(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  panelPlate(ctx, cx - 8, base - 4, 16, 4, P.nestSteelDk);
  ctx.globalAlpha = 0.7;
  rect(ctx, cx - 7, base - 26, 14, 22, '#1d5f63');
  ctx.globalAlpha = 1;
  rect(ctx, cx - 8, base - 28, 16, 3, P.nestSteel);
  rect(ctx, cx - 8, base - 28, 16, 1, P.nestSteelHi);
  // suspended specimen, indistinct on purpose
  ell(ctx, cx, base - 15, 4, 5.5, '#2a3c3a');
  ell(ctx, cx, base - 17, 2.4, 2.4, '#3a504c');
  for (let i = 0; i < 5; i++) {
    circ(ctx, cx - 4 + rng() * 8, base - 8 - rng() * 16, 1, '#8fd0d6');
  }
  rect(ctx, cx - 5, base - 27, 1, 22, '#4d8f96');
}

function drawOpTable(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  rect(ctx, cx - 2, base - 8, 4, 8, P.nestSteelDk);
  panelPlate(ctx, cx - 13, base - 12, 26, 5, P.nestSteel);
  // straps
  for (const x of [-7, 0, 7]) rect(ctx, cx + x - 1, base - 13, 3, 2, '#3a3226');
  // instrument arm
  taper(ctx, cx + 10, base - 12, cx + 6, base - 24, 1.4, 1, P.nestSteelDk);
  circ(ctx, cx + 6, base - 24, 2.4, P.nestSteel);
  circ(ctx, cx + 6, base - 24, 1.2, P.springHot);
  // old stains
  for (let i = 0; i < 6; i++) px(ctx, Math.round(cx - 8 + rng() * 16), Math.round(base - 8 + rng() * 6), '#5c1a1a');
}

function drawLabDoor(ctx, rng, open) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  panelPlate(ctx, cx - 12, base - 26, 24, 26, P.nestSteelDk);
  if (open) {
    rect(ctx, cx - 9, base - 23, 18, 23, '#101a1c');
    rect(ctx, cx - 10, base - 24, 2, 24, P.nestSteel);
    rect(ctx, cx + 8, base - 24, 2, 24, P.nestSteel);
  } else {
    panelPlate(ctx, cx - 9, base - 23, 9, 23, P.nestSteel);
    panelPlate(ctx, cx, base - 23, 9, 23, P.nestSteel);
    rect(ctx, cx - 1, base - 23, 2, 23, P.nestSteelDk);
    for (let i = 0; i < 3; i++) rect(ctx, cx - 7, base - 20 + i * 3, 5, 1, '#c9a23c');
  }
  circ(ctx, cx + 10, base - 14, 1.4, open ? P.uiGood : P.nestEye);
}

function drawHurdle(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  rect(ctx, cx - 10, base - 3, 3, 3, P.nestSteelDk);
  rect(ctx, cx + 7, base - 3, 3, 3, P.nestSteelDk);
  rect(ctx, cx - 10, base - 9, 20, 3, '#c9a23c');
  for (let i = 0; i < 4; i++) rect(ctx, cx - 9 + i * 5, base - 9, 2, 3, '#2c2418');
}

function drawFoodDish(ctx, rng, full) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  ell(ctx, cx, base - 2, 7, 3, P.nestSteel);
  ell(ctx, cx, base - 3, 5.4, 2.2, P.nestSteelDk);
  if (full) {
    for (let i = 0; i < 6; i++) {
      circ(ctx, cx - 3 + rng() * 6, base - 3.5 + rng() * 1.5, 1.2, i % 2 ? '#8a6234' : '#a97c46');
    }
  }
}

function drawBanner(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  rect(ctx, cx - 13, base - 30, 26, 30, P.nestDark);
  rect(ctx, cx - 13, base - 30, 26, 1, P.nestTeal);
  drawNestLogo(ctx, cx, base - 17, 0.85);
  rect(ctx, cx - 9, base - 5, 18, 1, P.nestTeal);
  rect(ctx, cx - 6, base - 3, 12, 1, P.nestTealHi);
}

function drawLocker(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  panelPlate(ctx, cx - 8, base - 22, 16, 22, P.nestSteel);
  rect(ctx, cx, base - 22, 1, 22, P.nestSteelDk);
  circ(ctx, cx - 3, base - 11, 1, P.nestSteelDk);
  circ(ctx, cx + 3, base - 11, 1, P.nestSteelDk);
  rect(ctx, cx - 6, base - 20, 5, 2, P.nestTeal);
}

function drawCrateLab(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  panelPlate(ctx, cx - 7, base - 13, 14, 13, P.nestDark);
  rect(ctx, cx - 7, base - 8, 14, 1, P.nestTeal);
  rect(ctx, cx - 4, base - 11, 8, 2, P.nestTealHi);
}

function drawHeli(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, cy = H / 2;
  // body
  ellShaded(ctx, cx, cy, 15, 8, P.nestDark, P.nestSteelDk, '#0a1615');
  panelPlate(ctx, cx - 6, cy - 7, 14, 7, P.nestSteelDk);
  ell(ctx, cx + 10, cy - 1, 6, 5, '#2a5c60');
  ell(ctx, cx + 11, cy - 2, 3.5, 2.6, '#8fd0d6');
  // tail boom
  taper(ctx, cx - 12, cy - 1, cx - 30, cy - 4, 3.4, 1.8, P.nestDark);
  tri(ctx, cx - 30, cy - 9, cx - 30, cy - 1, cx - 24, cy - 4, P.nestSteelDk);
  // skids
  rect(ctx, cx - 12, cy + 8, 22, 1, P.nestSteel);
  rect(ctx, cx - 8, cy + 6, 1, 3, P.nestSteel);
  rect(ctx, cx + 6, cy + 6, 1, 3, P.nestSteel);
  // main rotor, blurred by speed
  const spin = Math.abs(Math.cos(t * TAU));
  ctx.globalAlpha = 0.5 + spin * 0.35;
  ell(ctx, cx - 2, cy - 11, 26 * (0.35 + spin * 0.65), 1.4, '#c4d0d4');
  ctx.globalAlpha = 1;
  rect(ctx, cx - 3, cy - 12, 3, 3, P.nestSteel);
  // tail rotor
  ctx.globalAlpha = 0.5;
  ell(ctx, cx - 30, cy - 4, 2, 6 * (0.4 + spin * 0.6), '#c4d0d4');
  ctx.globalAlpha = 1;
  drawNestLogo(ctx, cx - 2, cy + 1, 0.5);
}

// --- the chair -------------------------------------------------------------

/**
 * Aldous Vane, Chief Executive, Les Nest Holdings.
 *
 * He is drawn as a machine with a person in it rather than the other way
 * round, because that is how he treats himself: a failing body kept running by
 * the same division that keeps you running. The chair is the character. The
 * man in it barely moves.
 */
function drawChair(ctx, rng, mode = 'idle') {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, ground = H - 1;
  const steel = P.nestSteel, dark = P.nestSteelDk, teal = P.nestTeal;

  // wheels: big at the back, castors at the front
  for (const s of [-1, 1]) {
    const wx = cx + s * 9;
    circ(ctx, wx, ground - 7, 7, '#14181c');
    circ(ctx, wx, ground - 7, 5, shade(steel, -0.3));
    circ(ctx, wx, ground - 7, 2, dark);
    // spokes, so it reads as a wheel and not a hole
    for (let i = 0; i < 6; i++) {
      const a = i * (TAU / 6) + (mode === 'roll' ? 0.4 : 0);
      line(ctx, wx, ground - 7, wx + Math.cos(a) * 4.4, ground - 7 + Math.sin(a) * 4.4, shade(steel, -0.1));
    }
  }
  for (const s of [-1, 1]) {
    circ(ctx, cx + s * 6, ground - 2, 2.4, '#14181c');
    circ(ctx, cx + s * 6, ground - 2, 1.2, shade(steel, -0.2));
  }

  // frame and footplate
  rect(ctx, cx - 10, ground - 14, 20, 3, dark);
  rect(ctx, cx - 7, ground - 11, 14, 2, shade(steel, -0.4));
  rect(ctx, cx - 5, ground - 5, 10, 2, dark);

  // seat and a very high back
  rect(ctx, cx - 9, ground - 22, 18, 8, steel);
  rect(ctx, cx - 9, ground - 22, 18, 1, shade(steel, 0.3));
  rect(ctx, cx - 10, ground - 44, 20, 23, shade(steel, -0.12));
  rect(ctx, cx - 10, ground - 44, 20, 1, shade(steel, 0.28));
  rect(ctx, cx - 10, ground - 44, 1, 23, shade(steel, 0.12));
  rect(ctx, cx + 9, ground - 44, 1, 23, shade(steel, -0.3));

  // the life-support stack bolted to the back of the chair
  rect(ctx, cx - 14, ground - 40, 5, 18, dark);
  for (let i = 0; i < 3; i++) {
    rect(ctx, cx - 13, ground - 38 + i * 6, 3, 3, i === 1 ? P.nestEye : teal);
  }
  // an IV pole with a bag on it, leaning over his shoulder
  rect(ctx, cx + 11, ground - 52, 1, 32, shade(steel, -0.2));
  rect(ctx, cx + 8, ground - 54, 7, 9, '#8ab8a0');
  rect(ctx, cx + 9, ground - 53, 5, 6, '#c8e4d4');
  line(ctx, cx + 11, ground - 45, cx + 6, ground - 34, '#6a8a7a');

  // the man: small, sunken, mostly blanket
  rect(ctx, cx - 8, ground - 26, 16, 8, '#3a4048');           // lap blanket
  rect(ctx, cx - 8, ground - 26, 16, 1, '#4c545e');
  speckle(ctx, cx - 8, ground - 25, 16, 7, '#2c3138', 0.18, 3);
  // torso in a suit that no longer fits
  rect(ctx, cx - 6, ground - 38, 12, 13, '#23272e');
  rect(ctx, cx - 1, ground - 38, 2, 13, '#171a1f');            // the lapel gap
  rect(ctx, cx - 6, ground - 38, 1, 13, '#31363e');
  // hands: long, folded, wrong
  rect(ctx, cx - 5, ground - 27, 4, 2, '#c9bda8');
  rect(ctx, cx + 1, ground - 27, 4, 2, '#c9bda8');

  // head: hairless, hollow, a breathing mask over the lower half
  const hy = ground - 45;
  ell(ctx, cx, hy, 5, 5.6, '#cfc3ad');
  ell(ctx, cx, hy - 2, 4.4, 3.4, '#ded2bc');
  // the sunken sockets are most of the face
  rect(ctx, cx - 4, hy - 1, 3, 2, '#4a4238');
  rect(ctx, cx + 1, hy - 1, 3, 2, '#4a4238');
  px(ctx, cx - 3, hy - 1, P.nestEye);
  px(ctx, cx + 2, hy - 1, P.nestEye);
  // mask and hose
  rect(ctx, cx - 4, hy + 2, 8, 4, shade(steel, -0.1));
  rect(ctx, cx - 3, hy + 3, 6, 2, dark);
  for (let i = 0; i < 6; i++) {
    px(ctx, cx + 4 + i, hy + 4 + (i % 2), shade(steel, -0.28));
  }
  // collar and the company pin
  rect(ctx, cx - 6, ground - 39, 12, 2, '#31363e');
  px(ctx, cx + 4, ground - 38, P.nestTealHi);

  if (mode === 'talk') {
    // the mask lights when he speaks, which is the only movement he makes
    rect(ctx, cx - 2, hy + 3, 4, 2, P.nestTealHi);
  }
}

// --- vents ------------------------------------------------------------------

function drawVentGrille(ctx, rng, open) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  rect(ctx, 0, 0, W, H, shade(P.nestSteelDk, -0.2));
  frameRect(ctx, 0, 0, W, H, shade(P.nestSteel, -0.1));
  if (open) {
    // a black hole with the duct receding into it
    rect(ctx, 2, 2, W - 4, H - 4, '#080b0d');
    rect(ctx, 4, H - 6, W - 8, 2, '#141a1e');
    rect(ctx, 5, 4, W - 10, 1, '#1a2226');
    // the grille itself, hanging off one corner
    rect(ctx, W - 5, H - 3, 6, 2, shade(P.nestSteel, -0.3));
  } else {
    for (let i = 2; i < H - 2; i += 3) {
      rect(ctx, 2, i, W - 4, 2, shade(P.nestSteel, -0.34));
      rect(ctx, 2, i, W - 4, 1, shade(P.nestSteel, 0.06));
    }
    for (const x of [3, W - 4]) px(ctx, x, 2, shade(P.nestSteel, 0.3));
  }
}

// --- more of the building ---------------------------------------------------

function drawGurney(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  rect(ctx, 2, H - 8, 2, 7, P.nestSteelDk);
  rect(ctx, W - 4, H - 8, 2, 7, P.nestSteelDk);
  circ(ctx, 3, H - 2, 1.6, '#14181c');
  circ(ctx, W - 3, H - 2, 1.6, '#14181c');
  panelPlate(ctx, 0, H - 14, W, 6, P.nestSteel);
  rect(ctx, 1, H - 16, W - 2, 3, '#5c6470');       // a mattress nobody washed
  speckle(ctx, 1, H - 16, W - 2, 3, '#6d2320', 0.1, 9);
  // restraint straps, buckled and empty
  for (const x of [4, W - 8]) {
    rect(ctx, x, H - 17, 3, 5, '#3a352c');
    px(ctx, x + 1, H - 15, '#8a8070');
  }
}

function drawIVStand(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2;
  rect(ctx, cx, 4, 1, H - 6, shade(P.nestSteel, -0.2));
  for (const s of [-1, 1]) line(ctx, cx, H - 2, cx + s * 4, H - 1, shade(P.nestSteel, -0.35));
  rect(ctx, cx - 4, 2, 8, 9, '#8ab8a0');
  rect(ctx, cx - 3, 3, 6, 6, '#c8e4d4');
  rect(ctx, cx - 3, 7, 6, 2, '#9ccdb6');
  line(ctx, cx, 11, cx - 2, 20, '#6a8a7a');
}

function drawJar(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  rect(ctx, 2, H - 3, W - 4, 3, shade(P.nestSteelDk, -0.1));
  rect(ctx, 1, 3, W - 2, H - 6, 'rgba(150,200,205,0.30)');
  frameRect(ctx, 1, 3, W - 2, H - 6, '#7fb4bb');
  rect(ctx, 2, H - 9, W - 4, 6, 'rgba(120,170,150,0.55)');
  // whatever is in it is small and curled and you do not look twice
  ell(ctx, W / 2, H - 6, 2.6, 2, '#b8a888');
  ell(ctx, W / 2 + 1, H - 7, 1.4, 1.2, '#c9bda0');
  rect(ctx, 0, 1, W, 3, shade(P.nestSteel, -0.15));
  rect(ctx, 2, 0, W - 4, 2, shade(P.nestSteel, 0.12));
}

function drawTerminal(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  panelPlate(ctx, 0, H - 12, W, 12, P.nestSteelDk);
  rect(ctx, 2, 2, W - 4, H - 15, '#0d1418');
  frameRect(ctx, 2, 2, W - 4, H - 15, shade(P.nestSteel, -0.2));
  // lines of text nobody was ever meant to read
  for (let i = 0; i < 5; i++) {
    const w = 4 + Math.floor(rng() * (W - 12));
    rect(ctx, 4, 4 + i * 3, w, 1, i === 2 ? P.nestEye : P.nestTealHi);
  }
  rect(ctx, 4, H - 9, 3, 2, P.nestTealHi);
  rect(ctx, W - 8, H - 9, 4, 2, shade(P.nestSteel, -0.3));
}

function drawPipes(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  for (let i = 0; i < 3; i++) {
    const y = 2 + i * 5;
    rect(ctx, 0, y, W, 3, i === 1 ? '#5a6068' : shade(P.nestSteel, -0.24));
    rect(ctx, 0, y, W, 1, shade(P.nestSteel, 0.1));
    // couplings
    for (let x = 3; x < W; x += 11) rect(ctx, x, y - 1, 3, 5, shade(P.nestSteel, -0.36));
  }
  // a slow leak, because nothing in this building is maintained
  px(ctx, Math.floor(W * 0.6), H - 2, P.nestTealHi);
}

function drawFloorDrain(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  ell(ctx, W / 2, H / 2, W / 2 - 1, H / 2 - 1, shade(P.nestSteelDk, -0.3));
  ell(ctx, W / 2, H / 2, W / 2 - 2, H / 2 - 2, '#0a0d0f');
  for (let i = -2; i <= 2; i++) rect(ctx, W / 2 + i * 2 - 1, 2, 1, H - 4, shade(P.nestSteel, -0.15));
  rect(ctx, 1, H / 2 - 1, W - 2, 1, '#3a2020');
}

function drawIncinerator(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  panelPlate(ctx, 0, 4, W, H - 4, shade(P.nestSteel, -0.2));
  rect(ctx, 3, H - 16, W - 6, 11, '#0d0a08');
  frameRect(ctx, 3, H - 16, W - 6, 11, shade(P.nestSteel, -0.4));
  // the fire behind the hatch
  for (let i = 0; i < 8; i++) {
    const x = 5 + Math.floor(rng() * (W - 10)), y = H - 8 + Math.floor(rng() * 4);
    px(ctx, x, y, i % 3 === 0 ? P.fire1 : P.fire2);
  }
  rect(ctx, W / 2 - 5, 0, 10, 5, shade(P.nestSteelDk, -0.1));
  rect(ctx, 2, H - 20, W - 4, 2, shade(P.nestSteel, -0.35));
}

function drawSign(ctx, rng, kind) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  rect(ctx, 0, 0, W, H, kind === 'hazard' ? '#c8a72e' : P.nestTeal);
  frameRect(ctx, 0, 0, W, H, shade(kind === 'hazard' ? '#c8a72e' : P.nestTeal, -0.4));
  if (kind === 'hazard') {
    // biohazard, roughly: three arcs round a dot
    circ(ctx, W / 2, H / 2, 2, '#1a1610');
    for (let i = 0; i < 3; i++) {
      const a = i * (TAU / 3) - 1.6;
      circ(ctx, W / 2 + Math.cos(a) * 4, H / 2 + Math.sin(a) * 4, 2.4, '#1a1610');
      circ(ctx, W / 2 + Math.cos(a) * 4, H / 2 + Math.sin(a) * 4, 1.2, '#c8a72e');
    }
  } else {
    // an arrow, pointing somewhere you are not allowed to go
    tri(ctx, W - 4, H / 2, W - 10, H / 2 - 4, W - 10, H / 2 + 4, '#dff2f5');
    rect(ctx, 4, H / 2 - 1, W - 12, 3, '#dff2f5');
  }
}

function drawMopBucket(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  rect(ctx, 2, H - 8, W - 4, 8, '#c8a72e');
  rect(ctx, 2, H - 8, W - 4, 1, '#e2c04a');
  rect(ctx, 3, H - 7, W - 6, 3, '#6d5c3a');
  rect(ctx, W - 6, 0, 1, H - 8, '#8a8070');
  rect(ctx, W - 9, 0, 7, 2, '#9a9284');
}

function drawSpecShelf(ctx, rng) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  panelPlate(ctx, 0, 0, W, H, shade(P.nestSteel, -0.24));
  for (let row = 0; row < 3; row++) {
    const y = 3 + row * 8;
    rect(ctx, 1, y + 6, W - 2, 1, shade(P.nestSteel, -0.4));
    for (let i = 0; i < 4; i++) {
      const x = 3 + i * 6;
      rect(ctx, x, y, 4, 6, 'rgba(150,200,205,0.35)');
      rect(ctx, x, y + 2, 4, 4, 'rgba(120,170,150,0.5)');
      px(ctx, x + 1, y + 4, '#b8a888');
      rect(ctx, x, y - 1, 4, 1, shade(P.nestSteel, -0.1));
    }
  }
}

/**
 * A card reader beside a door.
 *
 * The single most institutional object in the building: a beige box with one
 * light on it that decides whether you are allowed to be where you are. Red
 * until somebody with the right plastic waves at it.
 */
function drawCardDoor(ctx, rng, open) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  // the frame
  rect(ctx, 0, 0, W, H, P.nestSteelDk);
  panelPlate(ctx, 1, 1, W - 2, H - 2, P.nestSteel);
  if (open) {
    // both leaves retracted into the jambs
    rect(ctx, 3, 2, 4, H - 4, P.nestSteelDk);
    rect(ctx, W - 7, 2, 4, H - 4, P.nestSteelDk);
    rect(ctx, 7, 3, W - 14, H - 6, '#0b1114');
    speckle(ctx, 8, 4, W - 16, H - 8, '#16232a', 0.25, 3);
  } else {
    // two leaves meeting in the middle, with the seam and the hazard chevrons
    rect(ctx, 3, 2, W - 6, H - 4, P.nestSteelHi);
    rect(ctx, W / 2 - 1, 2, 2, H - 4, P.nestSteelDk);
    for (let i = 0; i < 3; i++) {
      const y = 4 + i * 5;
      rect(ctx, 5, y, 5, 2, '#c8a02e');
      rect(ctx, W - 10, y, 5, 2, '#c8a02e');
    }
    rect(ctx, 3, H - 6, W - 6, 1, P.nestSteelDk);
  }
  // the reader on the jamb, and its light
  rect(ctx, W - 5, H - 14, 4, 8, '#cfc9b4');
  rect(ctx, W - 5, H - 14, 4, 1, '#e8e2cc');
  px(ctx, W - 3, H - 12, open ? '#5ad86a' : '#e0685a');
  px(ctx, W - 3, H - 10, '#3a3a34');
}

      out.push(ctx.canvas);
    }
