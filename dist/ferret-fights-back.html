 * The Les Nest mark: an empty nest holding one cracked egg and one dead bird.
 * A company logo that tells you exactly what it does, if you look at it.
 */
function drawNestLogo(ctx, cx, cy, scale = 1, opts = {}) {
  const s = scale;
  const twig = opts.twig || P.nestDark;
  const twigHi = opts.twigHi || P.nestTeal;
  // nest bowl
  ell(ctx, cx, cy + 2 * s, 9 * s, 4.4 * s, twig);
  ell(ctx, cx, cy + 1 * s, 7.4 * s, 3.4 * s, shade(twig, -0.28));
  for (let i = 0; i < 9; i++) {
    const a = Math.PI + (i / 8) * Math.PI;
    line(ctx, cx + Math.cos(a) * 9 * s, cy + 2 * s + Math.sin(a) * 4 * s,
      cx + Math.cos(a) * 6 * s, cy + 2.6 * s + Math.sin(a) * 1.6 * s, i % 2 ? twigHi : twig);
  }
  // cracked egg
  const ex = cx - 3.2 * s, ey = cy + 0.4 * s;
  ell(ctx, ex, ey, 3 * s, 3.6 * s, opts.egg || P.eggShell);
  line(ctx, ex - 2 * s, ey - 1 * s, ex, ey + 0.4 * s, P.eggCrack);
  line(ctx, ex, ey + 0.4 * s, ex + 1.4 * s, ey - 1.4 * s, P.eggCrack);
  line(ctx, ex, ey + 0.4 * s, ex + 0.6 * s, ey + 2.4 * s, P.eggCrack);
  // dead bird: on its back, legs up
  const bx = cx + 3.6 * s, by = cy + 0.8 * s;
  ell(ctx, bx, by, 3.2 * s, 2.2 * s, opts.bird || P.deadBird);
  ell(ctx, bx - 2.6 * s, by - 0.6 * s, 1.5 * s, 1.4 * s, shade(opts.bird || P.deadBird, 0.12));
  tri(ctx, bx - 3.6 * s, by - 1.1 * s, bx - 3.6 * s, by - 0.1 * s, bx - 5.4 * s, by - 0.6 * s, P.nestSteel);
  // the crossed-out eye
  line(ctx, bx - 3.2 * s, by - 1.2 * s, bx - 2 * s, by, P.nestSteelHi);
  line(ctx, bx - 2 * s, by - 1.2 * s, bx - 3.2 * s, by, P.nestSteelHi);
  // stiff legs
  line(ctx, bx + 0.6 * s, by - 1.6 * s, bx + 0.2 * s, by - 4 * s, P.nestSteel);
  line(ctx, bx + 1.8 * s, by - 1.6 * s, bx + 2.4 * s, by - 4 * s, P.nestSteel);
  line(ctx, bx + 0.2 * s, by - 4 * s, bx - 0.8 * s, by - 4.6 * s, P.nestSteel);
  line(ctx, bx + 2.4 * s, by - 4 * s, bx + 3.4 * s, by - 4.6 * s, P.nestSteel);
  // one limp wing hanging over the rim
  taper(ctx, bx + 1 * s, by + 0.6 * s, bx + 4.4 * s, by + 3.4 * s, 1.4 * s, 0.6 * s, shade(opts.bird || P.deadBird, -0.2));
}

function nestLogoSprite(size = 1) {
  return getSheet(`logo:nest:${size}`, () => {
    const w = Math.ceil(30 * size), h = Math.ceil(24 * size);
    const ctx = surface(w, h);
    drawNestLogo(ctx, w / 2, h / 2 + 2 * size, size);
    outline(ctx, P.black);
    return [ctx.canvas];
  })[0];
}

// --- machine parts ---------------------------------------------------------

function panel(ctx, x, y, w, h, base = P.nestSteel) {
  rect(ctx, x, y, w, h, base);
  rect(ctx, x, y, w, 1, shade(base, 0.22));
  rect(ctx, x, y + h - 1, w, 1, shade(base, -0.3));
  rect(ctx, x, y, 1, h, shade(base, 0.1));
  rect(ctx, x + w - 1, y, 1, h, shade(base, -0.24));
}

function optic(ctx, x, y, r, color = P.nestEye) {
  circ(ctx, x, y, r + 1, P.nestSteelDk);
  circ(ctx, x, y, r, color);
  circ(ctx, x, y, Math.max(0.6, r * 0.45), '#ffffff');
}

function vent(ctx, x, y, w, n = 3) {
  for (let i = 0; i < n; i++) rect(ctx, x, y + i * 2, w, 1, P.nestSteelDk);
}

// --- machines --------------------------------------------------------------

function drawDrone(ctx, t, hostile = true) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, cy = H / 2 + Math.sin(t * TAU) * 1.4;
  const spin = (t * 4) % 1;
  // rotors: two blur ellipses whose width oscillates, reading as fast spin
  for (const side of [-1, 1]) {
    const rx = cx + side * 8;
    const bw = 5 + Math.abs(Math.cos(spin * TAU)) * 2.5;
    ell(ctx, rx, cy - 5, bw, 1.1, 'rgba(180,200,210,0.55)');
    rect(ctx, rx - 0.5, cy - 5, 1, 4, P.nestSteelDk);
  }
  panel(ctx, cx - 6, cy - 3, 12, 7, hostile ? P.nestDark : P.nestSteel);
  panel(ctx, cx - 9, cy - 2, 4, 3, P.nestSteelDk);
  panel(ctx, cx + 5, cy - 2, 4, 3, P.nestSteelDk);
  optic(ctx, cx, cy + 0.5, 1.8, hostile ? P.nestEye : P.cyber);
  vent(ctx, cx - 4, cy + 2, 8, 1);
  // underslung barrel
  rect(ctx, cx - 1, cy + 4, 2, 3, P.nestSteelDk);
  // rim light so it pops against dark forest
  rect(ctx, cx - 6, cy - 3, 12, 1, P.nestTealHi);
}

function drawSpiderMech(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const bob = Math.sin(t * TAU * 2) * 1.2;
  const bodyY = base - 13 + bob;
  // six legs, alternating tripod gait
  for (let i = 0; i < 6; i++) {
    const side = i < 3 ? -1 : 1;
    const idx = i % 3;
    const phase = ((i + (idx % 2)) % 2) ? t : (t + 0.5) % 1;
    const lift = Math.max(0, Math.sin(phase * TAU)) * 4;
    const reach = Math.cos(phase * TAU) * 3;
    const hipX = cx + side * 5, hipY = bodyY + 2 + idx * 1.4;
    const kneeX = cx + side * (11 + idx * 1.5), kneeY = bodyY - 3 - idx;
    const footX = cx + side * (14 + idx * 2.5) + reach, footY = base - 1 - lift - idx * 0.6;
    taper(ctx, hipX, hipY, kneeX, kneeY, 1.6, 1.2, P.nestSteelDk);
    taper(ctx, kneeX, kneeY, footX, footY, 1.2, 0.7, P.nestSteel);
    circ(ctx, kneeX, kneeY, 1.6, P.nestSteel);
  }
  // chassis
  panel(ctx, cx - 9, bodyY - 4, 18, 9, P.nestDark);
  panel(ctx, cx - 6, bodyY - 7, 12, 4, P.nestSteelDk);
  rect(ctx, cx - 9, bodyY - 4, 18, 1, P.nestTeal);
  // saw arms
  for (const side of [-1, 1]) {
    const sx = cx + side * 11, sy = bodyY - 1;
    rect(ctx, cx + side * 8, bodyY - 2, 4, 2, P.nestSteel);
    circ(ctx, sx, sy, 4, P.nestSteelHi);
    circ(ctx, sx, sy, 2.4, P.nestSteelDk);
    for (let k = 0; k < 8; k++) {
      const a = (k / 8) * TAU + t * TAU * 3 * side;
      px(ctx, Math.round(sx + Math.cos(a) * 4.4), Math.round(sy + Math.sin(a) * 4.4), P.nestSteelHi);
    }
  }
  optic(ctx, cx, bodyY - 0.5, 2.4);
  // little chip port on the back — where you rip the upgrade out
  rect(ctx, cx - 2, bodyY - 7, 4, 2, P.cyberDim);
  px(ctx, cx, bodyY - 6, P.cyber);
}

function drawTurretWalker(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const step = Math.sin(t * TAU);
  // two heavy legs
  for (const side of [-1, 1]) {
    const ph = side > 0 ? step : -step;
    const footY = base - 1 - Math.max(0, ph) * 3;
    taper(ctx, cx + side * 3, base - 12, cx + side * 6, base - 6, 2.4, 2, P.nestSteelDk);
    taper(ctx, cx + side * 6, base - 6, cx + side * 5 + ph * 2, footY, 2, 1.6, P.nestSteel);
    rect(ctx, cx + side * 5 + ph * 2 - 3, footY - 1, 6, 2, P.nestSteelDk);
  }
  // hip block + rotating dome
  panel(ctx, cx - 7, base - 16, 14, 6, P.nestDark);
  ell(ctx, cx, base - 17, 8, 5, P.nestSteel);
  ell(ctx, cx, base - 18, 6, 3.6, P.nestSteelHi);
  const a = t * TAU;
  // three barrels around the dome
  for (let i = 0; i < 3; i++) {
    const ang = a + (i / 3) * TAU;
    const bx = cx + Math.cos(ang) * 9, by = base - 17 + Math.sin(ang) * 5;
    capsule(ctx, cx + Math.cos(ang) * 4, base - 17 + Math.sin(ang) * 2.6, bx, by, 1.4, P.nestSteelDk);
    px(ctx, Math.round(bx), Math.round(by), P.nestEye);
  }
  optic(ctx, cx, base - 17.5, 2);
  rect(ctx, cx - 2, base - 13, 4, 2, P.cyberDim);
}

function drawHarvester(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  // treads with scrolling cleats
  for (const side of [-1, 1]) {
    const tx = cx + side * 13;
    panel(ctx, tx - 5, base - 9, 10, 9, P.nestSteelDk);
    for (let i = 0; i < 5; i++) {
      const y = base - 9 + ((i * 2 + Math.floor(t * 8)) % 9);
      rect(ctx, tx - 5, y, 10, 1, P.nestSteel);
    }
    circ(ctx, tx, base - 7, 2.4, P.nestSteel);
    circ(ctx, tx, base - 2, 2.4, P.nestSteel);
  }
  // hull
  panel(ctx, cx - 14, base - 18, 28, 12, P.nestDark);
  rect(ctx, cx - 14, base - 18, 28, 1, P.nestTeal);
  vent(ctx, cx - 11, base - 15, 8, 3);
  drawNestLogo(ctx, cx + 5, base - 12, 0.55);
  // cutting head on a boom
  const swing = Math.sin(t * TAU) * 2;
  rect(ctx, cx - 6, base - 21 + swing, 12, 3, P.nestSteelDk);
  rect(ctx, cx - 10, base - 22 + swing, 6, 5, P.nestSteel);
  for (let i = 0; i < 5; i++) tri(ctx, cx - 12, base - 21 + i * 1.1 + swing, cx - 10, base - 22 + i * 1.1 + swing, cx - 10, base - 20 + i * 1.1 + swing, P.nestSteelHi);
  optic(ctx, cx + 8, base - 20 + swing * 0.5, 2.2);
  // exhaust stacks
  rect(ctx, cx + 2, base - 24, 2, 6, P.nestSteelDk);
  rect(ctx, cx + 6, base - 23, 2, 5, P.nestSteelDk);
  rect(ctx, cx - 3, base - 10, 5, 2, P.cyberDim);
}

function drawFirebomber(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, cy = H / 2 + Math.sin(t * TAU) * 1.8;
  // delta-wing body
  tri(ctx, cx - 12, cy + 4, cx + 12, cy + 4, cx, cy - 7, P.nestDark);
  tri(ctx, cx - 8, cy + 3, cx + 8, cy + 3, cx, cy - 4, P.nestSteelDk);
  panel(ctx, cx - 4, cy - 3, 8, 7, P.nestSteel);
  optic(ctx, cx, cy - 0.5, 2, P.fire3);
  // burning fuel pods
  for (const side of [-1, 1]) {
    const px1 = cx + side * 8;
    ell(ctx, px1, cy + 2, 2.4, 3.4, P.nestSteelDk);
    ell(ctx, px1, cy + 3.4, 1.6, 1.6, P.fire2);
    px(ctx, Math.round(px1), Math.round(cy + 3.4), P.fire1);
  }
  // thruster flare
  const flare = 3 + Math.abs(Math.sin(t * TAU * 3)) * 3;
  ell(ctx, cx, cy + 5 + flare * 0.4, 2.4, flare, P.fire3);
  ell(ctx, cx, cy + 4 + flare * 0.3, 1.4, flare * 0.6, P.fire1);
}

function drawSawTrap(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, cy = H / 2;
  circ(ctx, cx, cy, 6, P.nestSteel);
  circ(ctx, cx, cy, 3, P.nestSteelDk);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * TAU + t * TAU;
    tri(ctx, cx + Math.cos(a) * 6, cy + Math.sin(a) * 6,
      cx + Math.cos(a + 0.25) * 6, cy + Math.sin(a + 0.25) * 6,
      cx + Math.cos(a + 0.12) * 9, cy + Math.sin(a + 0.12) * 9, P.nestSteelHi);
  }
  optic(ctx, cx, cy, 1.4);
}

function drawDropPod(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  panel(ctx, cx - 8, base - 18, 16, 18, P.nestDark);
  rect(ctx, cx - 8, base - 18, 16, 2, P.nestTeal);
  rect(ctx, cx - 8, base - 8, 16, 1, P.nestTealHi);
  drawNestLogo(ctx, cx, base - 12, 0.55);
  for (const side of [-1, 1]) {
    taper(ctx, cx + side * 7, base - 6, cx + side * 11, base - 1, 2, 1.4, P.nestSteelDk);
  }
  const glow = 1 + Math.abs(Math.sin(t * TAU)) * 2;
  ell(ctx, cx, base - 1, 8, glow, P.fire2);
}

/**
 * MOTHER NEST — the final Les Nest machine. It is literally the logo, built at
 * industrial scale: a steel nest cradling a cracked reactor-egg, with the
 * dead-bird figurehead bolted to the front as a trophy.
 */
function drawMotherNest(ctx, t, phase = 0) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const bob = Math.sin(t * TAU) * 2;
  const bodyY = base - 34 + bob;

  // eight anchoring legs
  for (let i = 0; i < 8; i++) {
    const side = i < 4 ? -1 : 1;
    const k = i % 4;
    const ph = (t + k * 0.25) % 1;
    const lift = Math.max(0, Math.sin(ph * TAU)) * 3;
    const hipX = cx + side * (8 + k * 2), hipY = bodyY + 12;
    const kneeX = cx + side * (20 + k * 4), kneeY = bodyY + 4 + k * 2;
    const footX = cx + side * (26 + k * 6), footY = base - 1 - lift;
    taper(ctx, hipX, hipY, kneeX, kneeY, 3, 2, P.nestSteelDk);
    taper(ctx, kneeX, kneeY, footX, footY, 2, 1.2, P.nestSteel);
    circ(ctx, kneeX, kneeY, 2.6, P.nestSteel);
  }

  // the woven steel nest
  ell(ctx, cx, bodyY + 8, 32, 14, P.nestDark);
  for (let i = 0; i < 22; i++) {
    const a = Math.PI + (i / 21) * Math.PI;
    line(ctx, cx + Math.cos(a) * 32, bodyY + 8 + Math.sin(a) * 13,
      cx + Math.cos(a) * 22, bodyY + 11 + Math.sin(a) * 5, i % 2 ? P.nestTeal : P.nestSteelDk);
  }
  ell(ctx, cx, bodyY + 5, 26, 10, shade(P.nestDark, -0.3));

  // reactor egg with a widening crack that leaks light
  const eggPulse = 1 + Math.sin(t * TAU * 2) * 0.06;
  ell(ctx, cx, bodyY - 4, 15 * eggPulse, 19 * eggPulse, P.eggShell);
  ell(ctx, cx - 4, bodyY - 9, 7, 8, shade(P.eggShell, 0.12));
  const crackCol = phase >= 2 ? P.fire1 : phase >= 1 ? P.fire2 : P.nestEye;
  line(ctx, cx - 10, bodyY - 12, cx - 2, bodyY - 3, crackCol);
  line(ctx, cx - 2, bodyY - 3, cx + 6, bodyY - 11, crackCol);
  line(ctx, cx - 2, bodyY - 3, cx + 1, bodyY + 8, crackCol);
  line(ctx, cx + 1, bodyY + 2, cx + 8, bodyY + 4, crackCol);
  if (phase >= 1) {
    line(ctx, cx - 6, bodyY - 8, cx - 11, bodyY - 2, crackCol);
    line(ctx, cx + 4, bodyY - 6, cx + 11, bodyY - 1, crackCol);
  }
  // core optic inside the crack
  optic(ctx, cx, bodyY - 3, 3.4, crackCol);

  // dead-bird figurehead, wired to the front of the hull
  const bx = cx, by = bodyY + 16;
  ell(ctx, bx, by, 9, 5, P.deadBird);
  ell(ctx, bx - 8, by - 1.4, 4, 3.4, shade(P.deadBird, 0.12));
  tri(ctx, bx - 11, by - 2.4, bx - 11, by - 0.4, bx - 16, by - 1.4, P.nestSteel);
  line(ctx, bx - 10, by - 3, bx - 6, by + 0.4, P.nestSteelHi);
  line(ctx, bx - 6, by - 3, bx - 10, by + 0.4, P.nestSteelHi);
  for (const s of [-1, 1]) taper(ctx, bx + s * 4, by + 2, bx + s * 12, by + 7, 3, 1, shade(P.deadBird, -0.2));

  // shoulder cannons
  for (const side of [-1, 1]) {
    const sx = cx + side * 24, sy = bodyY - 6;
    panel(ctx, sx - 5, sy - 4, 10, 9, P.nestSteelDk);
    capsule(ctx, sx, sy + 2, sx + side * 9, sy + 5, 2, P.nestSteel);
    optic(ctx, sx, sy - 1, 1.6);
  }
  // chip ports light up as it takes damage
  for (let i = -1; i <= 1; i++) {
    rect(ctx, cx + i * 8 - 2, bodyY + 12, 4, 2, phase >= 1 ? P.cyber : P.cyberDim);
  }
}

function drawRipsawPrime(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 1;
  const bob = Math.sin(t * TAU * 2) * 1.6;
  const bodyY = base - 22 + bob;
  for (let i = 0; i < 8; i++) {
    const side = i < 4 ? -1 : 1;
    const k = i % 4;
    const ph = ((i + k) % 2) ? t : (t + 0.5) % 1;
    const lift = Math.max(0, Math.sin(ph * TAU)) * 4;
    const hipX = cx + side * 7, hipY = bodyY + 5 + k;
    const kneeX = cx + side * (15 + k * 2), kneeY = bodyY - 2 - k * 1.5;
    const footX = cx + side * (20 + k * 3.5), footY = base - 1 - lift;
    taper(ctx, hipX, hipY, kneeX, kneeY, 2, 1.4, P.nestSteelDk);
    taper(ctx, kneeX, kneeY, footX, footY, 1.4, 0.8, P.nestSteel);
  }
  panel(ctx, cx - 14, bodyY - 6, 28, 14, P.nestDark);
  rect(ctx, cx - 14, bodyY - 6, 28, 2, P.nestTeal);
  drawNestLogo(ctx, cx, bodyY + 1, 0.7);
  for (const side of [-1, 1]) {
    const sx = cx + side * 18, sy = bodyY - 2;
    circ(ctx, sx, sy, 7, P.nestSteelHi);
    circ(ctx, sx, sy, 4, P.nestSteelDk);
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * TAU + t * TAU * 4 * side;
      tri(ctx, sx + Math.cos(a) * 7, sy + Math.sin(a) * 7,
        sx + Math.cos(a + 0.2) * 7, sy + Math.sin(a + 0.2) * 7,
        sx + Math.cos(a + 0.1) * 10, sy + Math.sin(a + 0.1) * 10, P.nestSteelHi);
    }
  }
  optic(ctx, cx, bodyY - 9, 3.4);
  panel(ctx, cx - 5, bodyY - 13, 10, 5, P.nestSteelDk);
}

function drawKiln(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, cy = H / 2 + Math.sin(t * TAU) * 2.4;
  // a bloated airborne incinerator
  ell(ctx, cx, cy, 22, 14, P.nestSteelDk);
  ell(ctx, cx, cy - 3, 19, 9, P.nestSteel);
  rect(ctx, cx - 22, cy, 44, 2, P.nestDark);
  for (let i = -3; i <= 3; i++) {
    const gx = cx + i * 6;
    rect(ctx, gx - 2, cy + 4, 4, 5, P.nestSteelDk);
    const f = 2 + Math.abs(Math.sin(t * TAU * 2 + i)) * 3;
    ell(ctx, gx, cy + 9 + f * 0.4, 2, f, i % 2 ? P.fire2 : P.fire3);
    px(ctx, Math.round(gx), Math.round(cy + 9), P.fire1);
  }
  for (const side of [-1, 1]) {
    const rx = cx + side * 24;
    const bw = 6 + Math.abs(Math.cos(t * TAU * 4)) * 3;
    ell(ctx, rx, cy - 8, bw, 1.4, 'rgba(180,200,210,0.5)');
    rect(ctx, rx - 1, cy - 8, 2, 7, P.nestSteelDk);
  }
  drawNestLogo(ctx, cx, cy - 2, 0.8, { bird: '#2a2a2e' });
  optic(ctx, cx - 12, cy - 4, 2.4, P.fire3);
  optic(ctx, cx + 12, cy - 4, 2.4, P.fire3);
}

const MACHINES = {

  spider:       { w: 44, h: 30, frames: 8, fn: drawSpiderMech },

function machineFrames(kind, variant = 0) {
  const spec = MACHINES[kind] || MACHINES.drone;
  return getSheet(`machine:${kind}:${variant}`, () => {

      outline(ctx, P.black);

// ==========================================================================
// src/art/outpost.js
// ==========================================================================
// Les Nest, on the ground.
//
// An outpost has to read from a long way off — you should be able to top a
// rise, see a shape against the trees, and know what it is and roughly how
// much trouble it will be, before anything has shot at you. So each core is
// built around one hard, unnatural silhouette: nothing in this basin grows in
// straight vertical lines except the things they put here.
//
// They are also all obviously *cheap*. Corrugated sheet, welded angle iron,
// yellow paint over rust. This is a company that will be somewhere else next
// quarter and does not care what it leaves behind.

// bundled: import { surface, rect, frameRect, ell, circ, line, taper, t
// bundled: import { P } from './palette.js';
// bundled: import { drawNestLogo } from './machines.js';
// bundled: import { hash2 } from '../engine/rng.js';

const STEEL = '#5a5f63';
const STEEL_D = '#3a3e42';
const STEEL_L = '#7c8288';
const RUST = '#7a4526';
const PAINT = '#c8a02e';
const PAINT_D = '#8a6c18';
const DARK = '#1a1c1e';

/** Corrugation: the vertical ribbing that says "sheet metal" in nine pixels. */
function ribbed(ctx, x, y, w, h, base, lit) {
  rect(ctx, x, y, w, h, base);
  for (let i = 0; i < w; i += 3) rect(ctx, x + i, y, 1, h, lit);
  rect(ctx, x, y, w, 1, lit);
  rect(ctx, x, y + h - 1, w, 1, shade(base, -0.25));
}

function drawMast(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 2;
  // guy wires first, so the tower sits in front of them
  line(ctx, cx - 1, base - 46, 5, base - 2, '#3d4247');
  line(ctx, cx + 1, base - 46, W - 6, base - 2, '#3d4247');
  // the lattice: two legs and a ladder of cross-braces, narrowing as it goes
  for (let i = 0; i < 24; i++) {
    const y = base - i * 2;
    const spread = 7 - (i / 24) * 5;
    rect(ctx, Math.round(cx - spread), y, 1, 2, STEEL);
    rect(ctx, Math.round(cx + spread), y, 1, 2, STEEL_L);
    if (i % 2 === 0) line(ctx, cx - spread, y, cx + spread, y - 2, STEEL_D);
  }
  // the dish, and the light that tells you it is awake
  ell(ctx, cx + 3, base - 44, 4, 5, STEEL_L);
  ell(ctx, cx + 4, base - 44, 2.4, 3.4, STEEL_D);
  rect(ctx, cx - 1, base - 50, 2, 5, STEEL);
  const blink = t < 0.5;
  circ(ctx, cx, base - 51, 1.6, blink ? '#e8503a' : '#5a2018');
  // a shed at the foot with the logo on it
  ribbed(ctx, cx - 11, base - 12, 22, 12, STEEL, STEEL_L);
  rect(ctx, cx - 11, base - 12, 22, 1, PAINT);
  rect(ctx, cx - 4, base - 8, 8, 8, DARK);
  drawNestLogo(ctx, cx + 7, base - 7, 0.42);
  speckle(ctx, cx - 11, base - 6, 22, 6, RUST, 0.14, 3);
}

function drawTank(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 2;
  // a stack of drums on a pallet, one of them leaking
  const rows = [[-14, 0], [-7, 0], [0, 0], [7, 0], [-10, -11], [-3, -11], [4, -11], [-6, -22]];
  rect(ctx, cx - 18, base - 2, 36, 3, '#4a3a28');
  for (const [dx, dy] of rows) {
    const x = cx + dx, y = base - 12 + dy;
    rect(ctx, x, y, 7, 12, PAINT_D);
    rect(ctx, x + 1, y, 3, 12, PAINT);
    rect(ctx, x, y, 7, 1, shade(PAINT, 0.2));
    rect(ctx, x, y + 4, 7, 1, shade(PAINT_D, -0.3));
    rect(ctx, x, y + 8, 7, 1, shade(PAINT_D, -0.3));
    if ((dx + dy) % 3 === 0) speckle(ctx, x, y + 2, 7, 9, RUST, 0.3, dx + 7);
  }
  // the puddle, and the shimmer over it
  ell(ctx, cx - 2, base + 1, 12, 3, '#2e2a1a');
  ell(ctx, cx - 4, base + 1, 6, 2, '#4a4426');
  if (t > 0.5) px(ctx, Math.round(cx + 4), Math.round(base - 1), '#6b6438');
}

function drawCages(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 2;
  // a bank of four, stacked two by two, bars drawn one pixel apart
  const put = (x, y, w, h, occupied) => {
    rect(ctx, x, y, w, h, '#2a2a2c');
    for (let i = 1; i < w; i += 2) rect(ctx, x + i, y, 1, h, STEEL_L);
    frameRect(ctx, x, y, w, h, STEEL);
    if (occupied) {
      // something in there, and two eyes
      ell(ctx, x + w / 2, y + h - 3, w * 0.3, 2.2, '#4a3a28');
      px(ctx, Math.round(x + w / 2 - 2), Math.round(y + h - 5), '#c8c8a0');
      px(ctx, Math.round(x + w / 2 + 1), Math.round(y + h - 5), '#c8c8a0');
    }
  };
  put(cx - 15, base - 12, 14, 12, true);
  put(cx + 1, base - 12, 14, 12, t < 0.5);
  put(cx - 15, base - 23, 14, 11, false);
  put(cx + 1, base - 23, 14, 11, true);
  rect(ctx, cx - 17, base - 1, 34, 2, '#4a3a28');
  drawNestLogo(ctx, cx, base - 26, 0.36);
}

function drawSaw(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 2;
  // a gantry over a bed, with a blade you can see turning
  rect(ctx, cx - 18, base - 6, 36, 6, '#4a3a28');
  for (let i = 0; i < 6; i++) rect(ctx, cx - 16 + i * 6, base - 7, 4, 2, '#6b5335');
  ribbed(ctx, cx - 20, base - 26, 6, 20, STEEL, STEEL_L);
  ribbed(ctx, cx + 14, base - 26, 6, 20, STEEL, STEEL_L);
  rect(ctx, cx - 20, base - 28, 40, 4, STEEL_D);
  rect(ctx, cx - 20, base - 28, 40, 1, PAINT);
  const a = t * Math.PI;
  for (let i = 0; i < 8; i++) {
    const th = a + (i / 8) * Math.PI * 2;
    px(ctx, Math.round(cx + Math.cos(th) * 8), Math.round(base - 15 + Math.sin(th) * 8), '#c8ccd0');
  }
  circ(ctx, cx, base - 15, 7.5, '#8a9096');
  circ(ctx, cx, base - 15, 5.5, STEEL_D);
  circ(ctx, cx, base - 15, 1.6, PAINT);
  speckle(ctx, cx - 14, base - 10, 28, 8, '#8a7a4a', 0.16, 5);   // sawdust
}

function drawTurretCore(ctx, t) {
  const W = ctx.canvas.width, H = ctx.canvas.height;
  const cx = W / 2, base = H - 2;
  // sandbags, a pintle, and a barrel that tracks
  for (let i = 0; i < 7; i++) {
    const x = cx - 18 + (i % 4) * 9 + (i > 3 ? 4 : 0);
    const y = base - 6 - (i > 3 ? 5 : 0);
    ell(ctx, x + 4, y + 2, 5, 3, i % 2 ? '#6b6048' : '#7a6e54');
  }
  rect(ctx, cx - 3, base - 18, 6, 12, STEEL);
  rect(ctx, cx - 3, base - 18, 2, 12, STEEL_L);
  circ(ctx, cx, base - 20, 5, STEEL_D);
  circ(ctx, cx - 1, base - 21, 3, STEEL);
  const swing = Math.sin(t * Math.PI * 2) * 0.5;
  taper(ctx, cx, base - 20, cx + Math.cos(swing) * 13, base - 21 + Math.sin(swing) * 5, 2.2, 1.2, STEEL_D);
  circ(ctx, cx + 2, base - 23, 1.4, t < 0.5 ? '#e8503a' : '#5a2018');
  drawNestLogo(ctx, cx - 12, base - 12, 0.32);
}

const CORES = {
  mast:   { w: 40, h: 60, frames: 4, fn: drawMast },
  tank:   { w: 44, h: 44, frames: 2, fn: drawTank },
  cages:  { w: 40, h: 34, frames: 2, fn: drawCages },
  saw:    { w: 46, h: 36, frames: 4, fn: drawSaw },
  turret: { w: 44, h: 30, frames: 4, fn: drawTurretCore },
};

function outpostFrames(core) {
  const spec = CORES[core] || CORES.mast;
  return getSheet(`outpost:${core}`, () => {
    const frames = [];
    for (let i = 0; i < spec.frames; i++) {
      const ctx = surface(spec.w, spec.h);
      spec.fn(ctx, i / spec.frames);
      outline(ctx, P.black);
      frames.push(ctx.canvas);
    }
    return frames;
  });
}

/** What is left after you blow one up: a stump of scorched frame. */
function outpostWreck(core) {
  const spec = CORES[core] || CORES.mast;
  return getSheet(`outpostwreck:${core}`, () => {
    const ctx = surface(spec.w, Math.max(14, spec.h * 0.4));
    const W = ctx.canvas.width, H = ctx.canvas.height;
    const cx = W / 2, base = H - 2;
    rect(ctx, cx - 14, base - 3, 28, 4, '#2a2420');
    for (let i = 0; i < 7; i++) {
      const x = cx - 12 + i * 4 + (hash2(i, 3, 51) - 0.5) * 3;
      const hgt = 3 + hash2(i, 7, 52) * 8;
      taper(ctx, x, base - 2, x + (hash2(i, 9, 53) - 0.5) * 5, base - 2 - hgt, 1.4, 0.7, i % 2 ? '#3a3e42' : '#2e2622');
    }
    speckle(ctx, cx - 15, base - 8, 30, 9, '#171412', 0.4, 11);
    dither(ctx, cx - 12, base - 4, 24, 4, '#8a4a20', 1);
    outline(ctx, P.black);
    return [ctx.canvas];
  })[0];
}

function outpostSize(core) {
  const spec = CORES[core] || CORES.mast;
  return { w: spec.w, h: spec.h };
}

};

const GLYPH_H = 7;
const CAP_H = 6;
const LINE_H = 9;

let atlasWhite = null;
const metrics = new Map();   // char -> {sx, w, off}
const tinted = new Map();    // colour string -> canvas
let atlasW = 0;

function buildAtlas() {
  const chars = Object.keys(G);
  let x = 0;
  const placed = [];
  for (const ch of chars) {
    const rows = G[ch];
    let first = 5, last = -1;
    for (let c = 0; c < 5; c++) {
      for (let r = 0; r < GLYPH_H; r++) {
        if (rows[r][c] === '#') { if (c < first) first = c; if (c > last) last = c; break; }
      }
    }
    let w;
    if (last < 0) { first = 0; w = 2; }            // space and friends
    else w = last - first + 1;
    metrics.set(ch, { sx: x, w, off: first });
    placed.push({ ch, rows, first, w, x });
    x += w + 1;
  }
  atlasW = x;
  const cv = document.createElement('canvas');
  cv.width = atlasW; cv.height = GLYPH_H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  for (const p of placed) {
    for (let r = 0; r < GLYPH_H; r++) {
      for (let c = 0; c < p.w; c++) {
        if (p.rows[r][p.first + c] === '#') ctx.fillRect(p.x + c, r, 1, 1);
      }
    }
  }
  atlasWhite = cv;
}

function atlasFor(color) {
  if (!atlasWhite) buildAtlas();
  let a = tinted.get(color);
  if (a) return a;
  const cv = document.createElement('canvas');
  cv.width = atlasW; cv.height = GLYPH_H;
  const ctx = cv.getContext('2d');
  ctx.drawImage(atlasWhite, 0, 0);
  ctx.globalCompositeOperation = 'source-in';
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, atlasW, GLYPH_H);
  tinted.set(color, cv);
  return cv;
}

function normalize(str) { return String(str).toUpperCase(); }

function measure(str, scale = 1, tracking = 1) {
  if (!atlasWhite) buildAtlas();
  const s = normalize(str);
  let w = 0;
  for (let i = 0; i < s.length; i++) {
    const m = metrics.get(s[i]) || metrics.get('?');
    w += m.w + tracking;
  }
  return Math.max(0, w - tracking) * scale;
}

function textHeight(scale = 1) { return CAP_H * scale; }

/**
 * Draw text into a 2D context in screen space.
 * opts: { align:'left'|'center'|'right', alpha, shadow, scale, tracking, wave, waveAmp }
 */
function drawText(ctx, str, x, y, color = '#e8d7b0', opts = {}) {
  if (!atlasWhite) buildAtlas();
  const s = normalize(str);
  const scale = opts.scale || 1;
  const tracking = opts.tracking == null ? 1 : opts.tracking;
  const align = opts.align || 'left';
  const w = measure(s, scale, tracking);
  let px = Math.round(x);
  if (align === 'center') px = Math.round(x - w / 2);
  else if (align === 'right') px = Math.round(x - w);
  const py = Math.round(y);

  if (opts.shadow) {
    const sc = typeof opts.shadow === 'string' ? opts.shadow : 'rgba(0,0,0,0.75)';
    _blit(ctx, s, px + scale, py + scale, sc, scale, tracking, opts);
  }
  _blit(ctx, s, px, py, color, scale, tracking, opts);
  return w;
}

function _blit(ctx, s, px, py, color, scale, tracking, opts) {
  const atlas = atlasFor(color);
  const prevAlpha = ctx.globalAlpha;
  if (opts.alpha != null) ctx.globalAlpha = prevAlpha * opts.alpha;
  let cx = px;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    const m = metrics.get(ch) || metrics.get('?');
    let dy = py;
    if (opts.wave) dy += Math.round(Math.sin(opts.wave + i * 0.6) * (opts.waveAmp || 1));
    if (ch !== ' ') ctx.drawImage(atlas, m.sx, 0, m.w, GLYPH_H, cx, dy, m.w * scale, GLYPH_H * scale);
    cx += (m.w + tracking) * scale;
  }
  ctx.globalAlpha = prevAlpha;
}

/** Greedy word wrap. Returns an array of lines. */
function wrapText(str, maxWidth, scale = 1, tracking = 1) {
  const lines = [];
  // An explicit newline in the source is a line break the writer asked for,
  // and losing it runs two sentences together in the middle of a bubble.
  for (const para of String(str).split('\n')) {
    const words = para.split(/\s+/).filter(Boolean);
    if (!words.length) { lines.push(''); continue; }
    let line = '';
    for (const word of words) {
      const test = line ? line + ' ' + word : word;
      if (measure(test, scale, tracking) > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  }
  return lines;
}

// Touch controls for phones and iPad. Two floating sticks — left to move,
// right to aim and fire — plus a ring of action buttons. Everything is fed back
// into the same action names the keyboard uses, so no gameplay code has to know
// whether a human is holding a mouse or a slab of glass.

// bundled: import { drawText } from './font.js';
// bundled: import { VIEW_W, VIEW_H } from './canvas.js';
// bundled: import { clamp, TAU } from './math.js';

function isTouchDevice() {
  return (typeof window !== 'undefined') &&
    (('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0);
}

const STICK_R = 24;     // outer ring radius, scaled below
const KNOB_R = 9;
const DEAD = 0.14;

/**
 * Button glyphs, drawn rather than lettered.
 *
 * A three-letter label works on a desk. On a phone, under a thumb, at a glance,
 * during a firefight, it does not: you need a shape you can recognise without
 * reading it. Each of these draws into a circle of radius `r` centred on
 * (x, y), in a single colour, so the button can tint the whole icon by state.
 */
const BUTTON_ICONS = {
  // a paw print: move, gather, the general "do the thing" button
  interact(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    const p = r * 0.34;
    ell2(ctx, x, y + p * 0.5, p * 0.95, p * 0.8);
    for (let i = 0; i < 4; i++) {
      const a = -2.5 + i * 0.62;
      ell2(ctx, x + Math.cos(a) * p * 1.25, y + Math.sin(a) * p * 1.25 - p * 0.2, p * 0.42, p * 0.5);
    }
  },
  // a claw slash: three raking lines
  melee(ctx, x, y, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = Math.max(1, r * 0.14);
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5 + i * r * 0.26, y - r * 0.52);
      ctx.quadraticCurveTo(x + i * r * 0.24, y, x + r * 0.42 + i * r * 0.24, y + r * 0.54);
      ctx.stroke();
    }
  },
  // motion lines behind a chevron: dash
  dash(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    tri2(ctx, x - r * 0.1, y - r * 0.52, x - r * 0.1, y + r * 0.52, x + r * 0.56, y);
    ctx.fillRect(Math.round(x - r * 0.62), Math.round(y - r * 0.34), Math.max(1, r * 0.26), Math.max(1, r * 0.16));
    ctx.fillRect(Math.round(x - r * 0.72), Math.round(y - r * 0.08), Math.max(1, r * 0.34), Math.max(1, r * 0.16));
    ctx.fillRect(Math.round(x - r * 0.62), Math.round(y + r * 0.18), Math.max(1, r * 0.26), Math.max(1, r * 0.16));
  },
  // a pulsing eye: the lab optic
  scan(ctx, x, y, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = Math.max(1, r * 0.13);
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.56, r * 0.34, 0, 0, TAU);
    ctx.stroke();
    ctx.fillStyle = c;
    ell2(ctx, x, y, r * 0.2, r * 0.2);
  },
  // a droplet
  douse(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    tri2(ctx, x, y - r * 0.6, x - r * 0.4, y + r * 0.16, x + r * 0.4, y + r * 0.16);
    ell2(ctx, x, y + r * 0.16, r * 0.4, r * 0.4);
  },
  // a berry on a stem: eat
  use(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ell2(ctx, x - r * 0.2, y + r * 0.14, r * 0.3, r * 0.3);
    ell2(ctx, x + r * 0.24, y + r * 0.2, r * 0.26, r * 0.26);
    ctx.strokeStyle = c;
    ctx.lineWidth = Math.max(1, r * 0.12);
    ctx.beginPath();
    ctx.moveTo(x - r * 0.1, y - r * 0.1);
    ctx.lineTo(x + r * 0.16, y - r * 0.54);
    ctx.stroke();
  },
  // a puff
  smoke(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ell2(ctx, x - r * 0.26, y + r * 0.1, r * 0.3, r * 0.26);
    ell2(ctx, x + r * 0.2, y + r * 0.16, r * 0.26, r * 0.22);
    ell2(ctx, x, y - r * 0.22, r * 0.34, r * 0.3);
  },
  // a stubby gun
  weapon(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x - r * 0.56), Math.round(y - r * 0.16), Math.round(r * 1.1), Math.max(1, r * 0.3));
    ctx.fillRect(Math.round(x - r * 0.42), Math.round(y + r * 0.1), Math.max(1, r * 0.24), Math.max(1, r * 0.44));
    ctx.fillRect(Math.round(x + r * 0.34), Math.round(y - r * 0.34), Math.max(1, r * 0.2), Math.max(1, r * 0.2));
  },
  // a flame: overclock burns you for power
  overclock(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.62);
    ctx.quadraticCurveTo(x + r * 0.52, y - r * 0.05, x + r * 0.26, y + r * 0.3);
    ctx.quadraticCurveTo(x + r * 0.1, y + r * 0.58, x - r * 0.06, y + r * 0.56);
    ctx.quadraticCurveTo(x - r * 0.48, y + r * 0.3, x - r * 0.22, y - r * 0.16);
    ctx.quadraticCurveTo(x - r * 0.14, y - r * 0.36, x, y - r * 0.62);
    ctx.fill();
  },
  // a hammer and a plank: crafting
  craft(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x - r * 0.5), Math.round(y - r * 0.5), Math.round(r * 0.62), Math.max(1, r * 0.3));
    ctx.fillRect(Math.round(x - r * 0.28), Math.round(y - r * 0.24), Math.max(1, r * 0.2), Math.round(r * 0.72));
    ctx.fillRect(Math.round(x - r * 0.56), Math.round(y + r * 0.42), Math.round(r * 1.12), Math.max(1, r * 0.2));
  },
  // a chip: four legs and a die
  chips(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x - r * 0.34), Math.round(y - r * 0.34), Math.round(r * 0.68), Math.round(r * 0.68));
    for (let i = -1; i <= 1; i++) {
      ctx.fillRect(Math.round(x + i * r * 0.24 - r * 0.05), Math.round(y - r * 0.56), Math.max(1, r * 0.12), Math.max(1, r * 0.2));
      ctx.fillRect(Math.round(x + i * r * 0.24 - r * 0.05), Math.round(y + r * 0.36), Math.max(1, r * 0.12), Math.max(1, r * 0.2));
    }
  },
  // a folded map
  map(ctx, x, y, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = Math.max(1, r * 0.13);
    ctx.beginPath();
    ctx.moveTo(x - r * 0.54, y - r * 0.3);
    ctx.lineTo(x - r * 0.18, y - r * 0.5);
    ctx.lineTo(x + r * 0.18, y - r * 0.3);
    ctx.lineTo(x + r * 0.54, y - r * 0.5);
    ctx.lineTo(x + r * 0.54, y + r * 0.36);
    ctx.lineTo(x + r * 0.18, y + r * 0.54);
    ctx.lineTo(x - r * 0.18, y + r * 0.36);
    ctx.lineTo(x - r * 0.54, y + r * 0.54);
    ctx.closePath();
    ctx.stroke();
  },
  // three dots in formation: squad command
  command(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ell2(ctx, x, y - r * 0.34, r * 0.19, r * 0.19);
    ell2(ctx, x - r * 0.38, y + r * 0.26, r * 0.19, r * 0.19);
    ell2(ctx, x + r * 0.38, y + r * 0.26, r * 0.19, r * 0.19);
    ctx.strokeStyle = c;
    ctx.lineWidth = Math.max(1, r * 0.09);
    ctx.beginPath();
    ctx.moveTo(x, y - r * 0.34); ctx.lineTo(x - r * 0.38, y + r * 0.26);
    ctx.lineTo(x + r * 0.38, y + r * 0.26); ctx.closePath();
    ctx.stroke();
  },
  // an arrow curling home: rally
  rally(ctx, x, y, r, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.beginPath();
    ctx.arc(x, y + r * 0.08, r * 0.42, Math.PI * 0.15, Math.PI * 1.7);
    ctx.stroke();
    ctx.fillStyle = c;
    tri2(ctx, x + r * 0.5, y - r * 0.34, x + r * 0.12, y - r * 0.28, x + r * 0.44, y + r * 0.08);
  },
  // pause bars
  pause(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x - r * 0.34), Math.round(y - r * 0.42), Math.max(1, r * 0.22), Math.round(r * 0.84));
    ctx.fillRect(Math.round(x + r * 0.12), Math.round(y - r * 0.42), Math.max(1, r * 0.22), Math.round(r * 0.84));
  },
  // four corner brackets: fullscreen
  fullscreen(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    const t = Math.max(1, r * 0.16), l = r * 0.42, o = r * 0.48;
    for (const sx of [-1, 1]) {
      for (const sy of [-1, 1]) {
        ctx.fillRect(Math.round(x + sx * o - (sx > 0 ? l : 0)), Math.round(y + sy * o - (sy > 0 ? t : 0)), Math.round(l), Math.round(t));
        ctx.fillRect(Math.round(x + sx * o - (sx > 0 ? t : 0)), Math.round(y + sy * o - (sy > 0 ? l : 0)), Math.round(t), Math.round(l));
      }
    }
  },
};

// tiny local helpers, so the icon table stays readable
function ell2(ctx, cx, cy, rx, ry) {
  ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, TAU); ctx.fill();
}
function tri2(ctx, x0, y0, x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y2); ctx.closePath(); ctx.fill();
}

class TouchControls {
  constructor(canvas) {
    this.canvas = canvas;
    this.enabled = isTouchDevice();
    this.visible = this.enabled;
    this.pointers = new Map();     // pointerId -> {kind, ...}
    this.move = { x: 0, y: 0, active: false, ox: 0, oy: 0, kx: 0, ky: 0 };
    this.aim = { x: 1, y: 0, active: false, ox: 0, oy: 0, kx: 0, ky: 0 };
    this.down = new Set();
    this.pressed = new Set();
    this.released = new Set();
    this.tap = null;               // {x,y} screen-space tap for menus/panels
    this.uiMode = false;           // when true the whole screen is a tap target
    // Buttons the game has switched off this frame (nothing to craft, no squad,
    // no gun yet). Hidden buttons do not draw and do not take taps.
    this.hidden = new Set();
    this.buttons = [];
    this.scale = 1;
    this._layout();
    this._bind();
  }

  /**
   * Buttons are laid out from the corners so they stay under the thumbs at any
   * aspect ratio, and scale with the internal resolution.
   */
  _layout() {
    // Buttons are sized in real screen pixels, not internal ones. A thumb is
    // about 44 CSS pixels across whatever resolution the game happens to be
    // rendering at, and a control that is the right size on an iPad and half
    // that on a phone is a control that only works on an iPad.
    const rect = this.canvas.getBoundingClientRect();
    const disp = rect.width > 0 ? rect.width / Math.max(1, this.canvas.width) : 1;
    const s = this.scale = clamp((1 / disp) * 2.15, 0.9, 4.2);

    const W = VIEW_W, H = VIEW_H;
    const bigR = Math.round(17 * s), midR = Math.round(13.5 * s), smallR = Math.round(10.5 * s);
    const gap = Math.round(5 * s);
    // Everything is placed off its own radius, so the margins hold at every
    // scale instead of the cluster sliding off the corner on a dense screen.
    const rightX = W - bigR - gap;
    const bottomY = H - bigR - gap;

    this.buttons = [
      // right thumb: the things you press in a fight
      { action: 'dash',     label: 'DSH', x: rightX, y: bottomY, r: bigR, tint: '#4de1ff' },
      { action: 'melee',    label: 'CLW', x: rightX - bigR - midR - gap, y: bottomY + Math.round(2 * s), r: midR, tint: '#ff8a5a' },
      { action: 'interact', label: 'E',   x: rightX + Math.round(2 * s), y: bottomY - bigR - midR - gap, r: midR, tint: '#8ac47a' },
      { action: 'overclock', label: 'OC', x: rightX - bigR - smallR - gap * 2, y: bottomY - midR - smallR - gap, r: smallR, tint: '#b8f5ff', toggle: true },

      // utility column up the right edge
      { action: 'scan',  label: 'Q',   x: W - smallR - gap, y: bottomY - bigR - midR * 2 - smallR - gap * 3, r: smallR, tint: '#4de1ff' },
      { action: 'douse', label: 'H2O', x: W - smallR - gap, y: bottomY - bigR - midR * 2 - smallR * 3 - gap * 4, r: smallR, tint: '#a7d8e6' },
      { action: 'use',   label: 'EAT', x: W - smallR - gap, y: bottomY - bigR - midR * 2 - smallR * 5 - gap * 5, r: smallR, tint: '#7fd48a' },
      { action: 'smoke', label: 'SMK', x: W - smallR - gap, y: bottomY - bigR - midR * 2 - smallR * 7 - gap * 6, r: smallR, tint: '#8a9483' },

      // left edge: weapon and squad, away from the movement thumb
      { action: 'weapon',  label: 'GUN', x: midR + gap, y: bottomY, r: midR, tint: '#e8d7b0' },
      { action: 'command', label: 'CMD', x: smallR + gap, y: bottomY - midR - smallR - gap, r: smallR, tint: '#f0c05a', toggle: true },
      { action: 'rally',   label: 'RLY', x: smallR + gap, y: bottomY - midR - smallR * 3 - gap * 2, r: smallR, tint: '#f0c05a' },

      // top-right row: menus, out of the way of both thumbs
      { action: 'craft',      label: 'CRF', x: W - smallR - gap, y: smallR + gap, r: smallR, tint: '#e8d7b0' },
      { action: 'chips',      label: 'CHP', x: W - smallR * 3 - gap * 2, y: smallR + gap, r: smallR, tint: '#4de1ff' },
      { action: 'map',        label: 'MAP', x: W - smallR * 5 - gap * 3, y: smallR + gap, r: smallR, tint: '#8ac47a' },
      { action: 'pause',      label: '||',  x: W - smallR * 7 - gap * 4, y: smallR + gap, r: smallR, tint: '#8a9483' },
      { action: 'fullscreen', label: 'FS',  x: W - smallR * 9 - gap * 5, y: smallR + gap, r: smallR, tint: '#8a9483' },
    ];
    this.stickR = Math.round(STICK_R * s * 0.8);
    this.knobR = Math.round(KNOB_R * s * 0.8);
  }

  onViewportChange() { this._layout(); }

  _toCanvas(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / r.width) * VIEW_W,
      y: ((clientY - r.top) / r.height) * VIEW_H,
    };
  }

  /** The game tells us which actions make no sense right now. */
  setHidden(actions) {
    this.hidden.clear();
    for (const a of actions) this.hidden.add(a);
  }

  _hitButton(x, y) {
    // Generous hit radius: fingers are not mouse cursors.
    for (const b of this.buttons) {
      if (this.hidden.has(b.action)) continue;
      const pad = b.r + 6 * this.scale;
      const dx = x - b.x, dy = y - b.y;
      if (dx * dx + dy * dy <= pad * pad) return b;
    }
    return null;
  }

  _bind() {
    const cv = this.canvas;
    const opts = { passive: false };

    cv.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') return;      // mouse keeps its own path
      this.enabled = true; this.visible = true;
      e.preventDefault();
      const p = this._toCanvas(e.clientX, e.clientY);
      this.tap = { x: p.x, y: p.y };

      if (this.uiMode) {
        this.pointers.set(e.pointerId, { kind: 'ui' });
        return;
      }

      // Never let capture be fatal: some engines refuse it for synthetic or
      // already-released pointers.
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* not important */ }
      const btn = this._hitButton(p.x, p.y);
      if (btn) {
        this.pointers.set(e.pointerId, { kind: 'button', action: btn.action });
        this.down.add(btn.action);
        this.pressed.add(btn.action);
        btn.flash = 1;
        return;
      }

      if (p.x < VIEW_W * 0.46) {
        this.pointers.set(e.pointerId, { kind: 'move' });
        this.move.active = true;
        this.move.ox = p.x; this.move.oy = p.y;
        this.move.kx = p.x; this.move.ky = p.y;
        this.move.x = 0; this.move.y = 0;
      } else {
        this.pointers.set(e.pointerId, { kind: 'aim' });
        this.aim.active = true;
        this.aim.ox = p.x; this.aim.oy = p.y;
        this.aim.kx = p.x; this.aim.ky = p.y;
      }
    }, opts);

    cv.addEventListener('pointermove', (e) => {
      const rec = this.pointers.get(e.pointerId);
      if (!rec) return;
      e.preventDefault();
      const p = this._toCanvas(e.clientX, e.clientY);
      if (rec.kind === 'move') this._dragStick(this.move, p);
      else if (rec.kind === 'aim') this._dragStick(this.aim, p);
      else if (rec.kind === 'ui') this.tap = { x: p.x, y: p.y };
    }, opts);

    const end = (e) => {
      const rec = this.pointers.get(e.pointerId);
      if (!rec) return;
      this.pointers.delete(e.pointerId);
      if (rec.kind === 'move') { this.move.active = false; this.move.x = 0; this.move.y = 0; }
      else if (rec.kind === 'aim') { this.aim.active = false; }
      else if (rec.kind === 'button') { this.down.delete(rec.action); this.released.add(rec.action); }
    };
    cv.addEventListener('pointerup', end, opts);
    cv.addEventListener('pointercancel', end, opts);

    // Stop iOS from scrolling, zooming or bouncing the page under the game.
    for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange']) {
      cv.addEventListener(ev, (e) => e.preventDefault(), opts);
    }
    document.addEventListener('touchmove', (e) => {
      if (e.target === cv) e.preventDefault();
    }, opts);
  }

  _dragStick(st, p) {
    let dx = p.x - st.ox, dy = p.y - st.oy;
    const len = Math.hypot(dx, dy);
    const R = this.stickR;
    if (len > R) {
      // Let the stick base follow the thumb once it leaves the ring, which is
      // what makes long drags on a small screen feel right.
      st.ox += dx * (1 - R / len);
      st.oy += dy * (1 - R / len);
      dx *= R / len; dy *= R / len;
    }
    st.kx = st.ox + dx; st.ky = st.oy + dy;
    const n = Math.min(1, len / R);
    if (n < DEAD) { st.x = 0; st.y = 0; return; }
    const inv = 1 / (len || 1);
    const mag = (n - DEAD) / (1 - DEAD);
    st.x = dx * inv * mag;
    st.y = dy * inv * mag;
  }

  // --- queries -------------------------------------------------------------
  axes() {
    if (!this.move.active) return null;
    return { x: this.move.x, y: this.move.y };
  }

  /** Unit aim direction while the right stick is held, else null. */
  aimVector() {
    if (!this.aim.active) return null;
    const l = Math.hypot(this.aim.x, this.aim.y);
    if (l < 0.001) return null;
    return { x: this.aim.x / l, y: this.aim.y / l };
  }

  get firing() { return this.aim.active && Math.hypot(this.aim.x, this.aim.y) > 0.2; }

  isDown(a) { return this.down.has(a); }
  isPressed(a) { return this.pressed.has(a); }
  isReleased(a) { return this.released.has(a); }

  takeTap() { const t = this.tap; this.tap = null; return t; }

  setToggle(action, on) {
    const b = this.buttons.find(x => x.action === action);
    if (b) b.on = on;
  }

  endFrame() {
    this.pressed.clear();
    this.released.clear();
    this.tap = null;
    for (const b of this.buttons) if (b.flash) b.flash = Math.max(0, b.flash - 0.12);
  }

  // --- drawing -------------------------------------------------------------
  draw(r, game) {
    if (!this.visible) return;
    const ctx = r.ctx;
    const prev = ctx.globalAlpha;

    if (!this.uiMode) {
      for (const b of this.buttons) {
        if (this.hidden.has(b.action)) continue;
        const held = this.down.has(b.action) || b.on;
        const flash = b.flash || 0;
        const base = held ? 0.92 : 0.4 + flash * 0.35;

        // A dark well with a lit rim, so the button reads against grass, snow,
        // water and fire without a solid plate blocking the view underneath.
        ctx.globalAlpha = held ? 0.92 : 0.5;
        ctx.fillStyle = 'rgba(6,12,11,0.86)';
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();

        // pressed state fills with the button's own colour
        if (held) {
          ctx.globalAlpha = 0.5;
          ctx.fillStyle = b.tint;
          ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 1, 0, TAU); ctx.fill();
        }

        // rim: two rings, the outer one softer, which reads as depth
        ctx.globalAlpha = held ? 1 : 0.75;
        ctx.strokeStyle = b.tint; ctx.lineWidth = held ? 2 : 1.4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.22;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1.5, 0, TAU); ctx.stroke();

        // a toggle that is on gets a filled pip on the rim
        if (b.toggle && b.on) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = b.tint;
          ell2(ctx, b.x, b.y - b.r, 1.6, 1.6);
        }

        // the icon itself
        ctx.globalAlpha = held ? 1 : 0.9;
        const icon = BUTTON_ICONS[b.action];
        if (icon) icon(ctx, b.x, b.y, b.r * 0.78, held ? '#0d1512' : b.tint);
        else drawText(ctx, b.label, b.x, b.y - 3, held ? '#0d1512' : b.tint, { align: 'center' });
        ctx.globalAlpha = 1;
      }
    }

    ctx.globalAlpha = 1;
    this._drawStick(r, this.move, '#8ac47a');
    this._drawStick(r, this.aim, '#ff8a5a');
    ctx.globalAlpha = prev;
  }

  _drawStick(r, st, color) {
    if (!st.active) return;
    const ctx = r.ctx;
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(st.ox, st.oy, this.stickR, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(st.kx, st.ky, this.knobR, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/** Best-effort fullscreen; iPad Safari supports it, iPhone Safari does not. */
function toggleFullscreen(el) {
  const doc = document;
  const isFs = doc.fullscreenElement || doc.webkitFullscreenElement;
  try {
    if (isFs) {
      (doc.exitFullscreen || doc.webkitExitFullscreen || (() => {})).call(doc);
      return false;
    }
    const target = el || doc.documentElement;
    const req = target.requestFullscreen || target.webkitRequestFullscreen || target.webkitEnterFullscreen;
    if (req) { req.call(target); return true; }
  } catch (e) { /* Safari throws on unsupported surfaces; nothing to do */ }
  return false;
}


// ==========================================================================
// src/engine/input.js
// ==========================================================================
// Keyboard + mouse + gamepad input. Exposes edge-triggered "pressed" queries so
// gameplay code never has to track previous frames itself.

// bundled: import { TouchControls, isTouchDevice } from './touch.js';

const KEYMAP = {
  up:      ['KeyW', 'ArrowUp'],
  down:    ['KeyS', 'ArrowDown'],
  left:    ['KeyA', 'ArrowLeft'],
  right:   ['KeyD', 'ArrowRight'],
  interact:['KeyE'],
  dash:    ['Space'],
  focus:   ['ShiftLeft', 'ShiftRight'],
  scan:    ['KeyQ'],
  craft:   ['Tab'],
  chips:   ['KeyC'],
  map:     ['KeyM'],
  douse:   ['KeyR'],
  pause:   ['Escape', 'KeyP'],
  use:     ['KeyF'],
  smoke:   ['KeyG'],
  melee:   ['KeyX'],
  command: ['KeyT'],
  rally:   ['KeyY'],
  hold:    ['KeyH'],
  weapon:  ['KeyB'],
  fullscreen: ['F11'],
  slot1:   ['Digit1'],
  slot2:   ['Digit2'],
  slot3:   ['Digit3'],
  slot4:   ['Digit4'],
  slot5:   ['Digit5'],
};

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.down = new Set();
    this.pressed = new Set();
    this.released = new Set();
    this.mouse = { x: 0, y: 0, sx: 0, sy: 0, down: false, pressed: false, released: false, rdown: false, rpressed: false };
    this.wheel = 0;
    this.anyKeyPressed = false;
    this.touch = new TouchControls(canvas);
    this.usingTouch = isTouchDevice();
    this._bind();
  }

  _bind() {
    const consumed = new Set(['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
    window.addEventListener('keydown', (e) => {
      if (consumed.has(e.code)) e.preventDefault();
      if (e.repeat) return;
      this.down.add(e.code);
      this.pressed.add(e.code);
      this.anyKeyPressed = true;
    });
    window.addEventListener('keyup', (e) => {
      this.down.delete(e.code);
      this.released.add(e.code);
    });
    window.addEventListener('blur', () => { this.down.clear(); this.mouse.down = false; this.mouse.rdown = false; });

    const cv = this.canvas;
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('mousemove', (e) => this._movePointer(e.clientX, e.clientY));
    cv.addEventListener('mousedown', (e) => {
      this._movePointer(e.clientX, e.clientY);
      if (e.button === 0) { this.mouse.down = true; this.mouse.pressed = true; }
      if (e.button === 2) { this.mouse.rdown = true; this.mouse.rpressed = true; }
      this.anyKeyPressed = true;
      e.preventDefault();
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) { this.mouse.down = false; this.mouse.released = true; }
      if (e.button === 2) this.mouse.rdown = false;
    });
    window.addEventListener('wheel', (e) => { this.wheel += Math.sign(e.deltaY); }, { passive: true });

    // Touch is handled by TouchControls, which owns the pointer events and
    // feeds results back through the same action queries used below.
  }

  _movePointer(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();
    this.mouse.sx = ((clientX - r.left) / r.width) * this.canvas.width;
    this.mouse.sy = ((clientY - r.top) / r.height) * this.canvas.height;
  }

  // --- queries -------------------------------------------------------------
  isDown(action) {
    if (this.touch.isDown(action)) return true;
    const keys = KEYMAP[action];
    if (!keys) return false;
    for (const k of keys) if (this.down.has(k)) return true;
    return false;
  }
  isPressed(action) {
    if (this.touch.isPressed(action)) return true;
    const keys = KEYMAP[action];
    if (!keys) return false;
    for (const k of keys) if (this.pressed.has(k)) return true;
    return false;
  }
  isReleased(action) {
    if (this.touch.isReleased(action)) return true;
    const keys = KEYMAP[action];
    if (!keys) return false;
    for (const k of keys) if (this.released.has(k)) return true;
    return false;
  }

  /** Unit aim direction when a stick is driving, else null (mouse aiming). */
  aimVector() { return this.touch.aimVector(); }

  /** True when the player is asking to shoot, by mouse or by right stick. */
  get firing() { return this.mouse.down || this.touch.firing; }

  /** A screen-space tap that menus and panels can consume. */
  takeTap() {
    if (this.mouse.pressed) return { x: this.mouse.sx, y: this.mouse.sy };
    return this.touch.takeTap();
  }
  key(code) { return this.down.has(code); }
  keyPressed(code) { return this.pressed.has(code); }

  // Normalised movement axes with proper diagonal handling.
  axes() {
    let x = 0, y = 0;
    if (this.isDown('left')) x -= 1;
    if (this.isDown('right')) x += 1;
    if (this.isDown('up')) y -= 1;
    if (this.isDown('down')) y += 1;
    const gp = this._gamepadAxes();
    if (gp) { x += gp.x; y += gp.y; }
    const t = this.touch.axes();
    if (t) { x += t.x; y += t.y; }
    const len = Math.hypot(x, y);
    if (len > 1) { x /= len; y /= len; }
    return { x, y, len: Math.min(len, 1) };
  }

  _gamepadAxes() {
    if (!navigator.getGamepads) return null;
    const pads = navigator.getGamepads();
    for (const p of pads) {
      if (!p) continue;
      const dx = p.axes[0] || 0, dy = p.axes[1] || 0;
      if (Math.hypot(dx, dy) > 0.22) return { x: dx, y: dy };
      return null;
    }
    return null;
  }

  // Called once at the very end of each frame.
  endFrame() {
    this.touch.endFrame();
    this.pressed.clear();
    this.released.clear();
    this.mouse.pressed = false;
    this.mouse.released = false;
    this.mouse.rpressed = false;
    this.wheel = 0;
    this.anyKeyPressed = false;
  }
}


// ==========================================================================
// src/engine/loop.js
// ==========================================================================
// Fixed-timestep game loop with an accumulator. Gameplay always steps at a
// constant 1/60s so bullet patterns, wave timers and physics are deterministic
// regardless of monitor refresh rate; rendering happens once per animation frame.

const STEP = 1 / 60;
const MAX_FRAME = 0.25;   // never simulate more than a quarter second at once

class Loop {
  constructor(update, render) {
    this.update = update;
    this.render = render;
    this.acc = 0;
    this.last = 0;
    this.running = false;
    this.timeScale = 1;
    this.fps = 60;
    this._fpsAcc = 0;
    this._fpsFrames = 0;
    this.elapsed = 0;
    this._raf = null;
    this._tick = this._tick.bind(this);
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.last = performance.now() / 1000;
    this._raf = requestAnimationFrame(this._tick);
  }

  stop() {
    this.running = false;
    if (this._raf) cancelAnimationFrame(this._raf);
  }

  _tick(nowMs) {
    if (!this.running) return;
    this._raf = requestAnimationFrame(this._tick);
    const now = nowMs / 1000;
    let frame = now - this.last;
    this.last = now;
    if (frame > MAX_FRAME) frame = MAX_FRAME;

    this._fpsAcc += frame;
    this._fpsFrames++;
    if (this._fpsAcc >= 0.5) {
      this.fps = Math.round(this._fpsFrames / this._fpsAcc);
      this._fpsAcc = 0; this._fpsFrames = 0;
    }

    this.acc += frame * this.timeScale;
    let steps = 0;
    while (this.acc >= STEP && steps < 5) {
      this.update(STEP);
      this.elapsed += STEP;
      this.acc -= STEP;
      steps++;
    }
    // If we blew the step budget (tab was backgrounded, heavy GC) drop the
    // backlog rather than spiral-of-death'ing.
    if (steps >= 5) this.acc = 0;

    this.render(frame, this.acc / STEP);
  }
}
