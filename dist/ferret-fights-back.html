// ==========================================================================
// src/world/wind.js
// ==========================================================================
// Wind.
//
// The basin used to have thousands of plants each running its own little
// four-frame loop on its own phase offset. Every tuft of grass twitched
// independently, forever, and the result was visual static — the eye could
// never settle anywhere because everything on screen was always moving.
//
// Real wind does not work like that. Wind is *one field*: a gust arrives from
// one side, sweeps across the meadow, and everything in its path leans the
// same way at the same moment. Between gusts the field goes quiet and the
// grass stands still. That coherence is the whole effect — and it costs less
// than the noise did, because it is two sine waves.
//
// Everything that bends reads from here: grass, ferns, flowers, tree crowns,
// smoke, the fire. One field, one direction, one weather.

// Where the weather comes from. A fixed bearing reads as a place with
// prevailing wind, which is what a mountain basin has.
const DIRX = 0.93, DIRY = 0.36;

// Wavelengths, in world pixels. The swell is long enough that a gust takes a
// couple of seconds to cross the screen, which is what makes it read as a
// gust rather than a shimmer.
const SWELL = 1 / 190;
const RIPPLE = 1 / 74;
const BAND = 1 / 620;

let strength = 0.62;      // overall weather, 0 = dead calm
let bias = 0;             // pushed by explosions and the fire

/** Set the day's weather. Storms during a burn, stillness before dawn. */
function setWind(s) { strength = s; }
function windStrength() { return strength; }

/** A shove, for a blast wave or a helicopter overhead. Decays on its own. */
function gustBurst(amount) { bias = Math.max(bias, amount); }
function updateWind(dt) { bias *= Math.pow(0.2, dt); }

/**
 * How hard the wind is leaning at a point, right now. Range about -1..1;
 * positive is downwind.
 *
 * Two travelling waves give the motion, and a third, much longer one is the
 * gust envelope — broad bands of strong and calm that drift across the map,
 * so the meadow visibly breathes instead of vibrating.
 */
function windAt(x, y, t) {
  const s = x * DIRX + y * DIRY;
  const swell = Math.sin(s * SWELL - t * 1.35);
  const ripple = Math.sin(s * RIPPLE - t * 2.7 + 1.3);
  const band = Math.sin(s * BAND - t * 0.42);
  const gust = 0.28 + 0.72 * (band * 0.5 + 0.5) * (band * 0.5 + 0.5);
  return (swell * 0.68 + ripple * 0.32) * gust * (strength + bias);
}

/** Just the envelope, for things that want to know if a gust is passing. */
function gustAt(x, y, t) {
  const s = x * DIRX + y * DIRY;
  const band = Math.sin(s * BAND - t * 0.42) * 0.5 + 0.5;
  return (0.28 + 0.72 * band * band) * (strength + bias);
}

/** Which way it is blowing, for smoke and embers. */
const WIND_DIR = { x: DIRX, y: DIRY };

/**
 * Pick a bend frame for a sprite standing at (x, y).
 *
 * Frames run from fully-bent-upwind to fully-bent-downwind, so neighbouring
 * plants land on neighbouring frames and the whole stand leans together.
 */
function bendFrame(x, y, t, n) {
  const w = windAt(x, y, t);
  const i = Math.round((Math.max(-1, Math.min(1, w)) * 0.5 + 0.5) * (n - 1));
  return i < 0 ? 0 : i >= n ? n - 1 : i;
}

// ==========================================================================
// src/engine/rng.js
// ==========================================================================
// Deterministic RNG. The whole world (terrain, flora, critter placement, NPC
// spawn spots) is generated from one seed, so a seed reproduces a basin exactly.

// mulberry32 — tiny, fast, good enough distribution for level generation.
function makeRng(seed) {
  let a = seed >>> 0;
  const rng = function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (min, max) => min + Math.floor(rng() * (max - min + 1));
  rng.range = (min, max) => min + rng() * (max - min);
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.chance = (p) => rng() < p;
  rng.sign = () => (rng() < 0.5 ? -1 : 1);
  rng.angle = () => rng() * Math.PI * 2;
  rng.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };
  // Weighted pick from [[value, weight], ...]
  rng.weighted = (pairs) => {
    let total = 0;
    for (const p of pairs) total += p[1];
    let r = rng() * total;
    for (const p of pairs) { r -= p[1]; if (r <= 0) return p[0]; }
    return pairs[pairs.length - 1][0];
  };
  return rng;
}

// Stable hash of integer coordinates -> [0,1). Used for per-tile detail
// (grass tufts, pebble scatter) that must not be stored anywhere.
function hash2(x, y, seed = 0) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(seed | 0, 0x9e3779b1);
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b);
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

function hash2i(x, y, seed, n) { return Math.floor(hash2(x, y, seed) * n) % n; }

// The global "juice" RNG — non-deterministic effects (particles, sparks) that
// nobody needs to reproduce.
const rand = Math.random;
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const rndInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (p) => Math.random() < p;


// ==========================================================================
// src/engine/math.js
// ==========================================================================
// Small math helpers shared by every system. Kept allocation-free where it
// matters: the bullet-hell update loop runs thousands of these per frame.

const TAU = Math.PI * 2;

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
const smoothstep = (t) => t * t * (3 - 2 * t);
const saturate = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

// Frame-rate independent approach-to-target. `rate` is "fraction remaining
// after one second", so damp(x, y, 0.001, dt) is snappy and 0.5 is sluggish.
const damp = (a, b, rate, dt) => b + (a - b) * Math.pow(rate, dt);

function approach(a, b, step) {
  if (a < b) return Math.min(a + step, b);
  if (a > b) return Math.max(a - step, b);
  return b;
}

function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
function dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by) { return Math.sqrt(dist2(ax, ay, bx, by)); }

// Shortest signed difference between two angles, in (-PI, PI].
function angleDiff(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

function rotateToward(cur, target, maxStep) {
  const d = angleDiff(cur, target);
  if (Math.abs(d) <= maxStep) return target;
  return cur + Math.sign(d) * maxStep;
}

function circleHit(ax, ay, ar, bx, by, br) {
  const r = ar + br;
  return dist2(ax, ay, bx, by) <= r * r;
}

function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// Quantise to the pixel grid so nothing shimmers between sub-pixels.
const snap = (v) => Math.round(v);

function wrapIndex(i, n) { return ((i % n) + n) % n; }


// ==========================================================================
// src/art/pixel.js
// ==========================================================================
// A tiny pixel-drawing DSL. Everything works on integer coordinates against an
// offscreen 2D context, so shapes come out as honest hard-edged pixels rather
// than anti-aliased vectors. Sprites are baked once at load and cached.

// bundled: import { hash2 } from '../engine/rng.js';

function surface(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return ctx;
}

const px = (ctx, x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); };

function rect(ctx, x, y, w, h, c) {
  if (w <= 0 || h <= 0) return;
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function frameRect(ctx, x, y, w, h, c) {
  rect(ctx, x, y, w, 1, c);
  rect(ctx, x, y + h - 1, w, 1, c);
  rect(ctx, x, y, 1, h, c);
  rect(ctx, x + w - 1, y, 1, h, c);
}

/** Filled ellipse, scanline-accurate on the pixel grid. */
function ell(ctx, cx, cy, rx, ry, c) {
  if (rx <= 0 || ry <= 0) return;
  ctx.fillStyle = c;
  const y0 = Math.round(cy - ry), y1 = Math.round(cy + ry);
  for (let y = y0; y <= y1; y++) {
    const dy = (y + 0.5 - cy) / ry;
    const s = 1 - dy * dy;
    if (s <= 0) continue;
    const hw = Math.sqrt(s) * rx;
    const x0 = Math.round(cx - hw), x1 = Math.round(cx + hw);
    if (x1 > x0) ctx.fillRect(x0, y, x1 - x0, 1);
  }
}

function circ(ctx, cx, cy, r, c) { ell(ctx, cx, cy, r, r, c); }

/** Ellipse with a soft two-tone volume shade (light on top, dark below). */
function ellShaded(ctx, cx, cy, rx, ry, base, light, dark) {
  ell(ctx, cx, cy, rx, ry, base);
  if (light) ell(ctx, cx, cy - ry * 0.32, rx * 0.72, ry * 0.5, light);
  if (dark) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(Math.round(cx - rx), Math.round(cy + ry * 0.35), Math.ceil(rx * 2), Math.ceil(ry));
    ctx.clip();
    ell(ctx, cx, cy, rx, ry, dark);
    ctx.restore();
  }
}

/** Bresenham line. */
function line(ctx, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  ctx.fillStyle = c;
  for (let guard = 0; guard < 4096; guard++) {
    ctx.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

/** Thick line — limbs, branches, cables, gun barrels. */
function capsule(ctx, x0, y0, x1, y1, r, c) {
  const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    circ(ctx, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r, c);
  }
}

/** Tapered limb: thick at the root, thin at the tip. */
function taper(ctx, x0, y0, x1, y1, r0, r1, c) {
  const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)));
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    circ(ctx, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, r0 + (r1 - r0) * t, c);
  }
}

function tri(ctx, x0, y0, x1, y1, x2, y2, c) {
  ctx.fillStyle = c;
  const minY = Math.round(Math.min(y0, y1, y2)), maxY = Math.round(Math.max(y0, y1, y2));
  for (let y = minY; y <= maxY; y++) {
    const yc = y + 0.5;
    let lo = Infinity, hi = -Infinity;
    const edges = [[x0, y0, x1, y1], [x1, y1, x2, y2], [x2, y2, x0, y0]];
    for (const [ax, ay, bx, by] of edges) {
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) {
        const t = (yc - ay) / (by - ay);
        const x = ax + (bx - ax) * t;
        if (x < lo) lo = x;
        if (x > hi) hi = x;
      }
    }
    if (lo <= hi) ctx.fillRect(Math.round(lo), y, Math.max(1, Math.round(hi) - Math.round(lo)), 1);
  }
}

/** Scatter deterministic speckles inside a rect — bark, gravel, fur texture. */
function speckle(ctx, x, y, w, h, c, density, seed = 0) {
  ctx.fillStyle = c;
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      if (hash2(x + i, y + j, seed) < density) ctx.fillRect(x + i, y + j, 1, 1);
    }
  }
}

/** Checkerboard dither between two colours, used for gradients and mats. */
function dither(ctx, x, y, w, h, c, phase = 0) {
  ctx.fillStyle = c;
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      if (((i + j + phase) & 1) === 0) ctx.fillRect(x + i, y + j, 1, 1);
    }
  }
}

/**
 * Add a 1px outline around every opaque cluster. This is the single biggest
 * readability win in a busy bullet-hell: sprites stay legible over any terrain.
 */
function outline(ctx, color = '#0d120f', alphaCut = 8) {
  const { width: w, height: h } = ctx.canvas;
  const src = ctx.getImageData(0, 0, w, h);
  const d = src.data;
  const opaque = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) opaque[i] = d[i * 4 + 3] > alphaCut ? 1 : 0;
  const out = ctx.createImageData(w, h);
  const o = out.data;
  const [orr, og, ob] = hexToRgb(color);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (opaque[i]) {
        o[i * 4] = d[i * 4]; o[i * 4 + 1] = d[i * 4 + 1];
        o[i * 4 + 2] = d[i * 4 + 2]; o[i * 4 + 3] = d[i * 4 + 3];
        continue;
      }
      let near = false;
      if (x > 0 && opaque[i - 1]) near = true;
      else if (x < w - 1 && opaque[i + 1]) near = true;
      else if (y > 0 && opaque[i - w]) near = true;
      else if (y < h - 1 && opaque[i + w]) near = true;
      if (near) { o[i * 4] = orr; o[i * 4 + 1] = og; o[i * 4 + 2] = ob; o[i * 4 + 3] = 255; }
    }
  }
  ctx.putImageData(out, 0, 0);
  return ctx;
}

function hexToRgb(hex) {
  if (hex[0] === '#') hex = hex.slice(1);
  if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
  const n = parseInt(hex, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}

function shade(hex, amount) {
  const [r, g, b] = hexToRgb(hex);
  if (amount >= 0) return rgbToHex(r + (255 - r) * amount, g + (255 - g) * amount, b + (255 - b) * amount);
  return rgbToHex(r * (1 + amount), g * (1 + amount), b * (1 + amount));
}

function mix(a, b, t) {
  const [r1, g1, b1] = hexToRgb(a), [r2, g2, b2] = hexToRgb(b);
  return rgbToHex(r1 + (r2 - r1) * t, g1 + (g2 - g1) * t, b1 + (b2 - b1) * t);
}

/** Flat-tinted copy of a canvas — hit flashes, silhouettes, scan highlights. */
function tintCopy(src, color, amount = 1) {
  const ctx = surface(src.width, src.height);
  ctx.drawImage(src, 0, 0);
  ctx.globalCompositeOperation = 'source-atop';
  ctx.globalAlpha = amount;
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, src.width, src.height);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  return ctx.canvas;
}

/** Bake `n` animation frames. `fn(ctx, i, t)` draws one, t is 0..1 cyclic. */
function sheet(w, h, n, fn, opts = {}) {
  const frames = [];
  for (let i = 0; i < n; i++) {
    const ctx = surface(w, h);
    fn(ctx, i, i / n);
    if (opts.outline !== false) outline(ctx, opts.outlineColor || '#10160f');
    frames.push(ctx.canvas);
  }
  return frames;
}

// --- global sprite cache ---------------------------------------------------
const cache = new Map();

/** Get (and lazily bake) a named animation. `build` returns an array of canvases. */
function getSheet(key, build) {
  let s = cache.get(key);
  if (!s) { s = build(); cache.set(key, s); }
  return s;
}

const flashCache = new Map();
function flashFrames(key, frames, color = '#ffffff') {
  const k = key + '|' + color;
  let f = flashCache.get(k);
  if (!f) { f = frames.map(fr => tintCopy(fr, color, 1)); flashCache.set(k, f); }
  return f;
}

function clearSpriteCache() { cache.clear(); flashCache.clear(); }
function spriteCacheSize() { return cache.size; }


// ==========================================================================
// src/world/tiles.js
// ==========================================================================
// Tile definitions and terrain painting. Tiles are never pre-rendered to fixed
// canvases; instead each one is drawn straight into a chunk buffer using a
// deterministic hash of its coordinates, so there is no visible tiling pattern
// anywhere in the basin.

// bundled: import { P } from '../art/palette.js';
// bundled: import { hash2 } from '../engine/rng.js';
// bundled: import { TAU } from '../engine/math.js';
// bundled: import { shade } from '../art/pixel.js';

const TS = 16;   // tile size in pixels

const T = {
  WATER_DEEP: 0, WATER: 1, SHALLOW: 2, SAND: 3, GRAVEL: 4, DIRT: 5,
  GRASS: 6, DUFF: 7, MEADOW: 8, MEADOW_DRY: 9, SAGE: 10, ROCK: 11,
  SINTER: 12, MUD: 13, MAT_ORANGE: 14, MAT_OLIVE: 15, SPRING: 16,
  ASH: 17, CHARRED: 18, SNOW: 19, OBSIDIAN: 20, MAT_RUST: 21, SPRING_DEEP: 22,
  // Les Nest interiors
  LAB_FLOOR: 23, LAB_DARK: 24, LAB_WALL: 25, LAB_GLASS: 26,
  LAB_GRATE: 27, LAB_TEAL: 28, LAB_BLOOD: 29, LAB_PAD: 30,
};

const TILES = [];
function def(id, o) { TILES[id] = Object.assign({ id, solid: false, water: false, speed: 1, burn: -1, dark: null, light: null }, o); }

def(T.WATER_DEEP, { name: 'deep water', base: P.waterDeep, light: P.water, water: true, speed: 0.45, deep: true });
def(T.WATER,      { name: 'water', base: P.water, light: P.waterLight, water: true, speed: 0.55 });
def(T.SHALLOW,    { name: 'shallows', base: P.waterLight, light: P.waterFoam, water: true, speed: 0.75 });
def(T.SAND,       { name: 'sand', base: P.sand, light: shade(P.sand, 0.12), dark: shade(P.sand, -0.16) });
def(T.GRAVEL,     { name: 'gravel', base: P.gravel, light: P.gravelLight, dark: shade(P.gravel, -0.25), speed: 0.94 });
def(T.DIRT,       { name: 'dirt', base: P.dirt, light: P.dirtLight, dark: shade(P.dirt, -0.22) });
def(T.GRASS,      { name: 'grass', base: P.grass, light: P.grassLight, dark: P.grassDark, burn: T.CHARRED });
def(T.DUFF,       { name: 'needle duff', base: '#42402c', light: '#55503a', dark: '#2e2c1e', burn: T.CHARRED });
def(T.MEADOW,     { name: 'meadow', base: P.meadow, light: P.meadowLight, dark: shade(P.meadow, -0.24), burn: T.ASH });
def(T.MEADOW_DRY, { name: 'dry meadow', base: P.meadowDry, light: shade(P.meadowDry, 0.14), dark: shade(P.meadowDry, -0.22), burn: T.ASH });
def(T.SAGE,       { name: 'sage flat', base: P.sage, light: shade(P.sage, 0.12), dark: P.sageDark, burn: T.ASH });
def(T.ROCK,       { name: 'rock', base: P.stone, light: P.stoneLight, dark: P.stoneDark, solid: true });
def(T.SINTER,     { name: 'sinter', base: P.sinter, light: '#f0ece0', dark: shade(P.sinter, -0.18) });
def(T.MUD,        { name: 'mudpot', base: P.mudpot, light: P.mudpotLight, dark: shade(P.mudpot, -0.3), speed: 0.6, hot: true });
def(T.MAT_ORANGE, { name: 'bacterial mat', base: P.springRim1, light: shade(P.springRim1, 0.16), dark: P.springRim2, hot: true });
def(T.MAT_RUST,   { name: 'rust mat', base: P.springRim2, light: shade(P.springRim2, 0.18), dark: shade(P.springRim2, -0.22), hot: true });
def(T.MAT_OLIVE,  { name: 'olive mat', base: P.springRim3, light: shade(P.springRim3, 0.16), dark: shade(P.springRim3, -0.24), hot: true });
def(T.SPRING,     { name: 'hot spring', base: P.spring, light: P.springHot, water: true, speed: 0.5, hot: true, damage: 6 });
def(T.SPRING_DEEP,{ name: 'spring pool', base: '#1b8fa3', light: P.spring, water: true, speed: 0.4, hot: true, damage: 12 });
def(T.ASH,        { name: 'ash', base: P.ash, light: P.ashLight, dark: shade(P.ash, -0.3) });
def(T.CHARRED,    { name: 'burned ground', base: P.charred, light: '#3a322c', dark: '#161210' });
def(T.SNOW,       { name: 'snow', base: P.snow, light: '#ffffff', dark: '#b8c4c9', speed: 0.9 });
def(T.OBSIDIAN,   { name: 'obsidian flow', base: P.obsidian, light: P.obsidianHi, dark: '#0b0b12', speed: 0.95 });

// --- laboratory ------------------------------------------------------------
def(T.LAB_FLOOR, { name: 'lab floor', base: '#3f4a4c', light: '#4e5a5c', dark: '#2f383a', indoor: true });
def(T.LAB_DARK,  { name: 'service floor', base: '#2c3436', light: '#3a4446', dark: '#20272a', indoor: true });
def(T.LAB_WALL,  { name: 'wall', base: '#59666a', light: '#6f7d81', dark: '#39454a', solid: true, indoor: true });
def(T.LAB_GLASS, { name: 'containment glass', base: '#5f8f96', light: '#a9dbe0', dark: '#3d666d', solid: true, glass: true, indoor: true });
def(T.LAB_GRATE, { name: 'grate', base: '#333c3e', light: '#49555a', dark: '#232b2d', indoor: true });
def(T.LAB_TEAL,  { name: 'company floor', base: '#17403e', light: '#22605c', dark: '#0f2c2b', indoor: true });
// Same floor as anywhere else in the block. The blood is painted on top, not
// baked into the panel grid, or every tile edge comes out as a red line.
def(T.LAB_BLOOD, { name: 'floor', base: '#3f4a4c', light: '#4e5a5c', dark: '#2f383a', indoor: true, bloody: true });
def(T.LAB_PAD,   { name: 'helipad', base: '#37403f', light: '#c9a23c', dark: '#232a2a', indoor: true });

const isWater = (t) => TILES[t].water;
const isSolid = (t) => TILES[t].solid;
const tileSpeed = (t) => TILES[t].speed;
const isHot = (t) => !!TILES[t].hot;
const tileDamage = (t) => TILES[t].damage || 0;
const isFlammable = (t) => TILES[t].burn >= 0;

// Ordered dither matrix, and how much of the neighbour survives at each step
// inward. Four pixels of bleed is enough to break the grid without smearing
// the terrain into mush.
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const BLEED = 4;
const BLEED_T = [13, 9, 5, 2];

/**
 * Paint one tile into a chunk buffer.
 * `nb` is a callback (dx,dy) -> neighbouring tile id, used for edge blending.
 */
function drawTile(ctx, px, py, id, tx, ty, nb) {
  const t = TILES[id];
  ctx.fillStyle = t.base;
  ctx.fillRect(px, py, TS, TS);

  const h = (s) => hash2(tx, ty, s);

  switch (id) {
    case T.GRASS:
    case T.DUFF: {
      // clumps of lighter blades plus a few darker shadowed patches
      const n = 5 + Math.floor(h(1) * 4);
      ctx.fillStyle = t.light;
      for (let i = 0; i < n; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 2) * TS);
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 3) * TS);
        ctx.fillRect(x, y, 1, 2);
      }
      ctx.fillStyle = t.dark;
      for (let i = 0; i < 3; i++) {
        const x = px + Math.floor(hash2(tx + i, ty * 5, 4) * (TS - 3));
        const y = py + Math.floor(hash2(tx * 5, ty + i, 5) * (TS - 2));
        ctx.fillRect(x, y, 2 + Math.floor(h(6 + i) * 2), 1);
      }
      if (id === T.DUFF) {
        ctx.fillStyle = '#6b6142';
        for (let i = 0; i < 5; i++) {
          const x = px + Math.floor(hash2(tx * 11 + i, ty, 7) * (TS - 3));
          const y = py + Math.floor(hash2(tx, ty * 17 + i, 8) * TS);
          ctx.fillRect(x, y, 3, 1);
        }
      }
      break;
    }
    case T.MEADOW:
    case T.MEADOW_DRY:
    case T.SAGE: {
      ctx.fillStyle = t.light;
      for (let i = 0; i < 7; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 9) * TS);
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 10) * (TS - 3));
        ctx.fillRect(x, y, 1, 3);
      }
      ctx.fillStyle = t.dark;
      for (let i = 0; i < 4; i++) {
        const x = px + Math.floor(hash2(tx + i * 3, ty * 5, 11) * TS);
        const y = py + Math.floor(hash2(tx * 5, ty + i * 3, 12) * TS);
        ctx.fillRect(x, y, 1, 2);
      }
      break;
    }
    case T.DIRT:
    case T.SAND:
    case T.ASH:
    case T.SNOW: {
      ctx.fillStyle = t.light;
      for (let i = 0; i < 6; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 13) * TS);
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 14) * TS);
        ctx.fillRect(x, y, 1 + Math.floor(h(i) * 2), 1);
      }
      ctx.fillStyle = t.dark || shade(t.base, -0.2);
      for (let i = 0; i < 4; i++) {
        const x = px + Math.floor(hash2(tx + i, ty * 9, 15) * TS);
        const y = py + Math.floor(hash2(tx * 9, ty + i, 16) * TS);
        ctx.fillRect(x, y, 1, 1);
      }
      break;
    }
    case T.GRAVEL:
    case T.ROCK:
    case T.OBSIDIAN: {
      for (let i = 0; i < 9; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 17) * (TS - 2));
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 18) * (TS - 2));
        const s = 1 + Math.floor(hash2(i, tx + ty, 19) * 2);
        ctx.fillStyle = i % 3 === 0 ? t.light : t.dark;
        ctx.fillRect(x, y, s, s);
      }
      if (id === T.OBSIDIAN) {
        ctx.fillStyle = P.obsidianHi;
        const x = px + Math.floor(h(20) * (TS - 6));
        const y = py + Math.floor(h(21) * (TS - 4));
        ctx.fillRect(x, y, 4, 1);
      }
      break;
    }
    case T.CHARRED: {
      ctx.fillStyle = t.light;
      for (let i = 0; i < 5; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 22) * TS);
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 23) * TS);
        ctx.fillRect(x, y, 2, 1);
      }
      ctx.fillStyle = '#1b1512';
      for (let i = 0; i < 3; i++) {
        const x = px + Math.floor(hash2(tx + i, ty * 5, 24) * TS);
        const y = py + Math.floor(hash2(tx * 5, ty + i, 25) * TS);
        ctx.fillRect(x, y, 3, 2);
      }
      break;
    }
    case T.SINTER: {
      ctx.fillStyle = t.light;
      for (let i = 0; i < 4; i++) {
        const y = py + Math.floor(hash2(tx, ty * 3 + i, 26) * TS);
        ctx.fillRect(px, y, TS, 1);
      }
      ctx.fillStyle = t.dark;
      for (let i = 0; i < 3; i++) {
        const x = px + Math.floor(hash2(tx * 5 + i, ty, 27) * TS);
        ctx.fillRect(x, py, 1, TS);
      }
      break;
    }
    case T.MUD: {
      for (let i = 0; i < 4; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 28) * (TS - 6));
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 29) * (TS - 5));
        ctx.fillStyle = i % 2 ? t.light : t.dark;
        ctx.beginPath();
        ctx.ellipse(x + 3, y + 2, 3, 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
    case T.MAT_ORANGE:
    case T.MAT_RUST:
    case T.MAT_OLIVE: {
      // thermophile mats: fibrous streaks running away from the pool
      ctx.fillStyle = t.light;
      for (let i = 0; i < 6; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 30) * TS);
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 31) * TS);
        ctx.fillRect(x, y, 3, 1);
      }
      ctx.fillStyle = t.dark;
      for (let i = 0; i < 4; i++) {
        const x = px + Math.floor(hash2(tx + i, ty * 5, 32) * TS);
        const y = py + Math.floor(hash2(tx * 5, ty + i, 33) * TS);
        ctx.fillRect(x, y, 2, 1);
      }
      break;
    }
    case T.SPRING:
    case T.SPRING_DEEP:
    case T.WATER:
    case T.WATER_DEEP:
    case T.SHALLOW: {
      ctx.fillStyle = t.light;
      for (let i = 0; i < 3; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 34) * (TS - 5));
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 35) * TS);
        ctx.fillRect(x, y, 4, 1);
      }
      break;
    }
    case T.LAB_FLOOR:
    case T.LAB_DARK:
    case T.LAB_TEAL:
    case T.LAB_BLOOD: {
      // clean panel grid, scuffed
      ctx.fillStyle = t.dark;
      ctx.fillRect(px, py + TS - 1, TS, 1);
      ctx.fillRect(px + TS - 1, py, 1, TS);
      ctx.fillStyle = t.light;
      ctx.fillRect(px, py, TS - 1, 1);
      for (let i = 0; i < 3; i++) {
        const x = px + Math.floor(hash2(tx * 7 + i, ty * 13, 40) * (TS - 3));
        const y = py + Math.floor(hash2(tx * 3, ty * 11 + i, 41) * (TS - 2));
        ctx.fillStyle = h(i) > 0.6 ? t.light : t.dark;
        ctx.fillRect(x, y, 2, 1);
      }
      if (id === T.LAB_BLOOD) {
        // A pool with a dark heart and a spattered edge, deterministic so it
        // never crawls between frames. Blobs, not scanlines.
        const cx = px + 3 + Math.floor(hash2(tx, ty, 44) * 9);
        const cy = py + 3 + Math.floor(hash2(tx, ty, 45) * 9);
        const rr = 3 + hash2(tx, ty, 46) * 3.4;
        for (let y = -5; y <= 5; y++) {
          for (let x = -5; x <= 5; x++) {
            const gx = cx + x, gy = cy + y;
            if (gx < px || gy < py || gx >= px + TS || gy >= py + TS) continue;
            // squashed circle, edge chewed up by a hash so it is not a disc
            const d = Math.hypot(x, y * 1.25) - hash2(gx, gy, 47) * 1.6;
            if (d > rr) continue;
            ctx.fillStyle = d < rr * 0.45 ? '#4a1414' : d < rr * 0.78 ? '#5c1a1a' : '#7a2323';
            ctx.fillRect(gx, gy, 1, 1);
          }
        }
        // thrown droplets, further out and smaller
        for (let i = 0; i < 9; i++) {
          const a = hash2(tx * 5 + i, ty, 42) * TAU;
          const r2 = rr + 1 + hash2(tx, ty * 5 + i, 43) * 6;
          const gx = Math.round(cx + Math.cos(a) * r2);
          const gy = Math.round(cy + Math.sin(a) * r2 * 0.8);
          if (gx < px || gy < py || gx >= px + TS || gy >= py + TS) continue;
          ctx.fillStyle = i % 3 === 0 ? '#8e2a2a' : '#5c1a1a';
          ctx.fillRect(gx, gy, 1, 1 + (i % 2 && r2 < rr + 3 ? 1 : 0));
        }
      }
      break;
    }
    case T.LAB_WALL: {
      ctx.fillStyle = t.light;
      ctx.fillRect(px, py, TS, 2);
      ctx.fillStyle = t.dark;
      ctx.fillRect(px, py + TS - 3, TS, 3);
      for (let i = 0; i < 2; i++) {
        const x = px + 2 + i * 7;
        ctx.fillStyle = t.dark;
        ctx.fillRect(x, py + 4, 1, TS - 8);
      }
      break;
    }
    case T.LAB_GLASS: {
      ctx.fillStyle = t.dark;
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = t.base;
      ctx.fillRect(px + 1, py + 1, TS - 2, TS - 2);
      ctx.fillStyle = t.light;
      // a couple of specular streaks so it reads as glass, not water
      ctx.fillRect(px + 3, py + 2, 1, TS - 5);
      ctx.fillRect(px + 4, py + 2, 1, 4);
      ctx.fillRect(px + 9, py + 6, 1, TS - 9);
      break;
    }
    case T.LAB_GRATE: {
      ctx.fillStyle = t.dark;
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = t.light;
      for (let i = 1; i < TS; i += 3) ctx.fillRect(px, py + i, TS, 1);
      ctx.fillStyle = t.base;
      for (let i = 0; i < TS; i += 5) ctx.fillRect(px + i, py, 1, TS);
      break;
    }
    case T.LAB_PAD: {
      ctx.fillStyle = t.dark;
      ctx.fillRect(px, py, TS, TS);
      ctx.fillStyle = t.base;
      ctx.fillRect(px + 1, py + 1, TS - 2, TS - 2);
      // hazard chevrons
      ctx.fillStyle = t.light;
      for (let i = 0; i < TS; i += 4) ctx.fillRect(px + ((i + tx * 3) % TS), py + i, 2, 1);
      break;
    }
    default: break;
  }

  // --- edge blending ------------------------------------------------------
  // A single dithered pixel row still reads as a hard grid line when two
  // greens meet. Instead the neighbour bleeds four pixels in, thinning out
  // with an ordered dither, and the diagonals get a corner patch so the
  // intersections don't stay square either.
  if (nb && !t.indoor) {
    const edges = [
      [0, -1, 0, 0, 1, 0],       // dx, dy, x0, y0, along-x?, — top
      [0, 1, 0, TS - 1, 1, 0],   // bottom
      [-1, 0, 0, 0, 0, 1],       // left
      [1, 0, TS - 1, 0, 0, 1],   // right
    ];
    for (const [dx, dy, ex, ey, ax, ay] of edges) {
      const other = nb(dx, dy);
      if (other === id || other == null) continue;
      const ot = TILES[other];
      if (!ot || ot.solid || ot.water !== t.water) continue;
      ctx.fillStyle = ot.base;
      const inx = -dx, iny = -dy;
      for (let d = 0; d < BLEED; d++) {
        for (let k = 0; k < TS; k++) {
          const gx = px + ex + ax * k + (dx ? inx * d : 0);
          const gy = py + ey + ay * k + (dy ? iny * d : 0);
          const j = BAYER[(gy & 3) * 4 + (gx & 3)] + hash2(gx, gy, 91) * 7 - 3.5;
          if (j < BLEED_T[d]) ctx.fillRect(gx, gy, 1, 1);
        }
      }
    }
    // corners, so two different neighbours meeting at a diagonal blend too
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      const other = nb(dx, dy);
      if (other === id || other == null) continue;
      const ot = TILES[other];
      if (!ot || ot.solid || ot.water !== t.water) continue;
      ctx.fillStyle = ot.base;
      const cx = dx < 0 ? 0 : TS - 3, cy = dy < 0 ? 0 : TS - 3;
      for (let y = 0; y < 3; y++) {
        for (let x = 0; x < 3; x++) {
          const gx = px + cx + x, gy = py + cy + y;
          const j = BAYER[(gy & 3) * 4 + (gx & 3)] + hash2(gx, gy, 92) * 7 - 3.5;
          if (j < 6) ctx.fillRect(gx, gy, 1, 1);
        }
      }
    }
  }
}

/** Water shimmer drawn live over the baked chunk, so pools actually move. */
function drawWaterShimmer(r, tx, ty, id, time) {
  const px = tx * TS, py = ty * TS;
  const t = TILES[id];
  const phase = time * 1.4 + tx * 0.7 + ty * 0.45;
  const n = 2;
  for (let i = 0; i < n; i++) {
    const off = Math.sin(phase + i * 2.1) * 3;
    const y = py + 4 + i * 7 + Math.sin(phase * 0.7 + i) * 1.5;
    const w = 4 + Math.sin(phase + i) * 2;
    r.rectA(px + 3 + off, y, Math.max(2, w), 1, t.light, 0.55);
  }
}


// ==========================================================================
// src/engine/audio.js
// ==========================================================================
// Everything you hear is synthesised at runtime — no audio files. A tiny
// WebAudio toolkit (tones, noise bursts, filters) drives both the SFX bank and
// a layered procedural score that reacts to how dangerous things currently are.

const A4 = 440;
const SCALE_MINOR_PENT = [0, 3, 5, 7, 10];
const SCALE_AEOLIAN = [0, 2, 3, 5, 7, 8, 10];

function midi(n) { return A4 * Math.pow(2, (n - 69) / 12); }

class Audio {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.masterVol = 0.7;
    this.musicVol = 0.5;
    this.sfxVol = 0.85;
    this.intensity = 0;        // 0 calm .. 1 boss
    this.targetIntensity = 0;
    this._noise = null;
    this._nextNote = 0;
    this._step = 0;
    this._bpm = 96;
    this._fireBed = null;
    this._started = false;
    this._recent = new Map();  // name -> last play time, for throttling
  }

  // Must be called from a user gesture.
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    this.ctx = new AC();
    const c = this.ctx;

    this.master = c.createGain();
    this.master.gain.value = this.masterVol;
    this.master.connect(c.destination);

    // A gentle bus compressor stops the bullet-hell from clipping.
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -18;
    this.comp.knee.value = 12;
    this.comp.ratio.value = 6;
    this.comp.attack.value = 0.004;
    this.comp.release.value = 0.18;
    this.comp.connect(this.master);

    this.sfxBus = c.createGain();
    this.sfxBus.gain.value = this.sfxVol;
    this.sfxBus.connect(this.comp);

    this.musicBus = c.createGain();
    this.musicBus.gain.value = 0;
    this.musicBus.connect(this.comp);

    // Shared convolution-free "space": a short feedback delay used as reverb-ish.
    this.delay = c.createDelay(0.6);
    this.delay.delayTime.value = 0.22;
    this.delayFb = c.createGain();
    this.delayFb.gain.value = 0.28;
    this.delayFilter = c.createBiquadFilter();
    this.delayFilter.type = 'lowpass';
    this.delayFilter.frequency.value = 2200;
    this.delaySend = c.createGain();
    this.delaySend.gain.value = 0.3;
    this.delaySend.connect(this.delay);
    this.delay.connect(this.delayFilter);
    this.delayFilter.connect(this.delayFb);
    this.delayFb.connect(this.delay);
    this.delayFilter.connect(this.comp);

    this._buildNoise();
    this._buildMusicLayers();
  }

  resume() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    if (this.ctx && !this._started) {
      this._started = true;
      this._nextNote = this.ctx.currentTime + 0.1;
    }
  }

  get t() { return this.ctx ? this.ctx.currentTime : 0; }

  _buildNoise() {
    const c = this.ctx;
    const len = Math.floor(c.sampleRate * 2);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._noise = buf;
  }

  // --- primitives ----------------------------------------------------------
  /** One oscillator with an ADSR-ish envelope and optional pitch sweep. */
  tone(o = {}) {
    if (!this.ctx || !this.enabled) return null;
    const c = this.ctx;
    const t0 = o.at != null ? o.at : c.currentTime;
    const osc = c.createOscillator();
    osc.type = o.type || 'square';
    const f0 = o.freq || 440;
    const f1 = o.freq2 != null ? o.freq2 : f0;
    osc.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) {
      if (o.expo === false) osc.frequency.linearRampToValueAtTime(f1, t0 + (o.dur || 0.2));
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + (o.dur || 0.2));
    }
    if (o.detune) osc.detune.value = o.detune;

    const g = c.createGain();
    const vol = (o.vol == null ? 0.25 : o.vol);
    const atk = o.attack == null ? 0.004 : o.attack;
    const dur = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + atk);
    if (o.sustain) {
      g.gain.setValueAtTime(Math.max(0.0002, vol), t0 + dur * 0.6);
    }
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    let node = osc;
    if (o.filter) {
      const bq = c.createBiquadFilter();
      bq.type = o.filter;
      bq.frequency.setValueAtTime(o.cutoff || 1200, t0);
      if (o.cutoff2) bq.frequency.exponentialRampToValueAtTime(Math.max(40, o.cutoff2), t0 + dur);
      bq.Q.value = o.q == null ? 1 : o.q;
      node.connect(bq); node = bq;
    }
    node.connect(g);
    g.connect(o.bus || this.sfxBus);
    if (o.send) { const s = c.createGain(); s.gain.value = o.send; g.connect(s); s.connect(this.delaySend); }
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    return { osc, gain: g };
  }

  /** Filtered noise burst — impacts, explosions, wind, footsteps. */
  noise(o = {}) {
    if (!this.ctx || !this.enabled) return null;
    const c = this.ctx;
    const t0 = o.at != null ? o.at : c.currentTime;
    const src = c.createBufferSource();
    src.buffer = this._noise;
    src.loop = true;
    src.playbackRate.value = o.rate || 1;

    const bq = c.createBiquadFilter();
    bq.type = o.filter || 'bandpass';
    const f0 = o.freq || 900;
    const f1 = o.freq2 != null ? o.freq2 : f0;
    bq.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) bq.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + (o.dur || 0.2));
    bq.Q.value = o.q == null ? 1.2 : o.q;

    const g = c.createGain();
    const vol = o.vol == null ? 0.25 : o.vol;
    const dur = o.dur || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + (o.attack == null ? 0.005 : o.attack));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    src.connect(bq); bq.connect(g); g.connect(o.bus || this.sfxBus);
    if (o.send) { const s = c.createGain(); s.gain.value = o.send; g.connect(s); s.connect(this.delaySend); }
    src.start(t0);
    src.stop(t0 + dur + 0.05);
    return { src, gain: g, filter: bq };
  }

  // Prevents 40 simultaneous identical hits from turning into a wall of mud.
  _throttle(name, ms) {
    const now = performance.now();
    const last = this._recent.get(name) || -1e9;
    if (now - last < ms) return true;
    this._recent.set(name, now);
    return false;
  }

  // --- the SFX bank --------------------------------------------------------
  play(name, opt = {}) {
    if (!this.ctx || !this.enabled) return;
    const v = opt.vol == null ? 1 : opt.vol;
    switch (name) {
      case 'shoot':
        if (this._throttle('shoot', 24)) return;
        this.tone({ type: 'square', freq: 780, freq2: 190, dur: 0.09, vol: 0.16 * v, filter: 'lowpass', cutoff: 3800, cutoff2: 700 });
        this.noise({ freq: 2600, freq2: 500, dur: 0.07, vol: 0.10 * v, filter: 'highpass', q: 0.7 });
        break;
      case 'shotgun':
        this.noise({ freq: 1400, freq2: 180, dur: 0.24, vol: 0.28 * v, filter: 'lowpass', q: 0.6 });
        this.tone({ type: 'sawtooth', freq: 240, freq2: 60, dur: 0.2, vol: 0.18 * v });
        break;
      case 'rifle':
        this.tone({ type: 'sawtooth', freq: 1100, freq2: 140, dur: 0.13, vol: 0.19 * v, filter: 'lowpass', cutoff: 5200, cutoff2: 600 });
        this.noise({ freq: 3400, freq2: 700, dur: 0.11, vol: 0.14 * v, filter: 'highpass' });
        break;
      case 'sparker':
        if (this._throttle('sparker', 40)) return;
        this.tone({ type: 'square', freq: 1500, freq2: 2600, dur: 0.06, vol: 0.09 * v });
        this.noise({ freq: 5200, freq2: 2200, dur: 0.05, vol: 0.07 * v, filter: 'highpass' });
        break;
      case 'lob':
        this.tone({ type: 'sine', freq: 300, freq2: 640, dur: 0.16, vol: 0.16 * v });
        break;
      case 'hit':
        if (this._throttle('hit', 18)) return;
        this.noise({ freq: 2000, freq2: 420, dur: 0.06, vol: 0.14 * v, filter: 'bandpass', q: 1.2 });
        break;
      case 'flesh':
        if (this._throttle('flesh', 30)) return;
        this.noise({ freq: 700, freq2: 180, dur: 0.09, vol: 0.16 * v, filter: 'lowpass' });
        break;
      case 'metal':
        if (this._throttle('metal', 30)) return;
        this.tone({ type: 'square', freq: 1800, freq2: 900, dur: 0.06, vol: 0.07 * v });
        this.noise({ freq: 4200, freq2: 1800, dur: 0.07, vol: 0.09 * v, filter: 'highpass' });
        break;
      case 'explode':
        this.noise({ freq: 900, freq2: 60, dur: 0.62, vol: 0.36 * v, filter: 'lowpass', q: 0.7, send: 0.4 });
        this.tone({ type: 'sine', freq: 160, freq2: 32, dur: 0.5, vol: 0.3 * v });
        break;
      case 'bigexplode':
        this.noise({ freq: 1200, freq2: 40, dur: 1.1, vol: 0.44 * v, filter: 'lowpass', q: 0.6, send: 0.6 });
        this.tone({ type: 'sine', freq: 120, freq2: 24, dur: 0.9, vol: 0.34 * v });
        this.tone({ type: 'sawtooth', freq: 90, freq2: 20, dur: 0.7, vol: 0.16 * v, filter: 'lowpass', cutoff: 500 });
        break;
      case 'chop':
        this.noise({ freq: 620, freq2: 150, dur: 0.16, vol: 0.24 * v, filter: 'lowpass', q: 1.4 });
        this.tone({ type: 'triangle', freq: 210, freq2: 90, dur: 0.13, vol: 0.13 * v });
        break;
      case 'timber':
        this.noise({ freq: 400, freq2: 90, dur: 1.0, vol: 0.24 * v, filter: 'lowpass', q: 0.8, send: 0.4 });
        break;
      case 'mine':
        this.noise({ freq: 3000, freq2: 800, dur: 0.11, vol: 0.2 * v, filter: 'bandpass', q: 2.4 });
        this.tone({ type: 'square', freq: 520, freq2: 240, dur: 0.08, vol: 0.09 * v });
        break;
      case 'pick':
        this.tone({ type: 'sine', freq: 900, freq2: 1500, dur: 0.09, vol: 0.12 * v });
        break;
      case 'pickup':
        this.tone({ type: 'square', freq: 700, freq2: 1250, dur: 0.09, vol: 0.11 * v, send: 0.2 });
        break;
      case 'coinup':
        this.tone({ type: 'square', freq: 880, dur: 0.07, vol: 0.11 * v });
        this.tone({ type: 'square', freq: 1320, dur: 0.11, vol: 0.11 * v, at: this.t + 0.07 });
        break;
      case 'craft':
        [0, 4, 7, 12].forEach((s, i) => this.tone({ type: 'triangle', freq: midi(60 + s), dur: 0.28, vol: 0.13 * v, at: this.t + i * 0.07, send: 0.4 }));
        break;
      case 'deliver':
        this.tone({ type: 'sine', freq: midi(64), dur: 0.14, vol: 0.13 * v });
        this.tone({ type: 'sine', freq: midi(71), dur: 0.2, vol: 0.12 * v, at: this.t + 0.09, send: 0.3 });
        break;
      case 'quest':
        [0, 5, 9, 12, 16].forEach((s, i) => this.tone({ type: 'triangle', freq: midi(60 + s), dur: 0.4, vol: 0.12 * v, at: this.t + i * 0.09, send: 0.5 }));
        break;
      case 'recruit':
        [0, 7, 12, 19].forEach((s, i) => this.tone({ type: 'sawtooth', freq: midi(52 + s), dur: 0.6, vol: 0.1 * v, at: this.t + i * 0.11, filter: 'lowpass', cutoff: 2600, send: 0.5 }));
        break;
      case 'ui':
        this.tone({ type: 'square', freq: 620, dur: 0.04, vol: 0.07 * v });
        break;
      case 'uiselect':
        this.tone({ type: 'square', freq: 520, freq2: 880, dur: 0.08, vol: 0.09 * v });
        break;
      case 'deny':
        this.tone({ type: 'square', freq: 220, freq2: 130, dur: 0.16, vol: 0.11 * v });
        break;
      case 'dash':
        this.noise({ freq: 500, freq2: 3200, dur: 0.18, vol: 0.14 * v, filter: 'bandpass', q: 0.8 });
        break;
      case 'hurt':
        this.tone({ type: 'sawtooth', freq: 420, freq2: 110, dur: 0.26, vol: 0.24 * v, filter: 'lowpass', cutoff: 2000 });
        this.noise({ freq: 1200, freq2: 200, dur: 0.2, vol: 0.16 * v });
        break;
      case 'shieldbreak':
        this.tone({ type: 'square', freq: 1600, freq2: 300, dur: 0.3, vol: 0.16 * v, filter: 'bandpass', q: 4 });
        break;
      case 'chip':
        this.tone({ type: 'square', freq: 1200, dur: 0.05, vol: 0.1 * v });
        this.tone({ type: 'square', freq: 1800, dur: 0.05, vol: 0.1 * v, at: this.t + 0.05 });
        this.tone({ type: 'square', freq: 2400, dur: 0.12, vol: 0.1 * v, at: this.t + 0.1, send: 0.4 });
        break;
      case 'scan':
        this.tone({ type: 'sine', freq: 1800, freq2: 400, dur: 0.5, vol: 0.1 * v, send: 0.5 });
        this.tone({ type: 'sine', freq: 2700, freq2: 600, dur: 0.45, vol: 0.05 * v, at: this.t + 0.04 });
        break;
      case 'geyser':
        this.noise({ freq: 300, freq2: 2600, dur: 1.6, vol: 0.22 * v, filter: 'bandpass', q: 0.5, attack: 0.4, send: 0.5 });
        break;
      case 'bubble':
        if (this._throttle('bubble', 220)) return;
        this.tone({ type: 'sine', freq: 200 + Math.random() * 200, freq2: 500, dur: 0.13, vol: 0.05 * v });
        break;
      case 'wavewarn':
        this.tone({ type: 'sawtooth', freq: 160, freq2: 320, dur: 0.7, vol: 0.16 * v, filter: 'lowpass', cutoff: 900, send: 0.5 });
        this.tone({ type: 'sawtooth', freq: 240, dur: 0.7, vol: 0.08 * v, at: this.t + 0.36 });
        break;
      case 'wavestart':
        [0, 0.12, 0.24].forEach((d, i) => this.tone({ type: 'square', freq: midi(48 + i * 5), dur: 0.3, vol: 0.15 * v, at: this.t + d, filter: 'lowpass', cutoff: 1800 }));
        this.noise({ freq: 120, freq2: 60, dur: 0.9, vol: 0.2 * v, filter: 'lowpass' });
        break;
      case 'waveclear':
        [0, 4, 7, 12, 16, 19].forEach((s, i) => this.tone({ type: 'triangle', freq: midi(60 + s), dur: 0.5, vol: 0.12 * v, at: this.t + i * 0.08, send: 0.6 }));
        break;
      case 'alarm':
        this.tone({ type: 'square', freq: 880, freq2: 660, dur: 0.4, vol: 0.13 * v, filter: 'bandpass', q: 3 });
        break;
      case 'talk':
        if (this._throttle('talk', 45)) return;
        this.tone({ type: 'square', freq: (opt.pitch || 1) * (500 + Math.random() * 220), dur: 0.035, vol: 0.055 * v, filter: 'lowpass', cutoff: 1800 });
        break;
      case 'step':
        if (this._throttle('step', 90)) return;
        this.noise({ freq: 380 + Math.random() * 160, freq2: 160, dur: 0.06, vol: 0.055 * v, filter: 'lowpass', q: 1.1 });
        break;
      case 'splash':
        this.noise({ freq: 1600, freq2: 400, dur: 0.3, vol: 0.16 * v, filter: 'bandpass', q: 0.6 });
        break;
      case 'roar':
        this.tone({ type: 'sawtooth', freq: 90, freq2: 60, dur: 1.2, vol: 0.28 * v, filter: 'lowpass', cutoff: 700, cutoff2: 260, send: 0.5 });
        this.noise({ freq: 240, freq2: 90, dur: 1.2, vol: 0.16 * v, filter: 'lowpass' });
        break;
      case 'laser':
        this.tone({ type: 'sawtooth', freq: 180, freq2: 1400, dur: 0.9, vol: 0.14 * v, filter: 'bandpass', q: 6, send: 0.3 });
        break;
      case 'laserfire':
        this.tone({ type: 'square', freq: 2200, freq2: 300, dur: 0.4, vol: 0.2 * v, filter: 'bandpass', q: 3 });
        this.noise({ freq: 3000, freq2: 600, dur: 0.4, vol: 0.14 * v });
        break;
      case 'firewhoosh':
        this.noise({ freq: 400, freq2: 1800, dur: 1.4, vol: 0.2 * v, filter: 'bandpass', q: 0.5, attack: 0.5, send: 0.6 });
        break;
      case 'rescue':
        [0, 7, 12].forEach((s, i) => this.tone({ type: 'sine', freq: midi(67 + s), dur: 0.35, vol: 0.12 * v, at: this.t + i * 0.08, send: 0.5 }));
        break;
      case 'levelup':
        [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone({ type: 'square', freq: midi(60 + s), dur: 0.4, vol: 0.1 * v, at: this.t + i * 0.06, send: 0.5 }));
        break;
      case 'die':
        this.tone({ type: 'sawtooth', freq: 300, freq2: 40, dur: 1.6, vol: 0.24 * v, filter: 'lowpass', cutoff: 1400, cutoff2: 180, send: 0.6 });
        break;
      default: break;
    }
  }

  // --- music ---------------------------------------------------------------
  _buildMusicLayers() {
    const c = this.ctx;
    const mk = (vol) => { const g = c.createGain(); g.gain.value = vol; g.connect(this.musicBus); return g; };
    this.layers = {
      pad: mk(0.5),
      arp: mk(0.35),
      bass: mk(0.5),
      drums: mk(0.5),
      lead: mk(0.4),
    };
    const send = c.createGain();
    send.gain.value = 0.35;
    this.layers.arp.connect(send);
    this.layers.lead.connect(send);
    send.connect(this.delaySend);
  }

  setIntensity(v) { this.targetIntensity = Math.max(0, Math.min(1, v)); }

  /** Called once per frame. Schedules music ~0.4s ahead of the clock. */
  update(dt) {
    if (!this.ctx || !this.enabled || !this._started) return;
    this.intensity += (this.targetIntensity - this.intensity) * Math.min(1, dt * 0.9);
    this.musicBus.gain.value = this.musicVol;

    const c = this.ctx;
    const spb = 60 / this._bpm;
    const step = spb / 4;                    // sixteenth notes
    let guard = 0;
    while (this._nextNote < c.currentTime + 0.4 && guard++ < 64) {
      this._scheduleStep(this._step, this._nextNote, step);
      this._step = (this._step + 1) % 64;
      this._nextNote += step;
    }
  }

  _scheduleStep(s, t, stepDur) {
    const I = this.intensity;
    const L = this.layers;
    const bar = Math.floor(s / 16);
    // A slow, bleak minor progression: i - VI - III - VII
    const roots = [45, 41, 48, 43];
    const root = roots[bar % 4];
    const scale = I > 0.45 ? SCALE_AEOLIAN : SCALE_MINOR_PENT;
    this._bpm = 88 + I * 44;

    // Pad — always present, opens up as things calm down.
    if (s % 16 === 0) {
      const padVol = 0.05 + (1 - I) * 0.05;
      for (const iv of [0, 7, 12]) {
        this.tone({ type: 'triangle', freq: midi(root - 12 + iv), dur: stepDur * 16, vol: padVol, attack: 0.4, bus: L.pad, at: t, filter: 'lowpass', cutoff: 700 + I * 900 });
      }
    }

    // Arpeggio — the "wandering the basin" voice.
    if ((1 - I) > 0.25 && s % 2 === 0) {
      const idx = (s / 2) % scale.length;
      const oct = ((s / 2) % 8) < 4 ? 12 : 24;
      this.tone({
        type: 'square', freq: midi(root + scale[idx] + oct), dur: stepDur * 1.7,
        vol: 0.035 * (1 - I) + 0.008, bus: L.arp, at: t, filter: 'lowpass', cutoff: 2400,
      });
    }

    // Bass — drives everything once combat starts.
    if (I > 0.2) {
      const pat = [1, 0, 0, 1, 0, 0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 0];
      if (pat[s % 16]) {
        this.tone({
          type: 'sawtooth', freq: midi(root - 12), dur: stepDur * 1.6, vol: 0.075 * I,
          bus: L.bass, at: t, filter: 'lowpass', cutoff: 340 + I * 900, q: 5,
        });
      }
    }

    // Drums.
    if (I > 0.15) {
      const kick = [0, 6, 8, 14];
      const snare = [4, 12];
      if (kick.includes(s % 16)) {
        this.tone({ type: 'sine', freq: 150, freq2: 42, dur: 0.19, vol: 0.16 * I, bus: L.drums, at: t });
      }
      if (snare.includes(s % 16)) {
        this.noise({ freq: 1700, freq2: 700, dur: 0.15, vol: 0.1 * I, bus: L.drums, at: t, filter: 'bandpass', q: 0.8 });
      }
      if (I > 0.5 && s % 2 === 1) {
        this.noise({ freq: 8000, dur: 0.035, vol: 0.032 * I, bus: L.drums, at: t, filter: 'highpass' });
      }
    }

    // Lead — a defiant motif that only shows up when it's really bad.
    if (I > 0.72 && s % 16 === 0) {
      const motif = [0, 3, 7, 10, 7, 3];
      motif.forEach((iv, i) => {
        this.tone({
          type: 'sawtooth', freq: midi(root + 12 + iv), dur: stepDur * 2.2,
          vol: 0.05 * I, bus: L.lead, at: t + i * stepDur * 2,
          filter: 'lowpass', cutoff: 2200, q: 3,
        });
      });
    }
  }

  /** A looping crackle bed for the forest-fire sequence. */
  setFire(level) {
    if (!this.ctx || !this.enabled) return;
    if (level > 0.02 && !this._fireBed) {
      const c = this.ctx;
      const src = c.createBufferSource();
      src.buffer = this._noise; src.loop = true;
      const bq = c.createBiquadFilter(); bq.type = 'bandpass'; bq.frequency.value = 900; bq.Q.value = 0.5;
      const g = c.createGain(); g.gain.value = 0;
      src.connect(bq); bq.connect(g); g.connect(this.comp);
      src.start();
      this._fireBed = { src, gain: g, filter: bq };
    }
    if (this._fireBed) {
      const target = Math.min(0.34, level * 0.34);
      this._fireBed.gain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.6);
      this._fireBed.filter.frequency.setTargetAtTime(500 + level * 1400, this.ctx.currentTime, 0.8);
    }
  }

  setMuted(m) {
    this.enabled = !m;
    if (this.master) this.master.gain.value = m ? 0 : this.masterVol;
  }
}

// ==========================================================================
// src/engine/canvas.js
// ==========================================================================
// Pixel-perfect renderer. The screen canvas is a tiny internal resolution that
// the browser upscales with nearest-neighbour, so every drawn pixel is a real,
// chunky pixel. All world drawing goes through the camera transform.

// bundled: import { clamp, damp, snap } from './math.js';

// Internal resolution. These are LIVE module bindings: `resize()` reassigns
// them so the game fills whatever screen it lands on — a 16:9 monitor, a 4:3
// iPad, a phone held sideways — instead of letterboxing a fixed 480x270 box.
let VIEW_W = 640;
let VIEW_H = 400;

// Roughly how many game pixels tall the picture should be. Bigger = more of
// the basin on screen and a smaller ferret in the middle of it; this is the
// knob that decides how much world you can see at once.
//
// It went up when the sprites did. The art now carries enough detail to stand
// being further away, and standing further away is what makes a forest feel
// like a forest rather than a corridor of trees.
const TARGET_PX = 420;
const MIN_H = 240, MAX_H = 560;
const MIN_W = 340, MAX_W = 980;

const evenDown = (v) => Math.max(2, Math.floor(v / 2) * 2);

/**
 * Pick an internal resolution and an integer upscale for the current window.
 * Tries every whole scale and keeps the one that covers the most screen while
 * staying near the target pixel size, so a 4:3 iPad fills edge to edge instead
 * of floating in a letterbox.
 */
function computeViewport(availW, availH) {
  const ideal = Math.max(1, availH / TARGET_PX);
  let best = null;
  for (let scale = 1; scale <= 10; scale++) {
    const w = evenDown(Math.min(availW / scale, MAX_W));
    const h = evenDown(Math.min(availH / scale, MAX_H));
    if (w < MIN_W || h < MIN_H) continue;
    const coverage = (w * scale * h * scale) / (availW * availH);
    const sizePenalty = Math.abs(Math.log2(scale / ideal)) * 0.12;
    const score = coverage - sizePenalty;
    if (!best || score > best.score) best = { w, h, scale, score };
  }
  // Nothing fit the minimums (a very small window): fall back to 1:1.
  if (!best) best = { w: evenDown(Math.max(MIN_W, availW)), h: evenDown(Math.max(MIN_H, availH)), scale: 1, score: 0 };
  return best;
}

class Camera {
  constructor() {
    this.x = 0; this.y = 0;
    this.tx = 0; this.ty = 0;
    this.shake = 0;
    this.shakeX = 0; this.shakeY = 0;
    this.zoom = 1;
    this.bounds = null; // {minX,minY,maxX,maxY} in world px
  }
  follow(x, y, lead = 0, leadX = 0, leadY = 0) {
    this.tx = x + leadX * lead;
    this.ty = y + leadY * lead;
  }
  addShake(amount) { this.shake = Math.min(this.shake + amount, 14); }
  update(dt) {
    this.x = damp(this.x, this.tx, 0.0008, dt);
    this.y = damp(this.y, this.ty, 0.0008, dt);
    if (this.bounds) {
      const hw = VIEW_W / 2, hh = VIEW_H / 2;
      const b = this.bounds;
      if (b.maxX - b.minX > VIEW_W) this.x = clamp(this.x, b.minX + hw, b.maxX - hw);
      else this.x = (b.minX + b.maxX) / 2;
      if (b.maxY - b.minY > VIEW_H) this.y = clamp(this.y, b.minY + hh, b.maxY - hh);
      else this.y = (b.minY + b.maxY) / 2;
    }
    this.shake = Math.max(0, this.shake - dt * 26);
    const s = this.shake;
    this.shakeX = (Math.random() * 2 - 1) * s;
    this.shakeY = (Math.random() * 2 - 1) * s;
  }
  // Top-left of the visible world rect, snapped to whole pixels.
  get ox() { return snap(this.x - VIEW_W / 2 + this.shakeX); }
  get oy() { return snap(this.y - VIEW_H / 2 + this.shakeY); }
  toScreen(wx, wy) { return { x: wx - this.ox, y: wy - this.oy }; }
  toWorld(sx, sy) { return { x: sx + this.ox, y: sy + this.oy }; }
  visible(wx, wy, pad = 40) {
    const ox = this.ox, oy = this.oy;
    return wx > ox - pad && wx < ox + VIEW_W + pad && wy > oy - pad && wy < oy + VIEW_H + pad;
  }
}

const RADIAL_CACHE = new Map();

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  return { canvas: c, ctx };
}

class Renderer {
  constructor(screenCanvas) {
    this.canvas = screenCanvas;
    this.canvas.width = VIEW_W;
    this.canvas.height = VIEW_H;
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    this.camera = new Camera();

    // Lightmap: multiplied over the frame for fire glow, night, geyser light.
    const lm = makeCanvas(VIEW_W, VIEW_H);
    this.lightCanvas = lm.canvas;
    this.lightCtx = lm.ctx;

    // Additive layer for glows, muzzle flashes, embers.
    const gl = makeCanvas(VIEW_W, VIEW_H);
    this.glowCanvas = gl.canvas;
    this.glowCtx = gl.ctx;

    this.resize();
    const onResize = () => this.resize();
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', onResize);
      window.visualViewport.addEventListener('scroll', onResize);
    }
  }

  resize() {
    // The visual viewport is what actually matters on iOS, where the browser
    // chrome and the on-screen keyboard shrink the usable area.
    const vv = window.visualViewport;
    const availW = Math.round(vv ? vv.width : window.innerWidth);
    const availH = Math.round(vv ? vv.height : window.innerHeight);
    const v = computeViewport(availW, availH);

    if (v.w !== VIEW_W || v.h !== VIEW_H) {
      VIEW_W = v.w; VIEW_H = v.h;
      this.canvas.width = VIEW_W;
      this.canvas.height = VIEW_H;
      this.ctx.imageSmoothingEnabled = false;
      // The compositing buffers have to match the new size.
      const lm = makeCanvas(VIEW_W, VIEW_H);
      this.lightCanvas = lm.canvas; this.lightCtx = lm.ctx;
      const gl = makeCanvas(VIEW_W, VIEW_H);
      this.glowCanvas = gl.canvas; this.glowCtx = gl.ctx;
      if (this.onResize) this.onResize(VIEW_W, VIEW_H);
    }

    // computeViewport already guaranteed this scale fits.
    this.scale = v.scale;
    this.canvas.style.width = (VIEW_W * v.scale) + 'px';
    this.canvas.style.height = (VIEW_H * v.scale) + 'px';
  }

  get width() { return VIEW_W; }
  get height() { return VIEW_H; }

  beginFrame(skyColor) {
    const c = this.ctx;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = skyColor;
    c.fillRect(0, 0, VIEW_W, VIEW_H);
    // Lightmap starts at "ambient" and gets brightened by light sources.
    this.lightCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.lightCtx.globalCompositeOperation = 'source-over';
    this.glowCtx.setTransform(1, 0, 0, 1, 0, 0);
    this.glowCtx.globalCompositeOperation = 'source-over';
    this.glowCtx.clearRect(0, 0, VIEW_W, VIEW_H);
    this._lightUsed = false;
  }

  clearLight(ambient) {
    this.lightCtx.globalCompositeOperation = 'source-over';
    this.lightCtx.fillStyle = ambient;
    this.lightCtx.fillRect(0, 0, VIEW_W, VIEW_H);
    this.lightCtx.globalCompositeOperation = 'lighter';
    this._lightUsed = true;
  }

  /**
   * Radial falloff sprites, baked once per (radius, colour) pair. Building a
   * CanvasGradient per call is fine for a handful of lights and ruinous for a
   * thousand glowing bullets, so everything goes through this cache.
   */
  _radial(radius, color) {
    const r = Math.max(2, Math.round(radius));
    const key = r + '|' + color;
    let c = RADIAL_CACHE.get(key);
    if (c) return c;
    const size = r * 2;
    const { canvas, ctx } = makeCanvas(size, size);
    const g = ctx.createRadialGradient(r, r, 0, r, r, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    if (RADIAL_CACHE.size > 260) RADIAL_CACHE.clear();
    RADIAL_CACHE.set(key, canvas);
    return canvas;
  }

  // Radial light in world coordinates.
  light(wx, wy, radius, color = '#ffffff', intensity = 1) {
    const x = wx - this.camera.ox, y = wy - this.camera.oy;
    if (x < -radius || y < -radius || x > VIEW_W + radius || y > VIEW_H + radius) return;
    const img = this._radial(radius, color);
    const c = this.lightCtx;
    c.globalAlpha = intensity;
    c.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
    c.globalAlpha = 1;
  }

  glow(wx, wy, radius, color, intensity = 1) {
    const x = wx - this.camera.ox, y = wy - this.camera.oy;
    if (x < -radius || y < -radius || x > VIEW_W + radius || y > VIEW_H + radius) return;
    const img = this._radial(radius, color);
    const c = this.glowCtx;
    c.globalAlpha = intensity;
    c.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
    c.globalAlpha = 1;
  }

  endWorld() {
    if (this._lightUsed) {
      this.ctx.globalCompositeOperation = 'multiply';
      this.ctx.drawImage(this.lightCanvas, 0, 0);
    }
    this.ctx.globalCompositeOperation = 'lighter';
    this.ctx.drawImage(this.glowCanvas, 0, 0);
    this.ctx.globalCompositeOperation = 'source-over';
  }

  // --- world-space primitives ---------------------------------------------
  draw(img, wx, wy, flip = false, alpha = 1) {
    if (!img) return;
    const x = snap(wx - this.camera.ox), y = snap(wy - this.camera.oy);
    if (x + img.width < 0 || y + img.height < 0 || x > VIEW_W || y > VIEW_H) return;
    const c = this.ctx;
    if (alpha !== 1) c.globalAlpha = alpha;
    if (flip) {
      c.save();
      c.translate(x + img.width, y);
      c.scale(-1, 1);
      c.drawImage(img, 0, 0);
      c.restore();
    } else {
      c.drawImage(img, x, y);
    }
    if (alpha !== 1) c.globalAlpha = 1;
  }

  // Draw with arbitrary rotation/scale (used for bullets, debris, wings).
  drawT(img, wx, wy, rot = 0, sx = 1, sy = 1, alpha = 1, originX = null, originY = null) {
    if (!img) return;
    const c = this.ctx;
    const ox = originX == null ? img.width / 2 : originX;
    const oy = originY == null ? img.height / 2 : originY;
    c.save();
    c.globalAlpha = alpha;
    c.translate(snap(wx - this.camera.ox), snap(wy - this.camera.oy));
    if (rot) c.rotate(rot);
    if (sx !== 1 || sy !== 1) c.scale(sx, sy);
    c.drawImage(img, -ox, -oy);
    c.restore();
  }

  rect(wx, wy, w, h, color) {
    const c = this.ctx;
    c.fillStyle = color;
    c.fillRect(snap(wx - this.camera.ox), snap(wy - this.camera.oy), Math.round(w), Math.round(h));
  }
  rectA(wx, wy, w, h, color, alpha) {
    const c = this.ctx; c.globalAlpha = alpha;
    c.fillStyle = color;
    c.fillRect(snap(wx - this.camera.ox), snap(wy - this.camera.oy), Math.round(w), Math.round(h));
    c.globalAlpha = 1;
  }
  strokeRect(wx, wy, w, h, color) {
    const c = this.ctx;
    c.strokeStyle = color; c.lineWidth = 1;
    c.strokeRect(snap(wx - this.camera.ox) + 0.5, snap(wy - this.camera.oy) + 0.5, Math.round(w) - 1, Math.round(h) - 1);
  }
  circle(wx, wy, r, color, alpha = 1) {
    const c = this.ctx;
    c.globalAlpha = alpha; c.fillStyle = color;
    c.beginPath(); c.arc(snap(wx - this.camera.ox), snap(wy - this.camera.oy), r, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
  }
  ring(wx, wy, r, color, width = 1, alpha = 1) {
    const c = this.ctx;
    c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = width;
    c.beginPath(); c.arc(snap(wx - this.camera.ox), snap(wy - this.camera.oy), r, 0, Math.PI * 2); c.stroke();
    c.globalAlpha = 1;
  }
  arc(wx, wy, r, a0, a1, color, width = 1, alpha = 1) {
    const c = this.ctx;
    c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = width;
    c.beginPath(); c.arc(snap(wx - this.camera.ox), snap(wy - this.camera.oy), r, a0, a1); c.stroke();
    c.globalAlpha = 1;
  }
  line(x1, y1, x2, y2, color, width = 1, alpha = 1) {
    const c = this.ctx;
    c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = width;
    c.beginPath();
    c.moveTo(snap(x1 - this.camera.ox) + 0.5, snap(y1 - this.camera.oy) + 0.5);
    c.lineTo(snap(x2 - this.camera.ox) + 0.5, snap(y2 - this.camera.oy) + 0.5);
    c.stroke();
    c.globalAlpha = 1;
  }

  // Soft elliptical contact shadow under an entity.
  /**
   * A contact shadow.
   *
   * Two ellipses rather than one: a wide soft pool that says roughly where the
   * mass is, and a tight dark core right under the feet. A single flat ellipse
   * reads as a decal stuck to the ground; the core is what actually makes a
   * thing look like it is standing ON the grass rather than hovering above it.
   */
  shadow(wx, wy, rx, ry = null, alpha = 0.28) {
    const c = this.ctx;
    const sx = snap(wx - this.camera.ox), sy = snap(wy - this.camera.oy);
    const RX = Math.round(rx), RY = Math.round(ry == null ? rx * 0.45 : ry);
    c.fillStyle = '#000';
    c.globalAlpha = alpha * 0.42;
    c.beginPath();
    c.ellipse(sx, sy, RX + 2, RY + 1, 0, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = alpha;
    c.beginPath();
    c.ellipse(sx, sy, Math.max(1, Math.round(RX * 0.62)), Math.max(1, Math.round(RY * 0.62)), 0, 0, Math.PI * 2);
    c.fill();
    c.globalAlpha = 1;
  }

  // --- screen-space (UI) ---------------------------------------------------
  uiRect(x, y, w, h, color, alpha = 1) {
    const c = this.ctx; c.globalAlpha = alpha; c.fillStyle = color;
    c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    c.globalAlpha = 1;
  }
  uiStroke(x, y, w, h, color, alpha = 1) {
    const c = this.ctx; c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = 1;
    c.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w) - 1, Math.round(h) - 1);
    c.globalAlpha = 1;
  }
  // Panel with the game's chunky two-tone border.
  panel(x, y, w, h, fill = 'rgba(9,16,13,0.92)', border = '#3d5a41') {
    this.uiRect(x, y, w, h, fill);
    this.uiStroke(x, y, w, h, border);
    this.uiRect(x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,0.06)');
  }
  vignette(strength = 0.5) {
    const c = this.ctx;
    const g = c.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.32, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.82);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0,0,0,${strength})`);
    c.fillStyle = g;
    c.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  flash(color, alpha) {
    if (alpha <= 0) return;
    const c = this.ctx;
    c.globalAlpha = Math.min(1, alpha);
    c.fillStyle = color;
    c.fillRect(0, 0, VIEW_W, VIEW_H);
    c.globalAlpha = 1;
  }
}


// ==========================================================================
// src/engine/particles.js
// ==========================================================================
// Pooled particle system. Everything is a small axis-aligned rect so the whole
// effects layer stays inside the pixel-art look — no soft blurry sprites.
// Particles have a `z` height so sparks and debris can arc and land.

// bundled: import { rnd } from './rng.js';
// bundled: import { TAU, clamp } from './math.js';
// bundled: import { VIEW_W, VIEW_H } from './canvas.js';

const MAX = 1400;

class Particles {
  constructor() {
    this.pool = new Array(MAX);
    for (let i = 0; i < MAX; i++) this.pool[i] = { alive: false };
    this.head = 0;
    this.texts = [];
    this.rings = [];
  }

  _get() {
    for (let i = 0; i < MAX; i++) {
      const idx = (this.head + i) % MAX;
      if (!this.pool[idx].alive) { this.head = (idx + 1) % MAX; return this.pool[idx]; }
    }
    // Pool exhausted: recycle the oldest slot.
    const p = this.pool[this.head];
    this.head = (this.head + 1) % MAX;
    return p;
  }

  spawn(o) {
    const p = this._get();
    p.alive = true;
    p.x = o.x; p.y = o.y; p.z = o.z || 0;
    p.vx = o.vx || 0; p.vy = o.vy || 0; p.vz = o.vz || 0;
    p.life = p.maxLife = o.life || 0.5;
    p.size = o.size || 1;
    p.endSize = o.endSize == null ? p.size : o.endSize;
    p.colors = o.colors || [o.color || '#fff'];
    p.gravity = o.gravity || 0;
    p.drag = o.drag == null ? 1.6 : o.drag;
    p.additive = !!o.additive;
    p.bounce = o.bounce || 0;
    p.fade = o.fade == null ? true : o.fade;
    p.wobble = o.wobble || 0;
    p.phase = rnd(TAU);
    p.shrink = o.shrink !== false;
    p.layer = o.layer || 0;   // 0 = above ground, -1 = flat on the ground
    return p;
  }

  // --- effect recipes ------------------------------------------------------
  burst(x, y, n, o = {}) {
    const speed = o.speed || 60;
    for (let i = 0; i < n; i++) {
      const a = o.angle != null ? o.angle + rnd(-o.spread || -0.6, o.spread || 0.6) : rnd(TAU);
      const s = speed * rnd(0.35, 1);
      this.spawn({
        x, y, z: o.z || 2,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.7,
        vz: o.vz != null ? rnd(0, o.vz) : rnd(10, 60),
        life: (o.life || 0.5) * rnd(0.6, 1.3),
        size: o.size || 1, endSize: o.endSize,
        colors: o.colors, color: o.color,
        gravity: o.gravity == null ? 220 : o.gravity,
        drag: o.drag, additive: o.additive, bounce: o.bounce,
      });
    }
  }

  sparks(x, y, n = 8, color = '#ffd97a') {
    this.burst(x, y, n, { colors: [color, '#fff3c4', '#ff9c4a'], speed: 120, life: 0.36, additive: true, vz: 70, size: 1 });
  }

  blood(x, y, n = 8, colors = ['#8e2a2a', '#c04141', '#5c1a1a']) {
    this.burst(x, y, n, { colors, speed: 70, life: 0.6, vz: 40, size: 1, gravity: 320, bounce: 0.2 });
  }

  woodChips(x, y, n = 8) {
    this.burst(x, y, n, { colors: ['#8a6234', '#a97c46', '#5f4224', '#c49a63'], speed: 80, life: 0.7, vz: 90, size: 1, gravity: 340, bounce: 0.35 });
  }

  rockChips(x, y, n = 8, colors = ['#7c8489', '#9aa3a8', '#5a6165']) {
    this.burst(x, y, n, { colors, speed: 85, life: 0.6, vz: 90, size: 1, gravity: 360, bounce: 0.4 });
  }

  smoke(x, y, n = 4, o = {}) {
    for (let i = 0; i < n; i++) {
      this.spawn({
        x: x + rnd(-3, 3), y: y + rnd(-2, 2), z: o.z || 3,
        vx: rnd(-8, 8) + (o.vx || 0), vy: rnd(-6, 2) + (o.vy || 0), vz: rnd(12, 30),
        life: (o.life || 1.4) * rnd(0.7, 1.3),
        size: o.size || 2, endSize: (o.size || 2) + 2,
        colors: o.colors || ['#3a3d3c', '#4a4e4c', '#2a2d2c'],
        gravity: -8, drag: 1.1, shrink: false,
      });
    }
  }

  embers(x, y, n = 3) {
    for (let i = 0; i < n; i++) {
      this.spawn({
        x: x + rnd(-4, 4), y: y + rnd(-3, 3), z: rnd(0, 4),
        vx: rnd(-14, 14), vy: rnd(-10, 2), vz: rnd(24, 60),
        life: rnd(0.8, 2.0), size: 1,
        colors: ['#ff9a3c', '#ffd05a', '#ff5b2e'],
        gravity: -14, drag: 1.2, additive: true, wobble: rnd(8, 20),
      });
    }
  }

  dust(x, y, n = 5, color = '#6d7a5e') {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU);
      this.spawn({
        x, y, z: 1,
        vx: Math.cos(a) * rnd(10, 34), vy: Math.sin(a) * rnd(6, 20), vz: rnd(2, 12),
        life: rnd(0.3, 0.7), size: 1, colors: [color, '#8a9776'], gravity: 40, drag: 2.4,
      });
    }
  }

  leaves(x, y, n = 6, colors = ['#4b7a3a', '#3d6630', '#6d9146']) {
    for (let i = 0; i < n; i++) {
      this.spawn({
        x: x + rnd(-6, 6), y: y + rnd(-6, 6), z: rnd(6, 22),
        vx: rnd(-18, 18), vy: rnd(-6, 12), vz: rnd(-4, 8),
        life: rnd(1.2, 2.6), size: 1, colors, gravity: 26, drag: 1.0, wobble: rnd(14, 30),
      });
    }
  }

  water(x, y, n = 8) {
    this.burst(x, y, n, { colors: ['#5fa8c4', '#8fd0e0', '#3c7f99'], speed: 70, life: 0.5, vz: 70, gravity: 300, size: 1 });
  }

  chipSpark(x, y) {
    this.burst(x, y, 10, { colors: ['#4de1ff', '#b8f5ff', '#2596c9'], speed: 90, life: 0.5, additive: true, vz: 60 });
  }

  scrap(x, y, n = 10) {
    this.burst(x, y, n, { colors: ['#9aa3a8', '#c9d2d6', '#5a6165', '#ffb14a'], speed: 110, life: 0.8, vz: 110, gravity: 380, bounce: 0.35 });
  }

  /** Expanding ring — shockwaves, scan pulses, spawn telegraphs. */
  ring(x, y, r0, r1, life, color, width = 1, additive = false) {
    this.rings.push({ x, y, r0, r1, life, maxLife: life, color, width, additive });
  }

  /** Floating combat text. */
  text(x, y, str, color = '#fff', o = {}) {
    this.texts.push({
      x, y, str, color,
      life: o.life || 0.9, maxLife: o.life || 0.9,
      vy: o.vy == null ? -26 : o.vy,
      vx: o.vx || 0,
      scale: o.scale || 1,
      shadow: o.shadow !== false,
    });
    if (this.texts.length > 60) this.texts.shift();
  }

  update(dt) {
    for (let i = 0; i < MAX; i++) {
      const p = this.pool[i];
      if (!p.alive) continue;
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; continue; }
      const d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d;
      if (p.wobble) p.vx += Math.sin(p.phase + p.life * 6) * p.wobble * dt;
      p.vz -= p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.z += p.vz * dt;
      if (p.z < 0) {
        p.z = 0;
        if (p.bounce > 0 && Math.abs(p.vz) > 12) { p.vz = -p.vz * p.bounce; p.vx *= 0.6; p.vy *= 0.6; }
        else { p.vz = 0; p.vx *= 0.85; p.vy *= 0.85; }
      }
    }
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) this.rings.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt;
      t.y += t.vy * dt;
      t.x += t.vx * dt;
      t.vy *= Math.exp(-2.2 * dt);
      if (t.life <= 0) this.texts.splice(i, 1);
    }
  }

  draw(r, layer = 0) {
    const ctx = r.ctx;
    const ox = r.camera.ox, oy = r.camera.oy;
    let additiveOn = false;
    for (let i = 0; i < MAX; i++) {
      const p = this.pool[i];
      if (!p.alive || p.layer !== layer) continue;
      const sx = Math.round(p.x - ox);
      const sy = Math.round(p.y - p.z - oy);
      if (sx < -8 || sy < -8 || sx > VIEW_W + 8 || sy > VIEW_H + 8) continue;
      const t = p.life / p.maxLife;
      const ci = clamp(Math.floor((1 - t) * p.colors.length), 0, p.colors.length - 1);
      // t runs 1 -> 0 over the lifetime, so this interpolates size -> endSize.
      const size = Math.max(1, Math.round(p.size + (p.endSize - p.size) * (1 - t)));
      if (p.additive !== additiveOn) {
        ctx.globalCompositeOperation = p.additive ? 'lighter' : 'source-over';
        additiveOn = p.additive;
      }
      ctx.globalAlpha = p.fade ? clamp(t * 1.6, 0, 1) : 1;
      ctx.fillStyle = p.colors[ci];
      ctx.fillRect(sx, sy, size, size);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    if (layer === 0) {
      for (const rg of this.rings) {
        const t = 1 - rg.life / rg.maxLife;
        const rad = rg.r0 + (rg.r1 - rg.r0) * t;
        if (rg.additive) ctx.globalCompositeOperation = 'lighter';
        r.ring(rg.x, rg.y, rad, rg.color, rg.width, 1 - t);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  drawTexts(r, drawText) {
    for (const t of this.texts) {
      const a = clamp(t.life / t.maxLife * 1.8, 0, 1);
      const sx = t.x - r.camera.ox;
      const sy = t.y - r.camera.oy;
      drawText(r.ctx, t.str, sx, sy, t.color, { align: 'center', alpha: a, shadow: t.shadow, scale: t.scale });
    }
  }

  clear() {
    for (const p of this.pool) p.alive = false;
    this.texts.length = 0;
    this.rings.length = 0;
  }
}

const particles = new Particles();


// ==========================================================================
// src/systems/outposts.js
// ==========================================================================
// Les Nest outposts, and the pressure they put on you.
//
// The old loop was: a timer counts down, they come to you, you kill them, the
// timer resets. Forty-five seconds of gathering between fights you did not
// choose, forever. It made the whole basin into a corridor between the den and
// wherever the arrow said.
//
// So the pressure now has a *source you can go and remove*. Les Nest holds a
// handful of outposts out in the basin. Each one broadcasts, and the total
// broadcast is what eventually sends a patrol at your camp. Raze one and that
// pressure is gone for good — the tempo of the whole game is a dial you turn
// by walking somewhere and doing something about it.
//
// You can still stand at the den and fight what comes. It is simply the worst
// way to play, which is the correct relationship between a defensive option
// and an offensive one.

// bundled: import { TS } from '../world/tiles.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { rnd, pick, makeRng } from '../engine/rng.js';
// bundled: import { audio } from '../engine/audio.js';
// bundled: import { particles } from '../engine/particles.js';
// bundled: import { clamp } from '../engine/math.js';

/**
 * What an outpost is built around. The core is the thing you actually have to
 * destroy; killing the garrison alone just means they send more.
 */
const OUTPOST_KINDS = {
  mast: {
    label: 'Relay Mast', core: 'mast', hp: 260, pressure: 1.4,
    desc: 'Calls the patrols in. Loudest thing in the basin.',
    garrison: [['poacher', 3], ['drone', 2], ['technician', 1]],
    loot: { scrap: 8, powder: 3, wire: 4 },
  },
  fuel: {
    label: 'Fuel Dump', core: 'tank', hp: 200, pressure: 1.0,
    desc: 'Drums stacked four high. Do not shoot it from close up.',
    garrison: [['poacher', 2], ['logger', 2], ['trapper', 1]],
    loot: { fuel: 6, powder: 6, scrap: 4 },
    blast: 120,
  },
  cages: {
    label: 'Holding Pens', core: 'cages', hp: 180, pressure: 1.1,
    desc: 'Whatever they caught this week, waiting for the truck.',
    garrison: [['trapper', 3], ['poacher', 2]],
    loot: { scrap: 5, sinew: 4 },
    frees: 4,
  },
  mill: {
    label: 'Cut Yard', core: 'saw', hp: 300, pressure: 1.3,
    desc: 'They are taking the grove out a hundred trunks at a time.',
    garrison: [['logger', 4], ['spider', 1], ['technician', 1]],
    loot: { hardwood: 10, scrap: 6, fuel: 3 },
  },
  battery: {
    label: 'Gun Battery', core: 'turret', hp: 340, pressure: 1.6,
    desc: 'Automated, and it does not need anybody awake to work.',
    garrison: [['turret', 2], ['enforcer', 1], ['drone', 3]],
    loot: { scrap: 12, powder: 8, wire: 6 },
  },
};

const OUTPOST_KEYS = Object.keys(OUTPOST_KINDS);

let nextOutpostId = 1;

class Outpost {
  constructor(kind, x, y, landmark = null) {
    this.id = nextOutpostId++;
    this.kind = kind;
    this.def = OUTPOST_KINDS[kind];
    this.x = x; this.y = y;
    this.r = 84;                         // how far the garrison holds
    this.landmark = landmark;
    this.name = landmark ? landmark.name : this.def.label;
    this.hp = this.def.hp;
    this.maxHp = this.def.hp;
    this.razed = false;
    this.found = false;
