// ==========================================================================
// Everything that sits on the ground and does something: telegraphed mortar
// impacts, saw traps, smoke screens, the barricades Mossback builds, Sable's
// captured sentry, incendiary canisters, and geyser eruptions.

// bundled: import { machineFrames } from '../art/machines.js';

// bundled: import { P } from '../art/palette.js';
// bundled: import { TAU, clamp, dist2 } from '../engine/math.js';
// bundled: import { rnd, chance } from '../engine/rng.js';
// bundled: import { particles } from '../engine/particles.js';
// bundled: import { audio } from '../engine/audio.js';

/** A shell already in the air: ring on the ground, then a real explosion. */
class Mortar {
  constructor(x, y, delay, radius, damage, owner) {
    this.x = x; this.y = y;
    this.t = 0; this.delay = delay;
    this.radius = radius; this.damage = damage;
    this.owner = owner;
    this.dead = false;
    this.objType = 'hazard';
    this.layer = 'ground';
  }
  update(dt, game) {
    this.t += dt;
    if (chance(dt * 6)) particles.spawn({
      x: this.x + rnd(-this.radius, this.radius), y: this.y + rnd(-this.radius * 0.6, this.radius * 0.6),
      z: 0, vz: rnd(4, 14), life: 0.4, size: 1, colors: [P.nestEye, '#ffb0a8'], additive: true,
    });
    if (this.t >= this.delay) {
      this.dead = true;
      game.explode(this.x, this.y, this.radius, this.damage, false, this.owner);
    }
  }
  draw(r, game) {
    const f = clamp(this.t / this.delay, 0, 1);
    const col = f > 0.8 ? '#ffffff' : P.nestEye;
    r.ring(this.x, this.y, this.radius, col, 1, 0.35 + f * 0.5);
    r.ring(this.x, this.y, this.radius * f, col, 1, 0.7);
    if (f > 0.85 && Math.floor(game.time * 20) % 2 === 0) r.circle(this.x, this.y, this.radius * 0.3, 'rgba(255,90,70,0.35)');
  }
}

/** Incendiary canister — the thing that actually starts the forest fire. */
class Firebomb {
  constructor(x, y, delay, owner, silent = false) {
    this.x = x; this.y = y;
    this.t = 0; this.delay = delay;
    this.owner = owner;
    this.silent = silent;
    this.dead = false;
    this.objType = 'hazard';
    this.layer = 'ground';
  }
  update(dt, game) {
    this.t += dt;
    if (chance(dt * 10)) particles.embers(this.x + rnd(-8, 8), this.y + rnd(-6, 6), 1);
    if (this.t >= this.delay) {
      this.dead = true;
      game.fire.firebomb(this.x, this.y, 2.6);
      game.explode(this.x, this.y, 28, 16, false, this.owner);
      game.r.camera.addShake(3);
    }
  }
  draw(r, game) {
    const f = clamp(this.t / this.delay, 0, 1);
    r.ring(this.x, this.y, 26, P.fire2, 1, 0.3 + f * 0.6);
    r.ring(this.x, this.y, 26 * f, P.fire1, 1, 0.8);
    r.glow(this.x, this.y, 20 * f + 6, 'rgba(255,140,60,0.6)', 0.8);
  }
}

/** Trapper deployable: spins in place, shreds anything that touches it. */
class SawTrap {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.hp = 18;
    this.life = 26;
    this.t = rnd(TAU);
    this.dead = false;
    this.r = 8;
    this.objType = 'hazard';
    this.layer = 'entity';
    this.hitT = 0;
  }
  update(dt, game) {
    this.t += dt * 5;
    this.life -= dt;
    this.hitT = Math.max(0, this.hitT - dt);
    if (this.life <= 0) this.dead = true;
    const p = game.player;
    if (!p.dead && this.hitT <= 0 && dist2(this.x, this.y, p.x, p.y - 6) < (this.r + p.hitR) * (this.r + p.hitR)) {
      p.damage(10, game);
      this.hitT = 0.6;
      particles.sparks(this.x, this.y, 6, P.nestSteelHi);
    }
    if (chance(dt * 2)) particles.sparks(this.x + rnd(-6, 6), this.y + rnd(-4, 4), 1, P.nestSteelHi);
  }
  damage(n, game) {
    this.hp -= n;
    particles.sparks(this.x, this.y, 3, P.nestSteelHi);
    if (this.hp <= 0) {
      this.dead = true;
      audio.play('metal');
      particles.scrap(this.x, this.y, 6);
      game.pickups.drop('resource', 'scrap', this.x, this.y, { count: 1 });
    }
  }
  draw(r, game) {
    const f = machineFrames('sawtrap');
    const img = f[Math.floor((this.t * 0.4) % 1 * f.length) % f.length];
    r.shadow(this.x, this.y + 2, 7, 3);
    r.drawT(img, this.x, this.y, this.t, 1, 1, this.life < 3 ? (Math.floor(game.time * 8) % 2 ? 0.4 : 1) : 1);
  }
}

/** Ember's smoke pop: blocks line of sight and eats enemy bullets. */
class SmokeCloud {
  constructor(x, y, radius) {
    this.x = x; this.y = y;
    this.r = radius;
    this.life = 7;
    this.maxLife = 7;
    this.dead = false;
    this.objType = 'hazard';
    this.layer = 'over';
  }
  update(dt, game) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    if (chance(dt * 26)) {
      const a = rnd(TAU), d = rnd(0, this.r);
      particles.smoke(this.x + Math.cos(a) * d, this.y + Math.sin(a) * d * 0.7, 1, {
        life: 2.2, size: 3, colors: ['#8a8e8a', '#6a6e6a', '#4a4e4c'],
      });
    }
    // scrub hostile bullets inside the cloud
    for (const b of game.bullets.pool) {
      if (!b.alive || b.friendly) continue;
      if (dist2(b.x, b.y, this.x, this.y) < this.r * this.r) {
        b.alive = false;
        particles.burst(b.x, b.y, 2, { colors: ['#b8bcb8'], speed: 20, life: 0.3 });
      }
    }
  }
  draw(r, game) {
    const a = clamp(this.life / 1.5, 0, 1) * 0.5;
    r.circle(this.x, this.y, this.r, 'rgba(120,125,122,1)', a * 0.5);
    r.circle(this.x, this.y, this.r * 0.7, 'rgba(150,155,152,1)', a * 0.4);
  }
}

/** Mossback's pine barricade: soaks bullets so the den doesn't. */
class Barricade {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.hp = 90; this.maxHp = 90;
    this.dead = false;
    this.r = 9;
    this.objType = 'hazard';
    this.layer = 'entity';
    this.hurtT = 0;
  }
  update(dt, game) {
    this.hurtT = Math.max(0, this.hurtT - dt);
    if (game.fire.burnAtPx(this.x, this.y) > 0) this.hp -= dt * 12;
    // barricades stop hostile fire
    for (const b of game.bullets.pool) {
      if (!b.alive || b.friendly) continue;
      if (dist2(b.x, b.y, this.x, this.y - 6) < (this.r + b.radius) * (this.r + b.radius)) {
        b.alive = false;
        this.hp -= b.damage * 0.5;
        this.hurtT = 0.15;
        particles.woodChips(b.x, b.y, 3);
      }
    }
    if (this.hp <= 0) {
      this.dead = true;
      particles.woodChips(this.x, this.y - 6, 12);
      audio.play('timber', { vol: 0.5 });
    }
  }
  draw(r, game) {
    r.shadow(this.x, this.y, 8, 3);
    const h = 14 * clamp(this.hp / this.maxHp, 0.3, 1);
    const col = this.hurtT > 0 ? '#c9a877' : P.bark;
    for (let i = -1; i <= 1; i++) {
      r.rect(this.x + i * 5 - 2, this.y - h, 4, h, col);
      r.rect(this.x + i * 5 - 2, this.y - h, 4, 1, P.barkLight);
    }
    r.rect(this.x - 8, this.y - h * 0.6, 16, 2, P.barkLight);
  }
}

/** Sable's rebuilt sentry: shoots the company with its own hardware. */
class AllyTurret {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.hp = 120; this.maxHp = 120;
    this.dead = false;
    this.r = 8;
    this.fireT = 0;
    this.angle = 0;
    this.t = 0;
    this.objType = 'hazard';
    this.layer = 'entity';
  }
  update(dt, game) {
    this.t += dt;
    this.fireT -= dt;
    const e = game.nearestEnemy(this.x, this.y, 190);
    if (e) {
      this.angle = Math.atan2(e.y - this.y, e.x - this.x);
      if (this.fireT <= 0) {
        this.fireT = 0.5;
        game.spawnBullet({
          x: this.x + Math.cos(this.angle) * 8, y: this.y - 8 + Math.sin(this.angle) * 8,
          vx: Math.cos(this.angle) * 300, vy: Math.sin(this.angle) * 300,
          damage: 14, friendly: true, kind: 'nail', life: 1.4, owner: this,
        });
        audio.play('shoot', { vol: 0.28 });
      }
    } else {
      this.angle = Math.sin(this.t * 0.6) * 1.4;
    }
    if (game.fire.burnAtPx(this.x, this.y) > 0) this.hp -= dt * 10;
    if (this.hp <= 0) { this.dead = true; audio.play('explode'); particles.scrap(this.x, this.y - 6, 10); }
  }
  draw(r, game) {
    r.shadow(this.x, this.y, 8, 3);
    r.rect(this.x - 6, this.y - 8, 12, 8, P.nestSteelDk);
    r.rect(this.x - 6, this.y - 8, 12, 1, P.nestSteel);
    r.circle(this.x, this.y - 10, 4, P.nestSteel);
    r.line(this.x, this.y - 10, this.x + Math.cos(this.angle) * 9, this.y - 10 + Math.sin(this.angle) * 9, P.nestSteelHi, 2);
    r.circle(this.x, this.y - 10, 1.4, P.cyber);
    const w = 14, frac = clamp(this.hp / this.maxHp, 0, 1);
    r.rect(this.x - w / 2, this.y - 20, w, 2, 'rgba(0,0,0,0.6)');
    r.rect(this.x - w / 2, this.y - 20, w * frac, 2, P.uiAccent);
  }
}

/** A geyser going off: scalding column that hurts anything standing on it. */
class SteamBurst {
  constructor(x, y, duration = 2.4, friendly = true) {
    this.x = x; this.y = y;
    this.life = duration;
    this.maxLife = duration;
    this.dead = false;
    this.r = 22;
    this.friendly = friendly;
    this.tick = 0;
    this.objType = 'hazard';
    this.layer = 'over';
  }
  update(dt, game) {
    this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    this.tick -= dt;
    if (this.tick <= 0) {
      this.tick = 0.25;
      game.damageEnemiesAt(this.x, this.y, this.r, 12, null);
      const p = game.player;
      if (!this.friendly && dist2(p.x, p.y, this.x, this.y) < this.r * this.r) p.damage(8, game);
    }
    for (let i = 0; i < 3; i++) {
      particles.spawn({
        x: this.x + rnd(-6, 6), y: this.y + rnd(-4, 4), z: rnd(0, 6),
        vx: rnd(-14, 14), vy: rnd(-8, 8), vz: rnd(70, 160),
        life: rnd(0.6, 1.4), size: 2, endSize: 4,
        colors: ['#ffffff', '#c9e8f0', '#8fd0e0'], gravity: -18, drag: 1.1,
      });
    }
    if (chance(dt * 8)) particles.water(this.x + rnd(-8, 8), this.y, 2);
  }
  draw(r, game) {
    const f = clamp(this.life / this.maxLife, 0, 1);
    const h = 40 * f + 16;
    r.ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const yy = this.y - i * (h / 5);
      const ww = (7 - i * 0.9) * (0.7 + f * 0.6);
      r.circle(this.x + Math.sin(game.time * 6 + i) * 2, yy, Math.max(1, ww), 'rgba(200,235,245,1)', 0.35 * f);
    }
    r.ctx.globalCompositeOperation = 'source-over';
    r.ring(this.x, this.y, this.r * (1 - f * 0.2), P.springHot, 1, 0.35 * f);
  }
}


// ==========================================================================
// src/systems/waves.js
// ==========================================================================
// The wave director. Runs the loop the whole game hangs off:
//
//   PREP (visible countdown, go gather) -> ASSAULT (clear them) -> breather
//
// Waves 5, 10 and 15 are bosses. Wave 8 is THE BURN: no boss, but Les Nest
// torches the basin and the objective changes from "kill things" to "save the
// forest and everything living in it".

// bundled: import { ENEMY_TYPES } from '../entities/enemies.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { TAU, clamp } from '../engine/math.js';
// bundled: import { rnd, pick, chance, makeRng } from '../engine/rng.js

// bundled: import { audio } from '../engine/audio.js';

const PHASE = { PREP: 'prep', ASSAULT: 'assault', CLEAR: 'clear', FIRE: 'fire', VICTORY: 'victory' };

const COST = {
  poacher: 2, trapper: 3, logger: 4, technician: 2,
  drone: 3, spider: 6, turret: 6, enforcer: 7, harvester: 12, firebomber: 6,
};

// What Les Nest is willing to field, by wave.
const POOLS = [
  { from: 1, pool: [['poacher', 6], ['drone', 2]] },
  { from: 2, pool: [['poacher', 6], ['drone', 3], ['logger', 2]] },
  { from: 3, pool: [['poacher', 5], ['drone', 3], ['logger', 3], ['trapper', 2]] },
  { from: 4, pool: [['poacher', 4], ['drone', 3], ['logger', 3], ['trapper', 3], ['spider', 2], ['technician', 2]] },
  { from: 6, pool: [['poacher', 3], ['drone', 3], ['logger', 2], ['trapper', 3], ['spider', 3], ['turret', 2], ['technician', 2]] },
  { from: 9, pool: [['poacher', 2], ['drone', 3], ['trapper', 2], ['spider', 3], ['turret', 3], ['enforcer', 3], ['harvester', 1], ['firebomber', 2]] },
  { from: 12, pool: [['drone', 2], ['spider', 3], ['turret', 3], ['enforcer', 4], ['harvester', 2], ['firebomber', 2], ['trapper', 2]] },
];

const BOSS_WAVES = { 5: 'ripsawPrime', 10: 'kiln', 15: 'motherNest' };
const FIRE_WAVE = 8;
const FINAL_WAVE = 15;

const PREP_TIME = [0, 55, 48, 46, 44, 50, 42, 42, 55, 40, 50, 40, 40, 38, 38, 60];

class Director {
  constructor(seed) {
    this.rng = makeRng((seed ^ 0xd17ec7) >>> 0);
    this.wave = 0;
    this.phase = PHASE.PREP;
    this.timer = Infinity;           // gated: nothing comes until you provoke it
    this.prepTotal = 42;
    this.spawnQueue = [];
    this.spawnT = 0;
    this.spawnPoints = [];
    this.alive = 0;
    this.totalSpawned = 0;
    this.bossRef = null;
    this.fireEvent = null;
    this.announce = null;
    this.announceT = 0;
    this.endless = false;
    this.peakWave = 0;
    // Gated mode: the director stops running a clock and waits on the player.
    // Every outpost you raze is another rung, so the escalation is something
    // you provoke by going after them rather than something that arrives while
    // you are picking berries.
    this.gated = true;
    this.razedSeen = 0;
  }

  get isBossWave() { return !!BOSS_WAVES[this.wave]; }
  get nextIsBoss() { return !!BOSS_WAVES[this.wave + 1]; }
  get nextIsFire() { return this.wave + 1 === FIRE_WAVE; }

  waveLabel() {
    if (this.wave + 1 === FIRE_WAVE) return 'THE BURN';
    const b = BOSS_WAVES[this.wave + 1];
    if (b) return ENEMY_TYPES[b].name;
    return 'WAVE ' + (this.wave + 1);
  }

  // ------------------------------------------------------------------ update
  update(dt, game) {
    this.announceT = Math.max(0, this.announceT - dt);

    switch (this.phase) {
      case PHASE.PREP: {
        if (this.gated) { this.updateGate(game); break; }
        this.timer -= dt;
        // warning pips as the clock runs down
        const t = Math.ceil(this.timer);
        if (t !== this._lastTick && t <= 5 && t > 0) {
          this._lastTick = t;
          audio.play('wavewarn', { vol: 0.5 });
        }
        if (this.timer <= 0) this.startWave(game);
        break;
      }
      case PHASE.ASSAULT: {
        this.updateSpawning(dt, game);
        if (this.spawnQueue.length === 0 && game.enemies.length === 0) this.endWave(game);
        break;
      }
      case PHASE.FIRE: {
        this.updateFireEvent(dt, game);
        break;
      }
      case PHASE.CLEAR: {
        this.timer -= dt;
        if (this.timer <= 0) {
          this.phase = PHASE.PREP;
          this.timer = this.gated ? Infinity
            : (PREP_TIME[Math.min(this.wave + 1, PREP_TIME.length - 1)] || 40);
          if (this.endless) this.timer = 34;
          this.prepTotal = this.timer;
          this._lastTick = null;
        }
        break;
      }
      default: break;
    }
  }

  /**
   * The gate.
   *
   * Les Nest escalate when you cost them something, not when a clock runs out.
   * Each outpost razed moves the wave counter on, and the set pieces — the
   * bosses and the burn — sit on the rungs, so they land as a *response* to
   * what you have been doing instead of as the next item on a timetable.
   */
  updateGate(game) {
    const occ = game.occupation;
    if (!occ) { this.gated = false; return; }
    const razed = occ.razed;
    if (razed <= this.razedSeen) return;
    this.razedSeen = razed;
    // one wave per raid, and the last outpost brings the whole thing down
    const target = occ.standing.length === 0 ? FINAL_WAVE : Math.min(FINAL_WAVE - 1, razed * 2);
    if (target <= this.wave) return;
    this.wave = target - 1;
    this.startWave(game);
  }

  // ------------------------------------------------------------------- waves
  startWave(game) {
    this.wave++;
    this.peakWave = Math.max(this.peakWave, this.wave);
    this._lastTick = null;
    this.spawnQueue.length = 0;
    this.chooseSpawnPoints(game);

    if (this.wave === FIRE_WAVE) {
      this.startFireEvent(game);
      return;
    }

    this.phase = PHASE.ASSAULT;
    const boss = BOSS_WAVES[this.wave];
    if (boss) {
      this.queueBoss(boss, game);
      game.announce(ENEMY_TYPES[boss].name, 'LES NEST HEAVY ASSET', P.nestEye, 4);
      audio.play('roar');
      audio.setIntensity(1);
    } else {
      this.queueWave(game);
      game.announce('WAVE ' + this.wave, this.describeWave(), P.uiWarn, 2.6);
      audio.play('wavestart');
      audio.setIntensity(0.65);
    }
    game.r.camera.addShake(3);
    game.onWaveStart(this.wave);
  }

  describeWave() {
    const kinds = new Set(this.spawnQueue.map(s => s.kind));
    const names = [...kinds].map(k => ENEMY_TYPES[k].name.toUpperCase());
    return names.slice(0, 3).join(' / ');
  }

  /** Sable's intel: a peek at what the next wave is actually made of. */
  describeNext() {
    const next = this.wave + 1;
    if (next === FIRE_WAVE) return 'INCENDIARY OPERATION';
    const boss = BOSS_WAVES[next];
    if (boss) return 'HEAVY ASSET DEPLOYING';
    const pool = this.poolFor(next);
    const names = pool.slice(0, 3).map(([k]) => ENEMY_TYPES[k].name.toUpperCase());
    return names.join(', ');
  }

  poolFor(wave) {
    let best = POOLS[0];
    for (const p of POOLS) if (wave >= p.from) best = p;
    return best.pool;
  }

  queueWave(game) {
    const budget = Math.round((6 + this.wave * 4.6) * (this.endless ? 1.25 : 1));
    const pool = this.poolFor(this.wave);
    let spent = 0;
    let guard = 0;
    while (spent < budget && guard++ < 300) {
      const kind = this.rng.weighted(pool);
      const c = COST[kind] || 3;
      if (spent + c > budget + 3) break;
      spent += c;
      this.spawnQueue.push({ kind, at: rnd(0, 6 + this.wave * 0.6), point: this.rng.int(0, this.spawnPoints.length - 1) });
    }
    // arrive in loose clusters rather than a uniform drip
    this.spawnQueue.sort((a, b) => a.at - b.at);
    this.spawnT = 0;
  }

  queueBoss(kind, game) {
    this.spawnQueue.push({ kind, at: 1.4, point: 0, boss: true });
    const escortPool = this.wave >= 10 ? [['spider', 3], ['drone', 3], ['enforcer', 2]] : [['poacher', 4], ['drone', 3]];
    const n = 4 + Math.floor(this.wave / 3);
    for (let i = 0; i < n; i++) {
      this.spawnQueue.push({ kind: this.rng.weighted(escortPool), at: 2.5 + i * 1.6, point: this.rng.int(0, this.spawnPoints.length - 1) });
    }
    this.spawnT = 0;
  }

  chooseSpawnPoints(game) {
    // Ring the den, biased to the edges of the screen the player is looking at.
    this.spawnPoints.length = 0;
    const world = game.world;
    const cx = game.player.x, cy = game.player.y;
    const n = 5;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + this.rng.range(0, 0.6);
      const d = 250 + this.rng.range(0, 90);
      let x = cx + Math.cos(a) * d;
      let y = cy + Math.sin(a) * d * 0.8;
      x = clamp(x, 40, world.pxW - 40);
      y = clamp(y, 40, world.pxH - 40);
      this.spawnPoints.push({ x, y, a });
    }
  }

  updateSpawning(dt, game) {
    this.spawnT += dt;
    while (this.spawnQueue.length && this.spawnQueue[0].at <= this.spawnT) {
      const s = this.spawnQueue.shift();
      const pt = this.spawnPoints[clamp(s.point, 0, this.spawnPoints.length - 1)] || this.spawnPoints[0];
      const x = pt.x + rnd(-30, 30), y = pt.y + rnd(-24, 24);
      const e = game.spawnEnemy(s.kind, x, y, this.wave);
      if (s.boss) { this.bossRef = e; game.boss = e; }
      this.totalSpawned++;
    }
  }

  endWave(game) {
    this.phase = PHASE.CLEAR;
    this.timer = 4.5;
    this.bossRef = null;
    game.boss = null;
    audio.play('waveclear');
    audio.setIntensity(0.12);
    game.onWaveCleared(this.wave);

    if (this.wave >= FINAL_WAVE && !this.endless) {
      this.phase = PHASE.VICTORY;
      game.onVictory();
      return;
    }
    game.announce('WAVE ' + this.wave + ' CLEARED', 'THE BASIN HOLDS', P.uiGood, 3);
  }

  // ------------------------------------------------------------- the burn
  startFireEvent(game) {
    this.phase = PHASE.FIRE;
    this.fireEvent = {
      t: 0,
      stage: 0,
      bombersLeft: 6,
      bomberT: 0,
      duration: 150,
      trapped: 0,
      startedFires: 0,
    };
    game.announce('THE BURN', 'SAVE THE BASIN', P.fire2, 5);
    game.toast('PUT OUT FIRES WITH WATER  -  CARRY TRAPPED ANIMALS TO THE DEN', P.fire1, 8);
    audio.play('firewhoosh');
    audio.setIntensity(0.9);
    game.onFireEventStart();

    // Opening salvo: a line of incendiaries across the treeline upwind.
    const world = game.world;
    const a = rnd(TAU);
    for (let i = 0; i < 9; i++) {
      const x = clamp(game.player.x + Math.cos(a) * (140 + i * 44) + rnd(-40, 40), 40, world.pxW - 40);
      const y = clamp(game.player.y + Math.sin(a) * (140 + i * 44) + rnd(-40, 40), 40, world.pxH - 40);
      game.spawnFirebomb(x, y, 1.2 + i * 0.25, null, true);
    }
    // Some animals get cut off and need carrying out.
    this.fireEvent.trapped = game.wildlife.trapNear(game.player.x, game.player.y, 460, 6);
    game.rescueTarget = this.fireEvent.trapped;
    game.rescued = 0;

    for (let i = 0; i < 3; i++) {
      game.spawnEnemy('firebomber', game.player.x + rnd(-260, 260), game.player.y + rnd(-220, 220), this.wave);
    }
  }

  updateFireEvent(dt, game) {
    const ev = this.fireEvent;
    ev.t += dt;
    ev.bomberT -= dt;

    // Waves of bombers keep re-lighting the basin for the first two thirds.
    if (ev.bomberT <= 0 && ev.bombersLeft > 0 && ev.t < ev.duration * 0.66) {
      ev.bomberT = 14;
      ev.bombersLeft--;
      const a = rnd(TAU);
      game.spawnEnemy('firebomber', game.player.x + Math.cos(a) * 300, game.player.y + Math.sin(a) * 260, this.wave);
      if (chance(0.6)) game.spawnEnemy('drone', game.player.x + Math.cos(a + 1) * 280, game.player.y + Math.sin(a + 1) * 240, this.wave);
      game.toast('MORE BOMBERS INBOUND', P.uiBad, 2.4);
    }

    // Ground troops arrive to stop you fighting the fire.
    if (chance(dt * 0.22) && game.enemies.length < 14) {
      const a = rnd(TAU);
      game.spawnEnemy(pick(['poacher', 'logger', 'trapper']), game.player.x + Math.cos(a) * 300, game.player.y + Math.sin(a) * 250, this.wave);
    }

    // More animals get cut off as the fire grows.
    if (chance(dt * 0.14) && game.fire.active) {
      const n = game.wildlife.trapNear(game.player.x, game.player.y, 380, 1);
      if (n) { ev.trapped += n; game.rescueTarget += n; game.toast('AN ANIMAL IS TRAPPED', P.uiWarn, 2.4); }
    }

    audio.setIntensity(clamp(0.7 + game.fire.intensity * 0.3, 0, 1));

    const fireOut = !game.fire.active && game.fire.burning.size === 0;
    const timeUp = ev.t > ev.duration;
    if ((fireOut && ev.t > 30) || timeUp) {
      // clear remaining bombers before calling it
      const bombersLeft = game.enemies.some(e => e.kind === 'firebomber');
      if (!bombersLeft || timeUp) {
        game.fire.extinguishAll();
        this.phase = PHASE.CLEAR;
        this.timer = 6;
        audio.play('waveclear');
        audio.setIntensity(0.12);
        game.onFireEventEnd();
        game.announce('THE BURN IS OUT', 'THE BASIN SURVIVES', P.uiGood, 4);
      }
    }
  }

  // Called when the player wipes; soften the next wave a little.
  onPlayerDeath() {
    if (this.phase === PHASE.ASSAULT) {
      this.spawnQueue.length = 0;
    }
  }

  goEndless() {
    this.endless = true;
    this.phase = PHASE.CLEAR;
    this.timer = 6;
  }
}


// ==========================================================================
// src/ui/hud.js
// ==========================================================================
// The HUD. Deliberately small and quiet: a health bar, a wood tally, a row of
// resource counts, the current gun, and — the one thing that must never be
// missed — the countdown to the next assault.

// bundled: import { drawText, measure } from '../engine/font.js';
// bundled: import { itemIcon, weaponSprite } from '../art/items.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { HUD_RESOURCES, CHIPS } from '../systems/defs.js';
// bundled: import { MAX_WOOD } from '../entities/player.js';
// bundled: import { PHASE } from '../systems/waves.js';
// bundled: import { clamp } from '../engine/math.js';
// bundled: import { VIEW_W, VIEW_H } from '../engine/canvas.js';

function timeStr(s) {
  s = Math.max(0, Math.ceil(s));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

class Hud {
  constructor() {
    this.sub = null;
    this.pings = [];
    this.toasts = [];
    this.announce = null;
    this.hintT = 0;
    this.hint = null;
  }

  toast(text, color = P.ui, seconds = 2.6) {
    this.toasts.push({ text, color, life: seconds, maxLife: seconds });
    if (this.toasts.length > 5) this.toasts.shift();
  }

  /** A quiet line under the banner: flavour, not instruction. */
  subtitle(text, seconds = 3) { this.sub = { text, t: seconds, total: seconds }; }

  /** A marker out in the world, for something that just happened off-screen. */
  ping(x, y, color, seconds = 6) {
    this.pings.push({ x, y, color, t: seconds, total: seconds });
    if (this.pings.length > 8) this.pings.shift();
  }

  showAnnounce(title, sub, color, seconds) {
    this.announce = { title, sub, color, life: seconds, maxLife: seconds };
  }

  update(dt) {
    if (this.sub) { this.sub.t -= dt; if (this.sub.t <= 0) this.sub = null; }
    for (let i = this.pings.length - 1; i >= 0; i--) {
      this.pings[i].t -= dt;
      if (this.pings[i].t <= 0) this.pings.splice(i, 1);
    }
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      this.toasts[i].life -= dt;
      if (this.toasts[i].life <= 0) this.toasts.splice(i, 1);
    }
    if (this.announce) {
      this.announce.life -= dt;
      if (this.announce.life <= 0) this.announce = null;
    }
    this.hintT = Math.max(0, this.hintT - dt);
  }

  draw(r, game) {
    const ctx = r.ctx;
    const p = game.player;

    // On touch the thumb clusters own the bottom corners, so the readouts move
    // out from under them.
    this.touch = game.input.touch.visible;
    this.resY = this.touch ? 58 : VIEW_H - 14;
    this.squadY = this.touch ? 82 : 70;

    // Inside the facility you have no inventory, no squad and no waves — the
    // HUD shrinks to the two things that still matter.
    if (game.mode === 'lab') {
      this.drawVitals(r, ctx, p, game);
      if (game.campaign && game.campaign.hasGun) this.drawWeapon(r, ctx, p, game);
      this.drawToasts(r, ctx, game);
      this.drawAnnounce(r, ctx, game);
      this.drawCombo(r, ctx, game);
      return;
    }

    this.drawSubtitle(r, ctx, game);
    this.drawVitals(r, ctx, p, game);
    this.drawWood(r, ctx, p, game);
    this.drawResources(r, ctx, p, game);
    this.drawWeapon(r, ctx, p, game);
    this.drawWaveBanner(r, ctx, game);
    this.drawObjective(r, ctx, game);
    this.drawBossBar(r, ctx, game);
    this.drawToasts(r, ctx, game);
    this.drawAnnounce(r, ctx, game);
    this.drawPrompt(r, ctx, game);
    this.drawSquad(r, ctx, game);
    this.drawCombo(r, ctx, game);
  }

  /** Parry/graze chain. Only shows while it is actually paying you. */
  drawCombo(r, ctx, game) {
    const p = game.player;
    if (p.combo <= 0 || p.comboT <= 0) return;
    const cx = VIEW_W / 2;
    const y = 54;
    const bonus = Math.round(Math.min(0.6, 0.12 * p.combo) * 100);
    const a = clamp(p.comboT / 0.6, 0, 1);
    ctx.globalAlpha = a;
    drawText(ctx, 'x' + p.combo, cx, y, P.sulfurHi, { align: 'center', scale: 2, shadow: '#000' });
    drawText(ctx, '+' + bonus + '% DAMAGE', cx, y + 16, P.uiDim, { align: 'center', shadow: true });
    ctx.globalAlpha = 1;
  }

  // --- health / energy / dash / chips --------------------------------------
  drawVitals(r, ctx, p, game) {
    const x = 6, y = 6;
    const w = 92, h = 7;
    // health
    r.uiRect(x - 1, y - 1, w + 2, h + 2, 'rgba(0,0,0,0.55)');
    r.uiRect(x, y, w, h, P.hpRedDark);
    const frac = clamp(p.hp / p.maxHp, 0, 1);
    const barColor = p.overclock ? P.cyber : frac < 0.28 ? '#ff6a5a' : P.hpRed;
    r.uiRect(x, y, Math.round(w * frac), h, barColor);
    r.uiRect(x, y, Math.round(w * frac), 1, 'rgba(255,255,255,0.28)');
    // segment ticks every 25 hp
    for (let v = 25; v < p.maxHp; v += 25) {
      const sx = x + Math.round((v / p.maxHp) * w);
      r.uiRect(sx, y, 1, h, 'rgba(0,0,0,0.4)');
    }
    drawText(ctx, Math.ceil(Math.max(0, p.hp)) + '/' + p.maxHp, x + w + 4, y + 1, P.uiDim, { scale: 1, shadow: true });

    // energy (dash fuel)
    const ey = y + h + 3;
    r.uiRect(x - 1, ey - 1, w + 2, 4, 'rgba(0,0,0,0.55)');
    r.uiRect(x, ey, w, 2, '#123a44');
    r.uiRect(x, ey, Math.round(w * clamp(p.energy / p.maxEnergy, 0, 1)), 2, P.energy);

    // dash charges
    for (let i = 0; i < p.dashMax; i++) {
      const dx = x + i * 6;
      const filled = i < p.dashCharges;
      r.uiRect(dx, ey + 4, 4, 3, filled ? P.cyber : 'rgba(20,40,46,0.9)');
    }

    // chip slots
    const cy = ey + 9;
    for (let i = 0; i < p.chipSlots; i++) {
      const cx = x + i * 9;
      const key = p.chips[i];
      const c = key ? CHIPS[key] : null;
      r.uiRect(cx, cy, 7, 7, 'rgba(0,0,0,0.5)');
      r.uiStroke(cx, cy, 7, 7, c ? c.color : '#2c4230');
      if (c) r.uiRect(cx + 2, cy + 2, 3, 3, c.color);
    }
    if (p.chipBag.length > 0) {
      const bx = x + p.chipSlots * 9 + 2;
      const blink = Math.floor(game.time * 2.5) % 2 === 0;
      drawText(ctx, '+' + p.chipBag.length, bx, cy + 1, blink ? P.cyber : P.cyberDim, { shadow: true });
    }

    if (p.shieldUp) r.uiRect(x + w + 34, y, 4, 7, P.springHot);
  }

  // --- the wood you are physically carrying ---------------------------------
  drawWood(r, ctx, p, game) {
    const n = p.inv.get('wood');
    const x = 6, y = 46;
    const icon = itemIcon('wood');
    r.ctx.globalAlpha = n > 0 ? 1 : 0.45;
    ctx.drawImage(icon, x, y - 1);
    r.ctx.globalAlpha = 1;
    // ten pips: full is a real limit you feel
    for (let i = 0; i < MAX_WOOD; i++) {
      const px = x + 13 + i * 4;
      const on = i < n;
      r.uiRect(px, y + 1, 3, 7, on ? (n >= MAX_WOOD ? P.uiWarn : P.barkLight) : 'rgba(0,0,0,0.45)');
      if (on) r.uiRect(px, y + 1, 3, 1, 'rgba(255,255,255,0.25)');
    }
    drawText(ctx, n + '/' + MAX_WOOD, x + 13 + MAX_WOOD * 4 + 4, y + 2, n >= MAX_WOOD ? P.uiWarn : P.uiDim, { shadow: true });
  }

  // --- compact resource row -------------------------------------------------
  drawResources(r, ctx, p, game) {
    let x = 6;
    const y = this.resY;
    for (const key of HUD_RESOURCES) {
      const n = p.inv.get(key);
      if (n <= 0 && !['wood', 'ammo', 'gunpowder'].includes(key)) continue;
      const icon = itemIcon(key);
      ctx.globalAlpha = n > 0 ? 1 : 0.35;
      ctx.drawImage(icon, x, y);
      ctx.globalAlpha = 1;
      const label = String(n);
      drawText(ctx, label, x + 11, y + 3, n > 0 ? P.ui : P.uiDim, { shadow: true });
      x += 12 + measure(label, 1) + 5;
      if (x > VIEW_W - 120) break;
    }
  }

  // --- weapon + ammo --------------------------------------------------------
  drawWeapon(r, ctx, p, game) {
    const w = p.weapon;
    const bx = this.touch ? Math.round(VIEW_W / 2 - 43) : VIEW_W - 92;
    const by = VIEW_H - 26;
    r.panel(bx, by, 86, 22);
    const img = weaponSprite(w.art);
    ctx.drawImage(img, bx + 3, by + 5);
    drawText(ctx, w.name, bx + 30, by + 4, P.ui, { shadow: true });
    if (w.ammo > 0) {
      const ammo = p.inv.get('ammo');
      drawText(ctx, ammo + ' RDS', bx + 30, by + 13, ammo <= 0 ? P.uiBad : ammo < 10 ? P.uiWarn : P.uiDim, { shadow: true });
    } else {
      drawText(ctx, 'NO AMMO NEEDED', bx + 30, by + 13, P.uiDim, { shadow: true });
    }
    // weapon slots
    if (p.weapons.length > 1) {
      for (let i = 0; i < p.weapons.length; i++) {
        const sx = bx - 2 + i * 9;
        const sy = by - 11;
        const on = i === p.weaponIndex;
        r.uiRect(sx, sy, 8, 9, on ? P.uiBorder : 'rgba(9,16,13,0.8)');
        drawText(ctx, String(i + 1), sx + 2, sy + 2, on ? P.ui : P.uiDim);
      }
    }
  }

  // --- the countdown --------------------------------------------------------
  drawWaveBanner(r, ctx, game) {
    const d = game.director;
    // Outposts are the tempo now; the wave clock only shows for the scripted
    // set pieces, so the top of the screen is not two competing countdowns.
    if (game.occupation && game.occupation.outposts.length && !d.isBossWave && d.phase !== PHASE.ASSAULT) {
      this.drawOccupation(r, ctx, game);
      return;
    }
    const cx = VIEW_W / 2;
    // The director is on hold until the first fight is over; showing a wave
    // countdown that is not running would just be a lie.
    const stand = game.firstStand;
    if (stand && !stand.finished) {
      if (!stand.active) {
        drawText(ctx, 'SURVEY TEAM INBOUND', cx, 6, P.uiWarn, { align: 'center', shadow: '#000' });
        const t = Math.max(0, game.standDelay);
        drawText(ctx, '0:' + String(Math.floor(t)).padStart(2, '0'), cx, 15, t < 6 ? P.uiBad : P.uiDim, { align: 'center', shadow: '#000' });
      }
      return;
    }
    if (d.phase === PHASE.PREP) {
      const t = d.timer;
      const urgent = t <= 10;
      const label = d.waveLabel();
      const isBossNext = d.nextIsBoss;
      const isFireNext = d.nextIsFire;
      const col = isFireNext ? P.fire2 : isBossNext ? P.nestEye : urgent ? P.uiWarn : P.ui;
      const w = 128, h = 22;
      const bx = cx - w / 2;
      r.panel(bx, 4, w, h, 'rgba(9,16,13,0.86)', urgent ? col : P.uiBorder);
      drawText(ctx, 'NEXT: ' + label, cx, 7, col, { align: 'center', shadow: true });
      const pulse = urgent ? (Math.floor(game.time * 6) % 2 === 0 ? 1 : 0.55) : 1;
      ctx.globalAlpha = pulse;
      drawText(ctx, timeStr(t), cx, 15, urgent ? col : P.ui, { align: 'center', shadow: true, scale: 1 });
      ctx.globalAlpha = 1;
      // progress bar drains left-to-right
      r.uiRect(bx + 2, 4 + h - 3, w - 4, 1, 'rgba(0,0,0,0.5)');
      r.uiRect(bx + 2, 4 + h - 3, Math.round((w - 4) * clamp(t / d.prepTotal, 0, 1)), 1, col);
      if (game.intelLevel > 0) {
        drawText(ctx, 'INTEL: ' + d.describeNext(), cx, 4 + h + 2, P.uiDim, { align: 'center', shadow: true });
      }
    } else if (d.phase === PHASE.ASSAULT) {
      const left = game.enemies.length + d.spawnQueue.length;
      const w = 112, h = 13;
      r.panel(cx - w / 2, 4, w, h, 'rgba(9,16,13,0.8)', P.nestEye);
      drawText(ctx, 'WAVE ' + d.wave + '  -  ' + left + ' HOSTILE' + (left === 1 ? '' : 'S'), cx, 7, P.ui, { align: 'center', shadow: true });
    } else if (d.phase === PHASE.FIRE) {
      const ev = d.fireEvent;
      const w = 136, h = 13;
      const blink = Math.floor(game.time * 4) % 2 === 0;
      r.panel(cx - w / 2, 4, w, h, 'rgba(30,10,6,0.85)', blink ? P.fire1 : P.fire3);
      drawText(ctx, 'THE BURN  -  ' + timeStr(ev.duration - ev.t), cx, 7, blink ? P.fire1 : P.fire2, { align: 'center', shadow: true });
    } else if (d.phase === PHASE.CLEAR) {
      const w = 100, h = 13;
      r.panel(cx - w / 2, 4, w, h, 'rgba(9,16,13,0.8)', P.uiGood);
      drawText(ctx, 'AREA CLEAR', cx, 7, P.uiGood, { align: 'center', shadow: true });
    }
  }

  // --- fire-event objective tracker ----------------------------------------
  /**
   * A compass to the nearest thing worth walking to.
   *
   * The basin is big now, and a big map with no direction in it is just a
   * place to get lost. This points at the nearest Les Nest outpost you know
   * about — or, before you know about any, at the nearest place you have not
   * been. It is deliberately only an arrow and a distance: it tells you which
   * way, never what to do when you get there.
   */
  drawCompass(r, ctx, game) {
    if (!game.occupation || game.panels.open) return;
    const p = game.player;
    let target = null, best = Infinity, hostile = false;
    for (const o of game.occupation.outposts) {
      if (o.razed || !o.found) continue;
      const d = Math.hypot(o.x - p.x, o.y - p.y);
      if (d < best) { best = d; target = o; hostile = true; }
    }
    if (!target) {
      for (const l of (game.world.landmarks || [])) {
        if (l.found) continue;
        const d = Math.hypot(l.x - p.x, l.y - p.y);
        if (d < best) { best = d; target = l; hostile = false; }
      }
    }
    if (!target) return;

    const label = hostile ? target.name.toUpperCase() : 'SOMEWHERE OUT THERE';
    const col = hostile ? P.uiBad : P.uiDim;
    const x = VIEW_W - 6, y = this.touch ? 70 : 30;
    drawText(ctx, label, x, y, col, { align: 'right', shadow: '#000' });
    drawText(ctx, Math.round(best / 16) + 'm', x, y + 9, P.uiDim, { align: 'right', shadow: '#000' });

    // the arrow, drawn as a wedge of pixels so it stays crisp at any scale
    const a = Math.atan2(target.y - p.y, target.x - p.x);
    const ax = x - 30, ay = y + 20;
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      const px2 = ax + Math.cos(a) * (t * 9 - 4);
      const py2 = ay + Math.sin(a) * (t * 9 - 4);
      r.uiRect(Math.round(px2), Math.round(py2), 2, 2, i > 4 ? col : P.uiDim);
    }
  }

  drawObjective(r, ctx, game) {
    const d = game.director;
    this.drawCompass(r, ctx, game);
    if (d.phase !== PHASE.FIRE) return;
    const x = VIEW_W - 106, y = 22;
    r.panel(x, y, 100, 30, 'rgba(30,10,6,0.8)', P.fire3);
    drawText(ctx, 'FIRES BURNING: ' + game.fire.burning.size, x + 4, y + 4, game.fire.burning.size > 60 ? P.uiBad : P.fire2, { shadow: true });
    drawText(ctx, 'RESCUED: ' + game.rescued + '/' + game.rescueTarget, x + 4, y + 13, game.rescued >= game.rescueTarget ? P.uiGood : P.ui, { shadow: true });
    const waterN = game.player.inv.get('water');
    drawText(ctx, 'WATER: ' + waterN + '/' + game.player.inv.cap('water'), x + 4, y + 22, waterN > 0 ? P.waterFoam : P.uiBad, { shadow: true });
  }

  // --- boss health ----------------------------------------------------------
  drawBossBar(r, ctx, game) {
    const b = game.boss;
    if (!b || b.dead) return;
    const w = 240, h = 8;
    const x = VIEW_W / 2 - w / 2, y = 34;
    r.uiRect(x - 1, y - 1, w + 2, h + 2, 'rgba(0,0,0,0.7)');
    r.uiRect(x, y, w, h, '#2a0f0d');
    const frac = clamp(b.hp / b.maxHp, 0, 1);
    r.uiRect(x, y, Math.round(w * frac), h, P.nestRed);
    r.uiRect(x, y, Math.round(w * frac), 1, 'rgba(255,255,255,0.25)');
    // phase dividers
    for (const f of [0.33, 0.66]) r.uiRect(x + Math.round(w * f), y, 1, h, 'rgba(0,0,0,0.6)');
    drawText(ctx, b.def.name, VIEW_W / 2, y - 9, P.nestEye, { align: 'center', shadow: true });
  }

  // --- toasts & announcements ----------------------------------------------
  drawToasts(r, ctx, game) {
    let y = VIEW_H - (this.touch ? 44 : 44);
    for (let i = this.toasts.length - 1; i >= 0; i--) {
      const t = this.toasts[i];
      const a = clamp(t.life / 0.4, 0, 1);
      ctx.globalAlpha = a;
      const w = measure(t.text, 1) + 8;
      r.uiRect(VIEW_W / 2 - w / 2, y, w, 11, 'rgba(9,16,13,0.85)');
      r.uiStroke(VIEW_W / 2 - w / 2, y, w, 11, 'rgba(61,90,65,0.6)');
      drawText(ctx, t.text, VIEW_W / 2, y + 3, t.color, { align: 'center' });
      ctx.globalAlpha = 1;
      y -= 13;
    }
  }

  /** A quiet line under the banner, and markers for off-screen events. */
  drawSubtitle(r, ctx, game) {
    if (this.sub) {
      const a = clamp(this.sub.t / 0.6, 0, 1);
      ctx.globalAlpha = a;
      drawText(ctx, this.sub.text, VIEW_W / 2, VIEW_H - 78, P.uiDim, { align: 'center', shadow: '#000' });
      ctx.globalAlpha = 1;
    }
    // Pings sit on the rim of the screen pointing at where the thing happened,
    // so a patrol landing off-camera still tells you which way to look.
    for (const p of this.pings) {
      const sx = p.x - r.camera.ox, sy = p.y - r.camera.oy;
      const a = clamp(p.t / p.total, 0, 1) * (0.5 + Math.abs(Math.sin(game.time * 4)) * 0.5);
      const cx = clamp(sx, 10, VIEW_W - 10), cy = clamp(sy, 22, VIEW_H - 24);
      ctx.globalAlpha = a;
      r.uiRect(cx - 2, cy - 2, 5, 5, p.color);
      r.uiRect(cx - 4, cy, 1, 1, p.color);
      r.uiRect(cx + 4, cy, 1, 1, p.color);
      ctx.globalAlpha = 1;
    }
  }

  /**
   * The occupation readout.
   *
   * This replaces the wave clock as the thing you glance at. It says how many
   * of their outposts are still up and how close the noise is to buying them
   * a patrol — both of which are numbers you can go and change.
   */
  drawOccupation(r, ctx, game) {
    const occ = game.occupation;
    if (!occ || !occ.outposts.length) return;
    const standing = occ.standing.length;
    const cx = VIEW_W / 2;
    const w = 132, h = standing ? 20 : 12;
    const y = 2;
    r.uiRect(cx - w / 2, y, w, h, 'rgba(9,16,13,0.82)');
    r.uiStroke(cx - w / 2, y, w, h, standing ? 'rgba(120,54,44,0.7)' : 'rgba(70,110,72,0.7)');
    if (!standing) {
      drawText(ctx, 'BASIN CLEAR', cx, y + 3, P.uiGood, { align: 'center' });
      return;
    }
    drawText(ctx, 'LES NEST: ' + standing + ' HOLDING', cx, y + 3, P.uiBad, { align: 'center' });
    // the heat bar: full means a patrol leaves for your camp
    const bw = w - 12;
    r.uiRect(cx - bw / 2, y + 12, bw, 4, 'rgba(0,0,0,0.55)');
    const f = clamp(occ.heat, 0, 1);
    r.uiRect(cx - bw / 2, y + 12, Math.round(bw * f), 4, f > 0.8 ? P.uiBad : f > 0.5 ? P.uiWarn : '#6a5a3a');
    r.uiStroke(cx - bw / 2, y + 12, bw, 4, 'rgba(61,90,65,0.5)');
  }

  drawAnnounce(r, ctx, game) {
    const a = this.announce;
    if (!a) return;
    const t = 1 - a.life / a.maxLife;
    const alpha = clamp(Math.min(a.life / 0.5, (1 - t) * 4 + 0.2), 0, 1);
    ctx.globalAlpha = alpha;
    const y = 74;
    const slide = Math.round((1 - clamp(t * 6, 0, 1)) * -14);
    drawText(ctx, a.title, VIEW_W / 2, y + slide, a.color, { align: 'center', scale: 2, shadow: '#000' });
    if (a.sub) drawText(ctx, a.sub, VIEW_W / 2, y + 16 + slide, P.uiDim, { align: 'center', shadow: true });
    ctx.globalAlpha = 1;
  }

  // --- world interaction prompt --------------------------------------------
  drawPrompt(r, ctx, game) {
    const pr = game.prompt;
    if (!pr) return;
    const sx = pr.x - r.camera.ox;
    const sy = pr.y - r.camera.oy;
    const label = '[E] ' + pr.label;
    const w = measure(label, 1) + 8;
    const bx = clamp(Math.round(sx - w / 2), 2, VIEW_W - w - 2);
    const by = clamp(Math.round(sy), 14, VIEW_H - 30);
    const bob = Math.sin(game.time * 4) * 1;
    r.uiRect(bx, by + bob, w, 11, 'rgba(9,16,13,0.88)');
    r.uiStroke(bx, by + bob, w, 11, P.uiAccent);
    drawText(ctx, label, bx + 4, by + 3 + bob, P.ui);
  }

  // --- recruited squad list -------------------------------------------------
  drawSquad(r, ctx, game) {
    const squad = game.npcs.filter(n => n.recruited);
    if (squad.length === 0) return;
    let y = this.squadY;
    for (const n of squad) {
      const down = n.downT > 0;
      drawText(ctx, n.name, 6, y, down ? P.uiBad : P.uiDim, { shadow: true });
      const w = 26;
      r.uiRect(40, y + 1, w, 3, 'rgba(0,0,0,0.5)');
      r.uiRect(40, y + 1, Math.round(w * clamp(n.hp / n.maxHp, 0, 1)), 3, down ? P.uiBad : P.uiGood);
      y += 8;
    }
  }
}


// ==========================================================================
// src/ui/panels.js
// ==========================================================================
// The three full-screen overlays: crafting, chip sockets, and the basin map.
// One class owns all of them so only one can ever be open, and so the "does
// this pause the world?" question has a single answer (it doesn't — waves keep
// counting down while you shop).

// bundled: import { FACTIONS, FACTION_KEYS } from '../systems/factions.
// bundled: import { drawText, measure } from '../engine/font.js';
// bundled: import { itemIcon } from '../art/items.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { RECIPES, RESOURCES, CHIPS } from '../systems/defs.j
// bundled: import { VIEW_W, VIEW_H } from '../engine/canvas.js';
// bundled: import { clamp } from '../engine/math.js';
// bundled: import { audio } from '../engine/audio.js';
// bundled: import { TS, TILES } from '../world/tiles.js';
// bundled: import { makeCanvas } from '../engine/canvas.js';

class Panels {
  constructor() {
    this.mode = 'none';
    this.cursor = 0;
    this.chipCursor = 0;
    this.chipPane = 'bag';       // 'bag' | 'slots'
    this.mapCanvas = null;
    this.mapDirty = true;
    this.scroll = 0;
  }

  get open() { return this.mode !== 'none'; }

  toggle(mode) {
    if (this.mode === mode) { this.mode = 'none'; audio.play('ui'); return; }
    this.mode = mode;
    this.cursor = 0;
    this.scroll = 0;
    audio.play('uiselect');
  }

  close() { this.mode = 'none'; }

  // ---------------------------------------------------------------- input
  update(dt, game) {
    if (!this.open) return;
    const input = game.input;
    if (input.isPressed('pause')) { this.close(); audio.play('ui'); return; }

    if (this.mode === 'craft') this.updateCraft(game, input);
    else if (this.mode === 'chips') this.updateChips(game, input);
    else if (this.mode === 'map') { /* map is read-only */ }
  }

  availableRecipes(game) {
    const p = game.player;
    return RECIPES.filter(rec => {
      if (rec.repeatable && (game.craftCounts[rec.id] || 0) >= rec.repeatable) return false;
      if (rec.give && rec.give.weapon && p.weapons.includes(rec.give.weapon)) return false;
      return true;
    });
  }

  updateCraft(game, input) {
    const list = this.availableRecipes(game);
    if (list.length === 0) return;
    if (input.isPressed('up')) { this.cursor = (this.cursor - 1 + list.length) % list.length; audio.play('ui'); }
    if (input.isPressed('down')) { this.cursor = (this.cursor + 1) % list.length; audio.play('ui'); }
    if (input.wheel) { this.cursor = clamp(this.cursor + input.wheel, 0, list.length - 1); audio.play('ui'); }
    if (input.isPressed('interact') || input.keyPressed('Enter')) {
      const rec = list[clamp(this.cursor, 0, list.length - 1)];
      game.craft(rec);
    }
  }

  updateChips(game, input) {
    const p = game.player;
    const list = this.chipPane === 'bag' ? p.chipBag : p.chips;
    const n = Math.max(1, this.chipPane === 'slots' ? p.chipSlots : list.length);
    if (input.isPressed('up')) { this.chipCursor = (this.chipCursor - 1 + n) % n; audio.play('ui'); }
    if (input.isPressed('down')) { this.chipCursor = (this.chipCursor + 1) % n; audio.play('ui'); }
    if (input.isPressed('left') || input.isPressed('right')) {
      this.chipPane = this.chipPane === 'bag' ? 'slots' : 'bag';
      this.chipCursor = 0;
      audio.play('ui');
    }
    if (input.isPressed('interact') || input.keyPressed('Enter')) {
      if (this.chipPane === 'bag') {
        const key = p.chipBag[this.chipCursor];
        if (key) {
          if (p.chips.length < p.chipSlots) {
            p.installChip(key);
            audio.play('chip');
            game.toast('INSTALLED ' + CHIPS[key].name, CHIPS[key].color);
          } else {
            game.toast('ALL SOCKETS FULL - REMOVE ONE FIRST', P.uiWarn);
            audio.play('deny');
          }
        }
      } else {
        if (p.removeChip(this.chipCursor)) { audio.play('ui'); game.toast('CHIP REMOVED', P.uiDim); }
        else audio.play('deny');
      }
    }
  }

  // ---------------------------------------------------------------- drawing
  draw(r, game) {
    if (!this.open) return;
    const ctx = r.ctx;
    r.uiRect(0, 0, VIEW_W, VIEW_H, 'rgba(6,10,8,0.82)');
    if (this.mode === 'craft') this.drawCraft(r, ctx, game);
    else if (this.mode === 'chips') this.drawChips(r, ctx, game);
    else if (this.mode === 'map') this.drawMap(r, ctx, game);
  }

  drawCraft(r, ctx, game) {
    const p = game.player;
    const list = this.availableRecipes(game);
    this.cursor = clamp(this.cursor, 0, Math.max(0, list.length - 1));

    const px = 12, py = 16, pw = VIEW_W - 24, ph = VIEW_H - 32;
    r.panel(px, py, pw, ph);
    drawText(ctx, 'CRAFTING', px + 6, py + 5, P.ui, { scale: 1 });
    const station = game.nearStation();
    const camp = game.camp;
    // Before anyone has built you anything, the useful thing to say is not
    // "no station nearby" but who to go and ask.
    let stationLabel, stationCol;
    if (station) { stationLabel = 'AT ' + station.toUpperCase(); stationCol = P.uiGood; }
    else if (camp && !camp.hasWorkbench) { stationLabel = 'NOTHING IS BUILT YET'; stationCol = P.uiWarn; }
    else { stationLabel = 'NO STATION NEARBY'; stationCol = P.uiDim; }
    drawText(ctx, stationLabel, px + pw - 6, py + 5, stationCol, { align: 'right' });
    if (camp && !camp.hasWorkbench) {
      drawText(ctx, 'GO AND ASK SOMEBODY TO BUILD A WORKBENCH. NOBODY OUT HERE OWES YOU ONE.',
        px + 6, py + 15, P.uiDim);
    }
    drawText(ctx, 'W/S SELECT   E CRAFT   TAB CLOSE', px + pw - 6, py + ph - 10, P.uiDim, { align: 'right' });

    const rowH = 15;
    const visible = Math.floor((ph - 32) / rowH);
    this.scroll = clamp(this.cursor - Math.floor(visible / 2), 0, Math.max(0, list.length - visible));

    for (let i = 0; i < Math.min(visible, list.length); i++) {
      const idx = i + this.scroll;
      const rec = list[idx];
      if (!rec) break;
      const y = py + 16 + i * rowH;
      const sel = idx === this.cursor;
      const can = game.canCraft(rec);
      if (sel) r.uiRect(px + 3, y - 1, pw - 6, rowH - 1, 'rgba(61,90,65,0.35)');
      const nameColor = !can.ok ? P.uiDim : sel ? P.ui : P.uiDim;
      drawText(ctx, rec.name, px + 7, y + 1, nameColor, { shadow: sel });

      // cost line, coloured per ingredient
      let cx = px + 104;
      for (const k in rec.cost) {
        const need = rec.cost[k];
        const have = p.inv.get(k);
        const icon = itemIcon(k);
        ctx.globalAlpha = have >= need ? 1 : 0.45;
        ctx.drawImage(icon, cx, y - 1);
        ctx.globalAlpha = 1;
        drawText(ctx, have + '/' + need, cx + 11, y + 2, have >= need ? P.uiGood : P.uiBad);
        cx += 12 + measure(have + '/' + need, 1) + 6;
      }
      if (rec.station) {
        drawText(ctx, rec.station.toUpperCase(), px + pw - 8, y + 2,
          station === rec.station ? P.uiGood : P.uiWarn, { align: 'right' });
      }
      if (sel) {
        const desc = rec.desc + (can.ok ? '' : '  (' + can.why + ')');
        drawText(ctx, desc, px + 7, py + ph - 20, can.ok ? P.uiDim : P.uiWarn);
      }
    }
    if (list.length === 0) drawText(ctx, 'NOTHING LEFT TO BUILD.', px + 7, py + 20, P.uiDim);
  }

  drawChips(r, ctx, game) {
    const p = game.player;
    const px = 12, py = 16, pw = VIEW_W - 24, ph = VIEW_H - 32;
    r.panel(px, py, pw, ph);
    drawText(ctx, 'UPGRADE CHIPS', px + 6, py + 5, P.cyber);
    drawText(ctx, 'STOLEN: ' + p.chipsStolen, px + pw - 6, py + 5, P.uiDim, { align: 'right' });
    drawText(ctx, 'A/D SWITCH   W/S SELECT   E INSTALL/REMOVE   C CLOSE', px + pw - 6, py + ph - 10, P.uiDim, { align: 'right' });

    // installed sockets
    const colW = (pw - 20) / 2;
    drawText(ctx, 'SOCKETS (' + p.chips.length + '/' + p.chipSlots + ')', px + 8, py + 18, this.chipPane === 'slots' ? P.ui : P.uiDim);
    for (let i = 0; i < p.chipSlots; i++) {
      const y = py + 30 + i * 17;
      const key = p.chips[i];
      const c = key ? CHIPS[key] : null;
      const sel = this.chipPane === 'slots' && i === this.chipCursor;
      r.uiRect(px + 8, y, colW - 8, 15, sel ? 'rgba(61,90,65,0.35)' : 'rgba(0,0,0,0.25)');
      r.uiStroke(px + 8, y, colW - 8, 15, c ? c.color : '#2c4230');
      if (c) {
        r.uiRect(px + 12, y + 4, 7, 7, c.color);
        drawText(ctx, c.name, px + 23, y + 2, P.ui);
        drawText(ctx, c.desc, px + 23, y + 9, P.uiDim);
      } else {
        drawText(ctx, 'EMPTY SOCKET', px + 14, y + 5, P.uiDim);
      }
    }

    // bag
    const bx = px + colW + 12;
    drawText(ctx, 'SALVAGE (' + p.chipBag.length + ')', bx, py + 18, this.chipPane === 'bag' ? P.ui : P.uiDim);
    if (p.chipBag.length === 0) {
      drawText(ctx, 'RIP CHIPS OUT OF MACHINE', bx, py + 32, P.uiDim);
      drawText(ctx, 'WRECKS WITH [E].', bx, py + 41, P.uiDim);
    }
    const maxRows = Math.floor((ph - 50) / 17);
    for (let i = 0; i < Math.min(p.chipBag.length, maxRows); i++) {
      const key = p.chipBag[i];
      const c = CHIPS[key];
      const y = py + 30 + i * 17;
      const sel = this.chipPane === 'bag' && i === this.chipCursor;
      r.uiRect(bx, y, colW - 8, 15, sel ? 'rgba(61,90,65,0.35)' : 'rgba(0,0,0,0.25)');
      r.uiStroke(bx, y, colW - 8, 15, c.color);
      r.uiRect(bx + 4, y + 4, 7, 7, c.color);
      drawText(ctx, c.name, bx + 15, y + 2, P.ui);
      drawText(ctx, c.desc, bx + 15, y + 9, P.uiDim);
    }
  }

  // --- the basin map --------------------------------------------------------
  buildMap(game) {
    const world = game.world;
    // Tiles per map pixel, chosen so the finished map fills the panel rather
    // than sitting as a postage stamp in the middle of it. A bigger basin
    // needs a coarser map, not a smaller one.
    const availW = VIEW_W - 36, availH = VIEW_H - 86;
    const scale = Math.max(1, Math.ceil(Math.max(world.w / availW, world.h / availH)));
    const mw = Math.ceil(world.w / scale), mh = Math.ceil(world.h / scale);
    const { canvas, ctx } = makeCanvas(mw, mh);
    const img = ctx.createImageData(mw, mh);
    const d = img.data;
    for (let y = 0; y < mh; y++) {
      for (let x = 0; x < mw; x++) {
        const t = world.tileAt(Math.min(world.w - 1, x * scale), Math.min(world.h - 1, y * scale));
        const hex = TILES[t].base;
        const n = parseInt(hex.slice(1), 16);
        const i = (y * mw + x) * 4;
        d[i] = (n >> 16) & 255; d[i + 1] = (n >> 8) & 255; d[i + 2] = n & 255; d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    this.mapCanvas = canvas;
    this.mapScale = scale;
    this.mapDirty = false;
  }

  drawMap(r, ctx, game) {
    if (!this.mapCanvas || this.mapDirty) this.buildMap(game);
    const world = game.world;
    const px = 12, py = 16, pw = VIEW_W - 24, ph = VIEW_H - 32;
    r.panel(px, py, pw, ph);
    drawText(ctx, 'THE BASIN', px + 6, py + 5, P.ui);
    drawText(ctx, 'M TO CLOSE', px + pw - 6, py + 5, P.uiDim, { align: 'right' });

    const mw = this.mapCanvas.width, mh = this.mapCanvas.height;
    const avail = { w: pw - 12, h: ph - 58 };
    const s = Math.min(avail.w / mw, avail.h / mh);
    const dw = Math.round(mw * s), dh = Math.round(mh * s);
    const dx = Math.round(px + (pw - dw) / 2), dy = Math.round(py + 14);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.mapCanvas, dx, dy, dw, dh);
    r.uiStroke(dx - 1, dy - 1, dw + 2, dh + 2, P.uiBorder);

    const toMap = (wx, wy) => ({
      x: dx + (wx / (world.w * TS)) * dw,
      y: dy + (wy / (world.h * TS)) * dh,
    });

    // markers
    const den = toMap(world.den.x, world.den.y);
    r.uiRect(den.x - 2, den.y - 2, 5, 5, P.furCream);
    drawText(ctx, 'DEN', den.x + 4, den.y - 3, P.furCream);

    for (const n of game.npcs) {
      const m = toMap(n.x, n.y);
      r.uiRect(m.x - 1, m.y - 1, 3, 3, n.recruited ? P.uiAccent : P.favor);
    }
    for (const e of game.enemies) {
      const m = toMap(e.x, e.y);
      r.uiRect(m.x - 1, m.y - 1, e.def.boss ? 4 : 2, e.def.boss ? 4 : 2, P.nestEye);
    }
    if (game.surveyLevel > 0) {
      for (const node of world.nodes) {
        if (!node.alive) continue;
        const k = node.type;
        if (!['iron', 'copper', 'obsidian', 'coal', 'sulfur', 'saltpeter'].includes(k)) continue;
        if (game.surveyLevel < 2 && Math.random() > 0.4) continue;
        const m = toMap(node.x, node.y);
        r.uiRect(m.x, m.y, 1, 1, RESOURCES[k] ? RESOURCES[k].color : '#fff');
      }
    }
    if (game.fire.burning.size) {
      let i = 0;
      for (const idx of game.fire.burning) {
        if ((i++ & 3) !== 0) continue;
        const tx = idx % world.w, ty = (idx / world.w) | 0;
        const m = toMap(tx * TS, ty * TS);
        r.uiRect(m.x, m.y, 2, 2, P.fire2);
      }
    }
    // --- named places -------------------------------------------------------
    // Only what you have actually walked to. The map filling in as you cross
    // the basin is most of what makes a big basin worth crossing.
    const known = (world.landmarks || []).filter(l => l.found);
    for (const l of known) {
      const m = toMap(l.x, l.y);
      const hostile = l.outpost && !l.outpost.razed;
      const col = hostile ? P.uiBad : l.cleared ? P.uiGood : P.uiAccent;
      r.uiRect(m.x - 2, m.y - 2, 5, 5, 'rgba(9,16,13,0.8)');
      r.uiRect(m.x - 1, m.y - 1, 3, 3, col);
      if (dw > 200) {
        const label = l.name.toUpperCase();
        drawText(ctx, label, m.x + 4, m.y - 3, col, { scale: 1 });
      }
    }
    // outposts you have found that are not on a named place
    if (game.occupation) {
      for (const o of game.occupation.outposts) {
        if (!o.found || o.landmark) continue;
        const m = toMap(o.x, o.y);
        r.uiRect(m.x - 1, m.y - 1, 3, 3, o.razed ? P.uiGood : P.uiBad);
      }
    }

    const pl = toMap(game.player.x, game.player.y);
    const blink = Math.floor(game.time * 3) % 2 === 0;
    r.uiRect(pl.x - 2, pl.y - 2, 5, 5, blink ? P.cyberHot : P.cyber);

    // --- the ledger ---------------------------------------------------------
    const total = (world.landmarks || []).length;
    const standing = game.occupation ? game.occupation.standing.length : 0;
    let ly = py + ph - 11;
    drawText(ctx, 'FOUND ' + known.length + '/' + total
      + (standing ? '   LES NEST HOLDING ' + standing : '   BASIN CLEAR'),
      px + 8, ly, standing ? P.uiWarn : P.uiGood);
    drawText(ctx, game.surveyLevel > 0 ? 'ORE SURVEYED' : 'ASK WISP TO SURVEY THE RIDGE',
      px + pw - 8, ly, P.uiDim, { align: 'right' });

    // --- standing with the powers of the basin -------------------------------
    if (game.alliances) {
      const keys = FACTION_KEYS;
      const colW = Math.floor((pw - 16) / keys.length);
      const fy = py + ph - 20;
      for (let i = 0; i < keys.length; i++) {
        const k = keys[i], f = FACTIONS[k];
        const v = game.alliances.get(k);
        const x = px + 8 + i * colW;
        const t = game.alliances.tierOf(k);
        drawText(ctx, f.short, x, fy - 15, v > 0 ? f.color : P.uiDim, { scale: 1 });
        drawText(ctx, t >= 0 ? f.tiers[t].title.toUpperCase() : 'UNKNOWN', x, fy - 7,
          t >= 0 ? f.color : P.uiDim, { scale: 1 });
        r.uiRect(x, fy, colW - 8, 3, 'rgba(0,0,0,0.5)');
        r.uiRect(x, fy, Math.round((colW - 8) * (v / 100)), 3, f.color);
      }
    }
  }
}


// ==========================================================================
// src/ui/dialogue.js
// ==========================================================================
// Speech. Everything an NPC says appears in a bubble over their head in world
// space, typed out character by character, so conversations never take the
// camera away from the fight going on behind them.

// bundled: import { drawText, measure, wrapText, LINE_H } from '../engi
// bundled: import { P } from '../art/palette.js';
// bundled: import { VIEW_W, VIEW_H } from '../engine/canvas.js';
// bundled: import { clamp } from '../engine/math.js';
// bundled: import { audio } from '../engine/audio.js';

const BUBBLE_MAX_W = 168;

/**
 * One speech bubble, drawn in screen space over a world position.
 *
 * Everything that talks in this game uses this: neighbours in the basin, Dax
 * through the glass, Vane from the chair. A bar of text pinned to the bottom
 * of the screen tells you somebody is speaking; a bubble with a tail tells you
 * *who*, which matters a great deal in a room with three of them in it.
 */
function speechBubble(r, game, o) {
  const ctx = r.ctx;
  const cam = r.camera;
  const lines = o.lines;
  const alpha = o.alpha == null ? 1 : o.alpha;
  const accent = o.color || P.uiBorder;
  const small = !!o.small;

  let w = 0;
  for (const l of lines) w = Math.max(w, measure(l, 1));
  w = Math.min(o.maxW || BUBBLE_MAX_W, w);
  const padX = 5, padY = 4;
  const bw = w + padX * 2;

  // The box grows with the text rather than opening at its final height and
  // waiting to be filled. Width is fixed to the longest line so it only ever
  // grows downward — a bubble that also changes width mid-sentence twitches.
  const budget = o.chars == null ? Infinity : o.chars;
  let shown = 0, counted = 0;
  for (const l of lines) {
    if (counted >= budget) break;
    shown++;
    counted += l.length + 1;
  }
  shown = Math.max(1, shown);
  const bh = shown * LINE_H + padY * 2 + (o.accept ? LINE_H : 0);

  const anchorX = o.x - cam.ox;
  const anchorY = o.y - cam.oy;
  let bx = Math.round(anchorX - bw / 2);
  let by = Math.round(anchorY - bh - 6);
  // If the speaker is near the top of the screen the bubble flips under them,
  // so it never gets shoved off and pointed at nothing.
  const below = by < 20;
  if (below) by = Math.round(anchorY + 8);
  bx = clamp(bx, 4, VIEW_W - bw - 4);
  by = clamp(by, 16, VIEW_H - bh - 26);

  ctx.globalAlpha = alpha;
  const fill = small ? 'rgba(9,16,13,0.80)' : 'rgba(9,16,13,0.94)';
  r.uiRect(bx, by, bw, bh, fill);
  r.uiStroke(bx, by, bw, bh, small ? '#2c4230' : accent);
  // a lit top edge, so the bubble has a light source like everything else
  r.uiRect(bx + 1, by, bw - 2, 1, small ? '#2c4230' : accent);

  // the tail, pointing at whoever is talking
  const tx = clamp(Math.round(anchorX), bx + 5, bx + bw - 6);
  if (below) {
    r.uiRect(tx - 2, by - 2, 4, 2, fill);
    r.uiRect(tx - 1, by - 4, 2, 2, fill);
    r.uiRect(tx - 2, by - 3, 1, 1, accent);
    r.uiRect(tx + 1, by - 3, 1, 1, accent);
  } else {
    r.uiRect(tx - 2, by + bh, 4, 2, fill);
    r.uiRect(tx - 1, by + bh + 2, 2, 2, fill);
    r.uiRect(tx - 2, by + bh + 1, 1, 1, accent);
    r.uiRect(tx + 1, by + bh + 1, 1, 1, accent);
  }

  // the name tag sits on the bubble's shoulder
  if (o.name) {
    const nameW = measure(o.name, 1);
    const nx = clamp(bx + 3, 2, VIEW_W - nameW - 8);
    r.uiRect(nx, by - 8, nameW + 6, 9, accent);
    drawText(ctx, o.name, nx + 3, by - 7, P.uiDark, { scale: 1 });
  }

  let used = 0;
  for (let i = 0; i < lines.length; i++) {
    const remain = budget - used;
    if (remain <= 0) break;
    drawText(ctx, lines[i].slice(0, Math.max(0, remain)), bx + padX, by + padY + i * LINE_H,
      small ? P.uiDim : (o.textColor || P.ui), { scale: 1 });
    used += lines[i].length + 1;
  }

  if (o.accept && budget >= lines.join(' ').length - 1) {
    const blink = Math.floor(game.time * 3) % 2 === 0;
    drawText(ctx, blink ? '[E] ACCEPT' : ' [E] ACCEPT', bx + padX, by + padY + lines.length * LINE_H, P.favor);
  }
  if (o.more) {
    const blink = Math.floor(game.time * 3) % 2 === 0;
    drawText(ctx, 'E', bx + bw - 5, by + bh - 9, blink ? accent : P.uiDim, { align: 'right' });
  }
  ctx.globalAlpha = 1;
  return { bx, by, bw, bh };
}

class Dialogue {
  constructor() {
    this.active = null;      // { npc, text, life, maxLife, chars, lines, accept }
    this.floats = [];        // short ambient barks
  }

  show(npc, text, seconds = 3, opts = {}) {
    this.active = {
      npc, text,
      life: seconds, maxLife: seconds,
      chars: 0,
      lines: wrapText(text, BUBBLE_MAX_W),
      accept: !!opts.accept,
      voice: npc && npc.data ? npc.data.voice : 1,
    };
  }

  showFloating(npc, text) {
    this.floats.push({ npc, text, life: 2.4, maxLife: 2.4 });
    if (this.floats.length > 4) this.floats.shift();
  }

  close() { this.active = null; }

  get isOpen() { return !!this.active; }
  get needsAccept() { return !!(this.active && this.active.accept); }

  update(dt) {
    const a = this.active;
    if (a) {
      const total = a.text.length;
      const prev = Math.floor(a.chars);
      a.chars = Math.min(total, a.chars + dt * 42);
      if (Math.floor(a.chars) > prev && Math.floor(a.chars) % 2 === 0) {
        audio.play('talk', { pitch: a.voice, vol: 0.5 });
      }
      a.life -= dt;
      if (a.life <= 0) this.active = null;
    }
    for (let i = this.floats.length - 1; i >= 0; i--) {
      this.floats[i].life -= dt;
      if (this.floats[i].life <= 0) this.floats.splice(i, 1);
    }
  }

  /** Skip the typewriter, or dismiss if it's already complete. */
  advance() {
    const a = this.active;
    if (!a) return false;
    if (a.chars < a.text.length) { a.chars = a.text.length; return true; }
    return false;
  }

  draw(r, game) {
    for (const f of this.floats) this._bubble(r, game, f.npc, [f.text], f.text.length, clamp(f.life / 0.4, 0, 1), false, true);
    const a = this.active;
    if (!a || !a.npc) return;
    this._bubble(r, game, a.npc, a.lines, Math.floor(a.chars), clamp(a.life / 0.35, 0, 1), a.accept, false);
  }

  _bubble(r, game, npc, lines, charBudget, alpha, showAccept, small) {
    speechBubble(r, game, {
      x: npc.x, y: npc.y - (npc.h || 20) - 4,
      lines, chars: charBudget, alpha, accept: showAccept, small,
      name: small ? null : npc.name,
    });
  }

}


// ==========================================================================
// src/systems/squad.js
// ==========================================================================
// Top-down army control. Everything that has bonded with you obeys the same
// four orders; the only question is which of them you are talking to.
//
// Command mode replaces your trigger with a reticle: click ground to send them,
// click a machine to send them at it. Everything else stays live while you do
// it — this is not a pause menu.

// bundled: import { drawText } from '../engine/font.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { ROLE_COLOR } from '../art/beastiary.js';
// bundled: import { clamp, TAU } from '../engine/math.js';
// bundled: import { audio } from '../engine/audio.js';
// bundled: import { VIEW_W, VIEW_H } from '../engine/canvas.js';

const ROLE_ORDER = ['fighter', 'tank', 'scout', 'support', 'builder', 'flyer'];

class Squad {
  constructor() {
    this.commandMode = false;
    this.filter = 'all';        // 'all' or a role name
    this.markers = [];          // transient order markers in the world
    this.rallyT = 0;            // temporary morale bonus from a bugle/whistle
    this.lastOrder = '';
    this.lastOrderT = 0;
    this._size = 0;
  }

  members(game) { return game.wildlife.bonded; }

  get size() { return this._size; }

  selected(game) {
    const all = this.members(game);
    if (this.filter === 'all') return all;
    return all.filter(a => a.def.role === this.filter);
  }

  selectedHas(a) { return this.filter === 'all' || a.def.role === this.filter; }

  update(dt, game) {
    const all = this.members(game);
    this._size = all.length;
    this.rallyT = Math.max(0, this.rallyT - dt);
    this.lastOrderT = Math.max(0, this.lastOrderT - dt);
    for (let i = this.markers.length - 1; i >= 0; i--) {
      this.markers[i].life -= dt;
      if (this.markers[i].life <= 0) this.markers.splice(i, 1);
    }
    for (const a of all) a.selected = this.commandMode && this.selectedHas(a);

    const input = game.input;
    if (game.uiBlocksInput) return;

    if (input.isPressed('command')) {
      if (all.length === 0) {
        game.toast('NOBODY FOLLOWS YOU YET  -  FEED THE WILDLIFE [E]', P.uiWarn, 3);
        audio.play('deny');
      } else {
        this.commandMode = !this.commandMode;
        audio.play(this.commandMode ? 'uiselect' : 'ui');
      }
      game.input.touch.setToggle('command', this.commandMode);
    }

    if (input.isPressed('rally')) this.issueFollow(game);
    if (input.isPressed('hold')) this.issueHold(game);

    if (this.commandMode) {
      for (let i = 0; i < ROLE_ORDER.length; i++) {
        if (input.isPressed('slot' + (i + 1))) {
          this.filter = this.filter === ROLE_ORDER[i] ? 'all' : ROLE_ORDER[i];
          audio.play('ui');
        }
      }
      const tap = input.takeTap();
      if (tap) {
        const w = game.r.camera.toWorld(tap.x, tap.y);
        this.issueAt(game, w.x, w.y);
      }
    }
  }

  issueAt(game, wx, wy) {
    const group = this.selected(game);
    if (!group.length) return;
    const target = game.enemyNear(wx, wy, 26);
    if (target) {
      for (const a of group) { a.order = 'attack'; a.orderTarget = target; }
      this.markers.push({ x: target.x, y: target.y, kind: 'attack', life: 1.4 });
      this.say('ATTACK', group.length);
      audio.play('alarm', { vol: 0.4 });
    } else {
      // fan them out so five animals do not pile onto one pixel
      group.forEach((a, i) => {
        const ang = (i / Math.max(1, group.length)) * TAU;
        const spread = Math.min(30, 6 + group.length * 3);
        a.order = 'move';
        a.orderTarget = null;
        a.orderX = wx + Math.cos(ang) * spread;
        a.orderY = wy + Math.sin(ang) * spread * 0.8;
      });
      this.markers.push({ x: wx, y: wy, kind: 'move', life: 1.4 });
      this.say('MOVE', group.length);
      audio.play('ui');
    }
  }

  issueFollow(game) {
    const group = this.selected(game);
    if (!group.length) return;
    for (const a of group) { a.order = 'follow'; a.orderTarget = null; }
    this.markers.push({ x: game.player.x, y: game.player.y, kind: 'rally', life: 1.2 });
    this.say('ON ME', group.length);
    audio.play('uiselect');
  }

  issueHold(game) {
    const group = this.selected(game);
    if (!group.length) return;
    for (const a of group) { a.order = 'hold'; a.orderTarget = null; a.orderX = a.x; a.orderY = a.y; }
    this.say('HOLD', group.length);
    audio.play('ui');
  }

  say(what, n) {
    this.lastOrder = what + '  x' + n + (this.filter === 'all' ? '' : '  (' + this.filter.toUpperCase() + ')');
    this.lastOrderT = 2;
  }

  /** A rally call from an elk or a marmot briefly steadies the whole line. */
  rally(seconds) { this.rallyT = Math.max(this.rallyT, seconds); }

  // --- drawing -------------------------------------------------------------
  drawWorld(r, game) {
    for (const m of this.markers) {
      const f = 1 - m.life / 1.4;
      const col = m.kind === 'attack' ? P.uiBad : m.kind === 'rally' ? P.favor : P.uiAccent;
      r.ring(m.x, m.y, 6 + f * 14, col, 1, 1 - f);
      if (m.kind === 'attack') {
        const s = 5;
        r.line(m.x - s, m.y - s, m.x + s, m.y + s, col, 1, 1 - f);
        r.line(m.x + s, m.y - s, m.x - s, m.y + s, col, 1, 1 - f);
      }
    }
    if (!this.commandMode) return;

    // faint leash from each animal to whatever it has been told to do
    for (const a of this.selected(game)) {
      if (a.order === 'move' || a.order === 'hold') {
        r.line(a.x, a.y, a.orderX, a.orderY, P.uiAccent, 1, 0.22);
      } else if (a.order === 'attack' && a.orderTarget && !a.orderTarget.dead) {
        r.line(a.x, a.y, a.orderTarget.x, a.orderTarget.y, P.uiBad, 1, 0.22);
      }
    }

    // reticle
    const m = game.input.mouse;
    const w = game.r.camera.toWorld(m.sx, m.sy);
    const target = game.enemyNear(w.x, w.y, 26);
    const col = target ? P.uiBad : P.uiAccent;
    const pulse = 0.6 + Math.sin(game.time * 8) * 0.3;
    r.ring(target ? target.x : w.x, target ? target.y : w.y, target ? target.r + 5 : 9, col, 1, pulse);
    r.line(w.x - 8, w.y, w.x - 3, w.y, col, 1, pulse);
    r.line(w.x + 3, w.y, w.x + 8, w.y, col, 1, pulse);
    r.line(w.x, w.y - 8, w.x, w.y - 3, col, 1, pulse);
    r.line(w.x, w.y + 3, w.x, w.y + 8, col, 1, pulse);
  }

  drawHud(r, ctx, game) {
    const all = this.members(game);
    if (!all.length) return;
    const touch = game.input.touch.visible;
    const x = 6;
    let y = touch ? 96 : 84;

    drawText(ctx, 'FOLLOWING  ' + all.length, x, y, this.commandMode ? P.favor : P.uiDim, { shadow: true });
    y += 9;

    const shown = all.slice(0, 8);
    for (const a of shown) {
      const roleCol = ROLE_COLOR[a.def.role] || P.uiDim;
      const dim = this.filter !== 'all' && a.def.role !== this.filter;
      ctx.globalAlpha = dim ? 0.4 : 1;
      r.uiRect(x, y + 1, 2, 5, roleCol);
      drawText(ctx, a.name, x + 5, y, a.downT > 0 ? P.uiBad : P.ui, { shadow: true });
      const bw = 20, bx = x + 52;
      r.uiRect(bx, y + 1, bw, 4, 'rgba(0,0,0,0.5)');
      r.uiRect(bx, y + 1, bw * clamp(a.hp / a.maxHpStat, 0, 1), 4, a.downT > 0 ? P.uiBad : a.devoted ? P.favor : P.uiGood);
      const tag = a.downT > 0 ? 'DOWN' : a.order.toUpperCase();
      drawText(ctx, tag, bx + bw + 3, y, a.downT > 0 ? P.uiBad : P.uiDim, { shadow: true });
      for (let i = 0; i < a.tools.length; i++) r.uiRect(bx + bw + 22 + i * 3, y + 1, 2, 4, P.cyber);
      ctx.globalAlpha = 1;
      y += 8;
    }
    if (all.length > shown.length) {
      drawText(ctx, '+' + (all.length - shown.length) + ' MORE', x + 5, y, P.uiDim, { shadow: true });
    }

    if (this.commandMode) {
      const label = 'COMMAND  -  CLICK TO ORDER  -  ' + (this.filter === 'all' ? 'ALL' : this.filter.toUpperCase());
      drawText(ctx, label, VIEW_W / 2, VIEW_H - 40, P.favor, { align: 'center', shadow: true });
      drawText(ctx, '1-6 FILTER BY ROLE   Y ON ME   H HOLD   T EXIT', VIEW_W / 2, VIEW_H - 31, P.uiDim, { align: 'center', shadow: true });
    }
    if (this.lastOrderT > 0) {
      ctx.globalAlpha = clamp(this.lastOrderT, 0, 1);
      drawText(ctx, this.lastOrder, VIEW_W / 2, 66, P.favor, { align: 'center', shadow: true });
      ctx.globalAlpha = 1;
    }
    if (this.rallyT > 0) drawText(ctx, 'RALLIED', VIEW_W / 2, 76, P.uiGood, { align: 'center', shadow: true });
  }
}


// ==========================================================================
// src/world/lab.js
// ==========================================================================
// The Les Nest facility. Hand-laid rather than noise-generated: the story needs
// to know exactly where your tank is, where the beaver's tank is, and which
// corridor the guard comes down.
//
// It fills the same World object the forest uses, so collision, chunk rendering
// and the draw list all work unchanged.

// bundled: import { T, TS } from './tiles.js';
// bundled: import { makeRng } from '../engine/rng.js';

const LAB_W = 96, LAB_H = 74;

function room(w, x0, y0, x1, y1, floor = T.LAB_FLOOR) {
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (!w.inBounds(tx, ty)) continue;
      const edge = tx === x0 || tx === x1 || ty === y0 || ty === y1;
      w.tiles[w.idx(tx, ty)] = edge ? T.LAB_WALL : floor;
    }
  }
}

function fill(w, x0, y0, x1, y1, id) {
  for (let ty = y0; ty <= y1; ty++) {
    for (let tx = x0; tx <= x1; tx++) {
      if (w.inBounds(tx, ty)) w.tiles[w.idx(tx, ty)] = id;
    }
  }
}

/** Carve a doorway through a wall run. */
function doorway(w, x0, y0, x1, y1, floor = T.LAB_FLOOR) {
  fill(w, x0, y0, x1, y1, floor);
}

/**
 * Builds the whole facility into `world` and returns the landmarks the
 * campaign script needs to place actors and cameras.
 */
function buildLab(world, seed = 1) {
  const rng = makeRng(seed ^ 0x1ab);
  const w = world;
  w.tiles.fill(T.LAB_WALL);
  w.props.length = 0;
  w.decor.length = 0;
  w.nodes.length = 0;
  w.geysers.length = 0;

  const marks = {};
  const P = (x, y, kind, extra = {}) => {
    const o = Object.assign(
      { x: x * TS + TS / 2, y: y * TS + TS, kind, type: 'labprop', variant: (rng() * 4) | 0 }, extra);
    w.props.push(o);
    return o;
  };
  // Something you can walk up to and press E on. `use` says what happens.
  const I = (x, y, kind, use, label, extra = {}) =>
    P(x, y, kind, Object.assign({ use, label, interactive: true }, extra));
  marks.vents = [];
  marks.terminals = [];
  // A duct link. Ferrets are the shape of a pipe; the building is full of
  // pipes; somebody at Les Nest did not think that through.
  const VENT = (ax, ay, bx, by, note) => {
    const a = P(ax, ay, 'vent', { vent: marks.vents.length, end: 'a', interactive: true, use: 'vent', label: 'CRAWL INTO THE DUCT' });
    const b = P(bx, by, 'vent', { vent: marks.vents.length, end: 'b', interactive: true, use: 'vent', label: 'CRAWL INTO THE DUCT' });
    marks.vents.push({ a: { x: a.x, y: a.y }, b: { x: b.x, y: b.y }, note, open: false, propA: a, propB: b });
  };

  // --- holding block (start) ---------------------------------------------
  // A long room of tanks. Yours is third from the left.
  const hx0 = 6, hy0 = 6, hx1 = 44, hy1 = 26;
  room(w, hx0, hy0, hx1, hy1, T.LAB_FLOOR);
  fill(w, hx0 + 1, hy1 - 4, hx1 - 1, hy1 - 1, T.LAB_GRATE);

  // your tank: a glass box you can actually be inside
  const cageX = 14, cageY = 12;
  room(w, cageX - 3, cageY - 3, cageX + 3, cageY + 3, T.LAB_DARK);
  for (let tx = cageX - 3; tx <= cageX + 3; tx++) {
