    this.shotCounter = 0;
    this.recoil = 0;
    this.muzzleT = 0;

    this.chips = [];             // installed
    this.chipSlots = 3;
    this.chipBag = [];           // collected but not installed
    this.stats = {};
    this.shieldUp = false;
    this.shieldT = 0;

    this.gatherTarget = null;
    this.gatherT = 0;
    this.gatherSwing = 0;
    this.tool = 'hand';

    this.kills = 0;
    this.chipsStolen = 0;
    this.treesSaved = 0;
    this.animalsRescued = 0;
    this.carrying = null;        // a rescued animal being carried
    this.footT = 0;
    this.blinkT = 0;
    this.regenAcc = 0;
    // Permanent story bonuses. Kept apart from chips so recompute() can rebuild
    // the chip stats from scratch without wiping them.
    this.bonus = { damage: 0, speed: 0, hp: 0, rof: 0 };
    // The ferret is not a sprite sheet. It is a spine that trails the nose and
    // four feet that plant themselves, solved fresh every frame.
    this.rig = new FerretRig();
    this.spite = false;

    this.recompute();
    this.hp = this.maxHp;
  }

  // --- derived stats -------------------------------------------------------
  recompute() {
    const s = {
      damage: 1, rof: 1, speed: 1, hp: 0, regen: 0, pierce: 0, bounce: 0,
      count: 0, spread: 0, magnet: 0, shield: 0, lifesteal: 0, arc: 0,
      dilate: 0, harvest: 0, burn: 0, overclock: 0, siphon: 0, dash: 0,
    };
    for (const key of this.chips) {
      const c = CHIPS[key];
      if (!c) continue;
      for (const k in c.stat) s[k] = (s[k] || 0) + c.stat[k];
    }
    for (const k in this.bonus) s[k] = (s[k] || 0) + this.bonus[k];
    this.stats = s;
    const newMax = 100 + s.hp;
    if (newMax !== this.maxHp) {
      const frac = this.hp / this.maxHp;
      this.maxHp = newMax;
      this.hp = Math.min(this.maxHp, Math.max(this.hp, Math.round(frac * this.maxHp)));
    }
    this.dashMax = 1 + s.dash;
    this.dashCharges = Math.min(this.dashCharges + 0, this.dashMax);
    if (s.shield > 0 && !this.shieldUp && this.shieldT <= 0) this.shieldUp = true;
  }

  get weapon() { return WEAPONS[this.weapons[this.weaponIndex]] || WEAPONS.popper; }
  get weaponKey() { return this.weapons[this.weaponIndex]; }
  get wood() { return this.inv.get('wood'); }
  get woodFull() { return this.wood >= MAX_WOOD; }

  addWeapon(key) {
    if (this.weapons.includes(key)) return false;
    this.weapons.push(key);
    this.weaponIndex = this.weapons.length - 1;
    return true;
  }

  installChip(key, slot = -1) {
    if (slot < 0) {
      if (this.chips.length >= this.chipSlots) return false;
      this.chips.push(key);
    } else {
      if (slot >= this.chipSlots) return false;
      const old = this.chips[slot];
      this.chips[slot] = key;
      if (old) this.chipBag.push(old);
    }
    const i = this.chipBag.indexOf(key);
    if (i >= 0) this.chipBag.splice(i, 1);
    this.recompute();
    return true;
  }

  removeChip(slot) {
    const key = this.chips[slot];
    if (!key) return false;
    this.chips.splice(slot, 1);
    this.chipBag.push(key);
    this.recompute();
    return true;
  }

  // --- main update ---------------------------------------------------------
  update(dt, game, frozen = false) {
    if (this.dead) { this.deathT += dt; return; }
    const input = game.input;
    const world = game.world;

    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.recoil = Math.max(0, this.recoil - dt * 6);
    this.muzzleT = Math.max(0, this.muzzleT - dt);
    this.scanT = Math.max(0, this.scanT - dt);
    this.scanCd = Math.max(0, this.scanCd - dt);
    this.dashCd = Math.max(0, this.dashCd - dt);
    this.meleeCd = Math.max(0, this.meleeCd - dt);
    this.parryT = Math.max(0, this.parryT - dt);
    this.parryPerfectT = Math.max(0, this.parryPerfectT - dt);
    this.parryFlash = Math.max(0, this.parryFlash - dt * 3.5);
    this.grazeCd = Math.max(0, this.grazeCd - dt);
    this.edgeBuffT = Math.max(0, this.edgeBuffT - dt);
    if (this.meleeT > 0) this.meleeT = Math.max(0, this.meleeT - dt);
    if (this.comboT > 0) { this.comboT -= dt; if (this.comboT <= 0) this.combo = 0; }
    this.blinkT += dt;

    // --- aim -------------------------------------------------------------
    const stick = input.aimVector();
    if (stick) {
      // Twin-stick aiming, with a light magnetism toward whatever you are
      // clearly pointing at — a thumb is not a mouse.
      let a = Math.atan2(stick.y, stick.x);
      const snap = game.aimAssist(this.x, this.y - 10, a);
      if (snap != null) a = snap;
      this.aim = a;
      this.aimX = this.x + Math.cos(a) * 140;
      this.aimY = this.y - 10 + Math.sin(a) * 140;
    } else {
      const mw = game.r.camera.toWorld(input.mouse.sx, input.mouse.sy);
      this.aimX = mw.x; this.aimY = mw.y;
      this.aim = Math.atan2(mw.y - (this.y - 10), mw.x - this.x);
    }

    // --- movement --------------------------------------------------------
    const ax = input.axes();
    const uiBlocked = game.uiBlocksInput || frozen;
    const moveX = uiBlocked ? 0 : ax.x, moveY = uiBlocked ? 0 : ax.y;
    const moving = Math.hypot(moveX, moveY) > 0.05;

    // carrying wood is heavy; a full load is a real decision
    const load = this.wood / MAX_WOOD;
    const carryPenalty = 1 - load * 0.20 - (this.carrying ? 0.16 : 0);
    let speed = BASE_SPEED * (1 + this.stats.speed) * carryPenalty * this.speedMult;
    const tileMul = world.speedAtPx(this.x, this.y);
    speed *= tileMul;
    if (input.isDown('focus')) speed *= 0.45;   // focus-walk for threading bullets

    if (this.dashT > 0) {
      this.dashT -= dt;
      const dashSpeed = 330 * (1 - Math.pow(1 - this.dashT / 0.18, 2) * 0.35);
      this.vx = Math.cos(this.dashAngle) * dashSpeed;
      this.vy = Math.sin(this.dashAngle) * dashSpeed;
      // The trail records the shape the body was actually in, not a stamped
      // silhouette: at speed the ferret leaves a ribbon behind it.
      if (chance(dt * 70)) {
        this.afterimages.push({
          life: 0.24, maxLife: 0.24,
          spine: this.rig.spine.map((n, i) => ({ x: n.x, y: n.y, r: this.rig.radiusAt(i) })),
        });
      }
      this.invuln = Math.max(this.invuln, 0.06);
    } else {
      const target = { x: moveX * speed, y: moveY * speed };
      const accel = moving ? 12 : 16;
      this.vx = damp(this.vx, target.x, 0.0001, dt * accel / 12);
      this.vy = damp(this.vy, target.y, 0.0001, dt * accel / 12);
    }

    this._move(this.vx * dt, this.vy * dt, world);

    // the body follows wherever the nose ended up
    this.rig.update(dt, {
      x: this.x, y: this.y, vx: this.vx, vy: this.vy,
      facing: this.facing, anim: this.anim,
      dashing: this.dashT > 0, aim: this.aim,
    });

    // face the aim while shooting or standing, movement direction otherwise
    const aimingBack = Math.sin(this.aim) < -0.35;
    this.view = aimingBack ? 'back' : 'front';
    if (Math.abs(Math.cos(this.aim)) > 0.2) this.facing = Math.cos(this.aim) > 0 ? 1 : -1;

    // --- animation state --------------------------------------------------
    const spd = Math.hypot(this.vx, this.vy);
    let anim = 'idle';
    if (this.meleeT > 0) anim = 'attack';
    else if (this.hurtT > 0.05) anim = 'hurt';
    else if (this.dashT > 0) anim = 'run';
    else if (this.gatherT > 0) anim = 'attack';
    else if (spd > 130) anim = 'run';
    else if (spd > 12) anim = 'walk';
    if (anim !== this.anim) { this.anim = anim; if (anim !== 'walk' && anim !== 'run') this.animT = 0; }
    const rate = anim === 'run' ? 1.7 : anim === 'walk' ? 1.15 : anim === 'attack' ? 2.2 : 0.55;
    this.animT = (this.animT + dt * rate) % 1;

    if ((anim === 'walk' || anim === 'run') && !world.tileAtPx(this.x, this.y)) { /* noop */ }
    if (anim === 'walk' || anim === 'run') {
      this.footT -= dt * (anim === 'run' ? 6.4 : 4.2);
      if (this.footT <= 0) {
        this.footT = 1;
        audio.play('step', { vol: 0.6 });
        const t = world.tileAtPx(this.x, this.y);
        if (isWater(t)) particles.water(this.x, this.y + 3, 3);
        else particles.dust(this.x, this.y + 2, 2, TILES[t].dark || P.dirt);
      }
    }

    // --- dash -------------------------------------------------------------
    if (this.dashCharges < this.dashMax && this.dashCd <= 0) {
      this.dashCharges++;
      this.dashCd = 1.1;
    }
    if (!uiBlocked && input.isPressed('dash') && this.dashT <= 0 && this.dashCharges > 0 && this.energy >= 18) {
      this.dashCharges--;
      this.energy -= 18;
      this.dashT = 0.18;
      this.dashCd = Math.max(this.dashCd, 0.5);
      this.dashAngle = moving ? Math.atan2(moveY, moveX) : this.aim;
      audio.play('dash');
      particles.burst(this.x, this.y + 2, 12, { colors: [P.cyber, P.cyberHot, '#ffffff'], speed: 90, life: 0.3, additive: true, angle: this.dashAngle + Math.PI, spread: 0.9 });
      game.r.camera.addShake(1.6);
    }

    // --- claw / parry ------------------------------------------------------
    if (!uiBlocked && input.isPressed('melee')) this.tryMelee(game);

    // --- energy -----------------------------------------------------------
    const regenRate = this.dashT > 0 ? 0 : (moving ? 15 : 26);
    this.energy = clamp(this.energy + regenRate * dt, 0, this.maxEnergy);

    // --- overclock (the lab's other gift) ---------------------------------
    const wantOverclock = !uiBlocked && (input.mouse.rdown || input.isDown('overclock')) && this.hp > 12;
    if (wantOverclock !== this.overclock) {
      this.overclock = wantOverclock;
      if (wantOverclock) audio.play('scan', { vol: 0.4 });
    }
    if (this.overclock) {
      this.overclockT += dt;
      this.hp -= dt * 4.5;
      if (chance(dt * 24)) particles.spawn({
        x: this.x + rnd(-5, 5), y: this.y - 8 + rnd(-4, 4), z: 2,
        vx: rnd(-10, 10), vy: rnd(-24, -6), vz: rnd(4, 18),
        life: rnd(0.3, 0.7), size: 1, colors: [P.cyberHot, P.cyber, P.cyberDim], additive: true, gravity: -20,
      });
      if (this.hp <= 8) this.overclock = false;
    } else {
      this.overclockT = Math.max(0, this.overclockT - dt * 2);
    }

    // --- scan pulse -------------------------------------------------------
    if (!uiBlocked && input.isPressed('scan') && this.scanCd <= 0) {
      this.scanCd = 6;
      this.scanT = 1.6;
      audio.play('scan');
      particles.ring(this.x, this.y - 6, 6, 200, 0.9, P.cyber, 2, true);
      game.onScan(this);
    }

    // --- regen from chips -------------------------------------------------
    if (this.stats.regen > 0 && this.hp < this.maxHp) {
      this.regenAcc += dt * this.stats.regen;
      if (this.regenAcc >= 1) { const n = Math.floor(this.regenAcc); this.regenAcc -= n; this.heal(n, false); }
    }

    // --- shield recharge --------------------------------------------------
    if (this.stats.shield > 0 && !this.shieldUp) {
      this.shieldT -= dt;
      if (this.shieldT <= 0) { this.shieldUp = true; audio.play('pickup', { vol: 0.5 }); }
    }

    // --- shooting ---------------------------------------------------------
    this.fireT -= dt;
    // In command mode the click issues orders instead of pulling a trigger.
    if (!uiBlocked && !game.squad.commandMode && input.firing && this.fireT <= 0 && this.gatherT <= 0) this.tryShoot(game);

    // --- weapon select ----------------------------------------------------
    if (!uiBlocked) {
      for (let i = 0; i < 5; i++) {
        if (input.isPressed('slot' + (i + 1)) && i < this.weapons.length) {
          this.weaponIndex = i; audio.play('ui');
        }
      }
      if (input.wheel !== 0 && this.weapons.length > 1) {
        this.weaponIndex = (this.weaponIndex + (input.wheel > 0 ? 1 : -1) + this.weapons.length) % this.weapons.length;
        audio.play('ui');
      }
    }

    // --- gathering --------------------------------------------------------
    this.updateGather(dt, game, uiBlocked);

    // --- environment hazards ----------------------------------------------
    const tid = world.tileAtPx(this.x, this.y);
    const scald = tileDamage(tid);
    if (scald > 0 && this.invuln <= 0) this.damage(scald * dt * 2, game, { silent: true, source: 'scald' });
    const burn = game.fire.burnAtPx(this.x, this.y);
    if (burn > 0) {
      this.damage(11 * dt, game, { silent: true, source: 'fire' });
      if (chance(dt * 8)) particles.embers(this.x + rnd(-4, 4), this.y - 4, 1);
    }

    // --- afterimages ------------------------------------------------------
    for (let i = this.afterimages.length - 1; i >= 0; i--) {
      const a = this.afterimages[i];
      a.life -= dt;
      if (a.life <= 0) this.afterimages.splice(i, 1);
    }

    if (this.hp <= 0) this.die(game);
  }

  _move(dx, dy, world) {
    // Axis-separated sweep so sliding along a boulder feels smooth.
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 4));
    for (let i = 0; i < steps; i++) {
      const sx = dx / steps, sy = dy / steps;
      if (!this._blocked(this.x + sx, this.y, world)) this.x += sx;
      else this.vx *= 0.4;
      if (!this._blocked(this.x, this.y + sy, world)) this.y += sy;
      else this.vy *= 0.4;
    }
    this.x = clamp(this.x, 8, world.pxW - 8);
    this.y = clamp(this.y, 8, world.pxH - 8);
  }

  _blocked(x, y, world) {
    const r = this.r * 0.6;
    for (const [ox, oy] of [[-r, 0], [r, 0], [0, -r * 0.6], [0, r * 0.6]]) {
      const t = world.tileAtPx(x + ox, y + oy);
      if (isSolid(t)) return true;
      if (TILES[t].deep) return true;   // no swimming in the deep channel
    }
    return false;
  }

  // --- combat --------------------------------------------------------------
  tryShoot(game) {
    const w = this.weapon;
    const key = this.weaponKey;
    if (w.meleeOnly) return;                 // claws: the trigger does nothing
    const rof = w.rof / (1 + this.stats.rof + (this.overclock ? 0.6 : 0));
    // ammo
    if (w.ammo > 0) {
      const every = w.ammoEvery || 1;
      const needs = (this.shotCounter % every) === 0;
      if (needs && !this.inv.has('ammo', w.ammo)) {
        if (this.fireT <= -0.3) { audio.play('deny'); this.fireT = 0.35; game.toast('OUT OF ROUNDS', P.uiBad); }
        return;
      }
      if (needs) this.inv.take('ammo', w.ammo);
    }
    this.shotCounter++;
    this.fireT = rof;
    this.recoil = 1;
    this.muzzleT = 0.09;

    const count = w.count + this.stats.count;
    const spread = w.spread + this.stats.spread;
    // Rounds leave the barrel where the barrel actually is.
    const sh = this.rig.shoulder();
    const muzzleDist = ((WEAPON_MUZZLE[w.art] || 16) - 4) * 0.62;
    const ox = sh.x + Math.cos(this.aim) * muzzleDist;
    const oy = sh.y - 2 + Math.sin(this.aim) * muzzleDist;

    const dmg = w.damage * (1 + this.stats.damage) * this.damageMult;

    for (let i = 0; i < count; i++) {
      const off = count > 1 ? (i / (count - 1) - 0.5) * 2 : 0;
      const a = this.aim + off * spread + rnd(-spread * 0.3, spread * 0.3);
      const sp = w.speed * rnd(0.92, 1.08);
      game.spawnBullet({
        x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        damage: dmg, friendly: true, kind: w.bullet,
        life: w.range * 1.2, pierce: (w.pierce || 0) + this.stats.pierce,
        bounce: this.stats.bounce, aoe: w.aoe || 0, arc: w.arc,
        chain: w.chain || 0, chainRange: w.chainRange || 0,
        knock: w.knock || 0, burn: this.stats.burn, arcChance: this.stats.arc,
        scald: w.scald, owner: this,
      });
    }
    audio.play(w.sfx || 'shoot');
    if (w.shake) game.r.camera.addShake(w.shake);
    this.vx -= Math.cos(this.aim) * (w.knock || 20) * 0.5;
    this.vy -= Math.sin(this.aim) * (w.knock || 20) * 0.5;
    particles.burst(ox, oy, 3, { colors: [P.fire1, P.fire2], speed: 60, life: 0.15, additive: true, angle: this.aim, spread: 0.4, gravity: 0 });
  }

  // --- close quarters ------------------------------------------------------
  /** Swing the claws. The opening frames double as a parry. */
  /**
   * The bite.
   *
   * Not a sword swing with a white arc drawn over it. She picks the nearest
   * thing in front of her, throws herself at it, and closes her jaws on it —
   * the lunge is the attack, the rig plays the snap, and the only thing on
   * screen that was not already there is blood.
   */
  tryMelee(game) {
    if (this.meleeCd > 0) return false;
    if (this.energy < MELEE_COST) {
      audio.play('deny', { vol: 0.5 });
      return false;
    }

    // Pick a target first, so she commits to something rather than swinging at
    // the cursor and hoping. Anything inside the arc counts; the closest wins.
    let target = null, bestD = 1e9;
    const reach = MELEE_REACH + 8;
    for (const e of game.enemies) {
      if (e.dead || e.spawnT > 0 || e.charmT > 0) continue;
      const dx = e.x - this.x, dy = (e.y - 6) - (this.y - 8);
      const d = Math.hypot(dx, dy);
      if (d > reach + e.r) continue;
      let diff = Math.atan2(dy, dx) - this.aim;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) > MELEE_ARC) continue;
      if (d < bestD) { bestD = d; target = e; }
    }

    this.energy -= MELEE_COST;
    this.meleeCd = MELEE_CD;
    this.meleeT = 0.24;
    this.parryT = PARRY_WINDOW;
    this.parryPerfectT = PARRY_PERFECT;

    // She goes where the bite is going. With a target that means straight at
    // it; without one it is still a lunge, because the lunge is also how you
    // cross ground quickly without spending a dash.
    const ang = target
      ? Math.atan2((target.y - 6) - (this.y - 8), target.x - this.x)
      : this.aim;
    this.lastMeleeAngle = ang;
    this.aim = ang;
    this.rig.bite(ang);

    const lunge = target ? clamp(bestD * 7, 150, 320) : 165;
    this.vx += Math.cos(ang) * lunge;
    this.vy += Math.sin(ang) * lunge;
    audio.play('dash', { vol: 0.35, pitch: 1.35 });

    const dmg = 26 * (1 + this.stats.damage) * this.damageMult;
    let hits = 0;
    const strike = (e) => {
      e.damage(dmg, game, { vx: Math.cos(ang), vy: Math.sin(ang), knock: 190, owner: this, melee: true });
      // teeth, not sparks
      particles.blood(e.x, e.y - 6, 7);
      particles.burst(e.x, e.y - 6, 4, {
        colors: ['#c04141', '#8e2a2a'], speed: 90, life: 0.32,
        angle: ang, spread: 0.8, gravity: 260, vz: 40,
      });
      hits++;
    };

    for (const e of game.enemies) {
      if (e.dead || e.spawnT > 0 || e.charmT > 0) continue;
      const dx = e.x - this.x, dy = (e.y - 6) - (this.y - 8);
      const d = Math.hypot(dx, dy);
      if (d > MELEE_REACH + e.r) continue;
      let diff = Math.atan2(dy, dx) - ang;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) > MELEE_ARC / 2) continue;
      strike(e);
    }
    // Machines take the teeth badly; so do saw traps in the way.
    for (const h of game.hazards) {
      if (h.dead || !h.damage) continue;
      if (Math.hypot(h.x - this.x, h.y - this.y) < MELEE_REACH + 6) { h.damage(dmg, game); hits++; }
    }
    // And so, eventually, does a relay mast, though it takes a while and she
    // is standing under it the whole time.
    if (game.occupation) {
      for (const o of game.occupation.outposts) {
        if (o.razed) continue;
        if (Math.hypot(o.x - this.x, (o.y - 10) - (this.y - 8)) < MELEE_REACH + 16) { o.damage(dmg * 0.8, game); hits++; }
      }
    }

    if (hits) {
      game.r.camera.addShake(2.2);
      audio.play('flesh', { vol: 0.8 });
      game.slowmo(0.5, 0.07);
    } else {
      audio.play('hit', { vol: 0.2, pitch: 1.5 });
    }
    return true;
  }


  get parryActive() { return this.parryT > 0; }

  /** A hostile shot met by the claws is sent back where it came from. */
  tryParry(b, game) {
    if (this.parryT <= 0) return false;
    const dx = b.x - this.x, dy = b.y - (this.y - 8);
    const d = Math.hypot(dx, dy);
    if (d > MELEE_REACH + b.radius + 4) return false;
    let diff = Math.atan2(dy, dx) - this.lastMeleeAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    if (Math.abs(diff) > MELEE_ARC * 0.75) return false;

    const perfect = this.parryPerfectT > 0;
    this.combo++;
    this.comboT = 3.2;
    this.edgeBuffT = Math.max(this.edgeBuffT, perfect ? 5 : 3);
    this.energy = Math.min(this.maxEnergy, this.energy + (perfect ? 26 : 12));
    this.parryFlash = 1;
    this.invuln = Math.max(this.invuln, perfect ? 0.35 : 0.16);

    // Send it back, at whatever is nearest to the aim.
    const target = game.nearestEnemy(this.x, this.y, 260);
    const a = target ? Math.atan2(target.y - 6 - b.y, target.x - b.x) : this.lastMeleeAngle;
    const sp = Math.max(230, Math.hypot(b.vx, b.vy) * 1.5);
    b.friendly = true;
    b.owner = this;
    b.vx = Math.cos(a) * sp;
    b.vy = Math.sin(a) * sp;
    b.rot = a;
    b.damage = b.damage * (perfect ? 3.2 : 2) * (1 + this.stats.damage);
    b.life = Math.max(b.life, 1.6);
    b.pierce = Math.max(b.pierce, perfect ? 1 : 0);
    b.glow = 'rgba(255,240,160,0.7)';
    b.hits = null;

    audio.play(perfect ? 'shieldbreak' : 'metal', { vol: 0.9 });
    particles.ring(b.x, b.y, 3, perfect ? 34 : 22, 0.3, perfect ? '#ffffff' : P.sulfurHi, 2, true);
    particles.text(this.x, this.y - 30, perfect ? 'PERFECT PARRY' : 'PARRY', perfect ? '#ffffff' : P.sulfurHi, { life: 0.9 });
    game.slowmo(perfect ? 0.22 : 0.45, perfect ? 0.3 : 0.12);
    game.r.camera.addShake(perfect ? 4 : 2);
    return true;
  }

  /** Threading a shot at point-blank range during a dash pays you for it. */
  tryGraze(b, game) {
    if (this.grazeCd > 0 || this.dashT <= 0) return;
    const d = Math.hypot(b.x - this.x, b.y - (this.y - 7));
    if (d > GRAZE_DIST) return;
    this.grazeCd = 0.35;
    this.combo++;
    this.comboT = 3.2;
    this.edgeBuffT = Math.max(this.edgeBuffT, 2.6);
    this.energy = Math.min(this.maxEnergy, this.energy + 10);
    particles.text(this.x, this.y - 26, 'CLOSE', P.cyber, { life: 0.7 });
    particles.ring(this.x, this.y - 7, 4, 16, 0.22, P.cyber, 1, true);
    audio.play('sparker', { vol: 0.4 });
    game.slowmo(0.6, 0.05);
  }

  /** Every damage source multiplies through here. */
  get damageMult() {
    let m = this.overclock ? 1.3 : 1;
    if (this.stats.overclock && this.hp < this.maxHp * 0.4) m *= 1 + this.stats.overclock;
    if (this.edgeBuffT > 0) m *= 1 + Math.min(0.6, 0.12 * this.combo);
    return m;
  }

  damage(n, game, opts = {}) {
    if (this.dead) return;
    if (this.invuln > 0 && !opts.silent) return;
    if (this.shieldUp && !opts.silent) {
      this.shieldUp = false;
      this.shieldT = 9;
      this.invuln = 0.6;
      audio.play('shieldbreak');
      particles.ring(this.x, this.y - 6, 4, 26, 0.35, P.springHot, 2, true);
      game.toast('SHIELD BROKEN', P.springHot);
      return;
    }
    this.hp -= n;
    if (!opts.silent) {
      this.invuln = 0.65;
      this.hurtT = 0.32;
      audio.play('hurt');
      game.r.camera.addShake(4);
      game.hitFlash = Math.max(game.hitFlash, 0.35);
      particles.blood(this.x, this.y - 6, 8, ['#c04141', '#8e2a2a', P.cyber]);
      particles.text(this.x, this.y - 20, '-' + Math.round(n), P.uiBad);
      if (this.stats.dilate) game.slowmo(0.35, 0.28);
    }
    if (this.hp <= 0) this.die(game);
  }

  heal(n, showText = true) {
    const before = this.hp;
    this.hp = Math.min(this.maxHp, this.hp + n);
    if (showText && this.hp > before) particles.text(this.x, this.y - 22, '+' + Math.round(this.hp - before), P.uiGood);
  }

  onKill(game) {
    this.kills++;
    if (this.stats.lifesteal) this.heal(this.stats.lifesteal, false);
    if (this.stats.siphon) this.inv.add('ammo', this.stats.siphon);
  }

  die(game) {
    if (this.dead) return;
    // You do not get a game over during a fight the script says you lose.
    if (game.firstStand && game.firstStand.phase === 'fight') {
      game.firstStand.knockDown(game);
      return;
    }
    this.dead = true;
    this.deathT = 0;
    this.overclock = false;
    audio.play('die');
    particles.burst(this.x, this.y - 6, 30, { colors: ['#c04141', '#8e2a2a', P.furTan, P.cyber], speed: 120, life: 1.1, vz: 120 });
    game.onPlayerDeath();
  }

  respawn(x, y) {
    this.dead = false;
    this.hp = this.maxHp * 0.6;
    this.energy = this.maxEnergy;
    this.x = x; this.y = y;
    this.vx = this.vy = 0;
    this.invuln = 2.5;
    this.shieldUp = this.stats.shield > 0;
    this.carrying = null;
    this.rig.reset(this.x, this.y);
  }

  // --- gathering -----------------------------------------------------------
  updateGather(dt, game, uiBlocked) {
    const world = game.world;
    const holding = !uiBlocked && game.input.isDown('interact');

    if (this.gatherT > 0) {
      this.gatherT -= dt;
      this.gatherSwing += dt * 5;
      if (this.gatherSwing >= 1) {
        this.gatherSwing = 0;
        this.swing(game);
      }
      if (!holding || !this.gatherTarget || !this.gatherTarget.alive) {
        this.gatherT = 0;
        this.gatherTarget = null;
      }
      return;
    }

    if (!holding) { this.gatherTarget = null; return; }

    // Only start a swing if there is nothing more interesting in range —
    // NPCs, wrecks and pickups get priority so E is never ambiguous.
    if (game.interactPriority()) return;

    const node = world.nearestNode(this.x, this.y, 22, (n) => {
      if (n.def.tool === 'axe' && this.inv.isFull('wood') && n.def.yields.every(y => y[0] === 'wood')) return false;
      return true;
    });
    if (!node) return;
    this.gatherTarget = node;
    this.gatherT = 0.4;
    this.gatherSwing = 0.9;
    this.tool = node.def.tool;
  }

  swing(game) {
    const n = this.gatherTarget;
    if (!n || !n.alive) return;
    const world = game.world;
    const dx = n.x - this.x, dy = n.y - this.y;
    if (dx * dx + dy * dy > 30 * 30) { this.gatherT = 0; return; }
    this.facing = dx >= 0 ? 1 : -1;
    this.gatherT = 0.4;

    const power = n.def.tool === 'hand' ? 1 : 1;
    const yields = world.hitNode(n, power);

    if (n.def.tool === 'axe') {
      audio.play('chop');
      particles.woodChips(n.x, n.y - 8, 6);
      game.r.camera.addShake(0.8);
    } else if (n.def.tool === 'pick') {
      audio.play('mine');
      particles.rockChips(n.x, n.y - 4, 6, n.def.kind === 'obsidian' ? [P.obsidianHi, '#2b2a38'] : undefined);
      game.r.camera.addShake(0.8);
    } else {
      audio.play('pick');
      particles.burst(n.x, n.y - 5, 4, { colors: [P.berryHi, P.grassLight], speed: 40, life: 0.4 });
    }

    if (yields) {
      if (n.def.art === 'tree') { audio.play('timber'); particles.leaves(n.x, n.y - 20, 10); game.r.camera.addShake(2); }
      const mult = 1 + this.stats.harvest;
      for (const [item, base] of yields) {
        const amount = Math.max(1, Math.round(base * mult));
        this.grant(item, amount, game, n.x, n.y - 10);
      }
      this.gatherTarget = null;
      this.gatherT = 0;
    }
  }

  /** Add resources, spilling anything over the carry cap onto the ground. */
  grant(item, amount, game, fx, fy) {
    const taken = this.inv.add(item, amount);
    const spill = amount - taken;
    if (taken > 0) {
      particles.text(fx == null ? this.x : fx, (fy == null ? this.y - 16 : fy), '+' + taken + ' ' + (RESOURCES[item] ? RESOURCES[item].name : item), RESOURCES[item] ? RESOURCES[item].color : '#fff');
      audio.play('pickup', { vol: 0.6 });
    }
    if (spill > 0 && game) {
      for (let i = 0; i < Math.min(spill, 6); i++) {
        game.dropPickup(item, 1, (fx == null ? this.x : fx) + rnd(-8, 8), (fy == null ? this.y : fy) + rnd(-6, 6));
      }
      if (item === 'wood') game.toast('BACK IS FULL - 10 LOGS MAX', P.uiWarn);
    }
    return taken;
  }

  // --- drawing -------------------------------------------------------------
  /**
   * The face. Derived, so it is always telling the truth about the state the
   * ferret is actually in rather than whatever was last set on it.
   */
  get expression() {
    if (this.dead) return 'dead';
    if (this.hurtT > 0.05) return 'hurt';
    if (this.hp < this.maxHp * 0.3) return 'hurt';
    if (this.overclock) return 'angry';
    if (this.meleeT > 0 || this.parryT > 0) return 'angry';
    if (this.combo >= 3) return 'happy';
    if (this.gatherT > 0) return 'focused';
    if (this.dashT > 0) return 'focused';
    return 'calm';
  }

  frames(anim, view) {
    return critterFrames('player', PLAYER_CFG, anim, view, 8, this.expression);
  }

  draw(r, game) {
    if (this.dead && this.deathT > 1.2) return;
    const time = game.time;

    // contact shadow, squashed when dashing
    r.shadow(this.x, this.y + 1, 5 + (this.dashT > 0 ? 2 : 0), 2.2);

    // Dash afterimages: the shape the body was actually in a few frames ago,
    // so at speed the ferret leaves a ribbon rather than a row of stamps.
    for (const a of this.afterimages) {
      if (!a.spine) continue;
      this.rig.drawGhost(r, a.spine, (a.life / a.maxLife) * 0.4, P.cyberDim);
    }

    const flipped = this.facing < 0;

    // Wood rides in a bundle over the shoulders, tracked to the live spine so
    // it stays on her back through every turn and bound.
    const drawWood = () => {
      const n = this.wood;
      if (n <= 0) return;
      const log = carryLogSprite(0);
      const sh = this.rig.shoulder(), hp = this.rig.hipNode();
      const bx = (sh.x + hp.x) / 2, by = (sh.y + hp.y) / 2;
      const ang = Math.atan2(hp.y - sh.y, hp.x - sh.x);
      const moving = Math.hypot(this.vx, this.vy) > 20;
      for (let i = 0; i < n; i++) {
        const row = Math.floor(i / 2), col = i % 2;
        const wob = Math.sin(time * 7 + i * 0.8) * (moving ? 0.7 : 0.15);
        const along = (col - 0.5) * 3.4;
        const lx = bx + Math.cos(ang) * along;
        const ly = by + Math.sin(ang) * along - 5 - row * 2.4 + wob;
        r.drawT(log, lx, ly, ang + Math.PI / 2 + wob * 0.04, 1, 1, 1);
      }
      r.line(sh.x, sh.y - 3, hp.x, hp.y - 3, '#4a3f2c', 1, 0.8);
    };

    if (this.view === 'front') drawWood();

    // hurt / overclock tinting, applied to the whole rig at once
    const flashing = this.hurtT > 0 && Math.floor(this.hurtT * 24) % 2 === 0;
    const invulnBlink = this.invuln > 0 && this.hurtT <= 0 && Math.floor(this.invuln * 14) % 2 === 0;
    let tint = null;
    if (flashing) tint = '#ffffff';
    else if (this.overclock && Math.floor(time * 18) % 3 === 0) tint = P.cyber;

    this.rig.draw(r, { alpha: invulnBlink ? 0.5 : 1, tint });

    if (this.view === 'back') drawWood();

    // carried animal, riding on the shoulders
    if (this.carrying) {
      const cf = this.carrying.sprite;
      const sh = this.rig.shoulder();
      if (cf) r.drawT(cf, sh.x + (flipped ? 4 : -4), sh.y - 8, Math.sin(time * 5) * 0.12, 0.8, 0.8);
    }

    // held weapon, rotated to the aim
    this.drawWeapon(r, game, flipped);

    // The guard window still needs to be visible, but a two-pixel arc swept
    // round the whole animal is a special effect, not information. A glint on
    // her teeth says the same thing and stays out of the way.
    if (this.parryT > 0) {
      const nose = this.rig.nose();
      const f = this.parryT / 0.18;
      const perfect = this.parryPerfectT > 0;
      r.rect(nose.x + Math.cos(this.lastMeleeAngle) * 3 - 1, nose.y + Math.sin(this.lastMeleeAngle) * 3 - 1,
        2, 2, perfect ? '#ffffff' : P.sulfurHi);
      if (perfect) r.glow(nose.x, nose.y, 4, 'rgba(255,255,255,0.5)', f);
    }
    // A parry actually landing does get a flash, because it is the single best
    // thing you can do in a fight and it should feel like it.
    if (this.parryFlash > 0) {
      const nose = this.rig.nose();
      r.ring(nose.x, nose.y, 6 + (1 - this.parryFlash) * 10, '#ffffff', 1, this.parryFlash * 0.7);
    }

    // shield bubble
    if (this.shieldUp) {
      const pulse = 0.5 + Math.sin(time * 4) * 0.12;
      const mid = this.rig.shoulder();
      r.ring(mid.x, mid.y, 12 + Math.sin(time * 3) * 0.8, P.springHot, 1, pulse * 0.8);
    }

    // Cybernetic eye glow, tracked to the actual skull the rig solved this
    // frame rather than to a fixed offset from the feet.
    // The optic is one pixel on a very small animal. A five-pixel bloom on it
    // buries the whole face, so it gets a glint, not a headlamp.
    const eye = this.rig.eyePos();
    r.glow(eye.x, eye.y, this.overclock ? 7 : 2.5,
      this.overclock ? 'rgba(180,245,255,0.7)' : 'rgba(77,225,255,0.35)', 1);

    // overclock aura
    if (this.overclock) {
      r.ring(this.x, this.y - 6, 14 + Math.sin(time * 12) * 2, P.cyber, 1, 0.35);
    }
  }

  drawWeapon(r, game, flipped) {
    if (this.weapon.meleeOnly) return;      // claws are already on your hands
    const w = this.weapon;
    const img = weaponSprite(w.art);
    // The gun rides on the shoulders the rig solved this frame, and it is
    // scaled down to something a two-kilo animal could plausibly hold.
    const sh = this.rig.shoulder();
    const GS = 0.62;
    const dist = 3.5 - this.recoil * 2;
    const gx = sh.x + Math.cos(this.aim) * dist;
    const gy = sh.y - 2 + Math.sin(this.aim) * dist * 0.6;
    const flipY = Math.cos(this.aim) < 0 ? -1 : 1;
    r.drawT(img, gx, gy, this.aim, GS, flipY * GS, 1, 2, img.height / 2);
    if (this.muzzleT > 0) {
      const mf = muzzleFlash(w.art === 'scatter' || w.art === 'lobber' ? 1.5 : 1);
      const i = Math.min(2, Math.floor((1 - this.muzzleT / 0.09) * 3));
      const md = ((WEAPON_MUZZLE[w.art] || 16) - 2) * GS;
      const mx = sh.x + Math.cos(this.aim) * md;
      const my = sh.y - 2 + Math.sin(this.aim) * md;
      r.ctx.globalCompositeOperation = 'lighter';
      r.drawT(mf[i], mx, my, this.aim, GS, flipY * GS, 1, 2, 6);
      r.ctx.globalCompositeOperation = 'source-over';
      r.glow(mx, my, 22, 'rgba(255,190,90,0.7)', 1);
    }
  }

  drawLight(r) {
    const eye = this.rig.eyePos();
    r.light(eye.x, eye.y, 84, 'rgba(255,240,210,0.55)', 0.9);
    if (this.overclock) r.light(this.x, this.y - 8, 60, 'rgba(120,220,255,0.7)', 0.8);
  }
}

// bundled: export list


// ==========================================================================
// src/entities/bullets.js
// ==========================================================================
// Pooled projectiles. One flat array serves the player, the recruits and every
// enemy pattern in the game, because a bullet-hell needs to push a couple of
// thousand of these around without allocating.

// bundled: import { bulletSprite } from '../art/items.js';
// bundled: import { P } from '../art/palette.js';
// bundled: import { TAU, clamp, dist2 } from '../engine/math.js';
// bundled: import { rnd, chance } from '../engine/rng.js';
// bundled: import { particles } from '../engine/particles.js';
// bundled: import { audio } from '../engine/audio.js';
// bundled: import { isSolid } from '../world/tiles.js';

const MAX_BULLETS = 2200;

class Bullets {
  constructor() {
    this.pool = new Array(MAX_BULLETS);
    for (let i = 0; i < MAX_BULLETS; i++) this.pool[i] = { alive: false };
    this.head = 0;
    this.count = 0;
  }

  _get() {
    for (let i = 0; i < MAX_BULLETS; i++) {
      const idx = (this.head + i) % MAX_BULLETS;
      if (!this.pool[idx].alive) { this.head = (idx + 1) % MAX_BULLETS; return this.pool[idx]; }
    }
    const b = this.pool[this.head];
    this.head = (this.head + 1) % MAX_BULLETS;
    return b;
  }

  spawn(o) {
    const b = this._get();
    b.alive = true;
    b.x = o.x; b.y = o.y;
    b.vx = o.vx || 0; b.vy = o.vy || 0;
    b.damage = o.damage || 5;
    b.friendly = !!o.friendly;
    b.kind = o.kind || (o.friendly ? 'pellet' : 'redOrb');
    b.life = b.maxLife = o.life == null ? 2 : o.life;
    b.pierce = o.pierce || 0;
    b.bounce = o.bounce || 0;
    b.aoe = o.aoe || 0;
    b.arc = !!o.arc;
    b.z = o.arc ? 6 : 0;
    b.vz = o.arc ? 90 : 0;
    b.chain = o.chain || 0;
    b.chainRange = o.chainRange || 0;
    b.knock = o.knock || 0;
    b.burn = o.burn || 0;
    b.arcChance = o.arcChance || 0;
    b.scald = !!o.scald;
    b.owner = o.owner || null;
    b.radius = o.radius || (b.kind === 'saw' ? 6 : b.kind === 'net' ? 6 : 3);
    b.homing = o.homing || 0;
    b.accel = o.accel || 0;
    b.sine = o.sine || 0;
    b.sinePhase = o.sinePhase || rnd(TAU);
    b.sineFreq = o.sineFreq || 6;
    b.spin = o.spin || 0;
    b.rot = Math.atan2(b.vy, b.vx);
    b.trail = o.trail !== false;
    b.grav = o.grav || 0;
    b.hits = null;
    b.color = o.color || null;
    b.glow = o.glow == null ? (b.friendly ? 'rgba(255,220,140,0.5)' : 'rgba(255,90,70,0.5)') : o.glow;
    b.delay = o.delay || 0;
    b.ignoreTerrain = !!o.ignoreTerrain;
    this.count++;
    return b;
  }

  clear(friendlyToo = true) {
    for (const b of this.pool) {
      if (!b.alive) continue;
      if (!friendlyToo && b.friendly) continue;
      b.alive = false;
    }
    this.count = 0;
  }

  /** Convert every enemy bullet on screen into a harmless puff. */
  clearHostile(r) {
    let n = 0;
    for (const b of this.pool) {
      if (!b.alive || b.friendly) continue;
      particles.burst(b.x, b.y, 3, { colors: [P.nestTealHi, '#ffffff'], speed: 40, life: 0.25, additive: true });
      b.alive = false;
      n++;
    }
    return n;
  }

  update(dt, game) {
    const world = game.world;
    let live = 0;
    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = this.pool[i];
      if (!b.alive) continue;

      if (b.delay > 0) { b.delay -= dt; live++; continue; }

      b.life -= dt;
      if (b.life <= 0) { this._expire(b, game); continue; }
      live++;

      if (b.accel) {
        const sp = Math.hypot(b.vx, b.vy) || 1;
        b.vx += (b.vx / sp) * b.accel * dt;
        b.vy += (b.vy / sp) * b.accel * dt;
      }
      if (b.homing) {
        const target = b.friendly ? game.nearestEnemy(b.x, b.y, 180) : game.player;
        if (target && !target.dead) {
          const a = Math.atan2(target.y - 8 - b.y, target.x - b.x);
          const sp = Math.hypot(b.vx, b.vy);
          const cur = Math.atan2(b.vy, b.vx);
          let d = a - cur;
          while (d > Math.PI) d -= TAU;
          while (d < -Math.PI) d += TAU;
          const na = cur + clamp(d, -b.homing * dt, b.homing * dt);
          b.vx = Math.cos(na) * sp;
          b.vy = Math.sin(na) * sp;
        }
      }
      if (b.grav) b.vy += b.grav * dt;

      let mvx = b.vx, mvy = b.vy;
      if (b.sine) {
        const perp = Math.atan2(b.vy, b.vx) + Math.PI / 2;
        const s = Math.sin((b.maxLife - b.life) * b.sineFreq + b.sinePhase) * b.sine;
        mvx += Math.cos(perp) * s;
        mvy += Math.sin(perp) * s;
      }

      const nx = b.x + mvx * dt;
      const ny = b.y + mvy * dt;

      if (b.arc) {
        b.z += b.vz * dt;
        b.vz -= 240 * dt;
        if (b.z <= 0) { b.z = 0; this._expire(b, game); b.x = nx; b.y = ny; continue; }
      }

      // terrain
      if (!b.ignoreTerrain && !b.arc) {
        const t = world.tileAtPx(nx, ny);
        if (isSolid(t)) {
          if (b.bounce > 0) {
            b.bounce--;
            // reflect off whichever axis actually blocked us
            if (isSolid(world.tileAtPx(nx, b.y))) b.vx = -b.vx;
            if (isSolid(world.tileAtPx(b.x, ny))) b.vy = -b.vy;
            b.rot = Math.atan2(b.vy, b.vx);
            particles.sparks(nx, ny, 4, P.stoneLight);
            audio.play('metal', { vol: 0.4 });
            continue;
          }
          this._expire(b, game, true);
          continue;
        }
      }

      b.x = nx; b.y = ny;
      if (b.spin) b.rot += b.spin * dt;
      else b.rot = Math.atan2(b.vy, b.vx);

      if (b.x < -40 || b.y < -40 || b.x > world.pxW + 40 || b.y > world.pxH + 40) { b.alive = false; continue; }

      // trails
      if (b.trail && chance(dt * (b.friendly ? 26 : 16))) {
        particles.spawn({
          x: b.x, y: b.y, z: b.z, vx: -b.vx * 0.06, vy: -b.vy * 0.06,
          life: 0.22, size: 1, additive: true,
          colors: b.friendly ? ['#fff3c4', '#ffd97a'] : [P.nestRed, '#ff9a8a'],
        });
      }

      // --- collisions ---
      if (b.friendly) {
        const hit = game.hitEnemies(b);
        if (hit === 'consumed') continue;
      } else {
        const p = game.player;
        // Claws first: a shot met by an active guard is turned around before
        // it ever gets a chance to be a hit.
        if (!p.dead && p.parryActive && p.tryParry(b, game)) continue;
        if (!p.dead) p.tryGraze(b, game);
        if (!p.dead && p.invuln <= 0 && dist2(b.x, b.y, p.x, p.y - 7) < (b.radius + p.hitR) * (b.radius + p.hitR)) {
          p.damage(b.damage, game);
          this._expire(b, game);
          continue;
        }
        // recruited soldiers can be hit too
        const ally = game.hitAllies(b);
        if (ally === 'consumed') continue;
      }
    }
    this.count = live;
  }

  _expire(b, game, onTerrain = false) {
    b.alive = false;
    if (b.aoe > 0) {
      game.explode(b.x, b.y, b.aoe, b.damage, b.friendly, b.owner);
    } else if (onTerrain) {
      particles.burst(b.x, b.y, 3, { colors: b.friendly ? ['#ffd97a', '#fff'] : [P.nestRed, '#fff'], speed: 40, life: 0.2, additive: true });
    }
  }

  draw(r) {
    const ctx = r.ctx;
    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = this.pool[i];
      if (!b.alive || b.delay > 0) continue;
      if (!r.camera.visible(b.x, b.y, 24)) continue;
      const img = bulletSprite(b.kind);
      if (b.arc) r.shadow(b.x, b.y, 3, 1.5, 0.3);
      r.drawT(img, b.x, b.y - b.z, b.rot, 1, 1, 1);
    }
  }

  drawGlow(r) {
    // In a heavy pattern the individual glows merge anyway, so thin them out
    // rather than paying for one per bullet.
    const step = this.count > 700 ? 3 : this.count > 350 ? 2 : 1;
    let n = 0;
    for (let i = 0; i < MAX_BULLETS; i++) {
      const b = this.pool[i];
      if (!b.alive || b.delay > 0 || !b.glow) continue;
      if (step > 1 && (n++ % step) !== 0) continue;
      if (!r.camera.visible(b.x, b.y, 24)) continue;
      r.glow(b.x, b.y - b.z, b.radius * 3.4, b.glow, step > 1 ? 0.9 : 0.7);
    }
  }
}

// --- reusable enemy patterns ----------------------------------------------
// Every boss and turret composes its attacks out of these.
const Pattern = {
  radial(game, x, y, n, speed, opts = {}) {
    const base = opts.angle || 0;
    for (let i = 0; i < n; i++) {
      const a = base + (i / n) * TAU;
      game.spawnBullet(Object.assign({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        friendly: false, kind: 'redOrb', damage: opts.damage || 8, life: opts.life || 4,
      }, opts.extra));
    }
  },

  spiral(game, x, y, arms, speed, phase, opts = {}) {
    for (let i = 0; i < arms; i++) {
      const a = phase + (i / arms) * TAU;
      game.spawnBullet(Object.assign({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        friendly: false, kind: opts.kind || 'tealOrb', damage: opts.damage || 8, life: opts.life || 5,
      }, opts.extra));
    }
  },

  aimed(game, x, y, tx, ty, speed, opts = {}) {
    const a = Math.atan2(ty - y, tx - x) + (opts.offset || 0);
    game.spawnBullet(Object.assign({
      x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      friendly: false, kind: opts.kind || 'redOrb', damage: opts.damage || 9, life: opts.life || 4,
    }, opts.extra));
  },

  fan(game, x, y, tx, ty, n, spread, speed, opts = {}) {
    const base = Math.atan2(ty - y, tx - x);
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0 : (i / (n - 1) - 0.5) * 2;
      const a = base + t * spread;
      game.spawnBullet(Object.assign({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        friendly: false, kind: opts.kind || 'redOrb', damage: opts.damage || 8, life: opts.life || 3.5,
      }, opts.extra));
    }
  },

  /** A ring that arrives with a stagger, so it reads as a wave, not a wall. */
  wave(game, x, y, n, speed, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + (opts.angle || 0);
      game.spawnBullet(Object.assign({
        x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        friendly: false, kind: opts.kind || 'tealOrb', damage: opts.damage || 8,
        life: opts.life || 5, delay: (i % 4) * 0.06, sine: opts.sine || 0,
      }, opts.extra));
    }
  },

  /** Two counter-rotating rings — the classic "flower". */
  flower(game, x, y, n, speed, phase, opts = {}) {
    Pattern.spiral(game, x, y, n, speed, phase, opts);
    Pattern.spiral(game, x, y, n, speed * 0.75, -phase * 1.3, opts);
  },

  burstAt(game, x, y, n, speed, opts = {}) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU);
      const s = speed * rnd(0.7, 1.25);
      game.spawnBullet(Object.assign({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        friendly: false, kind: opts.kind || 'ember', damage: opts.damage || 7, life: opts.life || 2.6,
      }, opts.extra));
    }
  },
};

// three bosses. Each type has a movement behaviour and a telegraphed attack

// bundled: import { rnd, pick, chance } from '../engine/rng.js';
// bundled: import { particles } from '../engine/particles.js';

// ---------------------------------------------------------------- catalogue

  },
  // --- bosses ---
  ripsawPrime: {

    r: 24, contact: 26, xp: 30, machine: true, boss: true, keep: 90,

  },

  },
  motherNest: {

    r: 40, contact: 30, xp: 80, machine: true, boss: true, keep: 120,
    loot: [['scrap', 40, 1], ['iron', 16, 1], ['copper', 12, 1], ['obsidian', 8, 1]], chipChance: 1, chips: 4,
  },

let nextId = 1;

class Enemy {
  constructor(kind, x, y, level = 1) {
    const def = ENEMY_TYPES[kind];
    this.id = nextId++;
    this.kind = kind;
    this.def = def;
    this.x = x; this.y = y;
    this.vx = 0; this.vy = 0;
    this.level = level;
    const scale = 1 + (level - 1) * 0.13;
    this.maxHp = Math.round(def.hp * scale);
    this.hp = this.maxHp;
    this.r = def.r;
    this.speed = def.speed * (1 + (level - 1) * 0.02);
    this.facing = -1;
    this.view = 'front';
    this.anim = 'walk';
    this.animT = rnd(1);
    this.fireT = rnd(0.6, (def.fireEvery || 2));
    this.state = 'approach';
    this.stateT = 0;
    this.hurtT = 0;
    this.dead = false;
    this.markT = 0;
    this.burnT = 0;
    this.stunT = 0;
    this.phase = 0;
    this.spin = rnd(TAU);
    this.hover = rnd(TAU);
    this.strafe = chance(0.5) ? 1 : -1;
    this.telegraph = 0;
    this.burstN = 0;
    this.burstT = 0;
    this.telegraphKind = null;
    this.charmT = 0;             // Cobalt's hijack: fights for you for a while
    this.objType = 'enemy';
    this.bossBar = !!def.boss;
    this.spawnT = 0.45;
    this.chopT = 0;
    this.lastHitBy = null;
    const s = def.art === 'critter'
      ? critterSize(HUMANS[def.species].cfg)
      : { w: machineFrames(def.species)[0].width, h: machineFrames(def.species)[0].height };
    this.w = s.w; this.h = s.h;
  }

  get frames() {
    if (this.def.art === 'critter') {
      // The people who work for Les Nest only ever wear two faces: doing
      // the job, and having the job go wrong.
      const face = this.hp < this.maxHp * 0.35 ? 'afraid' : this.telegraph > 0 ? 'angry' : 'focused';
      return critterFrames('human:' + this.def.species, HUMANS[this.def.species].cfg, this.anim, this.view, 8, face);
    }
    return machineFrames(this.def.species);
  }

  get sprite() {
    const f = this.frames;
    return f[Math.floor(this.animT * f.length) % f.length];
  }

  // ------------------------------------------------------------------ update
  update(dt, game) {
    if (this.dead) return;
    const p = game.player;
    this.hurtT = Math.max(0, this.hurtT - dt);
    this.markT = Math.max(0, this.markT - dt);
    this.stunT = Math.max(0, this.stunT - dt);
    this.charmT = Math.max(0, this.charmT - dt);
    this.spawnT = Math.max(0, this.spawnT - dt);
    this.spin += dt;
    this.hover += dt * 2.4;

    if (this.burnT > 0) {
      this.burnT -= dt;
      this.hp -= dt * 9;
      if (chance(dt * 12)) particles.embers(this.x + rnd(-4, 4), this.y - 6, 1);
      if (this.hp <= 0) { this.die(game); return; }
    }

    if (this.spawnT > 0) {
      this.animT = (this.animT + dt) % 1;
      return;
    }

    // target: normally the player, but a hijacked machine turns on its friends
    let target = p;
    if (this.charmT > 0) {
      target = game.nearestEnemy(this.x, this.y, 240, this) || p;
    }
    const tx = target.x, ty = target.y - (target === p ? 6 : 0);
    const d = Math.sqrt(dist2(this.x, this.y, tx, ty));

    if (this.stunT > 0) {
      this.vx *= Math.exp(-6 * dt);
      this.vy *= Math.exp(-6 * dt);
      this._integrate(dt, game);
      return;
    }

    this.fireT -= dt;
    if (this.telegraph > 0) this.telegraph -= dt;

    switch (this.kind) {
      case 'poacher':   this.aiPoacher(dt, game, target, d); break;
      case 'trapper':   this.aiTrapper(dt, game, target, d); break;
      case 'logger':    this.aiLogger(dt, game, target, d); break;
      case 'enforcer':  this.aiEnforcer(dt, game, target, d); break;
      case 'labGuard':  this.aiLabGuard(dt, game, target, d); break;
      case 'technician':this.aiTechnician(dt, game, target, d); break;
      case 'drone':     this.aiDrone(dt, game, target, d); break;
      case 'spider':    this.aiSpider(dt, game, target, d); break;
      case 'turret':    this.aiTurret(dt, game, target, d); break;
      case 'harvester': this.aiHarvester(dt, game, target, d); break;
      case 'firebomber':this.aiFirebomber(dt, game, target, d); break;
      case 'ripsawPrime': this.aiRipsawPrime(dt, game, target, d); break;
      case 'kiln':      this.aiKiln(dt, game, target, d); break;
      case 'motherNest':this.aiMotherNest(dt, game, target, d); break;
      default: this.approach(dt, game, tx, ty, 60); break;
    }

    this._integrate(dt, game);

    // contact damage
    if (this.charmT <= 0 && !p.dead && this.def.contact) {
      const rr = this.r + p.hitR;
      if (dist2(this.x, this.y, p.x, p.y - 6) < rr * rr) {
        p.damage(this.def.contact, game);
        const a = Math.atan2(p.y - this.y, p.x - this.x);
        p.vx += Math.cos(a) * 140;
        p.vy += Math.sin(a) * 140;
      }
    }

    // machines take a beating standing in their own fire
    const burn = game.fire.burnAtPx(this.x, this.y);
    if (burn > 0 && !this.def.flying) this.damage(dt * 8, game, null, true);

    if (this.hp <= 0) this.die(game);
  }

  _integrate(dt, game) {
    const world = game.world;
    const nx = this.x + this.vx * dt;
    const ny = this.y + this.vy * dt;
    if (this.def.flying) {
      this.x = clamp(nx, 6, world.pxW - 6);
      this.y = clamp(ny, 6, world.pxH - 6);
    } else {
      if (!isSolid(world.tileAtPx(nx, this.y)) && !TILES[world.tileAtPx(nx, this.y)].deep) this.x = clamp(nx, 6, world.pxW - 6);
      else this.vx *= -0.4;
      if (!isSolid(world.tileAtPx(this.x, ny)) && !TILES[world.tileAtPx(this.x, ny)].deep) this.y = clamp(ny, 6, world.pxH - 6);
      else this.vy *= -0.4;
    }
    const sp = Math.hypot(this.vx, this.vy);
    if (Math.abs(this.vx) > 4) this.facing = this.vx > 0 ? 1 : -1;
    this.view = this.vy < -10 ? 'back' : 'front';
    if (this.def.art === 'critter') {
      this.anim = this.telegraph > 0 ? 'attack' : sp > 18 ? 'walk' : 'idle';
      this.animT = (this.animT + dt * (sp > 18 ? 1.3 : 0.6)) % 1;
    } else {
      this.animT = (this.animT + dt * 1.4) % 1;
    }
    if (!this.def.flying && sp > 20 && chance(dt * 4)) {
      particles.dust(this.x, this.y + 1, 1, TILES[game.world.tileAtPx(this.x, this.y)].dark || P.dirt);
    }
  }

  // --- steering helpers ----------------------------------------------------
  approach(dt, game, tx, ty, keep = 0, accel = 320) {
    const a = Math.atan2(ty - this.y, tx - this.x);
    const d = Math.sqrt(dist2(this.x, this.y, tx, ty));
    let want = this.speed;
    if (keep > 0) {
      if (d < keep * 0.75) want = -this.speed * 0.8;
      else if (d < keep * 1.1) want = 0;
    }
    const sx = Math.cos(a) * want, sy = Math.sin(a) * want;
    // strafe component keeps fights circular instead of a straight line
    const px = -Math.sin(a) * this.speed * 0.55 * this.strafe;
    const py = Math.cos(a) * this.speed * 0.55 * this.strafe;
    const mix = keep > 0 ? 1 : 0.35;
    this.vx += ((sx + px * mix) - this.vx) * clamp(dt * accel / 60, 0, 1);
    this.vy += ((sy + py * mix) - this.vy) * clamp(dt * accel / 60, 0, 1);
    if (chance(dt * 0.25)) this.strafe *= -1;
  }

  hoverAround(dt, game, tx, ty, keep) {
    this.approach(dt, game, tx, ty, keep, 220);
    this.vy += Math.sin(this.hover) * 8;
  }

  telegraphed(kind, time) {
    this.telegraph = time;
    this.telegraphKind = kind;
  }

  // --- per-type AI ---------------------------------------------------------
  aiPoacher(dt, game, target, d) {
    this.approach(dt, game, target.x, target.y, this.def.keep);
    if (this.fireT <= 0 && d < 220) {
      if (this.telegraph <= 0) { this.telegraphed('shot', 0.45); audio.play('alarm', { vol: 0.25 }); return; }
      if (this.telegraph > 0.02) return;
      this.fireT = this.def.fireEvery * rnd(0.8, 1.25);
      Pattern.fan(game, this.x, this.y - 8, target.x, target.y - 6, 3, 0.22, 150, { damage: 9, kind: 'redOrb' });
      audio.play('shotgun', { vol: 0.5 });
      particles.burst(this.x, this.y - 8, 4, { colors: [P.fire1, P.fire2], speed: 60, life: 0.2, additive: true });
    }
  }

  aiLabGuard(dt, game, target, d) {
    // Deliberately legible: he backs off, telegraphs, then fires two slow
    // rounds you are meant to learn to parry.
    this.approach(dt, game, target.x, target.y, this.def.keep);
    if (this.fireT <= 0 && d < 220) {
      this.fireT = this.def.fireEvery * rnd(0.9, 1.2);
      this.telegraph = 0.34;
      this.burstN = this.def.burst || 2;
      this.burstT = 0.34;
    }
    if (this.burstN > 0) {
      this.burstT -= dt;
      if (this.burstT <= 0) {
        this.burstN--;
        this.burstT = 0.18;
        Pattern.aimed(game, this.x, this.y - 8, target.x, target.y - 6, this.def.bulletSpeed || 110, {
          kind: 'dart', damage: 8, offset: rnd(-0.06, 0.06),
        });
        audio.play('rifle', { vol: 0.4 });
      }
    }
  }

  aiTrapper(dt, game, target, d) {
    this.approach(dt, game, target.x, target.y, this.def.keep);
    if (this.fireT <= 0 && d < 260) {
      this.fireT = this.def.fireEvery * rnd(0.9, 1.3);
      if (chance(0.5)) {
        Pattern.aimed(game, this.x, this.y - 8, target.x, target.y - 6, 120, {
          kind: 'net', damage: 6, life: 3,
          extra: { radius: 6, net: true, glow: 'rgba(200,180,120,0.4)' },
        });
        audio.play('lob', { vol: 0.5 });
      } else {
        game.spawnHazard('sawtrap', this.x + rnd(-30, 30), this.y + rnd(-24, 24));
        audio.play('metal', { vol: 0.5 });
      }
    }
  }

  aiLogger(dt, game, target, d) {
    // Loggers prefer trees to ferrets; that is what makes them urgent.
    this.chopT -= dt;
    const tree = game.world.nearestNode(this.x, this.y, 40, (n) => n.def.art === 'tree');
    if (tree && d > 60) {
      this.approach(dt, game, tree.x, tree.y, 14);
      if (this.chopT <= 0 && dist2(this.x, this.y, tree.x, tree.y) < 26 * 26) {
        this.chopT = 0.55;
        this.telegraphed('chop', 0.3);
        audio.play('chop', { vol: 0.6 });
        particles.woodChips(tree.x, tree.y - 8, 5);
        const y = game.world.hitNode(tree, 2);
        if (y) { game.onTreeFelledByEnemy(tree); audio.play('timber', { vol: 0.7 }); }
      }
      return;
    }
    this.approach(dt, game, target.x, target.y, 0);
    if (d < 34 && this.fireT <= 0) {
      this.fireT = this.def.fireEvery;
      this.telegraphed('swing', 0.28);
      Pattern.fan(game, this.x, this.y - 8, target.x, target.y - 6, 5, 0.5, 130, { damage: 12, kind: 'saw', life: 0.55, extra: { spin: 14, radius: 6 } });
      audio.play('metal', { vol: 0.6 });
    }
  }

  aiEnforcer(dt, game, target, d) {
    this.stateT -= dt;
    if (this.state === 'dash') {
      if (this.stateT <= 0) { this.state = 'approach'; this.stateT = rnd(2, 3.5); }
      return;
    }
    this.approach(dt, game, target.x, target.y, this.def.keep);
    if (this.stateT <= 0 && d < 190) {
      this.state = 'dash';
      this.stateT = 0.3;
      const a = Math.atan2(target.y - this.y, target.x - this.x);
      this.vx = Math.cos(a) * 300;
      this.vy = Math.sin(a) * 300;
      audio.play('dash', { vol: 0.6 });
      particles.burst(this.x, this.y, 8, { colors: [P.nestTealHi, P.nestTeal], speed: 70, life: 0.3, additive: true });
    }
    if (this.fireT <= 0 && d < 240) {
      this.fireT = this.def.fireEvery * rnd(0.8, 1.1);
      for (let i = 0; i < 3; i++) {
        Pattern.aimed(game, this.x, this.y - 8, target.x, target.y - 6, 165, {
          kind: 'dart', damage: 10, offset: (i - 1) * 0.1,
          extra: { homing: 1.6, life: 2.6, glow: 'rgba(53,179,171,0.6)' },
        });
      }
      audio.play('rifle', { vol: 0.5 });
    }
  }

  aiTechnician(dt, game, target, d) {
    // Runs away and calls for help.
    this.approach(dt, game, target.x, target.y, this.def.keep + 60);
    if (this.fireT <= 0) {
      this.fireT = this.def.fireEvery;
      if (d < 300 && chance(0.5)) {
        game.callReinforcement(this.x, this.y);
        particles.text(this.x, this.y - 22, 'CALLING IT IN', P.nestEye, { life: 1.2 });
        audio.play('alarm', { vol: 0.4 });
      } else {
        Pattern.aimed(game, this.x, this.y - 8, target.x, target.y - 6, 130, { kind: 'tealOrb', damage: 6 });
      }
    }
  }

  aiDrone(dt, game, target, d) {
    this.hoverAround(dt, game, target.x, target.y, this.def.keep);
    if (this.fireT <= 0 && d < 230) {
      if (this.telegraph <= 0) { this.telegraphed('burst', 0.4); return; }
      if (this.telegraph > 0.02) return;
      this.fireT = this.def.fireEvery * rnd(0.85, 1.2);
      for (let i = 0; i < 3; i++) {
        game.spawnBullet({
          x: this.x, y: this.y + 4, damage: 7, friendly: false, kind: 'tealOrb',
          vx: Math.cos(Math.atan2(target.y - 6 - this.y, target.x - this.x)) * 190,
          vy: Math.sin(Math.atan2(target.y - 6 - this.y, target.x - this.x)) * 190,
          delay: i * 0.09, life: 3,
        });
      }
      audio.play('shoot', { vol: 0.4 });
    }
  }

  aiSpider(dt, game, target, d) {
    this.approach(dt, game, target.x, target.y, this.def.keep);
    if (this.fireT <= 0) {
      if (this.telegraph <= 0) {
        this.telegraphed('ring', 0.55);
        particles.ring(this.x, this.y - 6, 4, 40, 0.5, P.nestEye, 1, true);
        audio.play('alarm', { vol: 0.3 });
        return;
      }
      if (this.telegraph > 0.02) return;
      this.fireT = this.def.fireEvery * rnd(0.85, 1.15);
      Pattern.radial(game, this.x, this.y - 6, 12, 120, { damage: 8, angle: this.spin });
      audio.play('explode', { vol: 0.4 });
      game.r.camera.addShake(1.4);
    }
  }

  aiTurret(dt, game, target, d) {
    this.approach(dt, game, target.x, target.y, this.def.keep);
    this.stateT -= dt;
    if (this.state === 'spray') {
      this.phase += dt * 5.2;
      if (chance(dt * 26)) Pattern.spiral(game, this.x, this.y - 14, 3, 130, this.phase, { damage: 8 });
      if (this.stateT <= 0) { this.state = 'approach'; this.fireT = this.def.fireEvery; }
      return;
    }
    if (this.fireT <= 0 && d < 260) {
      this.state = 'spray';
      this.stateT = 2.2;
      this.telegraphed('spiral', 0.4);
      audio.play('laser', { vol: 0.4 });
    }
  }

  aiHarvester(dt, game, target, d) {
    this.approach(dt, game, target.x, target.y, this.def.keep, 120);
    this.stateT -= dt;
    if (this.state === 'laser') {
      this.phase += dt * 1.1;
      if (chance(dt * 30)) {
        const a = this.laserBase + Math.sin(this.phase) * 0.8;
        game.spawnBullet({
          x: this.x, y: this.y - 14, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260,
          damage: 11, friendly: false, kind: 'laserBolt', life: 2.4,
        });
      }
      if (this.stateT <= 0) { this.state = 'approach'; this.fireT = this.def.fireEvery; }
      return;
    }
    if (this.fireT <= 0 && d < 280) {
      if (chance(0.55)) {
        this.state = 'laser';
        this.stateT = 2.6;
        this.laserBase = Math.atan2(target.y - this.y, target.x - this.x) - Math.sin(0) * 0.8;
        this.phase = 0;
        this.telegraphed('laser', 0.7);
        audio.play('laser', { vol: 0.6 });
      } else {
        this.fireT = this.def.fireEvery;
        this.telegraphed('mortar', 0.5);
        for (let i = 0; i < 4; i++) {
          const tx = target.x + rnd(-46, 46), ty = target.y + rnd(-40, 40);
          game.spawnMortar(tx, ty, 1.15 + i * 0.14, 34, 22, this);
        }
        audio.play('lob', { vol: 0.6 });
      }
    }
  }

  aiFirebomber(dt, game, target, d) {
    // Circles the treeline and drops incendiaries.
    this.hoverAround(dt, game, target.x, target.y, this.def.keep);
    if (this.fireT <= 0) {
      this.fireT = this.def.fireEvery * rnd(0.8, 1.2);
      this.telegraphed('bomb', 0.35);
      const tx = this.x + rnd(-30, 30), ty = this.y + rnd(10, 40);
      game.spawnFirebomb(tx, ty, 1.0, this);
      audio.play('lob', { vol: 0.6 });
    }
  }

  // --- bosses --------------------------------------------------------------
  aiRipsawPrime(dt, game, target, d) {
    const hpFrac = this.hp / this.maxHp;
    const phase = hpFrac > 0.66 ? 0 : hpFrac > 0.33 ? 1 : 2;
    if (phase !== this.phaseIdx) {
      this.phaseIdx = phase;
      this.state = 'approach';
      this.fireT = 0.8;
      game.bossPhase(this, phase);
    }
    this.stateT -= dt;

    if (this.state === 'charge') {
      if (this.stateT <= 0) {
        this.state = 'approach';
        this.fireT = 0.55;
        // It always leaves something behind when it stops: a ring of debris,
        // so a dodged charge is still a pattern you have to read.
        Pattern.radial(game, this.x, this.y - 8, 10 + phase * 3, 130, { damage: 9, angle: rnd(TAU) });
        game.r.camera.addShake(5);
        audio.play('explode', { vol: 0.5 });
      }
      if (chance(dt * 20)) particles.sparks(this.x + rnd(-16, 16), this.y + 6, 2, P.nestSteelHi);
      // Chews through the treeline as it goes, but on a timer — a per-frame
      // call here would clear-cut the whole forest in a second.
      this.chopT -= dt;
      if (this.chopT <= 0) { this.chopT = 0.2; game.damageTreesAt(this.x, this.y, 26, 1); }
      return;
    }
    if (this.state === 'spin') {
      this.spinPhase += dt * (2.4 + phase * 0.9);
      if (chance(dt * 34)) Pattern.spiral(game, this.x, this.y - 10, 4 + phase, 140, this.spinPhase, { damage: 9 });
      if (this.stateT <= 0) { this.state = 'approach'; this.fireT = 1.0; }
      return;
    }

    this.approach(dt, game, target.x, target.y, this.def.keep, 140);
    if (this.fireT <= 0) {
      const roll = Math.random();
      if (roll < 0.34) {
        this.state = 'charge';
        this.stateT = 1.1;
        this.telegraphed('charge', 0.6);
        const a = Math.atan2(target.y - this.y, target.x - this.x);
        this.vx = Math.cos(a) * 280; this.vy = Math.sin(a) * 280;
        audio.play('roar', { vol: 0.6 });
        game.r.camera.addShake(4);
      } else if (roll < 0.7) {
        this.state = 'spin';
        this.stateT = 2.4 + phase * 0.6;
        this.spinPhase = rnd(TAU);
        this.telegraphed('spiral', 0.5);
        audio.play('laser', { vol: 0.5 });
      } else {
        this.fireT = 2.0;
        Pattern.wave(game, this.x, this.y - 10, 18 + phase * 6, 115, { damage: 9, sine: phase > 1 ? 30 : 0 });
        audio.play('explode', { vol: 0.5 });
      }
    }
  }

  aiKiln(dt, game, target, d) {
    const hpFrac = this.hp / this.maxHp;
    const phase = hpFrac > 0.6 ? 0 : hpFrac > 0.3 ? 1 : 2;
    if (phase !== this.phaseIdx) { this.phaseIdx = phase; game.bossPhase(this, phase); this.fireT = 0.6; }
    this.hoverAround(dt, game, target.x, target.y, this.def.keep);
    this.stateT -= dt;

    if (this.state === 'rain') {
      if (chance(dt * (5 + phase * 4))) {
        game.spawnFirebomb(target.x + rnd(-90, 90), target.y + rnd(-70, 70), 1.2, this);
      }
      if (this.stateT <= 0) { this.state = 'approach'; this.fireT = 2.2; }
      return;
    }
    if (this.fireT <= 0) {
      const roll = Math.random();
      if (roll < 0.45) {
        this.state = 'rain';
        this.stateT = 3.2 + phase;
        this.telegraphed('rain', 0.8);
        audio.play('firewhoosh', { vol: 0.8 });
        game.toast('INCENDIARY RUN INBOUND', P.uiBad, 2.4);
      } else if (roll < 0.75) {
        this.fireT = 2.0;
        Pattern.radial(game, this.x, this.y, 14 + phase * 4, 120, { damage: 9, kind: 'ember', angle: this.spin, extra: { kind: 'ember', glow: 'rgba(255,120,60,0.6)' } });
        audio.play('explode', { vol: 0.5 });
      } else {
        this.fireT = 2.4;
        for (let i = 0; i < 5 + phase * 2; i++) {
          Pattern.aimed(game, this.x, this.y, target.x, target.y, 150, {
            kind: 'ember', damage: 8, offset: rnd(-0.4, 0.4), extra: { delay: i * 0.07, sine: 24 },
          });
        }
        audio.play('laserfire', { vol: 0.5 });
      }
    }
  }

  aiMotherNest(dt, game, target, d) {
    const hpFrac = this.hp / this.maxHp;
    const phase = hpFrac > 0.7 ? 0 : hpFrac > 0.4 ? 1 : 2;
    if (phase !== this.phaseIdx) {
      this.phaseIdx = phase;
      game.bossPhase(this, phase);
      this.fireT = 1.2;
      // it sheds its escort every time the egg cracks further
      for (let i = 0; i < 3 + phase * 2; i++) {
        game.spawnEnemy(pick(['drone', 'spider', 'enforcer']), this.x + rnd(-70, 70), this.y + rnd(-50, 50), this.level);
      }
    }
    this.stateT -= dt;
    this.approach(dt, game, target.x, target.y, this.def.keep, 90);

    if (this.state === 'flower') {
      this.spinPhase += dt * 1.6;
      if (chance(dt * 22)) Pattern.flower(game, this.x, this.y - 10, 6 + phase * 2, 105, this.spinPhase, { damage: 10 });
      if (this.stateT <= 0) { this.state = 'approach'; this.fireT = 1.6; }
      return;
    }
    if (this.state === 'sweep') {
      this.phase += dt * 2.2;
      if (chance(dt * 40)) {
        for (const side of [-1, 1]) {
          const a = Math.atan2(target.y - this.y, target.x - this.x) + Math.sin(this.phase) * 0.9 * side;
          game.spawnBullet({
            x: this.x + side * 24, y: this.y - 6, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240,
            damage: 12, friendly: false, kind: 'laserBolt', life: 2.6,
          });
        }
      }
      if (this.stateT <= 0) { this.state = 'approach'; this.fireT = 2.0; }
      return;
    }

    if (this.fireT <= 0) {
      const roll = Math.random();
      if (roll < 0.3) {
        this.state = 'flower';
        this.stateT = 3.4;
        this.spinPhase = rnd(TAU);
        this.telegraphed('flower', 0.7);
        audio.play('laser', { vol: 0.6 });
      } else if (roll < 0.6) {
        this.state = 'sweep';
        this.stateT = 2.8;
        this.phase = 0;
        this.telegraphed('laser', 0.8);
        audio.play('laser', { vol: 0.7 });
      } else if (roll < 0.82) {
        this.fireT = 2.4;
        this.telegraphed('mortar', 0.7);
        for (let i = 0; i < 8; i++) game.spawnMortar(target.x + rnd(-100, 100), target.y + rnd(-80, 80), 1.2 + i * 0.1, 36, 24, this);
        audio.play('lob', { vol: 0.7 });
      } else {
        this.fireT = 2.6;
        Pattern.wave(game, this.x, this.y - 6, 26 + phase * 8, 110, { damage: 10, sine: 20 });
        audio.play('explode', { vol: 0.6 });
        game.r.camera.addShake(4);
      }
    }
  }

  // --- damage & death ------------------------------------------------------
  damage(n, game, bullet = null, silent = false) {
    if (this.dead) return 0;
    let dmg = n;
    if (this.markT > 0) dmg *= 1.2;
    // Scripted ceramic plate: the hit lands, the damage does not.
    if (this.armour) {
      dmg *= this.armour;
      if (!silent && chance(0.5)) {
        particles.text(this.x, this.y - 22, 'PLATE', P.uiDim, { life: 0.6 });
        audio.play('metal', { vol: 0.35 });
      }
    }
    this.hp -= dmg;
    this.hurtT = 0.14;
    if (bullet) {
      this.lastHitBy = bullet.owner || null;
      if (bullet.knock) {
        const a = Math.atan2(bullet.vy, bullet.vx);
        const mass = this.def.boss ? 0.12 : this.def.hp > 200 ? 0.3 : 1;
        this.vx += Math.cos(a) * bullet.knock * mass;
        this.vy += Math.sin(a) * bullet.knock * mass;
      }
      if (bullet.burn) this.burnT = Math.max(this.burnT, 2.4);
      if (bullet.scald) this.stunT = Math.max(this.stunT, 0.18);
    }
    if (!silent) {
      if (this.def.machine) { audio.play('metal', { vol: 0.45 }); particles.sparks(this.x + rnd(-4, 4), this.y - 6, 4, P.nestSteelHi); }
      else { audio.play('flesh', { vol: 0.45 }); particles.blood(this.x + rnd(-3, 3), this.y - 6, 4); }
    }
    if (this.hp <= 0) this.die(game);
    return dmg;
  }

  die(game) {
    if (this.dead) return;
    this.dead = true;
    const def = this.def;
    if (def.machine) {
      audio.play(def.boss ? 'bigexplode' : 'explode');
      particles.scrap(this.x, this.y - 6, def.boss ? 40 : 14);
      particles.burst(this.x, this.y - 6, def.boss ? 40 : 16, { colors: [P.fire1, P.fire2, P.fire3], speed: def.boss ? 220 : 130, life: 0.8, additive: true, vz: 130 });
      particles.smoke(this.x, this.y - 6, def.boss ? 20 : 8, { life: 2.4, size: 3 });
      particles.ring(this.x, this.y - 6, 6, def.boss ? 140 : 46, 0.5, P.fire2, 2, true);
      game.r.camera.addShake(def.boss ? 12 : 3.5);
    } else {
      audio.play('flesh', { vol: 0.9 });
      particles.blood(this.x, this.y - 6, 16);
      game.r.camera.addShake(1.5);
    }
    game.onEnemyKilled(this);
  }

  // --- drawing -------------------------------------------------------------
  draw(r, game) {
    if (this.dead) return;
    const img = this.sprite;
    if (!img) return;
    const flying = this.def.flying;
    const hoverY = flying ? -14 - Math.sin(this.hover) * 2 : 0;

    r.shadow(this.x, this.y, this.r * (flying ? 0.7 : 1), this.r * 0.4, flying ? 0.18 : 0.3);

    // spawn-in warp
    if (this.spawnT > 0) {
      const t = 1 - this.spawnT / 0.45;
      r.ring(this.x, this.y, this.r + 20 * (1 - t), P.nestEye, 2, t);
      r.drawT(img, this.x, this.y - img.height / 2 + hoverY, 0, this.facing < 0 ? -1 : 1, clamp(t * 1.4, 0.05, 1), t);
      return;
    }

    let out = img;
    if (this.hurtT > 0) {
      const f = this.frames;
      out = flashFrames('enemy:' + this.kind + this.anim + this.view, f, '#ffffff')[Math.floor(this.animT * f.length) % f.length];
    } else if (this.charmT > 0 && Math.floor(game.time * 8) % 2 === 0) {
      const f = this.frames;
      out = flashFrames('enemy:charm:' + this.kind + this.anim + this.view, f, P.cyber)[Math.floor(this.animT * f.length) % f.length];
    }

    const flip = this.def.art === 'critter' && this.facing < 0;
    r.draw(out, this.x - out.width / 2, this.y - out.height + (flying ? 0 : 2) + hoverY, flip);

    // telegraph flare: the visual promise that something is about to happen
    if (this.telegraph > 0) {
      const t = this.telegraph;
      r.ring(this.x, this.y - 8 + hoverY, this.r + 6 + (1 - t) * 6, P.nestEye, 1, clamp(t * 2, 0, 0.9));
      r.glow(this.x, this.y - 8 + hoverY, 20, 'rgba(255,70,55,0.5)', 0.8);
    }
    if (this.burnT > 0) r.glow(this.x, this.y - 8 + hoverY, 16, 'rgba(255,140,60,0.6)', 0.8);
    if (this.markT > 0) {
      r.ring(this.x, this.y - 8 + hoverY, this.r + 4, P.cyber, 1, 0.5 + Math.sin(game.time * 8) * 0.3);
    }

    // health pip for anything tough (bosses use the top bar instead)
    if (!this.def.boss && this.hp < this.maxHp) {
      const w = Math.max(10, this.r * 2);
      const frac = clamp(this.hp / this.maxHp, 0, 1);
      const by = this.y - out.height - 3 + hoverY;
      r.rect(this.x - w / 2, by, w, 2, 'rgba(0,0,0,0.6)');
      r.rect(this.x - w / 2, by, w * frac, 2, this.def.machine ? P.nestTealHi : P.hpRed);
    }
  }

  drawLight(r) {
    if (this.def.machine) r.light(this.x, this.y - 8, 40, 'rgba(255,90,70,0.5)', 0.5);
    if (this.burnT > 0) r.light(this.x, this.y - 8, 40, 'rgba(255,150,70,0.8)', 0.7);
  }
}

// --------------------------------------------------------------------- wreck
/**
 * What a machine leaves behind. Walk up and press E to rip the chip out of its
 * skull — the game's whole progression system in one interaction.
 */
class Wreck {
  constructor(x, y, species, chipKey, scrap) {
    this.x = x; this.y = y;
    this.species = species;
    this.chipKey = chipKey;
    this.scrap = scrap;
    this.t = rnd(TAU);
    this.dead = false;
    this.looted = false;
    this.life = 90;
    this.objType = 'wreck';
    this.r = 10;
  }

  update(dt, game) {
    this.t += dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
    if (chance(dt * 2.2)) particles.sparks(this.x + rnd(-6, 6), this.y - rnd(0, 8), 2, P.nestSteelHi);
    if (chance(dt * 1.1)) particles.smoke(this.x + rnd(-4, 4), this.y - 4, 1, { life: 1.6 });
  }

  loot(game) {
    if (this.looted) return;
    this.looted = true;
    this.dead = true;
    const p = game.player;
    if (this.chipKey) {
      game.pickups.drop('chip', this.chipKey, this.x, this.y - 6, { vz: 120 });
      particles.chipSpark(this.x, this.y - 6);
      particles.ring(this.x, this.y - 6, 4, 30, 0.4, P.cyber, 2, true);
      audio.play('chip');
    }
    for (let i = 0; i < this.scrap; i++) {
      game.pickups.drop('resource', 'scrap', this.x + rnd(-4, 4), this.y + rnd(-3, 3), { count: 1 });
    }
    audio.play('metal', { vol: 0.6 });
    game.r.camera.addShake(1.2);
  }

  draw(r, game) {
    const f = machineFrames(this.species);
    const img = f[0];
    // slumped, darkened husk
    const tilt = 0.5 + Math.sin(this.t * 0.6) * 0.02;
    r.shadow(this.x, this.y, 10, 4, 0.32);
    r.ctx.globalAlpha = this.life < 6 ? clamp(this.life / 6, 0.2, 1) : 1;
    r.drawT(img, this.x, this.y - img.height * 0.3, tilt, 0.9, 0.7, 0.75);
    r.ctx.globalAlpha = 1;
    if (this.chipKey) {
      const pulse = 0.5 + Math.sin(this.t * 5) * 0.4;
      r.glow(this.x, this.y - 8, 14, 'rgba(77,225,255,0.55)', pulse);
    }
  }
}

// ==========================================================================
// The camp you do not have.
//
// You arrive in the basin out of a burning transport with a stolen pistol and
// nothing else. There is no den, no workbench, no forge, no fire — just a
// clearing where those things could go. Everything downstream of crafting is
// behind somebody else's hands, and the only way to get any of it is to walk
// up to a neighbour, ask, and then go and find what they need.
//
// That is the whole point of the opening hour: the ferret is not a survivor
// with a base, it is an escaped lab animal asking strangers for help.

// bundled: import { P } from '../art/palette.js';
// bundled: import { audio } from '../engine/audio.js';
// bundled: import { particles } from '../engine/particles.js';
// bundled: import { TS } from '../world/tiles.js';
// bundled: import { rnd, chance } from '../engine/rng.js';

/**
 * Everything that can be raised in the clearing, who is willing to raise it,
 * and what they want for it. `needs` is checked against another structure so
 * the camp goes up in a sensible order rather than all at once.
 */
const STRUCTURES = {
  firepit: {
    name: 'Fire Pit', kind: 'firepit', prop: { type: 'prop' },
    builder: 'ember', cost: { wood: 6, stone: 4 }, buildTime: 4,
    offset: { x: 0, y: 0 },
    desc: 'Somewhere warm. Everything else goes up around it.',
    offer: "You're shaking. I know that shake, I did it for a week after I got out too.\nGet me six logs and four stones and I'll build us a fire. Then we can think.",
    done: "There. Sit down for a second. Nobody is going to shoot you in the next minute.",
    unlock: 'The camp has a centre now. The others will come to it.',
  },
  workbench: {
    name: 'Workbench', kind: 'workbench', prop: { type: 'station', station: 'workbench' },
    builder: 'brindle', cost: { wood: 12, stone: 6 }, buildTime: 5, needs: 'firepit',
    offset: { x: -46, y: 10 },
    desc: 'Powder, rounds, anything that has to be measured.',
    offer: "You want rounds? Rounds come off a bench, and there is no bench.\nTwelve logs, six stone. I'll cut the joints myself, I'm not having you do it.",
    done: "Bench. Flat, level, and it will still be here in ten years. Now we can work.",
    unlock: 'GUNPOWDER AND ROUNDS UNLOCKED  -  TAB TO CRAFT',
  },
  forge: {
    name: 'Forge', kind: 'forge', prop: { type: 'station', station: 'forge' },
    builder: 'thermal', cost: { stone: 14, iron: 6, wood: 4 }, buildTime: 6, needs: 'workbench',
